<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Desk · Intraday</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Links (links.pumper.run) stylesheet, copied verbatim from proveway-hub templates/links/app.html. */
  :root{
    --bg:#FBF8F4; --surface:#FFFFFF; --surface2:#F5F1EB; --ink:#1E1B2B; --ink2:#5F5B70; --ink3:#6F6A83;
    --line:rgba(30,27,43,.08); --line2:rgba(30,27,43,.14); --hover:rgba(30,27,43,.045);
    --lav:#E6E0FF; --lav-i:#5A44C8; --mint:#D2F3E2; --mint-i:#14673F; --peach:#FFE2D2; --peach-i:#9A4118;
    --butter:#FFF0B5; --butter-i:#8A6500; --sky:#D5EBFF; --sky-i:#1D69AB; --blush:#FFD9E7; --blush-i:#B03360;
    --accent:#6A56E8; --good:#1F9D63; --bad:#D9455A;
    --pill:#1E1B2B; --pillink:#FFFFFF; --scrim:rgba(30,27,43,.28); --orb:rgba(255,255,255,.45);
    --shadow:0 1px 2px rgba(30,27,43,.04),0 14px 32px -16px rgba(30,27,43,.16);
    --shadow-lg:0 2px 6px rgba(30,27,43,.06),0 32px 70px -24px rgba(30,27,43,.34);
    --field:#FFFFFF;
    --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,.8,.24,1); --ease-out:cubic-bezier(.16,1,.3,1);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color-scheme:light;
  }
  :root[data-theme=dark]{
    --bg:#14121B; --surface:#1E1B2A; --surface2:#28243A; --ink:#F4F1FA; --ink2:#B4AFC8; --ink3:#9A95B2;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15); --hover:rgba(255,255,255,.06);
    --lav:rgba(150,130,255,.20); --lav-i:#CFC6FF; --mint:rgba(70,200,150,.18); --mint-i:#9BE8C4; --peach:rgba(255,150,100,.18); --peach-i:#FFC4A3;
    --butter:rgba(255,210,70,.16); --butter-i:#FFE48A; --sky:rgba(90,170,255,.18); --sky-i:#A8D4FF; --blush:rgba(255,110,160,.18); --blush-i:#FFB1CC;
    --accent:#A99BFF; --good:#52D68F; --bad:#FF7A90;
    --pill:#F4F1FA; --pillink:#16131F; --scrim:rgba(8,6,14,.62); --orb:rgba(255,255,255,.05);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 36px -18px rgba(0,0,0,.7);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 36px 80px -26px rgba(0,0,0,.85);
    --field:#161320;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{background:var(--bg);overflow-x:clip}
  body{margin:0;color:var(--ink);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
  html.theming *,html.theming *::before,html.theming *::after{transition:background-color .4s var(--ease),color .3s var(--ease),border-color .4s var(--ease),box-shadow .4s var(--ease)!important}
  ::selection{background:var(--lav);color:var(--ink)}
  button,input,select,textarea{font:inherit;color:inherit}
  .hidden{display:none!important}
  .wrap{max-width:min(1640px,100%);margin:0 auto;padding:28px clamp(20px,3.2vw,64px) 110px}

  /* surfaces: solid, soft, rounded (the old .glass class is kept as a plain card) */
  .glass{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}

  /* motion */
  @keyframes pop{from{opacity:0;transform:translate3d(0,18px,0) scale(.94)}}
  @keyframes rise{from{opacity:0;transform:translate3d(0,12px,0)}}
  @keyframes barUp{from{transform:scaleY(0)}}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes ping{0%{transform:scale(1);opacity:.4}70%,100%{transform:scale(2.2);opacity:0}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .rise{animation:rise .6s var(--ease-out) both;animation-delay:calc(var(--i,0) * 55ms)}
  .pop{animation:pop .75s var(--spring) both;animation-delay:calc(var(--i,0) * 70ms)}

  /* top bar */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.03em;font-size:19px}
  .mark{width:36px;height:36px;border-radius:12px;background:var(--lav);position:relative;display:grid;place-items:center;transition:transform .5s var(--spring)}
  .mark::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--peach);position:absolute;left:5px;top:5px}
  .mark::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--mint);position:absolute;right:5px;bottom:5px;mix-blend-mode:multiply}
  :root[data-theme=dark] .mark::after{mix-blend-mode:screen}
  .brand:hover .mark{transform:rotate(-12deg) scale(1.08)}
  .me{display:flex;align-items:center;gap:9px;padding:4px 14px 4px 4px;margin-right:4px;border-radius:99px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:700;font-size:13px}
  .meav{width:34px;height:34px;border-radius:50%;background:var(--lav);color:var(--lav-i);display:grid;place-items:center;font-weight:800;text-transform:uppercase;font-size:14px}
  .tag.w{background:var(--mint);color:var(--mint-i)}.tag.r{background:var(--butter);color:var(--butter-i)}
  .own{font-size:11px;font-weight:700;color:var(--ink3)}
  @media(max-width:620px){.mename,#meRole{display:none}.me{padding:3px;margin-right:0}}
  .host{font-weight:600;font-size:12px;color:var(--ink3);padding:3px 11px;border-radius:99px;background:var(--surface2)}
  .tools{display:flex;align-items:center;gap:8px}
  .ibtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .4s var(--spring),background-color .25s var(--ease)}
  .ibtn:hover{transform:translateY(-2px) rotate(-6deg);background:var(--surface2)}
  .ibtn:active{transform:scale(.9)}
  .ibtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .btn{height:42px;padding:0 20px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:700;font-size:13.5px;
    display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:transform .35s var(--spring),background-color .25s var(--ease),box-shadow .3s var(--ease)}
  .btn:hover{background:var(--surface2);transform:translateY(-2px)}
  .btn:active{transform:scale(.95)}
  .btn.primary{background:var(--pill);color:var(--pillink);border-color:transparent;box-shadow:0 12px 24px -12px rgba(30,27,43,.55)}
  .btn.primary:hover{transform:translateY(-3px);box-shadow:0 18px 30px -12px rgba(30,27,43,.5)}
  .btn.sm{height:32px;padding:0 14px;font-size:12.5px}
  .btn.danger{color:var(--bad)}
  .btn:focus-visible,.ibtn:focus-visible,.in:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  kbd{font:700 11px var(--mono);color:var(--ink3);border:1px solid var(--line2);border-radius:6px;padding:1px 6px;background:var(--surface2)}
  .btn.primary kbd{color:inherit;opacity:.55;border-color:currentColor;background:transparent}

  /* hero + bento tiles */
  .hero{margin:34px 0 24px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .hero h1{margin:0;font-size:46px;line-height:1.02;letter-spacing:-.045em;font-weight:800}
  .hero h1{min-height:2.08em}
  .hl{display:block}.hl2{color:var(--ink3)}
  .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.14em;margin-bottom:-.14em}
  .wi{display:inline-block;animation:wordIn 1s var(--ease-out) both;animation-delay:calc(var(--d,0) * 80ms + var(--l,0) * 160ms)}
  .hl2 .wi{--l:1}
  #greet.out .wi{animation:wordOut .5s cubic-bezier(.4,0,.7,.2) both;animation-delay:calc(var(--d,0) * 45ms)}
  @keyframes wordIn{from{opacity:0;transform:translate3d(0,105%,0)}}
  @keyframes wordOut{to{opacity:0;transform:translate3d(0,-60%,0)}}
  .hero .wave{display:inline-block;transform-origin:70% 70%;animation:float 3.4s ease-in-out infinite}
  .kpis{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:16px;min-width:0}
  .kpis>*,.table,.tb,.bar,.hero{min-width:0}
  .kpi{border-radius:32px;padding:22px 24px;min-height:176px;display:flex;flex-direction:column;justify-content:flex-start;position:relative;overflow:hidden;
    transition:transform .5s var(--spring),box-shadow .4s var(--ease)}
  .kpi:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:var(--shadow-lg)}
  .kpi::after,.kpi::before{content:"";position:absolute;border-radius:50%;background:var(--orb);pointer-events:none;transition:scale .9s var(--spring)}
  .kpi::after{right:-34px;top:-34px;width:132px;height:132px;animation:orbA 9s ease-in-out infinite;animation-delay:calc(var(--i,0) * -1.3s)}
  .kpi::before{right:58px;bottom:-26px;width:64px;height:64px;opacity:.7;animation:orbB 7s ease-in-out infinite;animation-delay:calc(var(--i,0) * -.9s)}
  .kpi:hover::after{scale:1.3}.kpi:hover::before{scale:1.5}
  @keyframes orbA{0%,100%{translate:0 0}33%{translate:-26px 22px}66%{translate:-8px 44px}}
  @keyframes orbB{0%,100%{translate:0 0}50%{translate:-34px -22px}}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}
  .t-lav{background:var(--lav);--tc:var(--lav-i)}.t-mint{background:var(--mint);--tc:var(--mint-i)}
  .t-peach{background:var(--peach);--tc:var(--peach-i)}.t-butter{background:var(--butter);--tc:var(--butter-i)}
  .t-sky{background:var(--sky);--tc:var(--sky-i)}.t-blush{background:var(--blush);--tc:var(--blush-i)}
  .kpi .lab{font-size:13px;color:var(--tc);font-weight:700;position:relative;z-index:1}
  .kpi .val{font-size:44px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1;position:relative;z-index:1;margin-top:16px;--valh:52px;height:var(--valh);display:flex;align-items:center}
  .kpi .sub{margin-top:auto;font-size:12.5px;color:var(--tc);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
  .kpi.hero-k{padding-bottom:20px}
  .kpi.hero-k .bars{position:absolute;left:24px;right:24px;bottom:18px;height:70px;z-index:1}

  /* bars: rounded, springy, pastel-ink coloured */
  .bars{display:flex;align-items:flex-end;gap:3px}
  .bars i{flex:1;min-height:3px;border-radius:7px 7px 3px 3px;background:var(--tc,var(--accent));opacity:.28;transform-origin:bottom;
    animation:barUp .9s var(--spring) both;animation-delay:calc(var(--k,0) * 16ms + .2s);transition:opacity .2s}
  .bars i:hover,.bars i.peak{opacity:.95}
  .bars i.peak{opacity:.75}

  /* toolbar + table */
  .tb{display:flex;gap:12px;align-items:center;margin:38px 0 16px;flex-wrap:wrap}
  .tb .btn{height:44px}
  .tb h2{margin:0;font-size:22px;letter-spacing:-.03em;flex:1;min-width:120px;font-weight:800}
  .search{position:relative;width:250px}
  .search input{width:100%;height:44px;border-radius:99px;border:1px solid var(--line2);background:var(--field);padding:0 44px 0 20px;transition:box-shadow .25s var(--ease),border-color .25s}
  .search input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
  .search input::placeholder{color:var(--ink3)}
  .search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);line-height:1.4;display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px}
  .table{border-radius:32px;overflow:hidden;padding-bottom:10px;transition:box-shadow .5s var(--ease)}
  .table:hover{box-shadow:var(--shadow-lg)}
  .thead,.tr{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1.1fr) 104px 74px 74px 84px;gap:14px;align-items:center;padding:0 24px}
  .thead{height:48px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3)}
  .tr{min-height:76px;margin:3px 10px;padding:10px 14px;border-radius:24px;cursor:pointer;transition:background-color .25s var(--ease),transform .4s var(--spring)}
  .tr:hover{background:var(--surface2);transform:scale(1.008)}
  .tr:active{transform:scale(.99)}
  .who{display:flex;align-items:center;gap:14px;min-width:0}
  .av{width:46px;height:46px;border-radius:16px;flex:none;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--b);color:var(--f);text-transform:uppercase;transition:transform .5s var(--spring)}
  .tr:hover .av{transform:rotate(-8deg) scale(1.1)}
  .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
  .num.dim{font-weight:600;color:var(--ink2)}
  .short{font-family:var(--mono);font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;position:relative}
  .dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--good);opacity:.4;animation:ping 2.4s var(--ease) infinite}
  .dot.off{background:var(--ink3)}.dot.off::after{display:none}
  .meta{display:flex;align-items:center;gap:4px 7px;flex-wrap:wrap;margin-top:4px;min-width:0}
  .sub2{color:var(--ink3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .dest{color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spark{height:30px}
  .spark i{min-width:4px;opacity:.4}
  @media(hover:none){.acts{opacity:1}}
  .acts{display:flex;gap:6px;justify-content:flex-end;opacity:.65;transition:opacity .25s var(--ease)}
  .tr:hover .acts,.tr:focus-within .acts{opacity:1}
  .ib2{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center;cursor:pointer;transition:transform .4s var(--spring),background-color .2s}
  .ib2:hover{transform:scale(1.14) rotate(-6deg);background:var(--lav)}
  .ib2:active{transform:scale(.9)}
  .ib2 svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ib2.off svg{stroke:var(--bad)}
  .tag{font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:800;border-radius:99px;padding:2px 9px;background:var(--surface2);color:var(--ink2);font-family:var(--sans)}
  .tag.a{background:var(--lav);color:var(--lav-i)}
  .chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--ink2)}
  .chip.c{background:var(--mint);color:var(--mint-i)}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .filters select{height:44px;border-radius:99px;width:auto;min-width:136px}
  .empty{padding:70px 24px;text-align:center;color:var(--ink3)}

  /* sheets */
  .scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .35s var(--ease);z-index:20}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;top:14px;right:14px;bottom:14px;width:min(580px,calc(100% - 28px));border-radius:36px;z-index:30;display:flex;flex-direction:column;
    background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow-lg);
    opacity:0;visibility:hidden;transform:translate3d(60px,0,0) scale(.96);pointer-events:none;transition:transform .6s var(--spring),opacity .3s var(--ease),visibility 0s .6s}
  .sheet.on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition-delay:0s}
  .sheet.wide{width:min(760px,calc(100% - 28px))}
  .sh-head{display:flex;align-items:center;justify-content:space-between;padding:24px 30px 14px}
  .sh-head h3{margin:0;font-size:23px;letter-spacing:-.035em;font-weight:800}
  .sh-body{padding:6px 30px 32px;overflow:auto;flex:1}
  .sh-body>*{animation:rise .5s var(--ease-out) both}
  .sh-foot{padding:16px 30px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center}
  .seg{display:inline-flex;padding:5px;border-radius:99px;background:var(--surface2);margin:4px 0 8px;flex-wrap:wrap;gap:2px}
  .seg button{height:34px;padding:0 17px;border:0;border-radius:99px;background:transparent;color:var(--ink2);cursor:pointer;font-weight:700;font-size:13px;transition:background-color .3s var(--ease),color .2s,transform .35s var(--spring)}
  .seg button:hover{color:var(--ink)}
  .seg button:active{transform:scale(.93)}
  .seg button.on{background:var(--lav);color:var(--lav-i)}
  label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:18px 0 7px}
  label i{font-style:normal;font-weight:500;color:var(--ink3)}
  .in{width:100%;height:46px;border-radius:16px;border:1.5px solid var(--line2);background:var(--field);padding:0 16px;transition:border-color .25s var(--ease),box-shadow .25s var(--ease)}
  .in:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line2))}
  .in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
  .in::placeholder{color:var(--ink3)}
  textarea.in{height:auto;padding:13px 16px;font:12px/1.65 var(--mono);resize:vertical}
  select.in{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:40px;background-repeat:no-repeat;background-position:right 16px center;background-size:12px 8px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none' stroke='%236F6A83' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M1.5 1.5l4.5 4.5 4.5-4.5'/></svg>")}
  :root[data-theme=dark] select.in{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none' stroke='%239A95B2' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M1.5 1.5l4.5 4.5 4.5-4.5'/></svg>")}
  select.in option{font-weight:600}
  input[type=color].in{padding:5px;cursor:pointer;border-color:var(--ink3)}
  input[type=color].in::-webkit-color-swatch-wrapper{padding:0}
  input[type=color].in::-webkit-color-swatch{border:1px solid var(--line2);border-radius:11px}
  input[type=color].in::-moz-color-swatch{border:0;border-radius:11px}
  input[type=datetime-local].in{font-variant-numeric:tabular-nums;cursor:pointer}
  input[type=datetime-local].in::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.6;border-radius:8px;padding:4px;transition:opacity .2s,background-color .2s}
  input[type=datetime-local].in::-webkit-calendar-picker-indicator:hover{opacity:1;background:var(--hover)}
  /* custom checkbox */
  input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;border-radius:7px;border:1.5px solid var(--ink3);background:var(--field);display:inline-grid;place-items:center;cursor:pointer;margin:0;transition:background-color .25s var(--ease),border-color .25s,transform .35s var(--spring)}
  input[type=checkbox]:hover{border-color:var(--accent)}
  input[type=checkbox]:active{transform:scale(.88)}
  input[type=checkbox]::after{content:"";width:5px;height:10px;margin-top:-2px;border:solid var(--pillink);border-width:0 2.2px 2.2px 0;transform:rotate(45deg) scale(0);transition:transform .35s var(--spring)}
  input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
  input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
  input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* file picker / drop zone */
  .filebtn{position:relative;display:flex;align-items:center;gap:14px;padding:14px 18px;margin:2px 0 8px;border:1.5px dashed color-mix(in srgb,var(--ink3) 55%,transparent);border-radius:16px;background:var(--surface2);cursor:pointer;
    transition:border-color .25s var(--ease),background-color .25s var(--ease),transform .4s var(--spring)}
  .filebtn:hover,.filebtn.drag{border-color:var(--accent);background:var(--lav);transform:translateY(-2px)}
  .filebtn:active{transform:scale(.985)}
  .filebtn:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
  .filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

    background:radial-gradient(120% 80% at 18% 0%,rgba(255,255,255,.26),transparent 55%),radial-gradient(90% 70% at 100% 100%,rgba(255,138,196,.22),transparent 60%),linear-gradient(160deg,#7B5CFA 0%,#5E3FD8 55%,#4A2FB5 100%);

/* Desk additions, built only from Links tokens and components. */

</head>
<body>
<div id="app" class="wrap"></div>
<div class="scrim" id="scrim"></div>
<aside class="sheet glass wide" id="swSheet" aria-label="Swing position" aria-hidden="true"></aside>
<script>
(function () {
  'use strict';
  // ── settings shared with console.html ────────────────────────────────
  const DEFAULT_SERVER = location.hostname.endsWith('github.io') ? 'https://web-production-23211.up.railway.app' : '';
  const ls = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  const server = () => (ls.get('signal_server_url', '') || DEFAULT_SERVER).replace(/\/$/, '');
  let capital = +ls.get('ie-capital', '') || 50000;
  const root = document.documentElement;
  const theme0 = ls.get('links-theme', '') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  root.setAttribute('data-theme', theme0);

  // ── engine facts (mirror server.py / conductor.py) ───────────────────
  const BROKERAGE_PER_LOT = 115;          // CONFIG brokerage_per_lot_roundtrip
  const SLIP_BPS_SIDE = 50;               // CONFIG slippage_bps_per_side
  const RISK_PCT = 0.01;                  // 1% of capital at the premium stop
  const MAX_CAP_PCT = 0.50;               // engine cap per trade
  const WIN = r => ['WIN', 'T1', 'T2', 'TRAIL'].includes(r);
  const NAMES = { NIFTY: 'NIFTY 50', BANKNIFTY: 'BANK NIFTY', FINNIFTY: 'FIN NIFTY' };

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const inr = (n, signed) => { const v = Math.round(+n || 0); const s = Math.abs(v).toLocaleString('en-IN'); return (signed ? (v > 0 ? '+' : v < 0 ? '−' : '') : (v < 0 ? '−' : '')) + '₹' + s; };
  const num = (n, d = 2) => n == null || !isFinite(+n) ? '-' : (+n).toLocaleString('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d });
  const istNow = () => new Date(Date.now() + (new Date().getTimezoneOffset() + 330) * 60000);
  const hm = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const todayISO = () => { const d = istNow(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const PAL = { lav: 'lav-i', mint: 'mint-i', peach: 'peach-i', butter: 'butter-i', sky: 'sky-i', blush: 'blush-i' };
  const palOf = str => { const k = Object.keys(PAL); let h = 0; for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return k[h % k.length]; };
  const av = (letter, p) => `<span class="av" style="--b:var(--${p});--f:var(--${PAL[p]})">${esc(letter)}</span>`;
  const signedPnl = s => { const raw = (s.pnl_rupees_net != null ? +s.pnl_rupees_net : +s.pnl_rupees) || 0; return s.result === 'LOSS' ? -Math.abs(raw) : WIN(s.result) ? Math.abs(raw) : raw; };

  // Lots that fit YOUR capital: the smaller of the 1% risk rule and the 50% capital cap.
  function sizeFor(premium, stopPremium, lotSize) {
    premium = +premium; stopPremium = +stopPremium; lotSize = +lotSize;
    if (!(premium > 0) || !(lotSize > 0)) return null;
    const perLotCost = premium * lotSize;
    const perLotRisk = (stopPremium > 0 && stopPremium < premium ? premium - stopPremium : premium * 0.35) * lotSize
                       + BROKERAGE_PER_LOT + premium * lotSize * SLIP_BPS_SIDE * 2 / 10000;
    const byRisk = Math.floor(capital * RISK_PCT / perLotRisk);
    const byCap = Math.floor(capital * MAX_CAP_PCT / perLotCost);
    const lots = Math.max(0, Math.min(byRisk, byCap));
    // Capital at which one lot passes both rules, so a 0 says what it would take.
    const need = Math.ceil(Math.max(perLotRisk / RISK_PCT, perLotCost / MAX_CAP_PCT) / 1000) * 1000;
    return { lots, cost: lots * perLotCost, risk: lots * perLotRisk, perLotCost, perLotRisk, need, why: lots ? '' : 'needs ' + inr(need) + ' for 1 lot' };
  }

  // ── fetch layer ──────────────────────────────────────────────────────
  const S = { status: null, ltp: null, hist: null, perf: null, swing: null, candles: {}, chain: null, err: null, sym: ls.get('desk-sym', 'BANKNIFTY'), ticks: {} };
  async function api(path, timeout = 25000) {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeout);
    try { const r = await fetch(server() + path, { signal: ctl.signal }); if (!r.ok) throw new Error(path + ' ' + r.status); return await r.json(); }
    finally { clearTimeout(t); }
  }
  function poll(key, path, ms, after, timeout) {
    const run = async () => {
      try { S[key] = await api(typeof path === 'function' ? path() : path, timeout); S.err = null; after && after(); }
      catch (e) { S.err = 'Cannot reach the engine (' + (e.name === 'AbortError' ? 'timeout' : e.message) + '). Retrying.'; }
      render();
    };
    run(); return setInterval(run, ms);
  }
  const SYMS = ['BANKNIFTY', 'NIFTY', 'FINNIFTY'];
  async function loadAllCandles() { for (const k of SYMS) await loadCandles(k); }
  async function loadCandles(sym) {
    try {
      const d = await api(`/api/historical/${sym}?days=3&interval=FIVE_MINUTE`, 80000);
      S.candles[sym] = (d.candles || []).map(c => ({ t: c.t, c: +c.c, h: +c.h, l: +c.l, o: +c.o }));
    } catch (e) { S.candles[sym] = S.candles[sym] || []; }
    render();
  }

  // ── chart: last session + today, live tick appended, VWAP proxy, signal marks ──
  function chartSVG(sym) {
    const all = S.candles[sym] || [];
    if (!all.length) return '<div class="empty" style="padding:110px 0">Loading candles from the engine…</div>';
    const days = [...new Set(all.map(c => c.t.slice(0, 10)))];
    const keep = days.slice(-2);
    let pts = all.filter(c => keep.includes(c.t.slice(0, 10)));
    const live = S.ticks[sym] || [];
    const lastT = pts.length ? pts[pts.length - 1].t : '';
    const tickPts = live.filter(x => x.t > lastT).map(x => ({ t: x.t, c: x.p, h: x.p, l: x.p, live: true }));
    pts = pts.concat(tickPts);
    // Draw at the box's real pixel size so lines and labels are never stretched.
    const box = document.getElementById('plot');
    const W = Math.max(320, Math.round((box && box.clientWidth) || S.plotW || 1000)), H = window.innerWidth < 880 ? 220 : 300, P = { l: 4, r: 62, t: 14, b: 24 };
    S.plotW = W;
    const lo = Math.min(...pts.map(p => p.l)), hi = Math.max(...pts.map(p => p.h)), span = hi - lo || 1;
    const X = i => P.l + i / Math.max(1, pts.length - 1) * (W - P.l - P.r);
    const Y = v => P.t + (1 - (v - lo) / span) * (H - P.t - P.b);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.c).toFixed(1)).join(' ');
    const area = line + ` L${X(pts.length - 1).toFixed(1)} ${H - P.b} L${X(0).toFixed(1)} ${H - P.b} Z`;
    // VWAP proxy for today: running mean of typical price (index volume is 0).
    const today = todayISO(); let n = 0, acc = 0; let vw = '';
    pts.forEach((p, i) => { if (p.t.slice(0, 10) !== today) return; acc += (p.h + p.l + p.c) / 3; n++; vw += (vw ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(acc / n).toFixed(1) + ' '; });
    // Day divider and time labels.
    let divider = '', labels = '';
    const firstToday = pts.findIndex(p => p.t.slice(0, 10) === today);
    if (firstToday > 0) divider = `<line x1="${X(firstToday)}" x2="${X(firstToday)}" y1="${P.t}" y2="${H - P.b}" stroke="var(--line2)" stroke-dasharray="4 5"/><text x="${X(firstToday) + 6}" y="${P.t + 10}" font-size="11" font-weight="700" fill="var(--ink3)">today</text>`;
    // Time labels, skipping any that would sit closer than 48px to the previous one.
    let lastX = -1e9;
    pts.forEach((p, i) => { const t = p.t.slice(11, 16); if (!['09:15', '11:00', '13:00', '15:00'].includes(t) || p.live) return; const x = X(i); if (x - lastX < 48) return; lastX = x;
      labels += `<text x="${x}" y="${H - 6}" font-size="11" font-weight="600" fill="var(--ink3)" text-anchor="${x < 20 ? 'start' : 'middle'}">${t}</text>`; });
    // Grid + price labels.
    let grid = '';
    for (let g = 0; g <= 3; g++) { const v = lo + span * g / 3; grid += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${W - P.r + 8}" y="${Y(v) + 4}" font-size="11" font-weight="600" fill="var(--ink3)">${Math.round(v).toLocaleString('en-IN')}</text>`; }
    // Signal markers from today's history for this index.
    let marks = '';
    (Array.isArray(S.hist) ? S.hist : []).filter(s => s.instrument === sym && s.date === today).forEach(s => {
      const t = (s.timestamp || '').slice(0, 16); let idx = pts.findIndex(p => p.t.slice(0, 16) >= t); if (idx < 0) idx = pts.length - 1;
      const up = (s.direction || '').toUpperCase() === 'LONG';
      marks += `<circle cx="${X(idx)}" cy="${Y(pts[idx].c)}" r="6" fill="var(--${up ? 'good' : 'bad'})" stroke="var(--surface)" stroke-width="2"><title>${esc((s.option_symbol || '') + ' ' + (s.direction || '') + ' at ' + (s.timestamp || '').slice(11, 16) + ' IST')}</title></circle>`;
    });
    const last = pts[pts.length - 1];
    const up = (S.ltp && S.ltp.prices && S.ltp.prices[sym] && S.ltp.prices[sym].pct >= 0);
    const col = up ? 'var(--good)' : 'var(--bad)';
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(NAMES[sym])} price, five-minute closes">
      <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      ${grid}${divider}<path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      ${vw ? `<path d="${vw}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-dasharray="5 5"/>` : ''}
      ${marks}<circle cx="${X(pts.length - 1)}" cy="${Y(last.c)}" r="4.5" fill="${col}"/>${labels}</svg>`;
  }

  // ── signal card (same anatomy as console.html PositionCard) ──────────
  function signalCard(c, i) {
    const { label, live, inst, strike, typ, dir, lots, lotSize, conf, tIn, entry, sl, t1, t2, cur, curLabel, pnl, status, statusPal, note, idea } = c;
    const qty = (lots || 1) * (lotSize || 0);
    const a = Math.min(sl || entry, entry, cur || entry), b = Math.max(t2 || t1 || entry, cur || entry), span = (b - a) || 1;
    const P = x => Math.max(0, Math.min(100, ((x - a) / span) * 100));
    const enP = P(entry), t1P = P(t1 || entry), curP = P(cur || entry);
    const up = (cur || entry) >= entry, pct = entry ? ((cur || entry) - entry) / entry * 100 : 0;
    const grad = `linear-gradient(90deg,var(--bad) 0%,var(--bad) ${(enP * .5).toFixed(0)}%,var(--butter-i) ${enP.toFixed(0)}%,var(--good) ${t1P.toFixed(0)}%,var(--sky-i) 100%)`;
    const sz = sizeFor(entry, sl, lotSize);
    const lotCost = entry * (lotSize || 0);
    const near = (p1, p2) => Math.abs(p1 - p2) < 9;   // keep labels from overlapping
    return `<div class="scard glass pop" style="--i:${i + 10}">
      <div class="sc-top"><span class="lbl">${esc(label)}</span><span class="live"><span class="dot ${live ? '' : 'off'}"></span>${esc(live || 'closed')}</span></div>
      <div class="sc-name">${esc(inst)} ${esc(strike ? Math.round(strike) : '')}<span class="ot ${String(typ).toLowerCase()}">${esc(typ)}</span></div>
      <div class="sc-meta">${String(typ).toUpperCase() === 'PE' ? 'Buy put · expects ' + esc(inst) + ' to fall' : 'Buy call · expects ' + esc(inst) + ' to rise'} · ${esc(lots || 1)} lot · ${esc(qty)} qty · conf ${esc(conf != null ? conf : '-')} · ${tIn ? 'entered ' + esc(tIn) + ' IST' : ''}</div>
      <div class="sc-prices"><div><div class="k">Entry</div><div class="v">₹${num(entry, 1)}</div></div>
        <div class="r"><div class="k">${esc(curLabel)}</div><div class="v ${cur ? (up ? 'up' : 'dn') : ''}">${cur ? '₹' + num(cur, 1) : '-'}</div></div></div>
      <div class="trk">
        <span class="lab l" style="left:0">SL</span><span class="lab" style="left:${enP}%">ENTRY</span>${near(t1P, 100) ? '' : `<span class="lab" style="left:${t1P}%">T1</span>`}<span class="lab r" style="left:100%">T2</span>
        <div class="bar" style="background:${grad}"></div>
        <span class="tick" style="left:${enP}%"></span><span class="tick" style="left:${t1P}%"></span>
        ${cur ? `<span class="dot" style="left:${curP}%;color:var(--${up ? 'good' : 'bad'});background:var(--${up ? 'good' : 'bad'})"></span>` : ''}
        <span class="val l" style="left:0">₹${num(sl, 0)}</span><span class="val" style="left:${enP}%">₹${num(entry, 0)}</span>${near(t1P, 100) || near(t1P, enP) ? '' : `<span class="val" style="left:${t1P}%">₹${num(t1, 0)}</span>`}<span class="val r" style="left:100%">₹${num(t2, 0)}</span>
      </div>
      <div class="sc-pnl"><div><div class="k">${idea ? 'Per lot, if taken at entry' : (status === 'running' ? 'P&L · unrealised' : 'P&L')}</div>
        <div class="v ${pnl > 0 ? 'up' : pnl < 0 ? 'dn' : ''}">${inr(pnl, true)}<small class="${up ? 'v up' : 'v dn'}">${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%</small></div></div>
        <span class="tag" style="background:var(--${statusPal});color:var(--${PAL[statusPal]})">${esc(status)}</span></div>
      <div class="need">
        <div><span>1 lot needs</span><b>${inr(lotCost)}</b></div>
        <div><span>Lost at SL, 1 lot</span><b>${inr((entry - sl) * (lotSize || 0))}</b></div>
        <div><span>Your ${inr(capital)} fits</span><b>${sz ? sz.lots + ' lot' + (sz.lots === 1 ? '' : 's') : '-'}</b></div>
      </div>
      ${sz && !sz.lots ? `<div class="sc-note">${lotCost <= capital * MAX_CAP_PCT
        ? `You can afford 1 lot (${Math.round(lotCost / capital * 100)}% of your money), but if SL hits you lose ${inr((entry - sl) * (lotSize || 0))}, which is ${((entry - sl) * (lotSize || 0) / capital * 100).toFixed(1)}% of your capital. Your rule allows 1% (${inr(capital * RISK_PCT)}); 1 lot fits that rule from about ${inr(sz.need)} of capital.`
        : `1 lot costs ${inr(lotCost)}, more than half of your ${inr(capital)}.`}</div>` : ''}
      ${note ? `<div class="sc-note">${note}</div>` : ''}
    </div>`;
  }

  // ── swing holding guide ──────────────────────────────────────────────
  // Rules from SWING_STRATEGY.md (Pullback v1.2): exits run in this order,
  // first to trigger wins. Older rows restored from Slack carry their own
  // SL / targets / max-hold in the row, so the guide reads the row first.
  const EXIT_TEXT = {
    STRENGTH_EXIT: 'Took profit on the first sign of strength (close above the 5-day average or RSI(2) above 65). This is the exit the strategy is built around.',
    T2_HIT: 'Hit the windfall target (+5 ATR on the stock).', T1_HIT: 'Hit the first target (+3 ATR on the stock).',
    SL_HIT: 'Hit the disaster floor on the stock price.', PREMIUM_BACKSTOP: 'The option premium halved, so the backstop closed it.',
    STAGNATION: 'Went nowhere for 5 sessions (premium under +25%), so it was closed before theta ate more.',
    MAX_HOLD: 'Reached the maximum holding period and was closed on time, win or lose.',
    EARNINGS_EXIT: 'Closed the session before quarterly results to avoid the IV crush and gap risk.',
    CANCELLED: 'The limit entry never filled, so there was no trade.',
  };
  const parseJ = v => { if (v == null) return null; if (typeof v !== 'string') return v; try { return JSON.parse(v); } catch (e) { return null; } };
  const isoOf = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const addSessions = (iso, n) => { if (!iso) return null; const d = new Date(iso + 'T00:00:00'); let k = 0; while (k < n) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w && w !== 6) k++; } return isoOf(d); };
  const addDays = (iso, n) => { if (!iso) return null; const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return isoOf(d); };
  const daysBetween = (a, b) => a && b ? Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5) : null;
  const sessionsBetween = (a, b) => { if (!a || !b) return null; const d = new Date(a + 'T00:00:00'), e = new Date(b + 'T00:00:00'); let k = 0; while (d < e) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w && w !== 6) k++; } return k; };
  const fmtDate = iso => iso ? new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : '-';

  function swingGuide(x) {
    const ind = parseJ(x.indicators) || {}, reasons = parseJ(x.reasons) || [];
    const isPull = /pullback|rsi\(2\)|cumrsi/i.test(JSON.stringify(reasons) + JSON.stringify(ind)) || /PULLBACK/i.test(x.source || '');
    const maxHold = +(ind.max_hold_days || (isPull ? 10 : 5));
    const entry = +x.option_entry || 0, long = (x.direction || '').toUpperCase() !== 'SHORT';
    const isOpen = x.status !== 'CLOSED';
    // Pullback rows count trading sessions; older rows (restored from Slack) counted calendar days.
    const unit = isPull ? 'sessions' : 'days';
    const span = isPull ? sessionsBetween : daysBetween;
    const held = isOpen ? span(x.entry_date, todayISO()) : (x.hold_days != null ? +x.hold_days : span(x.entry_date, x.exit_date));
    const steps = [];
    const st = (title, detail, right, pal, hitKey) => steps.push({ title, detail, right, pal, hit: !isOpen && hitKey && hitKey === x.exit_reason });
    if (isPull) st('First strength: take profit', 'Close above the 5-day average or RSI(2) above 65. Most winners exit here.', 'profit exit', 'mint', 'STRENGTH_EXIT');
    if (x.spot_target2) st('Windfall target', `${x.instrument} at ${num(x.spot_target2)} (+5 ATR). Exit everything.`, '₹' + num(x.spot_target2), 'mint', 'T2_HIT');
    if (x.spot_target1) st('First target', `${x.instrument} at ${num(x.spot_target1)} (+3 ATR).${x.option_target1 ? ' Option near ₹' + num(x.option_target1) + '.' : ''}`, '₹' + num(x.spot_target1), 'mint', 'T1_HIT');
    if (x.spot_sl && !isPull) st('Stop on the stock', `Out if ${x.instrument} closes ${long ? 'below' : 'above'} ${num(x.spot_sl)}.${x.option_sl ? ' Option near ₹' + num(x.option_sl) + '.' : ''}`, '₹' + num(x.spot_sl), 'blush', 'SL_HIT');
    if (x.spot_sl && isPull) st('Disaster floor only', `Spot stop is off for pullback trades (it lost money in the backtest). ${num(x.spot_sl)} is information, not an exit.`, '₹' + num(x.spot_sl), 'butter', 'SL_HIT');
    if (entry) st('Premium backstop', 'Exit if the option premium falls to half of what you paid.', '₹' + num(entry * 0.5), 'blush', 'PREMIUM_BACKSTOP');
    if (isPull && entry) st('Stagnation check', `If the premium is still under ₹${num(entry * 1.25)} (+25%) after 5 sessions, close it. Flat loses to theta.`, fmtDate(addSessions(x.entry_date, 5)), 'butter', 'STAGNATION');
    st('Results day', 'Close the session before the company reports quarterly results. Never hold an option through earnings.', 'T-1', 'butter', 'EARNINGS_EXIT');
    st('Time limit', `Hold at most ${maxHold} ${unit}, win or lose.`, fmtDate(isPull ? addSessions(x.entry_date, maxHold) : addDays(x.entry_date, maxHold)), 'lav', 'MAX_HOLD');
    return { ind, reasons, isPull, maxHold, held, steps, isOpen, unit };
  }

        </div>

          <div class="kvg">

            ${g.ind.risk_reward ? `<div><span>Reward : risk</span><b>${esc(g.ind.risk_reward)}</b></div>` : ''}

    const b = el.querySelector('.sh-body'); if (b && scroll) { b.scrollTop = scroll; b.querySelectorAll(':scope>*').forEach(n => n.style.animation = 'none'); }

  }

  // ── render ───────────────────────────────────────────────────────────
  function render() {

    const todays = rows.filter(s => s.date === today);

    const realized = closedToday.reduce((a, s) => a + signedPnl(s), 0);

    const net = realized + unreal;
    const deployed = open.reduce((a, p) => a + (+p.entry || 0) * (+p.qty || 0), 0);
    const total = perf.total || 0, wins = perf.wins || 0, losses = perf.losses || 0;

          <div class="meta"><span class="own">${esc(x.entry_date)}${x.exit_date ? ' → ' + esc(x.exit_date) : ''}</span><span class="chip">${esc(x.option_strike ? Math.round(x.option_strike) + ' ' + (x.option_type || '') : '')}</span>${x.hold_days != null ? `<span class="chip">${esc(x.hold_days)}d</span>` : ''}</div></div></div>
        <div class="dest wrap2">Started ${fmtDate(x.entry_date)} at ₹${num(x.option_entry)}${isOpen ? ` · open, day ${daysBetween(x.entry_date, today)}` : ` · closed ${fmtDate(x.exit_date)} at ₹${num(x.option_exit)}`}<span class="why">1 lot = ${esc(x.lot_size)} units = ${inr((+x.option_entry || 0) * (+x.lot_size || 0))} · ${isOpen ? 'open now' : (+x.pnl_rupees >= 0 ? 'made ' : 'lost ') + inr(Math.abs(+x.pnl_rupees || 0))} · tap for details</span></div>
        <div class="num ${r > 0 ? 'up' : r < 0 ? 'dn' : ''}">${r != null ? (r >= 0 ? '+' : '') + (r * 100).toFixed(1) + '%' : '-'}</div>
        <div class="num ${pnl > 0 ? 'up' : pnl < 0 ? 'dn' : ''}">${isOpen || r == null ? '-' : inr(pnl, true)}</div></div>`;
    }).join('');
    const reg = (S.swingRes && S.swingRes.regime) || null;

    const keep = document.activeElement && document.activeElement.id === 'cap';
    $('app').innerHTML = `
    <div class="bar rise" style="--i:0">
      <div class="brand"><div class="mark"></div>Desk<span class="host mkt"><span class="dot ${mk.open ? '' : 'off'}"></span>${clock} IST · ${mk.open ? 'market open' : 'market closed'}</span></div>
      <div class="tools">
        <div class="capbox"><label for="cap">Capital ₹</label><input id="cap" inputmode="numeric" value="${capital}" aria-label="Your trading capital in rupees"></div>
        <div class="me"><span class="meav">${esc(((st.config || {}).strategy || '?')[0])}</span><span class="mename">${esc((st.config || {}).strategy || 'engine')}</span><span class="tag ${st.running ? 'w' : 'r'}">${st.running ? 'running' : 'stopped'}</span></div>
        <button class="ibtn" id="theme" title="Switch theme" aria-label="Switch theme"><svg viewBox="0 0 24 24">${root.getAttribute('data-theme') === 'dark' ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>' : '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'}</svg></button>
      </div>
    </div>
    ${S.err ? `<div class="err">${esc(S.err)}</div>` : ''}
    <div class="hero rise" style="--i:1"><h1><span class="hl">${hi}</span><span class="hl hl2">${todays.length ? `${todays.length} signal${todays.length === 1 ? '' : 's'} today, ${inr(net, true)}` : (mk.open ? 'Engine is scanning' : 'Market is closed')}</span></h1></div>

    <div class="kpis six">${idxCards}
      <div class="kpi t-peach pop" style="--i:5"><div class="lab">Today's P&amp;L</div><div class="val">${inr(net, true)}</div><div class="sub">${capital ? (net / capital * 100).toFixed(2) + '% of capital' : ''} · ${closedToday.length + open.length} trades</div></div>
      <div class="kpi t-butter pop" style="--i:6"><div class="lab">Capital deployed</div><div class="val">${capital ? Math.round(deployed / capital * 100) : 0}%</div><div class="sub">${inr(deployed)} in · ${inr(Math.max(0, capital - deployed))} free</div></div>
      <div class="kpi t-blush pop" style="--i:7"><div class="lab">Net per trade</div><div class="val">${inr(perTrade, true)}</div><div class="sub">${wins} W · ${losses} L · ${Math.max(0, total - wins - losses)} scratch</div></div>
    </div>

    <div class="tb rise" style="--i:6"><h2>Live price</h2>
      <div class="seg" role="tablist">${['NIFTY', 'BANKNIFTY', 'FINNIFTY'].map(k => `<button role="tab" aria-selected="${k === sym}" class="${k === sym ? 'on' : ''}" data-sym="${k}">${NAMES[k]}</button>`).join('')}</div></div>
    <div class="table glass chartcard rise" style="--i:7">
      <div class="chart-head"><span class="px">${p.ltp ? num(p.ltp, 2) : '-'}</span>${p.pct != null ? `<span class="chg ${p.pct >= 0 ? 'up' : 'dn'}">${p.pct >= 0 ? '+' : ''}${num(p.chg, 2)} · ${p.pct >= 0 ? '+' : ''}${num(p.pct, 2)}%</span>` : ''}<span class="grow"></span><span class="stamp" style="font-size:12.5px;font-weight:600;color:var(--ink3)">prev close ${num(p.prev_close, 2)} · ticks every 5 s</span></div>
      <div class="plot" id="plot">${chartSVG(sym)}</div>
      <div class="legend"><span><i style="background:var(--good)"></i>price, 5-min + live ticks</span><span><i style="background:var(--accent)"></i>VWAP proxy (today)</span><span><i style="background:var(--bad);width:9px;height:9px;border-radius:50%"></i>engine signals</span></div>
    </div>

    <div class="tb rise" style="--i:8"><h2>Signals <span class="tag">${cards.length}</span></h2><span class="stamp">entry, SL, T1, T2 as the engine set them · sized for your ${inr(capital)}</span></div>
    ${sigHtml ? `<div class="sigs">${sigHtml}</div>` : '<div class="table glass"><div class="empty">No signals yet today. The engine fires only between 09:45 and 14:30 IST.</div></div>'}

    <div class="tb rise" style="--i:18"><h2>Swing record <span class="tag">${swOpen.length} open · ${chron.length} closed</span></h2><span class="stamp">${reg ? `regime tier ${esc(reg.tier)}${reg.tier === 'C' ? ' (no new entries)' : ''} · ` : ''}if you had put ${inr(slot)} (one of 4 slots) into each</span></div>
    ${(() => {
      const lastEntry = sw.map(x => x.entry_date).sort().slice(-1)[0];
      const daysQuiet = lastEntry ? daysBetween(lastEntry, today) : null;
      if (swOpen.length || daysQuiet == null || daysQuiet < 7) return '';
      const why = reg && reg.tier === 'C'
        ? `The engine only opens swing trades when the market is in an uptrend. Today NIFTY (${num(reg.nifty_close, 0)}) is <b>${num(reg.nifty_gap_pts, 0)} points below</b> its 200-day average (${num(reg.nifty_sma200, 0)}), so new entries are blocked (checked ${esc(reg.checked_at)} IST).`
        : 'The scanner has found no stock that passes every filter.';
      return `<div class="stale"><b>No new swing trade since ${fmtDate(lastEntry)} (${daysQuiet} days).</b> ${why} The trades below are the past record, not live ideas. New ones will appear here the day the filter turns on.</div>`;
    })()}
    <div class="kpis six" style="margin-bottom:16px">
      <div class="kpi t-mint pop" style="--i:18;grid-column:span 2"><div class="lab">Your ${inr(slot)} slot, every trade</div><div class="val">${inr(eq, true)}</div>
        <div class="bars mini">${curve.map((v, i) => { const lo = Math.min(0, ...curve), sp = (Math.max(0, ...curve) - lo) || 1; return `<i class="${i === curve.length - 1 ? 'now' : ''}" style="height:${Math.max(8, (v - lo) / sp * 100)}%;--k:${i}"></i>`; }).join('')}</div></div>
      <div class="kpi t-lav pop" style="--i:19"><div class="lab">Win rate</div><div class="val">${chron.length ? Math.round(recWins / chron.length * 100) : 0}%</div><div class="sub">${recWins} of ${chron.length} closed green</div></div>
      <div class="kpi t-sky pop" style="--i:20"><div class="lab">Engine, 1 lot each</div><div class="val">${inr(swNet, true)}</div><div class="sub">actual lots, not your slot</div></div>
      <div class="kpi t-peach pop" style="--i:21"><div class="lab">Best</div><div class="val">${best ? '+' + (ret(best) * 100).toFixed(0) + '%' : '-'}</div><div class="sub">${best ? esc(best.instrument) + ' · ' + fmtDate(best.entry_date) : ''}</div></div>
      <div class="kpi t-blush pop" style="--i:22"><div class="lab">Worst</div><div class="val">${worst ? (ret(worst) * 100).toFixed(0) + '%' : '-'}</div><div class="sub">${worst ? esc(worst.instrument) + ' · ' + fmtDate(worst.entry_date) : ''}</div></div>
    </div>
    <div class="table glass rise" style="--i:23">
      <div class="thead s4"><div>Trade</div><div>Started → now</div><div class="num">Return</div><div class="num">Your slot</div></div>
      ${swHtml || '<div class="empty">No swing trades yet.</div>'}
      ${sw.filter(x => x.status === 'CLOSED').length > swClosed.length ? `<div style="padding:8px 24px 14px;display:flex;justify-content:center"><button class="btn sm" data-swall>${S.swAll ? 'Show recent only' : 'Show all ' + sw.filter(x => x.status === 'CLOSED').length + ' trades'}</button></div>` : ''}
    </div>
    <p class="foot" style="margin-top:12px">Return is the option premium's change from entry to exit. "Your slot" scales that to ${inr(slot)}, ignoring lot sizes, so it shows how the strategy did, not what a broker would have filled. Open trades show "-" until the engine closes them: the swing feed has no live quote for stock options.</p>

    <div class="tb rise" style="--i:28"><h2>All-time</h2><span class="stamp">intraday engine since 4 Sep 2026</span></div>
    <div class="big">
      <div style="--bg-c:var(--lav);--tc:var(--lav-i)"><b>${inr(perf.total_pnl_net || 0, true)}</b><span>net after costs</span></div>
      <div style="--bg-c:var(--mint);--tc:var(--mint-i)"><b>${total ? Math.round(wins / total * 100) : 0}%</b><span>win rate (${wins} of ${total})</span></div>
      <div style="--bg-c:var(--peach);--tc:var(--peach-i)"><b>${inr(perf.best_trade || 0, true)}</b><span>best trade</span></div>
      <div style="--bg-c:var(--blush);--tc:var(--blush-i)"><b>${inr(perf.worst_trade || 0, true)}</b><span>worst trade</span></div>
      <div style="--bg-c:var(--butter);--tc:var(--butter-i)"><b>${inr((perf.total_brokerage || 0) + (perf.total_slippage || 0))}</b><span>paid in costs</span></div>
    </div>
    <p class="foot">Read-only view of the engine at ${esc(server().replace(/^https?:\/\//, ''))}. Sizes use your capital, 1% risk at the premium stop, a 50% capital cap per trade, ₹115/lot brokerage and 50 bps slippage per side. Advisory only, never an order. Start/stop the engine from the <a href="console.html" style="color:var(--accent);font-weight:700">console</a>.</p>`;

    if (keep) { const c = $('cap'); c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
    if (S.openSw != null) renderSheet();
  }

  // ── events ───────────────────────────────────────────────────────────
  const openSw = id => { S.openSw = id; const el = $('swSheet'); el.innerHTML = ''; renderSheet(); setTimeout(() => { const c = el.querySelector('[data-close]'); c && c.focus(); }, 50); };
  const closeSw = () => { const id = S.openSw; S.openSw = null; renderSheet(); const row = document.querySelector(`[data-sw="${id}"]`); row && row.focus(); };
  document.addEventListener('click', e => {
    if (e.target.closest('[data-close]') || e.target.id === 'scrim') { closeSw(); return; }
    if (e.target.closest('[data-swall]')) { S.swAll = !S.swAll; render(); return; }
    const r = e.target.closest('[data-sw]'); if (r) { openSw(r.dataset.sw); return; }
    const b = e.target.closest('[data-sym]');
    if (b) { S.sym = b.dataset.sym; ls.set('desk-sym', S.sym); if (!S.candles[S.sym]) loadCandles(S.sym); render(); return; }
    if (e.target.closest('#theme')) { const t = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', t); ls.set('links-theme', t); render(); }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'cap') { const v = Math.round(+String(e.target.value).replace(/[^\d.]/g, '')); if (v > 0) { capital = v; ls.set('ie-capital', String(v)); } render(); }
  });
  document.addEventListener('keydown', e => {
    if (e.target.id === 'cap' && e.key === 'Enter') { e.target.blur(); return; }
    if (e.key === 'Escape' && S.openSw != null) { closeSw(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-sw],.kpi[data-sym]')) { e.preventDefault(); e.target.click(); }
  });

  poll('status', '/api/status', 10000);
  poll('ltp', '/api/ltp', 5000, () => {
    const t = todayISO() + ' ' + hm(istNow()) + ':' + String(istNow().getSeconds()).padStart(2, '0');
    if (!(S.status && S.status.market && S.status.market.open)) return;
    for (const [k, v] of Object.entries(S.ltp.prices || {})) { const a = S.ticks[k] = S.ticks[k] || []; a.push({ t, p: +v.ltp }); if (a.length > 400) a.shift(); }
  });
  poll('hist', () => '/api/history?limit=200&date=' + todayISO(), 20000);
  poll('perf', '/api/performance', 60000);
  poll('swing', '/api/swing/positions', 120000);
  poll('swingRes', '/api/swing/results', 300000, null, 60000);
  loadCandles(S.sym).then(() => { for (const k of SYMS) if (k !== S.sym) loadCandles(k); });
  setTimeout(() => $('app').classList.add('ready'), 1500);
  setInterval(loadAllCandles, 5 * 60000);
  setInterval(render, 30000);
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 120); });
  setTimeout(render, 60);
})();
</script>
</body>
</html>
