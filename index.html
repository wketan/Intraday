    // ─────────────────────────────────────────────────────────
    // Backtest modal — runs /api/backtest and renders results
    // ─────────────────────────────────────────────────────────
    function BacktestModal({ open, onClose, budget }) {
      const [days, setDays] = useState(30);
      const [syms, setSyms] = useState({ NIFTY: true, BANKNIFTY: true, FINNIFTY: true });
      const [strategy, setStrategy] = useState('v2');
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const [data, setData] = useState(null);
      const [progressMsg, setProgressMsg] = useState('');
      const pollRef = useRef(null);

      useEffect(() => {
        if (open) { setData(null); setErr(''); setProgressMsg(''); }
        return () => { if (pollRef.current) { clearTimeout(pollRef.current); pollRef.current = null; } };
      }, [open]);

      if (!open) return null;

      const toggleSym = (k) => setSyms(s => ({ ...s, [k]: !s[k] }));

      const pollJob = async (jobId, startedAt) => {
        const elapsedSec = Math.floor((Date.now() - startedAt) / 1000);
        try {
          const r = await apiFetch('/api/backtest/jobs/' + jobId);
          if (!r.ok) {
            const t = await r.text();
            throw new Error('API ' + r.status + ' · ' + t.slice(0, 200));
          }
          const j = await r.json();
          if (j.status === 'done' && j.result) {
            setData(j.result);
            setBusy(false);
            setProgressMsg('');
            return;
          }
          if (j.status === 'error') {
            setErr(j.error || 'backtest job failed');
            setBusy(false);
            setProgressMsg('');
            return;
          }
          const mins = Math.floor(elapsedSec / 60);
          const secs = elapsedSec % 60;
          const elapsed = mins + 'm ' + String(secs).padStart(2,'0') + 's';
          setProgressMsg((j.progress || 'Working...') + '  ·  ' + elapsed);
          // Hard cap 25 minutes; server GC kicks in at 30 min anyway.
          if (elapsedSec > 1500) {
            setErr('Backtest still running after 25 minutes — check Railway logs');
            setBusy(false);
            setProgressMsg('');
            return;
          }
          // Poll every 3s for the first minute (fast initial feedback), then
          // every 6s once we know it's a long-running job.
          const nextDelay = elapsedSec < 60 ? 3000 : 6000;
          pollRef.current = setTimeout(() => pollJob(jobId, startedAt), nextDelay);
        } catch (e) {
          setErr(e.message || 'Poll failed');
          setBusy(false);
          setProgressMsg('');
        }
      };

      const run = async () => {
        const symbols = Object.keys(syms).filter(k => syms[k]);
        if (symbols.length === 0) { setErr('Pick at least one instrument'); return; }
        setBusy(true); setErr(''); setData(null); setProgressMsg('Starting backtest...');
        try {
          const r = await apiFetch('/api/backtest', {
            method: 'POST',
            body: JSON.stringify({ days, symbols, budget: budget || 50000, strategy })
          });
          if (!r.ok) {
            const t = await r.text();
            throw new Error('API ' + r.status + ' · ' + t.slice(0, 200));
          }
          const j = await r.json();
          if (!j.ok || !j.job_id) throw new Error(j.error || 'backtest spawn failed');
          // Start polling for the job's progress + result
          pollJob(j.job_id, Date.now());
        } catch (e) {
          setErr(e.message || 'Backtest failed');
          setBusy(false);
          setProgressMsg('');
        }
      };

      const summary = data && data.summary;
      const trades  = (data && data.trades) || [];
      const curve   = summary && summary.equity_curve || [];

      // Build equity curve SVG
      let curveSVG = null;
      if (curve.length > 1) {
        const values = curve.map(p => p.pnl);
        const mn = Math.min(0, ...values);
        const mx = Math.max(0, ...values);
        const range = mx - mn || 1;
        const W = 880, H = 120, pad = 6;
        const step = (W - pad*2) / (curve.length - 1);
        const points = curve.map((p, i) => {
          const x = pad + i * step;
          const y = pad + (1 - (p.pnl - mn) / range) * (H - pad*2);
          return [x, y];
        });
        const line = points.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
        const area = line + ' L ' + (W-pad) + ' ' + (H-pad) + ' L ' + pad + ' ' + (H-pad) + ' Z';
        const zeroY = pad + (1 - (0 - mn) / range) * (H - pad*2);
        const isWin = (values[values.length-1] || 0) >= 0;
        curveSVG = (
          <svg className="bt-curve" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
            <defs>
              <linearGradient id="btGrad" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stopColor={isWin?'var(--win)':'var(--loss)'} stopOpacity="0.30"/>
                <stop offset="100%" stopColor={isWin?'var(--win)':'var(--loss)'} stopOpacity="0"/>
              </linearGradient>
            </defs>
            <line x1="0" y1={zeroY} x2={W} y2={zeroY} stroke="var(--line-1)" strokeDasharray="3 4"/>
            <path d={area} fill="url(#btGrad)"/>
            <path d={line} fill="none" stroke={isWin?'var(--win)':'var(--loss)'} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        );
      }

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card bt-card" onClick={(e)=>e.stopPropagation()}>
            <div className="modal-head">
              <div className="modal-avatar" style={{background:'linear-gradient(135deg,#a78bfa,#60a5fa)'}}>B</div>
              <div>
                <div className="modal-name">Backtest <em style={{fontFamily:'var(--font-italic)',fontStyle:'italic',color:'var(--accent)',fontWeight:400}}>strategy v2</em></div>
                <div className="modal-sub">Replay closed sessions · validate edge before live</div>
              </div>
              <button className="modal-x" onClick={onClose} aria-label="Close">×</button>
            </div>

            <div className="bt-controls">
              <div className="group">
                <span className="label">Strategy</span>
                <div className="bt-seg">
                  {[
                    {k: 'v2',        label: 'v2',        title: 'Confluence (legacy, baseline)'},
                    {k: 'orb',       label: 'ORB-15',    title: 'Opening Range Breakout — 1 trade/day per instrument'},
                    {k: 'gamma',     label: 'Gamma',     title: 'Gamma Blast — expiry-day only'},
                    {k: 'conductor', label: 'Conductor', title: '5-dim AI-style discretionary scout — targets ₹1k+ EV/trade'},
                    {k: 'scalper',   label: 'Scalper',   title: 'MACD/EMA crossover scalper — 5-10 pt targets, 15-min holds'},
                    {k: 'scalper_v3',label: 'Scalper v3',title: 'Price-action scalp: VWAP bounce / pivot bounce / 3-bar reversal. Tuned for NIFTY.'},
                    {k: 'reverter',  label: 'Reverter',  title: 'Mean reversion: VWAP fade + RSI extreme + reversal candle. Tuned for range-bound NIFTY.'},
                    {k: 'nifty_windows', label: 'N-Windows', title: 'Conductor confluence, fires only in volatile 09:30-11:00 / 13:30-14:45 windows (U-shape regime).'},
                    {k: 'deadzone_fade', label: 'DZ-Fade', title: 'Reverter VWAP fade, fires only inside the 11:00-13:15 midday dead zone (U-shape regime).'},
                    {k: 'patterns', label: 'Patterns', title: 'Deterministic chart patterns: H&S, double top/bottom, triangles, flags. UNVALIDATED — backtest only.'},
                  ].map(s => (
                    <button key={s.k} type="button" title={s.title}
                      className={strategy === s.k ? 'on' : ''}
                      onClick={() => setStrategy(s.k)}>{s.label}</button>
                  ))}
                </div>
              </div>
              <div className="group">
                <span className="label">Window</span>
                <div className="bt-seg">
                  {[7, 30, 60, 90].map(d => (
                    <button key={d} type="button"
                      className={days === d ? 'on' : ''}
                      onClick={() => setDays(d)}>{d}d</button>
                  ))}
                </div>
              </div>
              <div className="group">
                <span className="label">Instruments</span>
                <div className="bt-syms">
                  {['NIFTY','BANKNIFTY','FINNIFTY'].map(k => (
                    <button key={k} type="button"
                      className={'bt-sym-chip ' + (syms[k]?'on':'')}
                      onClick={() => toggleSym(k)}>{k}</button>
                  ))}
                </div>
              </div>
              <button className="btn primary bt-run" onClick={run} disabled={busy}>
                {busy ? <><span className="spinner"/> Running…</> : 'Run backtest'}
              </button>
            </div>

            <div className="bt-body">
              {err && <div className="bt-err">{err}</div>}

              {busy && !data && (
                <div className="bt-running">
                  <span className="spinner"/>
                  <div style={{textAlign:'center'}}>
                    <div style={{color:'var(--ink-1)', fontWeight:600, marginBottom:6,
                      fontFamily:'var(--font-mono)', fontSize:12, letterSpacing:'0.05em'}}>
                      {progressMsg || 'Replaying ' + days + ' days…'}
                    </div>
                    <div style={{color:'var(--ink-3)', fontSize:10.5, letterSpacing:'0.04em'}}>
                      {days >= 60 ? 'Long backtest — can take 3–5 minutes' : 'Typically 30–90 seconds · safe to leave this tab open'}
                    </div>
                  </div>
                </div>
              )}

              {!busy && !data && !err && (
                <div className="bt-empty">
                  <b>What this does</b><br/>
                  Replays the v2 strategy across the selected window using the same<br/>
                  confluence rules, regime filter, and SL/T1/T2 math as the live engine.<br/><br/>
                  Win rate &lt; 45% = strategy needs structural rework.<br/>
                  Win rate ≥ 50% &amp; positive expectancy = edge confirmed.
                </div>
              )}

              {data && summary && summary.taken_count === 0 && summary.diag && (
                <div style={{padding:'14px 16px', borderRadius:12,
                  background:'var(--warn-soft)', border:'1px solid var(--warn-border)',
                  marginBottom:18, fontFamily:'var(--font-mono)', fontSize:11.5,
                  color:'var(--ink-1)', lineHeight:1.6}}>
                  <div style={{fontFamily:'var(--font-display)', fontWeight:600, fontSize:14,
                    color:'var(--warn)', marginBottom:8}}>
                    No trades fired — diagnostic log
                  </div>
                  {Object.entries(summary.diag).map(([sym, d]) => (
                    <div key={sym} style={{marginBottom:10}}>
                      <div style={{color:'var(--ink-2)', marginBottom:2}}><b>{sym}</b> · {d.raw_signals} signals</div>
                      {d.error && <div style={{color:'var(--loss)'}}>error: {d.error}</div>}
                      {(d.lines || []).map((ln, i) => (
                        <div key={i} style={{color:'var(--ink-3)', fontSize:11,
                          fontFamily:'var(--font-mono)', paddingLeft:10}}>{ln}</div>
                      ))}
                    </div>
                  ))}
                  <div style={{marginTop:10, paddingTop:10, borderTop:'1px solid var(--warn-border)',
                    color:'var(--ink-2)', fontSize:11}}>
                    Most common cause: Angel One historical fetch times out or returns empty
                    for cloud-IP requests. Try a shorter window (7d or 30d) — if those also
                    return 0, the data source itself is the bottleneck on Railway.
                  </div>
                </div>
              )}

              {data && summary && (
                <>
                  <div className="bt-stats">
                    <div className="bt-stat">
                      <span className="k">Net P&amp;L</span>
                      <div className={'v ' + (summary.net_pnl>=0?'win':'loss')}>
                        {fmtINR(summary.net_pnl, true)}
                      </div>
                      <span className="sub">over {data.params.days} days</span>
                    </div>
                    <div className="bt-stat">
                      <span className="k">Win rate</span>
                      <div className={'v ' + (summary.win_rate>=50?'win':summary.win_rate>=40?'warn':'loss')}>
                        {summary.win_rate}%
                      </div>
                      <span className="sub">{summary.wins}W · {summary.losses}L · {summary.taken_count} taken</span>
                    </div>
                    <div className="bt-stat">
                      <span className="k">Expectancy</span>
                      <div className={'v ' + (summary.expectancy>=0?'win':'loss')}>
                        {fmtINR(summary.expectancy, true)}
                      </div>
                      <span className="sub">per trade</span>
                    </div>
                    <div className="bt-stat">
                      <span className="k">Max drawdown</span>
                      <div className="v loss">{fmtINR(summary.max_drawdown, true)}</div>
                      <span className="sub">peak-to-trough</span>
                    </div>
                  </div>

                  {curveSVG && (
                    <>
                      <div className="bt-section-title">Equity curve</div>
                      {curveSVG}
                    </>
                  )}

                  {summary.by_symbol && (
                    <>
                      <div className="bt-section-title">By instrument</div>
                      <table className="bt-table">
                        <thead>
                          <tr>
                            <th>Symbol</th>
                            <th className="r">Trades</th>
                            <th className="r">Wins</th>
                            <th className="r">Losses</th>
                            <th className="r">Win rate</th>
                            <th className="r">Net P&amp;L</th>
                            <th className="r">Avg win</th>
                            <th className="r">Avg loss</th>
                          </tr>
                        </thead>
                        <tbody>
                          {Object.entries(summary.by_symbol).map(([sym, s]) => (
                            <tr key={sym}>
                              <td><b style={{color:'var(--ink-1)'}}>{sym}</b></td>
                              <td className="r">{s.trades}</td>
                              <td className="r win">{s.wins}</td>
                              <td className="r loss">{s.losses}</td>
                              <td className="r">{s.win_rate}%</td>
                              <td className={'r ' + (s.net_pnl>=0?'win':'loss')}>{fmtINR(s.net_pnl, true)}</td>
                              <td className="r win">{fmtINR(s.avg_win, true)}</td>
                              <td className="r loss">{fmtINR(s.avg_loss, true)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </>
                  )}

                  {trades.length > 0 && (
                    <>
                      <div className="bt-section-title">Trade log <span style={{color:'var(--ink-4)',fontWeight:400,fontSize:11}}> · first {Math.min(trades.length, 50)} of {trades.length}</span></div>
                      <table className="bt-table">
                        <thead>
                          <tr>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Symbol</th>
                            <th>Side</th>
                            <th>Bucket</th>
                            <th className="r">P&amp;L</th>
                          </tr>
                        </thead>
                        <tbody>
                          {trades.slice(0, 50).map((t, i) => (
                            <tr key={i}>
                              <td>{t.date}</td>
                              <td>{t.time || '—'}</td>
                              <td><b style={{color:'var(--ink-1)'}}>{t.symbol}</b></td>
                              <td>{t.direction || '—'}</td>
                              <td className={t.bucket==='TAKEN_WIN'?'win':t.bucket==='TAKEN_LOSS'?'loss':''}>
                                {t.bucket}
                              </td>
                              <td className={'r ' + (t.net_pnl>0?'win':t.net_pnl<0?'loss':'')}>
                                {t.net_pnl != null ? fmtINR(t.net_pnl, true) : '—'}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </>
                  )}
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Setup screen — shown when no auth token is configured
    // ─────────────────────────────────────────────────────────
    function SetupScreen({ onComplete }) {
      const [serverUrl, setServerUrl] = useState(getServer());
      const [token, setToken] = useState('');
      const [name, setName] = useState('Ketan');
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState(false);

      const save = async () => {
        setBusy(true); setErr('');
        try {
          setServer(serverUrl);
          setAuthToken(token);
          // Verify by hitting /api/ping
          const r = await apiFetch('/api/ping');
          if (!r.ok) throw new Error('Server reachable but ping failed (' + r.status + ')');
          try { localStorage.setItem('ie-user', name); } catch(e){}
          onComplete();
        } catch (e) {
          setErr(e.message || 'Could not reach server');
        } finally {
          setBusy(false);
        }
      };
      return (
        <div className="setup">
          <div className="setup-card">
            <div className="setup-head">
              <div className="setup-logo">I</div>
              <div className="setup-title">Welcome to <em>Intraday Engine.</em></div>
              <div className="setup-sub">Configure the server endpoint &amp; your auth token to connect.
                Leave URL blank to use the current origin (same host as this page).</div>
            </div>
            {err && <div className="setup-err">{err}</div>}
            <div className="modal-section">
              <label className="modal-label">Your name</label>
              <div className="modal-input-row" style={{padding:'10px 14px'}}>
                <input className="modal-input-text" type="text" placeholder="e.g. Ketan"
                  value={name} onChange={e=>setName(e.target.value)}/>
              </div>
            </div>
            <div className="modal-section">
              <label className="modal-label">Server URL (optional)</label>
              <div className="modal-input-row" style={{padding:'10px 14px'}}>
                <input className="modal-input-text" type="text"
                  placeholder="https://intraday.up.railway.app"
                  value={serverUrl} onChange={e=>setServerUrl(e.target.value)}/>
              </div>
            </div>
            <div className="modal-section">
              <label className="modal-label">Auth token</label>
              <div className="modal-input-row" style={{padding:'10px 14px'}}>
                <input className="modal-input-text" type="password"
                  placeholder="Server AUTH_TOKEN"
                  value={token} onChange={e=>setToken(e.target.value)}
                  onKeyDown={e=>{ if(e.key==='Enter') save(); }}/>
              </div>
            </div>
            <div className="modal-foot" style={{borderTop:'1px solid var(--line-1)', marginTop:18, paddingTop:18, paddingLeft:0, paddingRight:0}}>
              <button className="btn primary" onClick={save} disabled={busy || !token.trim()}>
                {busy ? <><span className="spinner"/> Connecting…</> : 'Connect'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // App — wires everything to live /api/* endpoints
    // ─────────────────────────────────────────────────────────
    const INDEX_NAMES = { NIFTY: 'NIFTY 50', BANKNIFTY: 'BANK NIFTY', FINNIFTY: 'FIN NIFTY' };

    function App() {
      const [theme, toggleTheme] = useTheme();
      const [userName, setUserName] = useState(() => {
        try { return localStorage.getItem('ie-user') || 'Ketan'; } catch(e){ return 'Ketan'; }
      });
      const [capital, setCapitalRaw] = useState(() => {
        try { return +localStorage.getItem('ie-capital') || 50000; } catch(e){ return 50000; }
      });
      const [profileOpen, setProfileOpen] = useState(false);
      const [backtestOpen, setBacktestOpen] = useState(false);
      const [needsSetup, setNeedsSetup] = useState(() => !getAuthToken());
      const [busy, setBusy] = useState(false);

      // Live ticking clock (IST)
      const [clock, setClock] = useState(() => {
        const now = new Date();
        const ist = new Date(now.getTime() + ((now.getTimezoneOffset() + 330) * 60000));
        return { hh: String(ist.getHours()).padStart(2,'0'), mm: String(ist.getMinutes()).padStart(2,'0'), ss: ist.getSeconds() };
      });
      useEffect(() => {
        const id = setInterval(() => {
          const now = new Date();
          const ist = new Date(now.getTime() + ((now.getTimezoneOffset() + 330) * 60000));
          setClock({ hh: String(ist.getHours()).padStart(2,'0'), mm: String(ist.getMinutes()).padStart(2,'0'), ss: ist.getSeconds() });
        }, 1000);
        return () => clearInterval(id);
      }, []);

      // Polls
      const [statusData] = usePoll('/api/status', 5000, { enabled: !needsSetup });
      const [perfData]   = usePoll('/api/performance', 12000, { enabled: !needsSetup });
      const [ltpData]    = usePoll('/api/ltp', 6000, { enabled: !needsSetup });
      const [historyData] = usePoll('/api/history?limit=50&date=' + todayISO(), 15000, { enabled: !needsSetup });
      const [diagData]   = usePoll('/api/v2-diag', 20000, { enabled: !needsSetup });
      const [metricsData] = usePoll('/api/metrics', 15000, { enabled: !needsSetup });

      // Index sparkline buffers (in-memory ring)
      const [sparkBuf, setSparkBuf] = useState({ NIFTY: [], BANKNIFTY: [], FINNIFTY: [] });
      useEffect(() => {
        if (!ltpData || !ltpData.prices) return;
        setSparkBuf(prev => {
          const next = Object.assign({}, prev);
          for (const k of Object.keys(ltpData.prices)) {
            const ltp = +ltpData.prices[k].ltp;
            if (!isFinite(ltp) || ltp <= 0) continue;
            const arr = (next[k] || []).slice();
            arr.push(ltp);
            if (arr.length > 36) arr.shift();
            next[k] = arr;
          }
          return next;
        });
      }, [ltpData]);

      const engineState = !statusData ? 'IDLE' : (statusData.running ? 'LIVE' : 'OFF');
      const openSignals = (statusData && statusData.open_signals) || [];
      const alerts = (statusData && statusData.alerts) || [];

      // Today's history
      const todaySignals = useMemo(() => {
        if (!Array.isArray(historyData)) return [];
        return historyData.filter(s => (s.date === todayISO()));
      }, [historyData]);

      // Derived perf
      const perfAll = perfData || {};
      const todayClosed = todaySignals.filter(s => s.status === 'CLOSED');
      const todayWins = todayClosed.filter(s => s.result === 'WIN' || s.result === 'T1' || s.result === 'T2');
      const todayLosses = todayClosed.filter(s => s.result === 'LOSS');

      // Signed P&L per row + cumulative equity curve
      const sgn = (s) => {
        const raw = (s.pnl_rupees_net != null ? +s.pnl_rupees_net : +s.pnl_rupees) || 0;
        if (s.result === 'LOSS') return -Math.abs(raw);
        if (s.result === 'WIN' || s.result === 'T1' || s.result === 'T2') return Math.abs(raw);
        return raw;
      };
      const equityCurve = useMemo(() => {
        const ordered = todayClosed.slice().sort((a,b) => (a.timestamp || '').localeCompare(b.timestamp || ''));
        let cum = 0;
        const pts = [{ t: 0, v: 0 }];
        ordered.forEach((s, idx) => {
          cum += sgn(s);
          pts.push({ t: idx+1, v: cum });
        });
        return pts;
      }, [todayClosed]);
      const maxDD = useMemo(() => {
        let peak = 0, dd = 0;
        equityCurve.forEach(p => { peak = Math.max(peak, p.v); dd = Math.min(dd, p.v - peak); });
        return dd;
      }, [equityCurve]);

      // Realized + unrealized for masthead
      const realized = todayClosed.reduce((a, s) => a + sgn(s), 0);
      const unrealized = openSignals.reduce((a, s) => a + (+s.pnl_now || 0), 0);
      const perfNet = realized + unrealized;
      const perfGross = perfNet;
      const brokerage = perfAll.total_brokerage || 0;
      const slippage = perfAll.total_slippage || 0;

      // Win rate (all-time, from /api/performance)
      const winsAll = perfAll.wins || 0;
      const lossesAll = perfAll.losses || 0;
      const closedAll = winsAll + lossesAll;
      const winRate = perfAll.win_rate != null ? perfAll.win_rate : (closedAll ? (winsAll/closedAll)*100 : 0);

      // Streak: count consecutive same-result from most recent closed
      const streak = useMemo(() => {
        if (!Array.isArray(historyData) || historyData.length === 0) return 0;
        const closed = historyData.filter(s => s.status === 'CLOSED' && (s.result === 'WIN' || s.result === 'T1' || s.result === 'T2' || s.result === 'LOSS'));
        if (closed.length === 0) return 0;
        const isWin = (r) => r === 'WIN' || r === 'T1' || r === 'T2';
        const firstWin = isWin(closed[0].result);
        let n = 0;
        for (const s of closed) {
          if (isWin(s.result) === firstWin) n++;
          else break;
        }
        return firstWin ? n : -n;
      }, [historyData]);

      // Last 10 trades (1=win 0=loss) for win-rate tile
      const last10 = useMemo(() => {
        if (!Array.isArray(historyData)) return [];
        const closed = historyData.filter(s => s.status === 'CLOSED' && (s.result === 'WIN' || s.result === 'T1' || s.result === 'T2' || s.result === 'LOSS')).slice(0, 10).reverse();
        return closed.map(s => (s.result === 'LOSS' ? 0 : 1));
      }, [historyData]);

      // Expectancy
      const expectancy = useMemo(() => {
        if (!closedAll) return 0;
        const avgWin  = perfAll.avg_win || 0;
        const avgLoss = perfAll.avg_loss || 0;
        return (winRate/100) * avgWin + ((100-winRate)/100) * avgLoss;
      }, [perfAll, winRate, closedAll]);

      // Deployed capital
      const deployed = useMemo(() => {
        return openSignals.reduce((s, p) => s + ((+p.entry || 0) * (+p.qty || 0)), 0);
      }, [openSignals]);

      // Indices
      const indices = useMemo(() => {
        const prices = ltpData && ltpData.prices || {};
        return ['NIFTY', 'BANKNIFTY', 'FINNIFTY'].map(code => {
          const p = prices[code] || {};
          return {
            code,
            name: INDEX_NAMES[code],
            ltp: p.ltp,
            pct: p.pct,
            pts: p.chg,
            spark: sparkBuf[code] || [],
            up: (p.pct||0) >= 0,
          };
        });
      }, [ltpData, sparkBuf]);

      // Regime checks from metrics + diag
      const regimeChecks = useMemo(() => {
        const m = metricsData || {};
        const eng = m.engine || {};
        const now = new Date();
        const ist = new Date(now.getTime() + ((now.getTimezoneOffset() + 330) * 60000));
        const hh = ist.getHours();
        const mm = ist.getMinutes();
        const day = ist.getDay();
        const isWeekday = day >= 1 && day <= 5;
        const marketOpen = isWeekday && ((hh > 9) || (hh === 9 && mm >= 15)) && (hh < 16);
        const preCutoff = marketOpen && (hh < 12 || (hh === 12 && mm < 30));
        const tripped = eng.killswitch_tripped;
        // Recognized production strategies. The gate is green when a known
        // strategy is configured, and genuinely red only if it's unset or a
        // typo (which would silently fall back to v1 on the backend). It used
        // to be hard-coded to `=== 'v2'`, leaving it permanently red once we
        // moved to conductor — a false alarm on a live dashboard.
        const KNOWN_STRATS = ['v1','v2','conductor','scalper','scalper_v3',
                              'reverter','nifty_windows','deadzone_fade','patterns'];
        const strat = eng.strategy || '';
        return [
          { label: 'Market open', ok: marketOpen, note: marketOpen ? 'In session' : 'Outside hours' },
          { label: 'Pre-cutoff',  ok: preCutoff, note: preCutoff ? 'Before 12:30' : 'After 12:30' },
          { label: 'Engine',      ok: eng.running, note: eng.running ? 'Running' : 'Stopped' },
          { label: 'Kill-switch', ok: !tripped, note: tripped ? 'Tripped' : 'Clear' },
          { label: 'Strategy',    ok: KNOWN_STRATS.includes(strat), note: strat ? strat.replace(/_/g,' ') : 'not set' },
        ];
      }, [metricsData]);

      // Timeline events from today
      const timelineEvents = useMemo(() => {
        const evs = [];
        const sessionStart = new Date();
        sessionStart.setHours(9, 15, 0, 0);
        todaySignals.forEach(s => {
          const ts = s.timestamp || '';
          const t = ts.split(' ')[1] || '';
          const [hh, mm] = t.split(':').map(x => parseInt(x,10));
          if (isNaN(hh)) return;
          const minOffset = (hh - 9) * 60 + (mm||0) - 15;
          if (minOffset < 0 || minOffset > 375) return;
          const [head, type] = humanizeSym(s.option_symbol || '');
          const sym = head + ' ' + type;
          let kind = 'open';
          if (s.status === 'CLOSED') {
            kind = (s.result === 'LOSS') ? 'loss' : (s.result==='WIN'||s.result==='T1'||s.result==='T2') ? 'win' : 'filter';
          }
          evs.push({
            t: minOffset, label: t.slice(0,5), sym,
            kind, pnl: s.status === 'CLOSED' ? sgn(s) : null,
          });
        });
        return evs;
      }, [todaySignals]);

      // Engine control
      const callEngine = async (path, body) => {
        setBusy(true);
        try {
          await apiJSON(path, { method: 'POST', body: body ? JSON.stringify(body) : null });
        } catch (e) {
          alert('Engine action failed: ' + e.message);
        } finally {
          setBusy(false);
        }
      };

      // Auto-schedule lives on the server (see _scheduler in server.py).
      // It runs 08:45/15:30 Mon-Fri IST regardless of whether the dashboard
      // tab is open — so we don't need a duplicate client-side timer here.

      const saveProfile = (next) => {
        const newCap = +next.capital || capital;
        setCapitalRaw(newCap);
        try { localStorage.setItem('ie-capital', String(newCap)); } catch(e){}
        if (next.name) {
          setUserName(next.name);
          try { localStorage.setItem('ie-user', next.name); } catch(e){}
        }
        // Push capital to server
        apiJSON('/api/config', { method: 'POST', body: JSON.stringify({ budget: newCap }) }).catch(()=>{});
      };

      if (needsSetup) {
        return <SetupScreen onComplete={() => setNeedsSetup(false)}/>;
      }

      return (
        <>
          <div className="page">
            <StatusBar
              engineState={engineState}
              clock={clock}
              theme={theme}
              onToggleTheme={toggleTheme}
              userName={userName}
              onProfileClick={() => setProfileOpen(true)}
              onOpenBacktest={() => setBacktestOpen(true)}
              onTrip={() => callEngine('/api/stop')}
              onReset={() => callEngine('/api/start')}
              busy={busy}
            />
            <Masthead
              perfNet={perfNet}
              openCount={openSignals.length}
              streak={streak}
              dayLabel={ddMonYY()}
              dayCount={todayClosed.length}
            />

            <PositionsSection positions={openSignals}/>

            {/* ── Hero band: headline P&L + win-rate ring ── */}
            <div className="hero-band">
              <PnLTile
                perfNet={perfNet}
                perfGross={perfGross}
                brokerage={brokerage}
                slippage={slippage}
                equityCurve={equityCurve}
                maxDD={maxDD}
                capital={capital}
              />
              <WinRateTile
                wins={winsAll}
                losses={lossesAll}
                winRate={winRate}
                streak={streak}
                expectancy={expectancy}
                last10={last10}
              />
            </div>

            {/* ── Compact stat-chip strip ── */}
            <div className="chip-strip">
              {indices.map((idx, j) => (
                <IndexTile
                  key={idx.code}
                  name={idx.name}
                  ltp={idx.ltp}
                  pct={idx.pct}
                  pts={idx.pts}
                  spark={idx.spark}
                  i={j+2}
                />
              ))}
              <CapitalTile capital={capital} deployed={deployed} positionsCount={openSignals.length}/>
              <StrategyTile diag={diagData}/>
            </div>

            {/* ── Full-width regime gates ── */}
            <div className="strip">
              <RegimeTile regimeChecks={regimeChecks}/>
            </div>

            {/* ── Full-width session timeline ── */}
            <div className="strip">
              <TimelineTile events={timelineEvents}/>
            </div>

            {/* ── Main board: signals centerpiece + side feed ── */}
            <div className="board">
              <SignalsPanel signals={todaySignals}/>
              <aside className="board-side">
                <AiFeedPanel alerts={alerts}/>
                <TelemetryTile metrics={metricsData}/>
              </aside>
            </div>
          </div>

          <ProfileModal
            open={profileOpen}
            userName={userName}
            capital={capital}
            onClose={() => setProfileOpen(false)}
            onSave={saveProfile}
          />

          <BacktestModal
            open={backtestOpen}
            budget={capital}
            onClose={() => setBacktestOpen(false)}
          />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>

  <script>
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.body.classList.add('is-loaded');
    }));

    // Cursor spotlight + parallax tilt
    (function(){
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;
      let pending = false;
      let queue = null;
      function flush(){
        if (!queue) return;
        const { x, y } = queue;
        document.querySelectorAll('.tile, .pos-card').forEach(el => {
          const r = el.getBoundingClientRect();
          if (x < r.left - 200 || x > r.right + 200 || y < r.top - 200 || y > r.bottom + 200) return;
          const rx = x - r.left;
          const ry = y - r.top;
          el.style.setProperty('--mx', rx + 'px');
          el.style.setProperty('--my', ry + 'px');
          if (el.classList.contains('pos-card') && rx >= 0 && rx <= r.width && ry >= 0 && ry <= r.height) {
            const tx = ((rx / r.width) - 0.5) * 4;
            const ty = ((ry / r.height) - 0.5) * -3;
            el.style.setProperty('--tx', tx.toFixed(2) + 'deg');
            el.style.setProperty('--ty', ty.toFixed(2) + 'deg');
          }
        });
        queue = null;
        pending = false;
      }
      window.addEventListener('pointermove', (e) => {
        queue = { x: e.clientX, y: e.clientY };
        if (!pending) { pending = true; requestAnimationFrame(flush); }
      }, { passive: true });
      document.addEventListener('pointerout', (e) => {
        const el = e.target.closest && e.target.closest('.pos-card');
        if (el) {
          el.style.setProperty('--tx', '0deg');
          el.style.setProperty('--ty', '0deg');
        }
      }, { passive: true });
    })();
  </script>
</body>
</html>
