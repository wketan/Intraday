                    {/* (legacy inline estimator kept below in component definition for fallback) */}
                    {false && (
                      (() => {
                        const instDef = INST.find(i => i.name === displaySig.inst) || INST[0];
                        const gap = instDef.gap;
                        const optType = displaySig.type || (displaySig.dir === 'LONG' ? 'CE' : 'PE');
                        const indexEntry = displaySig.entry;
                        if (!indexEntry) return null;
                        const atm = Math.round(indexEntry / gap) * gap;
                        const recStrike = atm; // ATM strike
                        // ivFactor converts index level → approximate ATM premium
                        const ivFactor = { NIFTY: 0.0034, BANKNIFTY: 0.0050, FINNIFTY: 0.0054 }[displaySig.inst] || 0.0040;
                        // ATM option delta ≈ 0.45 — use this to convert INDEX MOVES → OPTION MOVES
                        const atmDelta = 0.45;
                        const idxRisk = displaySig.sl ? Math.abs(displaySig.entry - displaySig.sl) : gap * 0.5;
                        const idxT1 = displaySig.target1 ? Math.abs(displaySig.target1 - displaySig.entry) : idxRisk * 1.5;
                        const idxT2 = displaySig.target2 ? Math.abs(displaySig.target2 - displaySig.entry) : idxRisk * 2.5;
                        // estEntry = ATM premium estimate from index level
                        const estEntry = Math.max(Math.round(indexEntry * ivFactor), 10);
                        // Option SL: premium drops by idxRisk × delta (when index moves against us)
                        const estSl = Math.max(Math.round(estEntry - idxRisk * atmDelta), 5);
                        // Option T1/T2: premium rises by index move × delta (when index moves our way)
                        const estT1 = Math.round(estEntry + idxT1 * atmDelta);
                        const estT2 = Math.round(estEntry + idxT2 * atmDelta);
                        const lotSize = instDef.lot;
                        const budget = 20000;
                        const estLots = Math.max(1, Math.min(3, Math.floor((budget * 0.5) / (estEntry * lotSize))));
                        const estCapital = estEntry * lotSize * estLots;
                        return (
                          <div style={{marginBottom:14}}>
                            {/* Option identity */}
                            <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:10}}>
                              <span style={{fontSize:12, fontWeight:700, fontFamily:'var(--mono)',
                                background: displaySig.dir==='LONG'?'var(--long-dim)':'var(--short-dim)',
                                color: displaySig.dir==='LONG'?'var(--long)':'var(--short)',
                                padding:'4px 10px', borderRadius:4}}>
                                BUY {recStrike} {optType}
                              </span>
                              <span style={{fontSize:10, color:'var(--warn)', fontFamily:'var(--mono)'}}>est · live scan loading</span>
                            </div>

                            {/* Estimated premium levels */}
                            <div style={{fontSize:9, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.08em', fontWeight:600, marginBottom:5}}>Estimated option premiums</div>
                            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:6, marginBottom:10}}>
                              {[
                                { label:'Entry ₹ ~', val:estEntry, color:'var(--accent)' },
                                { label:'SL ₹ ~', val:estSl, color:'var(--short)' },
                                { label:'Target 1 ₹ ~', val:estT1, color:'var(--long)' },
                              ].map(({label,val,color}) => (
                                <div key={label} style={{background:'var(--bg-2)', borderRadius:6, padding:'7px 9px', opacity:0.85}}>
                                  <div style={{fontSize:8.5, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', fontWeight:600, marginBottom:2}}>{label}</div>
                                  <div style={{fontSize:15, fontWeight:700, color, fontFamily:'var(--mono)'}}>{val}</div>
                                </div>
                              ))}
                            </div>

                            {/* Sizing estimate */}
                            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:6, marginBottom:10}}>
                              <div style={{background:'var(--bg-2)', borderRadius:6, padding:'7px 9px', opacity:0.85}}>
                                <div style={{fontSize:8.5, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', fontWeight:600, marginBottom:2}}>Lots × {lotSize}</div>
                                <div style={{fontSize:13, fontWeight:700, fontFamily:'var(--mono)'}}>{estLots}L</div>
                              </div>
                              <div style={{background:'var(--bg-2)', borderRadius:6, padding:'7px 9px', opacity:0.85}}>
                                <div style={{fontSize:8.5, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', fontWeight:600, marginBottom:2}}>Capital ~</div>
                                <div style={{fontSize:13, fontWeight:700, fontFamily:'var(--mono)'}}>₹{estCapital.toLocaleString('en-IN')}</div>
                              </div>
                            </div>

                            {/* Index reference (clearly labelled) */}
                            <div style={{background:'var(--bg-2)', borderRadius:6, padding:'8px 10px', marginBottom:8}}>
                              <div style={{fontSize:9, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.08em', fontWeight:600, marginBottom:5}}>Index reference levels</div>
                              <div style={{display:'flex', gap:14, flexWrap:'wrap', fontFamily:'var(--mono)', fontSize:11}}>
                                {displaySig.entry != null && <span><span style={{color:'var(--ink-3)'}}>Entry</span> <span style={{color:'var(--accent)'}}>{fmt(displaySig.entry)}</span></span>}
                                {displaySig.sl != null && <span><span style={{color:'var(--ink-3)'}}>SL</span> <span style={{color:'var(--short)'}}>{fmt(displaySig.sl)}</span></span>}
                                {displaySig.target1 != null && <span><span style={{color:'var(--ink-3)'}}>T1</span> <span style={{color:'var(--long)'}}>{fmt(displaySig.target1)}</span></span>}
                                {displaySig.rr != null && <span><span style={{color:'var(--ink-3)'}}>R:R</span> <span style={{color: displaySig.rr >= 1.5 ? 'var(--long)' : 'var(--warn)'}}>{Number(displaySig.rr).toFixed(2)}×</span></span>}
                              </div>
                            </div>

                            <div style={{fontSize:10, color:'var(--ink-3)', padding:'4px 0', lineHeight:1.5}}>
                              ⏳ Live option chain scan triggers at 10%+ confidence. Premiums above are estimated — real strikes, greeks, OI and lots will replace these once chain data loads.
                            </div>
                          </div>
                        );
                      })()
                    )}

                    {/* strategy bars */}
                    {displaySig.strategies?.length > 0 && (
                      <div style={{marginBottom:12}}>
                        <div style={{fontSize:9, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.08em', fontWeight:600, marginBottom:8}}>Strategy confluence</div>
                        <StratBars items={displaySig.strategies.map(s=>({...s, dir:displaySig.dir}))}/>

                    {/* WATCH/READY status explanation */}
                    {(displaySig.status === 'WATCH' || displaySig.status === 'READY') && (
                      <div style={{padding:'10px 12px', marginBottom:10, borderRadius:6, fontSize:11.5, lineHeight:1.5,
                        background: displaySig.status==='READY' ? 'var(--accent-faint)' : 'var(--bg-2)',

                        {displaySig.status === 'READY'

    function PositionMonitor({ open, live, onClose }) {
      if (!open) return null;

      const entry = Number(open.entry || open.premium || 0);
      const qty = Number(open.qty || 0);
      const pnl = (cur != null && entry && qty) ? ((cur - entry) * qty * (open.dir === 'SHORT' ? -1 : 1)) : null;

      return (
        <div className="position-monitor">

    /**
     * RiskBanner — shows the kill-switch state, daily-loss progress vs limit,
     * trade-count progress vs cap, AND cache-cost telemetry (Anthropic cache hit
     * rate + candle cache hit rate). Renders nothing until /api/metrics responds.
     *
     * Wireframe:
     *   ┌─────────────────────────────────────────────────────────────────────────┐
     *   │ 🛡 SAFE   ₹—312 / ₹2000 loss limit   3/8 trades   AI cache 84% · candles 92% │
     *   └─────────────────────────────────────────────────────────────────────────┘
     * On kill-switch trip the row turns red and shows "🛑 KILL-SWITCH TRIPPED".
     */
    function RiskBanner({ metrics, onTrip, onReset, onStrategyChange }) {
      if (!metrics) return null;
      const risk = metrics.risk || {};
      const perf = metrics.perf_today || {};
      const eng  = metrics.engine || {};
      const ant  = (metrics.cache && metrics.cache.anthropic) || {};
      const candles = (metrics.cache && metrics.cache.candles) || {};
      const tripped = !!eng.killswitch_tripped;
      const lossLimit = Number(risk.daily_loss_limit || 2000);
      const tradeCap  = Number(risk.max_trades_per_day || 8);
      const netPnl    = Number(perf.total_pnl_net || 0);
      const trades    = Number(metrics.trades_today || 0);
      // Loss progress: 0 when in profit, capped at 100% when at-or-past limit
      const lossPct = lossLimit > 0 ? Math.max(0, Math.min(100, (-netPnl / lossLimit) * 100)) : 0;
      const tradePct = tradeCap > 0 ? Math.max(0, Math.min(100, (trades / tradeCap) * 100)) : 0;
      const antTotal = Number(ant.cache_read_tokens || 0) + Number(ant.input_tokens || 0);
      const antHitPct = antTotal > 0 ? Math.round((Number(ant.cache_read_tokens || 0) / antTotal) * 100) : 0;
      const candleHitPct = candles.hit_rate_pct != null ? candles.hit_rate_pct : 0;
      // Choose colour: tripped = red, near limit = amber, else green
      const tone = tripped || lossPct >= 100 || tradePct >= 100 ? 'short'
                  : lossPct >= 70 || tradePct >= 70 ? 'warn' : 'long';
      const toneVar = tone === 'short' ? 'var(--short)' : tone === 'warn' ? 'var(--warn)' : 'var(--long)';
      const toneDim = tone === 'short' ? 'var(--short-dim)' : tone === 'warn' ? 'var(--warn-dim)' : 'var(--long-dim)';
      const label = tripped ? '🛑 KILL-SWITCH TRIPPED' : (tone === 'long' ? '🛡 SAFE' : tone === 'warn' ? '⚠ NEAR LIMIT' : '⛔ AT LIMIT');
      return (
        <div style={{
          padding: '10px var(--pad-x)',
          background: tripped ? 'oklch(from var(--short) l c h / 0.18)' : toneDim,
          borderBottom: '1px solid ' + toneVar,
          display: 'flex', alignItems: 'center', gap: 18, fontSize: 12, flexWrap: 'wrap',
        }}>
          <span style={{
            fontFamily: 'var(--mono)', fontWeight: 600, fontSize: 11,
            letterSpacing: '0.08em', color: toneVar, whiteSpace: 'nowrap',
          }}>{label}</span>

          {/* Loss progress */}
          <div style={{display:'flex', alignItems:'center', gap:8, minWidth:200}}>
            <span style={{fontSize:10.5, color:'var(--ink-2)', fontFamily:'var(--mono)'}}>LOSS</span>
            <div style={{flex:1, height:6, background:'var(--bg-2)', borderRadius:3, position:'relative', overflow:'hidden'}}>
              <div style={{
                position:'absolute', left:0, top:0, bottom:0,
                width: lossPct + '%', background: toneVar, borderRadius: 3,
                transition: 'width 400ms ease',
              }}/>
            </div>
            <span className="mono" style={{fontSize:11, color: netPnl >= 0 ? 'var(--long)' : 'var(--short)', minWidth:90, textAlign:'right'}}>
              {netPnl >= 0 ? '+₹' : '−₹'}{Math.abs(Math.round(netPnl)).toLocaleString('en-IN')} / ₹{lossLimit.toLocaleString('en-IN')}
            </span>
          </div>

          {/* Trade progress */}
          <div style={{display:'flex', alignItems:'center', gap:8, minWidth:160}}>
            <span style={{fontSize:10.5, color:'var(--ink-2)', fontFamily:'var(--mono)'}}>TRADES</span>
            <div style={{flex:1, height:6, background:'var(--bg-2)', borderRadius:3, position:'relative', overflow:'hidden'}}>
              <div style={{
                position:'absolute', left:0, top:0, bottom:0,
                width: tradePct + '%', background: toneVar, borderRadius: 3,
                transition: 'width 400ms ease',
              }}/>
            </div>
            <span className="mono" style={{fontSize:11, color:'var(--ink-1)', minWidth:48, textAlign:'right'}}>
              {trades} / {tradeCap}
            </span>
          </div>

          <span style={{flex:1}}/>

          {/* Cache telemetry */}
          <div className="muted" style={{display:'flex', gap:12, fontSize:11, fontFamily:'var(--mono)'}}>
            <span title="Anthropic cache hit rate (cached tokens vs total input)">
              AI cache <span style={{color:'var(--ink-1)'}}>{antHitPct}%</span>
              <span style={{color:'var(--ink-3)', marginLeft:4}}>· {Number(ant.calls||0)} calls</span>
            </span>
            <span title="Candle cache hit rate — higher = fewer Angel One API calls">
              Candles <span style={{color:'var(--ink-1)'}}>{candleHitPct}%</span>
            </span>
            <span title="Auto-close cutoff for the session">
              Close <span style={{color:'var(--ink-1)'}}>{eng.auto_close || '15:15'}</span>
            </span>
          </div>

          {/* Strategy toggle (Phase 2.10) — switch v1 / v2 dry / v2 live from UI */}
          <StrategyToggle eng={eng} onChange={onStrategyChange}/>

          {/* Manual override controls */}
          {tripped ? (
            <button type="button" className="btn ghost" style={{height:26, fontSize:11}}
              onClick={onReset} title="Clear kill-switch latch — only do this if you understand why it tripped">
              Reset
            </button>
          ) : (
            <button type="button" className="btn danger" style={{height:26, fontSize:11}}
              onClick={onTrip} title="Manually stop new alerts for the rest of the day">
              Stop alerts
            </button>
          )}
        </div>
      );
    }

    /**
     * StrategyToggle — three-state segmented control rendered inside RiskBanner.
     *
     *   [ v1 (legacy) ]  [ v2 (dry-run) ]  [ v2 (live) ]
     *
     * Clicking a segment POSTs to /api/strategy. The choice persists across
     * server restarts (stored in SQLite engine_state). User never touches
     * Railway env vars to switch strategies.
     */
    function StrategyToggle({ eng, onChange }) {
      if (!eng) return null;
      const strategy = String(eng.strategy || 'v1').toLowerCase();
      const dry = !!eng.dry_run_v2;
      const active = strategy === 'v1' ? 'v1' : (dry ? 'v2dry' : 'v2live');
      const btn = (key, label, payload, title) => (
        <button type="button"
          className={'seg-btn ' + (active === key ? 'on' : '')}
          style={{
            height: 24, padding: '0 8px', fontSize: 10,
            fontFamily: 'var(--mono)', fontWeight: 600,
            borderRadius: 4, border: '1px solid var(--line-1)',
            background: active === key ? 'var(--accent-dim)' : 'transparent',
            color: active === key ? 'var(--accent)' : 'var(--ink-2)',
            cursor: 'pointer', whiteSpace: 'nowrap',
          }}
          onClick={() => onChange(payload)}
          title={title}>
          {label}
        </button>
      );
      return (
        <div style={{display:'flex', gap:2, alignItems:'center',
                     border:'1px solid var(--line-1)', borderRadius:5, padding:1,
                     background:'var(--bg-2)'}}>
          {btn('v1',     'v1 LEGACY',  {strategy:'v1', dry_run_v2:false},
               'Use the 13-indicator legacy strategy (currently live)')}
          {btn('v2dry',  'v2 DRY',     {strategy:'v2', dry_run_v2:true},
               'v2 confluence — fires Slack alerts only, no real trades. Use to evaluate v2 signal quality safely.')}
          {btn('v2live', 'v2 LIVE',    {strategy:'v2', dry_run_v2:false},
               'v2 confluence — REAL trades. Only enable after backtest passes the go/no-go gates.')}
        </div>
      );
    }

    /**
     * DaysInput — typeable number field with draft buffer.
     * Plain `parseInt(e.target.value) || 5` snaps back to 5 when the field is
     * momentarily empty/invalid mid-keystroke, which kills typing. The buffer
     * stays as a free-form string while editing; commit happens on blur/Enter
     * (with clamp to [1, 30]).
     */
    function DaysInput({ value, onCommit }) {
      const [draft, setDraft] = useState(String(value));
      useEffect(() => { setDraft(String(value)); }, [value]);
      const commit = () => {
        const n = parseInt(draft, 10);
        const clamped = isNaN(n) ? 5 : Math.max(1, Math.min(30, n));
        setDraft(String(clamped));
        if (clamped !== value) onCommit(clamped);
      };
      return (
        <input type="number" min="1" max="30" value={draft}
          onChange={e => setDraft(e.target.value)}
          onBlur={commit}
          onKeyDown={e => { if (e.key === 'Enter') e.currentTarget.blur(); }}
          style={{width:52, background:'var(--bg-2)', border:'1px solid var(--line-1)',
                  color:'var(--ink-0)', borderRadius:4, padding:'4px 6px',
                  fontFamily:'JetBrains Mono, monospace', fontSize:11.5}}/>
      );
    }

    /*
     * BridgedPremium — replaces the dashboard's old client-side linear formula
     * (indexEntry × 0.0034) with a server fetch to /api/replay-premium that
     * goes through data_layer's NSE-bridge cascade.
     *
     * For NIFTY 23900 PE on 11 May 2026 14:50 IST, the old formula returned ₹81.
     * This component instead shows:
     *   - The NSE day range (e.g., ₹162.5 - ₹295.0)
     *   - The day's settle price (e.g., ₹248.5)
     *   - A clamp-aware estimate inside that range
     *   - Real IV back-solved from NSE settle (e.g., 22.4%, "nse_settle_calibrated")
     *
     * Falls back to the legacy linear estimate ONLY if the bridge fetch fails.
     */
    function BridgedPremium({ displaySig }) {
      const [bridge, setBridge] = useState(null);
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState(null);
      // Expiry override — user can switch between weekly contracts (12 May / 19 May / etc).
      // Empty string means "let server auto-pick (>=5 DTE)".
      const [expiryOverride, setExpiryOverride] = useState('');

      const instDef = INST.find(i => i.name === displaySig.inst) || INST[0];
      const gap = instDef.gap;
      const lotSize = instDef.lot;
      const optType = displaySig.type || (displaySig.dir === 'LONG' ? 'CE' : 'PE');
      const indexEntry = displaySig.entry;
      const atm = indexEntry ? Math.round(indexEntry / gap) * gap : null;
      const recStrike = atm;

      // Reset override when signal changes
      useEffect(() => { setExpiryOverride(''); }, [displaySig?.id]);

      // Build a small list of candidate Tuesdays the user can switch between:
      // signal-day next Tuesday + the 3 following Tuesdays. Each shown with DTE.
      const expiryCandidates = (() => {
        if (!displaySig?.date) return [];
        const d = new Date(displaySig.date + 'T00:00:00');
        const out = [];
        // First Tuesday at-or-after signal date
        let daysAhead = (2 - d.getDay() + 7) % 7;     // JS getDay: Tue = 2
        if (daysAhead === 0) daysAhead = 7;
        for (let i = 0; i < 5; i++) {
          const exp = new Date(d.getTime() + (daysAhead + i*7) * 24*3600*1000);
          const yyyy = exp.getFullYear();
          const mm = String(exp.getMonth()+1).padStart(2,'0');
          const dd = String(exp.getDate()).padStart(2,'0');
          out.push({
            value: `${yyyy}-${mm}-${dd}`,
            label: `${exp.getDate()} ${exp.toLocaleDateString('en-IN',{month:'short'})} (${(daysAhead+i*7)} DTE)`,
            dte: daysAhead + i*7,
          });
        }
        return out;
      })();

      useEffect(() => {
        if (!displaySig?.iso_ts || !displaySig.inst || !recStrike) {
          setBridge(null); return;
        }
        let cancelled = false;
        setLoading(true); setErr(null);
        let url = `/api/replay-premium?symbol=${encodeURIComponent(displaySig.inst)}`
          + `&strike=${recStrike}&opt_type=${optType}`
          + `&ts=${encodeURIComponent(displaySig.iso_ts)}`;
        if (expiryOverride) url += `&expiry=${encodeURIComponent(expiryOverride)}`;
        apiJSON(url).then(r => {
          if (cancelled) return;
          setBridge(r); setLoading(false);
        }).catch(e => {
          if (cancelled) return;
          setErr(e.message || String(e)); setLoading(false); setBridge(null);
        });
        return () => { cancelled = true; };
      }, [displaySig?.iso_ts, displaySig?.inst, recStrike, optType, expiryOverride]);

      if (!indexEntry || !recStrike) return null;

      // ── Loading ──
      if (loading) {
        return (
          <div style={{marginBottom:14, padding:'14px', background:'var(--bg-2)', borderRadius:8,
                       textAlign:'center', color:'var(--ink-3)', fontSize:11.5}}>
            <div style={{fontFamily:'var(--mono)', marginBottom:4}}>⏳ Fetching real NSE day-OHLC for {recStrike}{optType} at {displaySig.t}…</div>
            <div style={{fontSize:10}}>One-time per signal · cached after first lookup</div>
          </div>
        );
      }

      // ── Bridge succeeded ──
      const hasBridge = bridge && bridge.price != null;
      const hasNseDay = bridge && bridge.nse_day_high != null && bridge.nse_day_low != null;

      if (hasBridge) {
        const price = Number(bridge.price);
        const dayLow = bridge.nse_day_low; const dayHigh = bridge.nse_day_high;
        const daySettle = bridge.nse_day_settle; const dayClose = bridge.nse_day_close;
        const iv = bridge.iv != null ? Number(bridge.iv) : null;
        const ivPct = iv ? (iv < 5 ? iv * 100 : iv) : null;
        const ivSrc = bridge.iv_source || '';
        const clamped = !!bridge.clamped;
        const bsRaw = bridge.price_raw_bs;
        const src = bridge.source || '';
        const inRange = hasNseDay && price >= dayLow && price <= dayHigh;

        // Server-computed outcome (real backtest)
        const oc = bridge.outcome || null;

        // SL / T1 from server outcome if present, else compute client-side (back-compat)
        const sl = oc ? oc.sl : Math.max(Math.round(price * 0.65), 5);
        const t1 = oc ? oc.t1 : Math.round(price * 1.50);
        const t2 = oc ? oc.t2 : Math.round(price * 2.00);
        const estLots = oc ? oc.lots : Math.max(1, Math.min(3, Math.floor((20000 * 0.5) / (price * lotSize))));
        const estCapital = Math.round(price * lotSize * estLots);

        return (
          <div style={{marginBottom:14}}>
            {/* Option identity + source badge */}
            <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:10, flexWrap:'wrap'}}>
              <span style={{fontSize:12, fontWeight:700, fontFamily:'var(--mono)',
                background: displaySig.dir==='LONG'?'var(--long-dim)':'var(--short-dim)',
                color: displaySig.dir==='LONG'?'var(--long)':'var(--short)',
                padding:'4px 10px', borderRadius:4}}>
                BUY {recStrike} {optType}
              </span>
              <span style={{fontSize:10, fontFamily:'var(--mono)',
                color: src.startsWith('nse_calibrated') ? 'var(--long)' : src === 'angel' ? 'var(--long)' : 'var(--warn)',
                background: src.startsWith('nse_calibrated') ? 'var(--long-dim)' : src === 'angel' ? 'var(--long-dim)' : 'var(--warn-dim)',
                padding:'3px 8px', borderRadius:3, fontWeight:600}}>
                {src === 'angel' ? '● LIVE ANGEL'
                  : src === 'nse_calibrated' ? '● NSE-CALIBRATED'
                  : src === 'nse_calibrated_clamped' ? '⚠ NSE-CLAMPED'
                  : '○ BS_FALLBACK'}
              </span>
              {clamped && (
                <span style={{fontSize:9.5, fontFamily:'var(--mono)', color:'var(--warn)',
                  padding:'2px 6px', borderRadius:3, background:'var(--warn-dim)'}}>
                  Clamped — BS estimate was ₹{bsRaw} (outside NSE day range)
                </span>
              )}
            </div>

            {/* Expiry switcher — explicit so user can verify against any expiry */}
            <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:10, fontSize:11}}>
              <span style={{color:'var(--ink-2)', fontFamily:'var(--mono)', fontSize:10}}>Expiry:</span>
              <select
                value={expiryOverride || (bridge?.expiry || '')}
                onChange={e => setExpiryOverride(e.target.value)}
                style={{padding:'3px 6px', fontSize:11, background:'var(--bg-2)',
                        color:'var(--ink-1)', border:'1px solid var(--line-1)', borderRadius:4,
                        fontFamily:'var(--mono)', cursor:'pointer'}}>
                {expiryCandidates.map(e => (
                  <option key={e.value} value={e.value}>{e.label}</option>
                ))}
              </select>
              <span style={{fontSize:10, color:'var(--ink-3)', fontFamily:'var(--mono)'}}>
                Querying: {bridge?.expiry || '—'}
              </span>
              {expiryOverride && (
                <button type="button" onClick={() => setExpiryOverride('')}
                  style={{fontSize:10, padding:'2px 6px', background:'transparent',
                          color:'var(--ink-3)', border:'1px solid var(--line-1)',
                          borderRadius:3, cursor:'pointer'}}>auto</button>
              )}
            </div>

            {/* Premium levels */}
            <div style={{fontSize:9, color:'var(--ink-3)', textTransform:'uppercase',
                         letterSpacing:'0.08em', fontWeight:600, marginBottom:5}}>
              Option premiums {src === 'angel' ? '(real, live)' : '(bridged · NSE-calibrated)'}
            </div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:6, marginBottom:10}}>
              {[
                { label:'Entry ₹', val:price.toFixed(0), color:'var(--accent)' },
                { label:'SL ₹', val:sl, color:'var(--short)' },
                { label:'Target 1 ₹', val:t1, color:'var(--long)' },
              ].map(({label,val,color}) => (
                <div key={label} style={{background:'var(--bg-2)', borderRadius:6, padding:'7px 9px'}}>
                  <div style={{fontSize:8.5, color:'var(--ink-3)', textTransform:'uppercase',
                               letterSpacing:'0.07em', fontWeight:600, marginBottom:2}}>{label}</div>
                  <div style={{fontSize:15, fontWeight:700, color, fontFamily:'var(--mono)'}}>{val}</div>
                </div>
              ))}
            </div>

            {/* NSE day range — the key transparency feature */}
            {hasNseDay && (
              <div style={{background: inRange ? 'var(--long-dim)' : 'var(--warn-dim)',
                           borderRadius:6, padding:'8px 10px', marginBottom:8,
                           borderLeft: '3px solid ' + (inRange ? 'var(--long)' : 'var(--warn)')}}>
                <div style={{fontSize:9, color:'var(--ink-3)', textTransform:'uppercase',
                             letterSpacing:'0.08em', fontWeight:600, marginBottom:5}}>
                  NSE day range — what this option actually traded at {fmtShortDate(displaySig.date)}
                </div>
                <div style={{display:'flex', gap:14, flexWrap:'wrap', fontFamily:'var(--mono)', fontSize:11}}>
                  <span><span style={{color:'var(--ink-3)'}}>Low</span> <span style={{color:'var(--short)'}}>₹{Number(dayLow).toFixed(1)}</span></span>
                  <span><span style={{color:'var(--ink-3)'}}>High</span> <span style={{color:'var(--long)'}}>₹{Number(dayHigh).toFixed(1)}</span></span>
                  {daySettle != null && <span><span style={{color:'var(--ink-3)'}}>Settle</span> <span style={{color:'var(--ink-1)'}}>₹{Number(daySettle).toFixed(1)}</span></span>}
                  {dayClose  != null && <span><span style={{color:'var(--ink-3)'}}>Close</span> <span style={{color:'var(--ink-1)'}}>₹{Number(dayClose ).toFixed(1)}</span></span>}
                </div>
                {ivPct != null && (
                  <div style={{marginTop:5, fontSize:10, fontFamily:'var(--mono)', color: ivSrc === 'nse_settle_calibrated' ? 'var(--long)' : 'var(--ink-3)'}}>
                    IV {ivPct.toFixed(1)}% · {ivSrc.replace(/_/g, ' ')}
                  </div>
                )}
              </div>
            )}

            {/* Sizing estimate */}
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:6, marginBottom:10}}>
              <div style={{background:'var(--bg-2)', borderRadius:6, padding:'7px 9px'}}>
                <div style={{fontSize:8.5, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', fontWeight:600, marginBottom:2}}>Lots × {lotSize}</div>
                <div style={{fontSize:13, fontWeight:700, fontFamily:'var(--mono)'}}>{estLots}L</div>
              </div>
              <div style={{background:'var(--bg-2)', borderRadius:6, padding:'7px 9px'}}>
                <div style={{fontSize:8.5, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', fontWeight:600, marginBottom:2}}>Capital ~</div>
                <div style={{fontSize:13, fontWeight:700, fontFamily:'var(--mono)'}}>₹{estCapital.toLocaleString('en-IN')}</div>
              </div>
            </div>

            {/* ── Outcome (real backtest from NSE day OHLC) ── */}
            {oc && oc.result && (() => {
              const r = oc.result;
              const pnl = oc.result_pnl_rs ?? 0;
              const isWin = ['T1_HIT','T2_HIT'].includes(r) || (r === 'HELD_TO_CLOSE' && pnl > 0);
              const isLoss = r === 'SL_HIT' || (r === 'HELD_TO_CLOSE' && pnl < 0);
              const accent = isWin ? 'var(--long)' : isLoss ? 'var(--short)' : 'var(--warn)';
              const accentDim = isWin ? 'var(--long-dim)' : isLoss ? 'var(--short-dim)' : 'var(--warn-dim)';
              const label = ({
                T2_HIT:        '🎯 TARGET 2 HIT (+100%)',
                T1_HIT:        '✓ TARGET 1 HIT (+50%)',
                SL_HIT:        '✗ STOP LOSS HIT (−35%)',
                HELD_TO_CLOSE: pnl >= 0 ? '⊙ CLOSED IN PROFIT' : '⊙ CLOSED IN LOSS',
                WHIPSAW:       '⚠ WHIPSAW (SL + T1 both touched)',
                UNKNOWN:       '? OUTCOME UNAVAILABLE',
              })[r] || r;
              const pnlSign = pnl >= 0 ? '+' : '−';
              const pnlAbs = Math.abs(pnl).toLocaleString('en-IN');
              return (
                <div style={{background: accentDim, borderRadius:6, padding:'12px',
                             marginBottom:10, borderLeft: '3px solid ' + accent}}>
                  <div style={{fontSize:9, color:'var(--ink-3)', textTransform:'uppercase',
                               letterSpacing:'0.08em', fontWeight:600, marginBottom:6}}>
                    Outcome — what actually happened that day
                  </div>
                  <div style={{display:'flex', alignItems:'baseline', justifyContent:'space-between',
                               gap:10, flexWrap:'wrap', marginBottom:8}}>
                    <span style={{fontSize:13, fontWeight:700, color: accent, fontFamily:'var(--mono)'}}>
                      {label}
                    </span>
                    {pnl !== 0 && (
                      <span style={{fontSize:18, fontWeight:700, color: accent, fontFamily:'var(--mono)'}}>
                        {pnlSign}₹{pnlAbs}
                      </span>
                    )}
                  </div>
                  {/* P&L breakdown grid */}
                  <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:6, marginBottom:6}}>
                    {oc.max_profit_rs != null && (
                      <div style={{background:'var(--bg-1)', borderRadius:4, padding:'5px 7px'}}>
                        <div style={{fontSize:8, color:'var(--ink-3)', textTransform:'uppercase',
                                     letterSpacing:'0.05em', fontWeight:600, marginBottom:1}}>Best case</div>
                        <div style={{fontSize:11, fontWeight:700, color:'var(--long)', fontFamily:'var(--mono)'}}>
                          +₹{oc.max_profit_rs.toLocaleString('en-IN')}
                        </div>
                        <div style={{fontSize:8, color:'var(--ink-3)', fontFamily:'var(--mono)'}}>
                          @ ₹{Number(dayHigh).toFixed(0)}
                        </div>
                      </div>
                    )}
                    {oc.close_pnl_rs != null && (
                      <div style={{background:'var(--bg-1)', borderRadius:4, padding:'5px 7px'}}>
                        <div style={{fontSize:8, color:'var(--ink-3)', textTransform:'uppercase',
                                     letterSpacing:'0.05em', fontWeight:600, marginBottom:1}}>If held to close</div>
                        <div style={{fontSize:11, fontWeight:700, fontFamily:'var(--mono)',
                                     color: oc.close_pnl_rs >= 0 ? 'var(--long)' : 'var(--short)'}}>
                          {oc.close_pnl_rs >= 0 ? '+' : '−'}₹{Math.abs(oc.close_pnl_rs).toLocaleString('en-IN')}
                        </div>
                        <div style={{fontSize:8, color:'var(--ink-3)', fontFamily:'var(--mono)'}}>
                          @ ₹{Number(daySettle ?? dayClose ?? 0).toFixed(0)} settle
                        </div>
                      </div>
                    )}
                    {oc.max_loss_rs != null && (
                      <div style={{background:'var(--bg-1)', borderRadius:4, padding:'5px 7px'}}>
                        <div style={{fontSize:8, color:'var(--ink-3)', textTransform:'uppercase',
                                     letterSpacing:'0.05em', fontWeight:600, marginBottom:1}}>Worst case</div>
                        <div style={{fontSize:11, fontWeight:700, color:'var(--short)', fontFamily:'var(--mono)'}}>
                          {oc.max_loss_rs >= 0 ? '+' : '−'}₹{Math.abs(oc.max_loss_rs).toLocaleString('en-IN')}
                        </div>
                        <div style={{fontSize:8, color:'var(--ink-3)', fontFamily:'var(--mono)'}}>
                          @ ₹{Number(dayLow).toFixed(0)}
                        </div>
                      </div>
                    )}
                  </div>
                  {oc.result_note && (
                    <div style={{fontSize:10, color:'var(--ink-2)', fontFamily:'var(--mono)', marginTop:4}}>
                      {oc.result_note}
                    </div>
                  )}
                  {oc.caveat && (
                    <div style={{fontSize:9.5, color:'var(--ink-3)', marginTop:5, lineHeight:1.4,
                                 borderTop:'1px dashed var(--line-1)', paddingTop:5}}>
                      <span style={{fontFamily:'var(--mono)'}}>*</span> {oc.caveat}
                    </div>
                  )}
                </div>
              );
            })()}

            {/* Verification footnote */}
            <div style={{fontSize:10, color:'var(--ink-3)', padding:'4px 0', lineHeight:1.5}}>
              {src === 'angel' || src === 'cache:angel'
                ? '✓ Real-time data from Angel One — exact exchange price.'
                : src.startsWith('nse_calibrated')
                  ? '⏳ NSE bridge: real day-IV from settle, clamped inside actual ₹' + Number(dayLow).toFixed(0) + '–₹' + Number(dayHigh).toFixed(0) + ' range. Open broker chart to verify exact 14:50 LTP.'
                  : '⚠ NSE row unavailable — fell back to BS w/ default IV. Treat as rough.'}
            </div>
          </div>
        );
      }

      // ── Bridge failed: fall back to legacy linear formula (clearly labelled) ──
      const ivFactor = { NIFTY: 0.0034, BANKNIFTY: 0.0050, FINNIFTY: 0.0054 }[displaySig.inst] || 0.0040;
      const atmDelta = 0.45;
      const idxRisk = displaySig.sl ? Math.abs(displaySig.entry - displaySig.sl) : gap * 0.5;
      const idxT1 = displaySig.target1 ? Math.abs(displaySig.target1 - displaySig.entry) : idxRisk * 1.5;
      const estEntry = Math.max(Math.round(indexEntry * ivFactor), 10);
      const estSl = Math.max(Math.round(estEntry - idxRisk * atmDelta), 5);
      const estT1 = Math.round(estEntry + idxT1 * atmDelta);
      const budget = 20000;
      const estLots = Math.max(1, Math.min(3, Math.floor((budget * 0.5) / (estEntry * lotSize))));
      const estCapital = estEntry * lotSize * estLots;

      // Bridge diagnostic: show WHY the endpoint returned null so the user knows what to fix
      const debug = bridge?.debug || {};
      const reason = bridge?.reason || (err ? `fetch error: ${err}` : 'no data');
      const debugRows = [
        { lbl: 'Angel connected', ok: !!debug.angel_connected, val: debug.angel_connected ? '✓' : '✗' },
        { lbl: 'Spot bars retrieved', ok: (debug.spot_bars_count || 0) > 0, val: `${debug.spot_bars_count ?? '?'}` },
        { lbl: 'jugaad-data available', ok: !!debug.jugaad_present, val: debug.jugaad_present ? '✓' : '✗' },
        { lbl: 'NSE day OHLC fetched', ok: !!debug.nse_day_fetched, val: debug.nse_day_fetched ? '✓' : '✗' },
        { lbl: 'Option token in master', ok: !!debug.option_token_found, val: debug.option_token_found ? '✓ active' : '✗ expired' },
      ];

      return (
        <div style={{marginBottom:14}}>
          <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:10, flexWrap:'wrap'}}>
            <span style={{fontSize:12, fontWeight:700, fontFamily:'var(--mono)',
              background: displaySig.dir==='LONG'?'var(--long-dim)':'var(--short-dim)',
              color: displaySig.dir==='LONG'?'var(--long)':'var(--short)',
              padding:'4px 10px', borderRadius:4}}>
              BUY {recStrike} {optType}
            </span>
            <span style={{fontSize:10, fontFamily:'var(--mono)', color:'var(--warn)',
              background:'var(--warn-dim)', padding:'3px 8px', borderRadius:3, fontWeight:600}}>
              ⚠ EST (bridge failed)
            </span>
          </div>
          <div style={{fontSize:9, color:'var(--ink-3)', textTransform:'uppercase',
                       letterSpacing:'0.08em', fontWeight:600, marginBottom:5}}>Rough estimate (no NSE data)</div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:6, marginBottom:10}}>
            {[
              { label:'Entry ₹ ~', val:estEntry, color:'var(--accent)' },
              { label:'SL ₹ ~', val:estSl, color:'var(--short)' },
              { label:'Target 1 ₹ ~', val:estT1, color:'var(--long)' },
            ].map(({label,val,color}) => (
              <div key={label} style={{background:'var(--bg-2)', borderRadius:6, padding:'7px 9px', opacity:0.7}}>
                <div style={{fontSize:8.5, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', fontWeight:600, marginBottom:2}}>{label}</div>
                <div style={{fontSize:15, fontWeight:700, color, fontFamily:'var(--mono)'}}>{val}</div>
              </div>
            ))}
          </div>

          {/* Diagnostic box — surfaces the exact failure step so user knows what to fix */}
          <div style={{background:'var(--warn-dim)', border:'1px solid var(--warn)',
                       borderRadius:6, padding:'10px 12px', marginBottom:8}}>
            <div style={{fontSize:10, color:'var(--warn)', fontWeight:700, marginBottom:6,
                         textTransform:'uppercase', letterSpacing:'0.08em'}}>
              ⚠ Why is the bridge unavailable?
            </div>
            <div style={{fontSize:11, color:'var(--ink-1)', marginBottom:8, lineHeight:1.4}}>{reason}</div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'3px 12px', fontSize:10, fontFamily:'var(--mono)'}}>
              {debugRows.map(({lbl, ok, val}) => (
                <div key={lbl} style={{display:'flex', justifyContent:'space-between'}}>
                  <span style={{color:'var(--ink-2)'}}>{lbl}</span>
                  <span style={{color: ok ? 'var(--long)' : 'var(--short)', fontWeight:600}}>{val}</span>
                </div>
              ))}
            </div>
          </div>

          <div style={{fontSize:10, color:'var(--ink-3)', padding:'4px 0', lineHeight:1.5}}>
            Coarse linear estimate shown above. Verify the real LTP on your broker chart before any decision.
          </div>
        </div>
      );
    }

    function TickerTape({ live = {} }) {
      // Build live rows from state; show dashes when we don't have data yet
      const items = INST.map(i => {
        const d = live[i.name];
        return d
          ? { name: i.name, spot: d.ltp, change: d.chg || 0, pct: d.pct || 0, hasData: true }
          : { name: i.name, spot: null, change: 0, pct: 0, hasData: false };
      });
      const row = (it, k) => (
        <span key={k} className="tape-item">
          <span className="sym">{it.name}</span>
          <span className="val">
            {it.hasData ? Number(it.spot).toLocaleString('en-IN', {minimumFractionDigits:2}) : '—'}
          </span>
          {it.hasData && (
            <span className={it.change >= 0 ? 'pos' : 'neg'} style={{fontSize:11}}>
              {it.change >= 0 ? '▲' : '▼'} {Math.abs(it.pct).toFixed(2)}%
            </span>
          )}
        </span>
      );
      return (
        <div className="tape">
          <div className="label">LIVE · NSE</div>
          <div className="track">
            {items.map((it,i) => row(it, i))}
            {items.map((it,i) => row(it, 'dup-'+i))}
          </div>
        </div>
      );
    }

    // ===========================================
    // TWEAKS PANEL
    // ===========================================

    const ACCENTS = {
      amber:  { dark: { a:'0.82 0.15 75',  ai:'0.15 0.02 75' },  light:{ a:'0.62 0.16 55',  ai:'0.99 0 0' } },
      indigo: { dark: { a:'0.72 0.17 270', ai:'0.99 0 0' },     light:{ a:'0.52 0.18 270', ai:'0.99 0 0' } },
      emerald:{ dark: { a:'0.78 0.17 160', ai:'0.15 0.02 160' },light:{ a:'0.55 0.15 160', ai:'0.99 0 0' } },
      rose:   { dark: { a:'0.74 0.19 15',  ai:'0.99 0 0' },     light:{ a:'0.58 0.19 15',  ai:'0.99 0 0' } },
    };

    function applyAccent(theme, accent) {
      const a = ACCENTS[accent][theme];
      const r = document.documentElement;
      r.style.setProperty('--accent',        `oklch(${a.a})`);
      r.style.setProperty('--accent-ink',    `oklch(${a.ai})`);
      r.style.setProperty('--accent-dim',    `oklch(${a.a} / 0.20)`);
      r.style.setProperty('--accent-faint',  `oklch(${a.a} / 0.08)`);
    }

    function Tweaks({ theme, setTheme, accent, setAccent, density, setDensity, serverOk, onClose }) {
      const [serverInp, setServerInp] = useState(getServer());
      const [tokInp, setTokInp] = useState(getAuthToken());
      const inputStyle = { width:'100%', background:'var(--bg-2)', border:'1px solid var(--line-1)', color:'var(--ink-0)',
        padding:'8px 10px', borderRadius:'var(--r-sm)', fontFamily:'JetBrains Mono, monospace', fontSize:11.5, outline:'none', marginBottom:6 };
      const dotColor = serverOk === true ? 'var(--long)' : serverOk === false ? 'var(--short)' : 'var(--ink-3)';
      const dotText  = serverOk === true ? 'connected' : serverOk === false ? 'offline' : 'checking…';
      return (
        <div className="tweaks">
          <h4>Settings <button type="button" onClick={onClose} className="btn ghost" style={{height:22, padding:'0 8px', fontSize:10}}>close</button></h4>

          <div className="tweak-row">
            <div className="lbl">
              <span>Connection</span>
              <span className="v" style={{display:'inline-flex', alignItems:'center', gap:5}}>
                <span style={{width:7, height:7, borderRadius:99, background: dotColor, boxShadow: serverOk===true?'0 0 6px var(--long)':'none'}}/>
                {dotText}
              </span>
            </div>
            <input type="text" placeholder="Server URL (e.g. https://intraday.up.railway.app)" value={serverInp}
              onChange={e=>setServerInp(e.target.value)}
              onBlur={e=>setServer(e.target.value)} style={inputStyle}/>
            <input type="password" placeholder="Auth token" value={tokInp}
              onChange={e=>setTokInp(e.target.value)}
              onBlur={e=>setAuthToken(e.target.value)} style={inputStyle}/>
          </div>

          <div className="tweak-row">
            <div className="lbl">Theme <span className="v">{theme}</span></div>
            <div className="theme-toggle" style={{width:'100%'}}>
              <button type="button" className={theme==='dark'?'on':''} onClick={()=>setTheme('dark')} style={{flex:1, borderRadius:99}}>◗ Dark</button>
              <button type="button" className={theme==='light'?'on':''} onClick={()=>setTheme('light')} style={{flex:1, borderRadius:99}}>◐ Light</button>
            </div>
          </div>
          <div className="tweak-row">
            <div className="lbl">Accent <span className="v">{accent}</span></div>
            <div className="swatches">
              {Object.keys(ACCENTS).map(k => {
                const color = `oklch(${ACCENTS[k][theme].a})`;
                return <div key={k} className={`swatch ${accent===k?'on':''}`} style={{background:color}} onClick={()=>setAccent(k)} title={k}/>;
              })}
            </div>
          </div>
          <div className="tweak-row">
            <div className="lbl">Density <span className="v">{density}</span></div>
            <div className="seg" style={{width:'100%'}}>
              <button type="button" className={density==='comfortable'?'on':''} style={{flex:1}} onClick={()=>setDensity('comfortable')}>Comfort</button>
              <button type="button" className={density==='compact'?'on':''} style={{flex:1}} onClick={()=>setDensity('compact')}>Compact</button>
            </div>
          </div>
        </div>
      );
    }

    // ===========================================
    // MAIN APP
    // ===========================================

          // Normalize candle shape: backend emits {t,o,h,l,c,v}; analyze/chart expect long names.
      function normCandles(arr) {
        if (!Array.isArray(arr)) return [];
        return arr.map(c => {
          if (c && typeof c === 'object' && !Array.isArray(c)) {
            return {
              time:   c.time   ?? c.t   ?? c.timestamp ?? c[0],
              open:   Number(c.open  ?? c.o ?? c[1]),
              high:   Number(c.high  ?? c.h ?? c[2]),
              low:    Number(c.low   ?? c.l ?? c[3]),
              close:  Number(c.close ?? c.c ?? c[4]),
              volume: Number(c.volume ?? c.v ?? c[5] ?? 0),
            };
          }
          if (Array.isArray(c)) {
            return { time:c[0], open:+c[1], high:+c[2], low:+c[3], close:+c[4], volume:+(c[5]||0) };
          }
          return null;
        }).filter(Boolean);
      }

// ═══════════════════════════════════════════════════════════════════
// SWING TAB
// ═══════════════════════════════════════════════════════════════════
function SwingTab({ data, getServer, getAuthToken, showToast }) {
  const { useState: useSt, useCallback } = React;
  const [posFilter, setPosFilter] = useSt('ALL');  // ALL | OPEN | CLOSED
  const [exitLoading, setExitLoading] = useSt(null);
  const [saveLoading, setSaveLoading] = useSt(null);

  const signals   = (data.signals   || []).filter(s => s.signal && s.signal.confidence >= 55);
  const positions = (data.positions || []);
  const perf      = data.performance || {};

  const apiPost = async (path, body={}) => {
    const base  = getServer();
    const token = getAuthToken();
    const r = await fetch(`${base}${path}`, {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Auth-Token':token},
      body: JSON.stringify(body),
    });
    return r.json();
  };

  const triggerExitAll = async () => {
    setExitLoading('all');
    try {
      const r = await apiPost('/api/swing/exit-analysis');
      showToast(r.msg || 'AI exit analysis triggered');
    } catch(e) { showToast('Error: ' + e.message); }
    finally { setExitLoading(null); }
  };

  const triggerExitOne = async (posId) => {
    setExitLoading(posId);
    try {
      const r = await apiPost(`/api/swing/exit-analysis/${posId}`);
      showToast(r.ai ? `AI: ${r.ai.decision} — ${(r.ai.reasoning||'').slice(0,60)}` : 'Done');
    } catch(e) { showToast('Error: ' + e.message); }
    finally { setExitLoading(null); }
  };

  const saveSignal = async (name) => {
    setSaveLoading(name);
    try {
      const r = await apiPost('/api/swing/save-signal', { instrument: name });
      showToast(r.ok ? `✅ Position saved for ${name} (#${r.id})` : (r.error || 'Error'));
    } catch(e) { showToast('Error: ' + e.message); }
    finally { setSaveLoading(null); }
  };

  const closePosition = async (pos) => {
    const price = prompt(`Close position #${pos.id} (${pos.instrument}).\nEnter exit price (spot or option premium):`);
    if (!price || isNaN(+price)) return;
    try {
      const r = await apiPost(`/api/swing/positions/${pos.id}`, { action:'close', exit_price: +price });
      showToast(r.result ? `Closed: ${r.result.result} | P&L ₹${r.result.pnl_rupees}` : 'Closed');
    } catch(e) { showToast('Error: ' + e.message); }
  };

  const confColor = c => c >= 75 ? 'var(--long)' : c >= 60 ? 'var(--warn)' : 'var(--ink-2)';
  const dirBg    = d => d === 'LONG' ? 'var(--long-dim)' : 'var(--short-dim)';
  const dirColor = d => d === 'LONG' ? 'var(--long)' : 'var(--short)';
  const pnlColor = p => p > 0 ? 'var(--long)' : p < 0 ? 'var(--short)' : 'var(--ink-2)';

  const filteredPos = positions.filter(p => posFilter === 'ALL' || p.status === posFilter);

  return (
    <div style={{flex:1, overflowY:'auto', padding:'0 0 80px'}}>

      {/* ── Performance strip ──────────────────────────────────────── */}
      {perf.total > 0 && (
        <div style={{display:'flex', gap:8, padding:'10px 12px 0', flexWrap:'wrap'}}>
          {[
            ['Trades', perf.total],
            ['Wins', perf.wins],
            ['Win rate', (perf.win_rate||0)+'%'],
            ['Total P&L', '₹'+(perf.total_pnl||0).toLocaleString('en-IN')],
            ['Avg hold', (perf.avg_hold_days||0)+' days'],
          ].map(([label,val]) => (
            <div key={label} style={{background:'var(--bg-2)', borderRadius:6, padding:'5px 10px', fontSize:11}}>
              <div style={{color:'var(--ink-3)', fontSize:8.5, textTransform:'uppercase', letterSpacing:'0.07em'}}>{label}</div>
              <div style={{fontFamily:'var(--mono)', fontWeight:700, marginTop:1}}>{val}</div>
            </div>
          ))}
        </div>
      )}

      {/* ── Scan header ───────────────────────────────────────────── */}
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', padding:'10px 12px 6px'}}>
        <div>
          <div style={{fontWeight:700, fontSize:13}}>Swing Signals</div>
          <div style={{fontSize:10, color:'var(--ink-3)', marginTop:1}}>
            {data.instruments_count || 70}+ stocks · daily timeframe · last scan {data.last_scan_time || '—'}
          </div>
        </div>
        <button onClick={triggerExitAll} disabled={exitLoading==='all'}
          style={{fontSize:10.5, padding:'5px 12px', borderRadius:5, border:'1px solid var(--line-1)',
                  background:'var(--bg-2)', color:'var(--ink-1)', cursor:'pointer'}}>
          {exitLoading==='all' ? '⏳ Checking...' : '🤖 AI Exit Check All'}
        </button>
      </div>

      {/* ── Signal cards ──────────────────────────────────────────── */}
      {signals.length === 0 && (
        <div style={{padding:'24px 16px', textAlign:'center', color:'var(--ink-3)', fontSize:12}}>
          No swing signals ≥55% confidence yet — scanner runs every 30 min during market hours.
        </div>
      )}
      {signals.map(snap => {
        const { instrument: name, type, signal: sig, option: opt, updated_at } = snap;
        const isIdx = type === 'INDEX';
        return (
          <div key={name} style={{margin:'0 8px 10px', borderRadius:8,
            border:'1px solid var(--line-1)', background:'var(--bg-1)',
            borderLeft:`3px solid ${dirColor(sig.direction)}`}}>
            {/* Header */}
            <div style={{display:'flex', alignItems:'center', gap:8, padding:'8px 10px 6px', flexWrap:'wrap'}}>
              <span style={{fontWeight:700, fontSize:13, fontFamily:'var(--mono)'}}>{name}</span>
              <span style={{fontSize:9, padding:'2px 6px', borderRadius:3,
                background: dirBg(sig.direction), color: dirColor(sig.direction), fontWeight:700}}>
                {sig.direction}
              </span>
              <span style={{fontSize:9, padding:'2px 6px', borderRadius:3, background:'var(--bg-3)', color:'var(--ink-2)'}}>
                {isIdx ? 'INDEX' : 'STOCK'} · DAILY
              </span>
              <span style={{fontSize:10.5, fontWeight:700, color: confColor(sig.confidence)}}>
                {sig.confidence}% conf
              </span>
              <span style={{fontSize:9, color:'var(--ink-3)', marginLeft:'auto'}}>Updated {updated_at}</span>
            </div>

            {/* Levels */}
            <div style={{display:'flex', gap:8, padding:'0 10px 6px', flexWrap:'wrap', fontSize:10.5, fontFamily:'var(--mono)'}}>
              <span>Spot <strong>₹{sig.price}</strong></span>
              <span style={{color:'var(--short)'}}>SL ₹{sig.sl}</span>
              <span style={{color:'var(--long)'}}>T1 ₹{sig.target1}</span>
              <span style={{color:'var(--long)'}}>T2 ₹{sig.target2}</span>
              <span style={{color:'var(--ink-3)'}}>R:R {sig.risk_reward}</span>
              <span style={{color:'var(--ink-3)'}}>RSI {sig.rsi}</span>
            </div>

            {/* Indicators row */}
            <div style={{display:'flex', gap:6, padding:'0 10px 6px', flexWrap:'wrap', fontSize:9.5}}>
              {sig.reasons && sig.reasons.slice(0,3).map((r,i) => (
                <span key={i} style={{background:'var(--bg-3)', borderRadius:3, padding:'2px 6px', color:'var(--ink-2)'}}>
                  {r}
                </span>
              ))}
              {sig.hold_days_est && (
                <span style={{background:'var(--warn-dim)', borderRadius:3, padding:'2px 6px', color:'var(--warn)', fontWeight:600}}>
                  ⏱ {sig.hold_days_est}
                </span>
              )}
            </div>

            {/* Option pick */}
            {opt && (
              <div style={{margin:'0 10px 8px', background:'var(--bg-2)', borderRadius:5, padding:'6px 8px', fontSize:10}}>
                <div style={{fontWeight:700, color: dirColor(sig.direction), marginBottom:3}}>
                  📋 {opt.symbol}  <span style={{fontWeight:400, color:'var(--ink-3)'}}>({opt.dte} DTE · monthly expiry)</span>
                </div>
                <div style={{display:'flex', gap:10, fontFamily:'var(--mono)', color:'var(--ink-2)', flexWrap:'wrap'}}>
                  <span>Strike ₹{opt.strike}</span>
                  <span>Est entry ~₹{opt.entry}</span>
                  <span style={{color:'var(--short)'}}>SL ~₹{opt.sl}</span>
                  <span style={{color:'var(--long)'}}>T1 ~₹{opt.target1}</span>
                  <span>Capital ~₹{(opt.capital||0).toLocaleString('en-IN')}</span>
                </div>
                <div style={{fontSize:9, color:'var(--ink-3)', marginTop:3}}>
                  ⚠ Option premium estimated — verify live price before entering
                </div>
              </div>
            )}

            {/* Action button */}
            <div style={{padding:'0 10px 8px'}}>
              <button onClick={() => saveSignal(name)} disabled={saveLoading===name}
                style={{fontSize:10.5, padding:'4px 12px', borderRadius:5,
                        background: dirBg(sig.direction), color: dirColor(sig.direction),
                        border:'none', cursor:'pointer', fontWeight:600}}>
                {saveLoading===name ? '⏳ Saving...' : '+ Track this trade'}
              </button>
            </div>
          </div>
        );
      })}

      {/* ── Open Positions ────────────────────────────────────────── */}
      <div style={{padding:'14px 12px 4px', display:'flex', alignItems:'center', justifyContent:'space-between'}}>
        <div style={{fontWeight:700, fontSize:13}}>Position Tracker</div>
        <div style={{display:'flex', gap:4}}>
          {['ALL','OPEN','CLOSED'].map(f => (
            <button key={f} onClick={() => setPosFilter(f)}
              style={{fontSize:9.5, padding:'3px 8px', borderRadius:4,
                background: posFilter===f ? 'var(--accent)' : 'var(--bg-2)',
                color: posFilter===f ? '#000' : 'var(--ink-2)',
                border:'none', cursor:'pointer', fontWeight: posFilter===f ? 700 : 400}}>
              {f}
            </button>
          ))}
        </div>
      </div>

      {filteredPos.length === 0 && (
        <div style={{padding:'16px', textAlign:'center', color:'var(--ink-3)', fontSize:11.5}}>
          No positions. Click "+ Track this trade" on a swing signal to start tracking.
        </div>
      )}

      {filteredPos.map(pos => {
        const dir = pos.direction;
        const isOpen = pos.status === 'OPEN';
        const aiDec  = pos.last_ai_decision;
        const aiBg   = aiDec==='EXIT' ? 'var(--short-dim)' : aiDec==='PARTIAL_EXIT' ? 'var(--warn-dim)' : 'var(--bg-2)';
        const aiCol  = aiDec==='EXIT' ? 'var(--short)' : aiDec==='PARTIAL_EXIT' ? 'var(--warn)' : 'var(--ink-3)';
        return (
          <div key={pos.id} style={{margin:'0 8px 8px', borderRadius:7,
            border:`1px solid ${isOpen ? 'var(--accent)' : 'var(--line-1)'}`,
            background:'var(--bg-1)', opacity: isOpen ? 1 : 0.7}}>
            {/* Pos header */}
            <div style={{display:'flex', alignItems:'center', gap:6, padding:'7px 10px 4px', flexWrap:'wrap'}}>
              <span style={{fontWeight:700, fontSize:12, fontFamily:'var(--mono)'}}>{pos.instrument}</span>
              <span style={{fontSize:9, padding:'2px 5px', borderRadius:3,
                background: dirBg(dir), color: dirColor(dir), fontWeight:700}}>{dir}</span>
              <span style={{fontSize:9, padding:'2px 5px', borderRadius:3,
                background: isOpen ? 'var(--accent-dim)' : 'var(--bg-3)',
                color: isOpen ? 'var(--accent)' : 'var(--ink-3)', fontWeight:600}}>
                {pos.status}
              </span>
              {pos.result && (
                <span style={{fontSize:9, fontWeight:700,
                  color: pos.result==='WIN' ? 'var(--long)' : 'var(--short)'}}>
                  {pos.result==='WIN' ? '✅' : '❌'} {pos.pnl_pct > 0 ? '+' : ''}{pos.pnl_pct}%
                  {' '}₹{(pos.pnl_rupees||0).toLocaleString('en-IN')}
                </span>
              )}
              <span style={{marginLeft:'auto', fontSize:9, color:'var(--ink-3)'}}>
                #{pos.id} · {pos.entry_date}
                {pos.hold_days != null && pos.hold_days > 0 ? ` · ${pos.hold_days}d held` : ''}
              </span>
            </div>
            {/* Levels */}
            <div style={{display:'flex', gap:8, padding:'0 10px 5px', fontSize:10, fontFamily:'var(--mono)', color:'var(--ink-2)', flexWrap:'wrap'}}>
              <span>Spot ₹{pos.spot_entry}</span>
              <span style={{color:'var(--short)'}}>SL ₹{pos.spot_sl}</span>
              <span style={{color:'var(--long)'}}>T1 ₹{pos.spot_target1}</span>
              {pos.option_symbol && <span>Opt: {pos.option_symbol} @₹{pos.option_entry}</span>}
            </div>
            {/* AI decision */}
            {aiDec && (
              <div style={{margin:'0 10px 6px', background:aiBg, borderRadius:4, padding:'5px 8px', fontSize:10}}>
                <span style={{color:aiCol, fontWeight:700}}>🤖 AI: {aiDec}</span>
                {pos.last_ai_reasoning && <span style={{color:'var(--ink-2)', marginLeft:6}}>{pos.last_ai_reasoning.slice(0,100)}…</span>}
                {pos.last_ai_ts && <span style={{color:'var(--ink-3)', fontSize:8.5, marginLeft:6}}>{pos.last_ai_ts}</span>}
              </div>
            )}
            {/* Actions */}
            {isOpen && (
              <div style={{display:'flex', gap:6, padding:'0 10px 8px'}}>
                <button onClick={() => triggerExitOne(pos.id)} disabled={exitLoading===pos.id}
                  style={{fontSize:9.5, padding:'3px 10px', borderRadius:4,
                    background:'var(--bg-2)', border:'1px solid var(--line-1)',
                    color:'var(--ink-1)', cursor:'pointer'}}>
                  {exitLoading===pos.id ? '⏳' : '🤖 AI Exit?'}
                </button>
                <button onClick={() => closePosition(pos)}
                  style={{fontSize:9.5, padding:'3px 10px', borderRadius:4,
                    background:'var(--short-dim)', border:'none',
                    color:'var(--short)', cursor:'pointer', fontWeight:600}}>
                  Mark Closed
                </button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

    function LiveStripBar({ on, mode, doStart, doStop, replayDays, speed, setSpeed, setReplayDays }) {
      const istTime = (() => {
        const d = new Date();
        const utc = d.getUTCHours() * 60 + d.getUTCMinutes();
        const ist = (utc + 330) % 1440;
        const h = Math.floor(ist / 60), m = ist % 60;
        const h12 = ((h + 11) % 12) + 1;
        return `${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')} ${h < 12 ? 'am' : 'pm'}`;
      })();
      const isAutoActive = (() => {
        const d = new Date();
        const ist = ((d.getUTCHours() * 60 + d.getUTCMinutes()) + 330) % 1440;
        return ist >= (8*60+45) && ist < (17*60);
      })();
      return (
        <div className={`live-strip ${on ? '' : 'off'}`}>
          <div className="ldot"></div>
          <div>
            <div className="ltitle">{on ? (mode==='replay' ? 'Backtest replay running' : 'AI engine live · scanning price action') : 'Engine paused'}</div>
            <div className="lsub">
              {mode === 'replay'
                ? `${replayDays || 5}d window · ${speed||1}x speed · IST ${istTime}`
                : `v2 · OHLC + RSI + EMA + VWAP + level breaks · IST ${istTime}`}
            </div>
          </div>
          {mode === 'replay' && !on && (
            <div style={{display:'flex',alignItems:'center',gap:6,fontSize:11.5,color:'var(--ink-2)'}}>

            <span className="et-info">
              <span className="et-label">{on ? 'LIVE' : 'OFF'}</span>
              <span className="et-sub">{on ? 'tap to stop' : (isAutoActive ? 'tap to start' : 'auto-on 08:45 IST')}</span>
            </span>
            <span className="et-switch" aria-hidden="true"/>
          </button>
        </div>
      );
    }

    function HeroRow({ trades, signals, capital }) {
      const closed = (trades || []).filter(t => t && t.status && t.status !== 'OPEN');
      const pnl = closed.reduce((a, b) => a + (Number(b.pnl) || 0), 0);
      const wins   = closed.filter(t => t.status === 'WIN').length;
      const losses = closed.filter(t => t.status === 'LOSS' || t.status === 'SL').length;
      const winRate = closed.length ? Math.round((wins / closed.length) * 100) : 0;
      const pnlPct = capital ? ((pnl / capital) * 100) : 0;
      const recent = [...closed].slice(-5).reverse();
      let streak = 0;
      for (const t of recent) { if (t.status === 'WIN') streak++; else break; }
      const dots = recent.length ? recent.slice(0, 5).reverse() : [];
      const C = 2 * Math.PI * 42; // gauge circumference
      const offset = C * (1 - winRate / 100);
      const pnlClass = pnl >= 0 ? 'win' : 'loss';
      const pnlSign = pnl >= 0 ? '+' : '−';
      return (
        <div className="hero-row">
          <div className="gcard gcard-hi hero-pnl-card">
            <div className="h-eb">Today's P&amp;L</div>
            <div className={`h-big ${pnlClass}`}>
              <span className="currency">₹</span>{pnlSign}{Math.abs(Math.round(pnl)).toLocaleString('en-IN')}
            </div>
            <div className="h-foot">
              <span className={`pct-pill ${pnlClass}`}>{pnl>=0?'▲ +':'▼ −'}{Math.abs(pnlPct).toFixed(2)}%</span>
              <span>{closed.length} closed · {(signals||[]).length} signals</span>
            </div>
          </div>
          <div className="gcard hero-gauge">
            <div className="gauge-wrap">
              <svg className="gauge-svg" viewBox="0 0 100 100">
                <defs>
                  <linearGradient id="gw" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%"   stopColor="oklch(0.86 0.13 152)"/>
                    <stop offset="100%" stopColor="oklch(0.78 0.13 120)"/>
                  </linearGradient>
                </defs>
                <circle cx="50" cy="50" r="42" className="gauge-track"/>
                <circle cx="50" cy="50" r="42" className="gauge-progress"
                        stroke="url(#gw)"
                        strokeDasharray={C.toFixed(1)}
                        strokeDashoffset={offset.toFixed(1)}/>
              </svg>
              <div className="gauge-overlay">
                <div className="gauge-num">{winRate}<span className="pct">%</span></div>
                <div className="gauge-lbl">win rate</div>
              </div>
            </div>
            <div className="gauge-stats">
              <div className="gauge-row"><span className="gauge-rl">Wins</span><span className="gauge-rv win">{wins}</span></div>
              <div className="gauge-row"><span className="gauge-rl">Losses</span><span className="gauge-rv loss">{losses}</span></div>
              <div className="gauge-row"><span className="gauge-rl">Closed</span><span className="gauge-rv">{closed.length}</span></div>
              <div className="gauge-row"><span className="gauge-rl">Signals</span><span className="gauge-rv">{(signals||[]).length}</span></div>
            </div>
          </div>
          <div className="gcard hero-streak">
            <div className="h-eb">Current streak</div>
            <div className="streak-big">{streak}<span>W</span></div>
            <div className="streak-dots">
              {dots.length === 0 && [0,1,2,3,4].map(i => <div key={i} className="streak-dot"/>)}
              {dots.map((t, i) => <div key={i} className={`streak-dot ${t.status==='WIN'?'win':'loss'}`}/>)}
            </div>
            <div className="streak-foot">{closed.length} trades total</div>
          </div>
        </div>
      );
    }
