    function LiveHeroCard({ signal, live, capital, onOpen }) {
      if (!signal) return null;
      const instLive = (live || {})[signal.inst] || {};
      const entry = Number(signal.entry || 0);
      const sl = Number(signal.sl || 0);
      const t1 = Number(signal.target1 || 0);
      const t2 = Number(signal.target2 || 0);
      const ltp = instLive.ltp ?? entry;
      const lotSize = ({NIFTY:75, BANKNIFTY:30, FINNIFTY:65})[signal.inst] || 75;
      const budget = (capital || 50000) * 0.5;
      const perLotCost = entry * lotSize;
      const lots = Math.max(1, Math.min(3, perLotCost ? Math.floor(budget / perLotCost) : 1));
      const cap = Math.round(perLotCost * lots);
      const contracts = lots * lotSize;
      const pnl = Math.round((ltp - entry) * contracts);
      const pct = entry ? ((ltp - entry) / entry * 100) : 0;
      const pnlIsWin = pnl >= 0;
      return (
        <div className="live-hero" onClick={onOpen}>
          <div className="lh-status">
            <span className="lh-pill live"><span className="lh-dot"></span> LIVE · In flight</span>
            <span className="lh-time">{signal.t || ''}</span>
          </div>
          <div className="lh-main">
            <div>
              <div className="lh-title">{signal.inst} {signal.strike} {signal.type} · {String(signal.dir||'').toLowerCase()}</div>
              <div className="lh-sub">{signal.date ? signal.date : ''} · {lots}L × {lotSize} · cap ₹{cap.toLocaleString('en-IN')}</div>
            </div>
            <div className="lh-pnl">
              <div className="lh-pnl-num" style={{color: pnlIsWin?'var(--long)':'var(--short)'}}>
                {pnlIsWin?'+':'−'}₹{Math.abs(pnl).toLocaleString('en-IN')}
              </div>
              <div className="lh-pnl-pct" style={{color: pnlIsWin?'var(--long)':'var(--short)'}}>
                {pnlIsWin?'▲ +':'▼ −'}{Math.abs(pct).toFixed(1)}%
              </div>
            </div>
          </div>
          <div className="lh-row">
            <span className="lvl-inline"><span className="lvl-k">Entry</span><b>₹{Math.round(entry)}</b></span>
            <span className="sep">→</span>
            <span className="lvl-inline ltp"><span className="lvl-k">LTP</span><b>₹{Math.round(ltp)}</b></span>
            <span className="sep">·</span>
            <span className="lvl-inline sl"><span className="lvl-k">SL</span><b>₹{Math.round(sl)}</b></span>
            <span className="lvl-inline t1"><span className="lvl-k">T1</span><b>₹{Math.round(t1)}</b></span>
            <span className="lvl-inline t2"><span className="lvl-k">T2</span><b>₹{Math.round(t2)}</b></span>
            <button type="button" className="lh-cta">Details →</button>
          </div>
        </div>
      );
    }

    function ProfileModal({ open, userName, capital, onClose, onSave }) {
      const [name, setName] = React.useState(userName || 'You');
      const [cap, setCap]   = React.useState(capital || 50000);
      React.useEffect(() => { if (open) { setName(userName || 'You'); setCap(capital || 50000); } }, [open, userName, capital]);
      const handleSave = () => {
        const n = (name || '').replace(/\s+/g, ' ').trim() || 'You';
        const c = parseInt(cap, 10);
        if (isNaN(c) || c < 5000) return;
        onSave({ name: n, capital: c });
      };
      const handleKey = e => {
        if (e.key === 'Enter')  { e.preventDefault(); handleSave(); }
        if (e.key === 'Escape') { e.preventDefault(); onClose(); }
      };
      return (
        <>
          <div className={`modal-backdrop ${open?'on':''}`} onClick={onClose}/>
          <div className={`modal-card ${open?'on':''}`} role="dialog">
            <div className="modal-eb">Profile</div>
            <div className="modal-tt">Your trading setup</div>
            <div className="modal-desc">Sizing scales to your capital — 50% per trade, 1–3 lots, SL capped at 3% of capital.</div>
            <label className="modal-label">Your name</label>
            <div className="modal-input-wrap">
              <input type="text" className="modal-input small" maxLength="40" value={name} onChange={e => setName(e.target.value)} onKeyDown={handleKey}/>
            </div>
            <label className="modal-label">Trading capital</label>
            <div className="modal-input-wrap">
              <span className="pre">₹</span>
              <input type="number" className="modal-input" inputMode="numeric" min="5000" max="10000000" step="1000" value={cap} onChange={e => setCap(e.target.value)} onKeyDown={handleKey}/>
            </div>
            <div className="modal-quick">
              {[10000, 20000, 50000, 100000, 500000].map(v => (
                <button key={v} type="button" onClick={() => setCap(v)}>{v >= 100000 ? `₹${v/100000}L` : `₹${v/1000}K`}</button>
              ))}
            </div>
            <div className="modal-actions">
              <button type="button" className="btn-ghost-mod" onClick={onClose}>Cancel</button>
              <button type="button" className="btn-prim" onClick={handleSave}>Save</button>
            </div>
          </div>
        </>
      );
    }

    function App() {
      const [tab, setTab] = useState(() => localStorage.getItem('se_tab') || 'signals');
      const [inst, setInst] = useState(0);
      const [theme, setThemeState] = useState(() => localStorage.getItem('se_theme') || 'dark');
      const [accent, setAccentState] = useState(() => localStorage.getItem('se_accent') || 'amber');
      const [density, setDensityState] = useState(() => localStorage.getItem('se_density') || 'comfortable');
      const [tweakOpen, setTweakOpen] = useState(false);
      const [profileOpen, setProfileOpen] = useState(false);
      const [userName, setUserName] = useState(() => localStorage.getItem('se_user_name') || 'You');
      const [capital, setCapital]   = useState(() => {
        const v = parseInt(localStorage.getItem('se_capital'), 10);
        return (!isNaN(v) && v >= 5000) ? v : 50000;
      });
      const [showPosMonitor, setShowPosMonitor] = useState(false);

      // ── engine state ─────────────────────────────────
      const [mode, setMode] = useState(() => localStorage.getItem('se_mode') || 'live'); // 'live' | 'replay'
      const [speed, setSpeed] = useState(2); // 1x/2x/4x
      const [replayDays, setReplayDays] = useState(5);
      const [on, setOn] = useState(false);
      const [serverOk, setServerOk] = useState(null);
      const [signals, setSignals] = useState([]);
      const [trades, setTrades] = useState([]);
      const [logLines, setLogLines] = useState([]);
      const [candles, setCandles] = useState({});    // { NIFTY:[...], BANKNIFTY:[...], ... }
      const [live, setLive] = useState({});          // { NIFTY:{ltp, chg, pct}, ... }
      const [replay, setReplay] = useState(null);    // { data, idx, total }
      const [toast, setToast] = useState(null);
      const [swingData, setSwingData] = useState({signals:[], positions:[], performance:{}, last_scan_time:'—'});
      // /api/metrics snapshot — kill-switch state, daily P&L, trade cap, cache hit rate.
      // Polled every 8s while engine is on (cheap endpoint, all in-memory on the server).
      const [metrics, setMetrics] = useState(null);
      const lastSigId = useRef(null);
      const replayAnalyzedAt = React.useRef({});      // { [instName]: lastAnalyzedIdx }

      const addLog = (level, msg) => {
        const ist = new Date(Date.now() + 5.5*3600*1000);
        const t = String(ist.getUTCHours()).padStart(2,'0')+':'+String(ist.getUTCMinutes()).padStart(2,'0')+':'+String(ist.getUTCSeconds()).padStart(2,'0');
        setLogLines(prev => [...prev.slice(-199), { t, level, msg }]);
      };

      const showToast = (text, ms=3000) => { setToast(text); setTimeout(()=>setToast(null), ms); };

      const beep = (freq=880) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.frequency.value = freq; o.connect(g); g.connect(ctx.destination);
          g.gain.setValueAtTime(0.0001, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime+0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.18);
          o.start(); o.stop(ctx.currentTime+0.2);
        } catch(e){}
      };

      const notifySignal = (sig) => {
        beep(880); setTimeout(()=>beep(1100), 180);
        showToast(`● ${sig.inst || ''} ${sig.direction || sig.dir || ''} ${sig.option?.strike || sig.strike || ''}`);
        try {
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('Signal Engine', { body: `${sig.inst} ${sig.direction || sig.dir} @ ${sig.option?.strike || sig.strike}`, silent: false });
          }
        } catch(e){}
      };

      const requestNotify = () => { try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch(e){} };

      // Determine current NSE phase from IST clock
      const nsePhase = () => {
        const ist = new Date(Date.now() + 5.5*3600*1000);
        const mins = ist.getUTCHours()*60 + ist.getUTCMinutes();
        const dow  = ist.getUTCDay();
        const wkdy = dow >= 1 && dow <= 5;
        if (!wkdy) return 'closed';
        if (mins < 9*60) return 'pre-market';          // before 09:00
        if (mins < 9*60+15) return 'pre-open';          // 09:00–09:15
        if (mins < 15*60+30) return 'open';             // 09:15–15:30
        return 'closed';
      };

      // Fetch historical candles for all instruments and run analyze() on each
      const preopenScan = async () => {
        addLog('INFO', `Pre-open scan · fetching ${replayDays || 5}d historical for all instruments`);
        const results = [];
        let firstAuthFail = true;
        for (const i of INST) {
          try {
            addLog('TICK', `Loading ${i.name} historical · ${replayDays || 5}d …`);
            const r = await apiJSON(`/api/historical/${i.key}?days=${replayDays || 5}`);
            const arr = r.candles || r.data || r;
            if (!Array.isArray(arr) || arr.length < 20) {
              addLog('INFO', `${i.name} · insufficient data (${arr && arr.length || 0} candles)`);
              continue;
            }
            setCandles(prev => ({ ...prev, [i.name]: normCandles(arr) }));
            addLog('TICK', `${i.name} · ${arr.length} candles loaded · last close ${arr[arr.length-1].close || arr[arr.length-1][4] || '?'}`);
            // analyze
            try {
              const sig = analyze(normCandles(arr), i, 100000);
              if (sig && sig.direction && sig.direction !== 'NONE') {
                const entry = { id: `PRE-${i.name}-${Date.now()}`, inst: i.name,
                  t: new Date(Date.now()+5.5*3600*1000).toISOString().slice(11,16),
                  dir: sig.direction, type: sig.option?.type || (sig.direction==='LONG'?'CE':'PE'),
                  strike: sig.option?.strike, premium: sig.option?.ltp, confidence: sig.confidence,
                  strategies: sig.strategies, reasons: sig.reasons, status: 'PRE-OPEN',
                  entry: sig.entry, sl: sig.sl, target1: sig.target1, target2: sig.target2, rr: sig.rr, risk: sig.risk };
                results.push(entry);
                addLog('SIG', `${i.name} · ${sig.direction} ${sig.confidence}% · ${sig.strategies.length} strategies · ${sig.reasons[0] || ''}`);
              } else {
                addLog('INFO', `${i.name} · no signal · conditions not met`);
              }
            } catch (aE) {
              addLog('INFO', `${i.name} · analyze error · ${aE.message || aE}`);
            }
          } catch (e) {
            // surface the server's actual reason if we have one
            const status = e.status || '';
            const reason = e.message || String(e);
            addLog('INFO', `${i.name} · fetch failed · ${reason}`);
            if (status === 401 && firstAuthFail) {
              firstAuthFail = false;
              showToast('Historical 401 — broker session likely expired on server');
              addLog('INFO', '↳ 401 on historical usually means the server-side Angel One session expired. Re-run broker login or check the backend logs.');
            }
          }
        }
        if (results.length) setSignals(prev => [...results, ...prev]);
        addLog('INFO', `Pre-open scan complete · ${results.length} signal${results.length===1?'':'s'} staged`);
        return results;
      };

      const doStart = async () => {
        requestNotify();
        const phase = nsePhase();
        // Flip button immediately so user sees acknowledgment
        setOn(true);
        addLog('INFO', `▶ Start pressed · mode=${mode} · phase=${phase}`);
        showToast(`● Engine ${mode === 'live' ? 'LIVE' : 'REPLAY'} · ${phase}`);

        // Pre-flight: warn if no auth token configured (server will 401 historical otherwise)
        if (!getAuthToken()) {
          addLog('INFO', '⚠ No auth token configured · open ⚙ Tweaks and paste your token');
          showToast('Set auth token in ⚙ Tweaks first');
          setOn(false);
          return;
        }

        try {
          if (mode === 'live') {
            addLog('TICK', 'Pinging server …');
            const ping = await apiFetch('/api/ping');
            if (!ping.ok) throw new Error('server ping failed · HTTP ' + ping.status);
            addLog('INFO', 'Server reachable');

            addLog('TICK', 'Authenticating with broker …');
            try {
              const lr = await apiFetch('/api/login', { method:'POST' });
              // Parse body first — backend may return 200 even when broker login actually failed.
              // We treat the JSON body as authoritative: connected === true ⇒ real success.
              let loginBody = null;
              try { loginBody = await lr.clone().json(); } catch(_) { loginBody = null; }

              // Pre-auth 401 (our X-Auth-Token rejected before the broker login was attempted)
              if (lr.status === 401 && loginBody && loginBody.status !== 'failed') {
                addLog('INFO', '✗ Auth token rejected (HTTP 401) · check ⚙ Tweaks');
                showToast('Auth 401 — check token in Tweaks'); setOn(false); return;
              }

              const connected = !!(loginBody && (loginBody.connected === true || loginBody.status === 'ok'));
              if (!connected) {
                // Broker login failed — surface the server's actual error + full diagnostics
                const reason = (loginBody && (loginBody.error || loginBody.message)) || `HTTP ${lr.status}`;
                addLog('INFO', `✗ Broker login FAILED · ${reason}`);
                if (loginBody && loginBody.attempts) addLog('INFO', `↳ server login attempts so far · ${loginBody.attempts}`);
                // Pull /api/diag for env-var presence + last attempt time so the user
                // can immediately see whether a secret is missing vs. rejected.
                try {
                  const dr = await apiFetch('/api/diag');
                  if (dr.ok) {
                    const d = await dr.json();
                    const ep = d && d.env_present || {};
                    const missing = Object.keys(ep).filter(k => !ep[k]);
                    if (missing.length) addLog('INFO', `↳ missing env vars on server · ${missing.join(', ')}`);
                    else addLog('INFO', `↳ all env vars present on server · issue is broker-side (TOTP / rate-limit / credentials)`);
                    if (d && d.last_login_attempt) addLog('INFO', `↳ last server login attempt · ${d.last_login_attempt}`);
                    if (d && d.client_id_hint) addLog('INFO', `↳ using client_id prefix · ${d.client_id_hint}`);
                  }
                } catch(_) {}
                showToast('Broker login failed — see log');
                setOn(false);
                return;
              }

              addLog('INFO', 'Broker login OK · broker session active');
              // Some backends mint a per-session JWT after broker login. If one is returned, persist it.
              try {
                const sess = loginBody && (loginBody.token || loginBody.jwt || loginBody.access_token || loginBody.session_token || (loginBody.data && (loginBody.data.jwtToken || loginBody.data.token)));
                if (sess && typeof sess === 'string' && sess !== getAuthToken()) {
                  setAuthToken(sess);
                  addLog('INFO', '↳ session token refreshed from broker login response');
                }
                if (loginBody && loginBody.message) addLog('INFO', `↳ ${loginBody.message}`);
              } catch(_) {}
            } catch(e) { addLog('INFO', '✗ Broker login error · ' + (e.message || e)); setOn(false); return; }

            if (phase === 'open') {
              addLog('TICK', 'Starting live engine …');
              const r = await apiFetch('/api/start', { method:'POST', body: JSON.stringify({ mode:'live' }) });
              if (!r.ok) throw new Error('start HTTP ' + r.status);
              addLog('SIG', 'Engine started · LIVE · scanning ticks every 2s');
              showToast('● Engine LIVE · scanning ticks');
              // Warm candles immediately instead of waiting 30s for the slow poller
              addLog('TICK', 'Warming candles · fetching today\'s history for all instruments');
              (async () => {
                for (const i of INST) {
                  try {
                    const hr = await apiJSON(`/api/historical/${i.key || i.name}?days=3`);
                    const arr = hr.candles || hr.data || hr.bars || (Array.isArray(hr) ? hr : null);
                    if (Array.isArray(arr) && arr.length) {
                      setCandles(prev => ({ ...prev, [i.name]: normCandles(arr) }));
                      addLog('TICK', `${i.name} · ${arr.length} candles loaded`);
                    } else {
                      addLog('INFO', `${i.name} · historical empty or unknown shape`);
                    }
                  } catch (e) {
                    addLog('INFO', `${i.name} · warm-up fetch failed · ${e.message || e}`);
                  }
                }
              })();
            } else {
              addLog('INFO', `Market ${phase} · running pre-open analysis instead of live tick loop`);
              await preopenScan();
              addLog('INFO', `Engine idle · will auto-activate live at 09:15 IST`);
              showToast(phase === 'pre-open' ? 'Pre-open scan complete' : `${phase} · historical scan complete`);
            }
          } else {
            // ── REPLAY MODE ──────────────────────────────────────────
            addLog('TICK', `Replay · loading ${replayDays}d of history for all instruments …`);
            const allData = {};
            let maxLen = 0;
            for (const i of INST) {
              try {
                const r = await apiJSON(`/api/historical/${i.key}?days=${replayDays}`);
                const arr = r.candles || r.data || (Array.isArray(r) ? r : null);
                if (Array.isArray(arr) && arr.length >= 20) {
                  allData[i.name] = normCandles(arr);
                  maxLen = Math.max(maxLen, allData[i.name].length);
                  addLog('TICK', `${i.name} · ${arr.length} candles loaded`);
                } else {
                  addLog('INFO', `${i.name} · insufficient data (${arr ? arr.length : 0} candles)`);
                }
              } catch(e) {
                addLog('INFO', `${i.name} · replay load failed · ${e.message || e}`);
              }
            }
            if (maxLen < 20) {
              addLog('INFO', '✗ No candle data for replay — check auth token and broker session');
              showToast('Replay failed: no data from server');
              setOn(false); return;
            }
            // Seed chart with first 20 candles so it's immediately visible
            const seed = {};
            Object.entries(allData).forEach(([name, arr]) => { seed[name] = arr.slice(0, 20); });
            setCandles(seed);
            replayAnalyzedAt.current = {};
            const replayState = { data: allData, idx: 20, total: maxLen, done: false };
            setReplay(replayState);
            addLog('SIG', `▶ Replay started · ${maxLen} bars · ${speed}x speed · analyzing …`);
            showToast(`▶ Replay · ${replayDays}d · ${speed}x`);
          }
        } catch (e) {
          addLog('INFO', '✗ Start failed · ' + (e.message || e));
          showToast('Start failed — check server + auth token');
          setOn(false); // revert button on hard failure
        }
      };

      const doStop = async () => {
        if (mode === 'live') {
          try { await apiFetch('/api/stop', { method:'POST' }); } catch(e){}
        }
        setOn(false); addLog('INFO', 'Engine stopped'); showToast('Engine stopped');
      };

      const doReset = () => {
        setSignals([]); setTrades([]); setLogLines([]); setReplay(null); lastSigId.current = null;
        addLog('INFO', 'State reset');
      };

      // Manual kill-switch controls — surfaced in the RiskBanner.
      const doKillswitch = async (action) => {
        try {
          const r = await apiJSON('/api/killswitch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action }),
          });
          showToast(action === 'trip' ? 'Kill-switch tripped — no new alerts today' : 'Kill-switch reset — engine can fire alerts again');
          addLog('INFO', `kill-switch ${action} → ${JSON.stringify(r)}`);
        } catch(e) {
          showToast('Kill-switch toggle failed — auth header set?');
          addLog('ERR', `kill-switch ${action} failed: ${e.message || e}`);
        }
      };

      // Strategy toggle (Phase 2.10) — switch v1 / v2-dry / v2-live from UI
      // payload: {strategy: 'v1'|'v2', dry_run_v2: boolean}
      const doStrategy = async (payload) => {
        try {
          const r = await apiJSON('/api/strategy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const label = payload.strategy === 'v1' ? 'v1 LEGACY'
                      : (payload.dry_run_v2 ? 'v2 DRY-RUN' : 'v2 LIVE');
          showToast(`Strategy → ${label}`);
          addLog('INFO', `strategy set → ${JSON.stringify(r)}`);
          // Force a metrics refetch so the banner updates immediately
          try {
            const m = await apiJSON('/api/metrics');
            if (m) setMetrics(m);
          } catch(e) { /* silent */ }
        } catch(e) {
          showToast('Strategy switch failed — auth token set?');
          addLog('ERR', `strategy switch failed: ${e.message || e}`);
        }
      };

      useEffect(() => { localStorage.setItem('se_tab', tab); }, [tab]);
      useEffect(() => { localStorage.setItem('se_mode', mode); }, [mode]);

      // Auto-reveal floating position monitor when an OPEN trade exists
      useEffect(() => {
        const tArr = Array.isArray(trades) ? trades : [];
        const hasOpen = tArr.some(t => t && t.status === 'OPEN');
        if (hasOpen && !showPosMonitor) setShowPosMonitor(true);
        if (!hasOpen && showPosMonitor) setShowPosMonitor(false);
      }, [trades]);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-density', density);
        applyAccent(theme, accent);
      }, [theme, accent, density]);

      // server health ping
      useEffect(() => {
        let alive = true;
        const check = async () => {
          try { const r = await apiFetch('/api/ping'); if (alive) setServerOk(r.ok); }
          catch { if (alive) setServerOk(false); }
        };
        check();
        const id = setInterval(check, 10000);
        return () => { alive = false; clearInterval(id); };
      }, []);

      // live pollers
      useEffect(() => {
        if (!on || mode !== 'live') return;
        let alive = true;
        let lastStatusErr = '';
        const histErr = {}; // { [instName]: lastErrMessage }
        const fast = async () => {
          try {
            const s = await apiJSON('/api/status');
            if (!alive) return;
            lastStatusErr = ''; // success — reset throttle

            // ── WATCH signals: s.signals is the per-instrument latest-scan dict.
            // Always updated by server (no confidence gate). Show on dashboard with
            // no notification — lets you see what the engine is seeing at all times.
            if (s.signals && typeof s.signals === 'object' && !Array.isArray(s.signals)) {
              const watchNow = Object.entries(s.signals).map(([name, result]) => {
                const sig = result && result.signal;
                const opt = result && result.option;
                if (!sig || !sig.direction) return null;
                const conf = (sig.confidence_ai_adj != null ? sig.confidence_ai_adj : sig.confidence) || 0;
                const minConf = (s.config && s.config.min_confidence) || 45;
                return {
                  id: `WATCH-${name}`,         // stable ID — overwritten each poll
                  inst: name,
                  dir: sig.direction,
                  type: (opt && opt.type) || (sig.direction === 'LONG' ? 'CE' : 'PE'),
                  strike: (opt && opt.strike) || null,
                  premium: (opt && opt.ltp) || null,
                  confidence: conf,
                  t: result.updated_at || '',
                  status: conf >= minConf ? 'READY' : 'WATCH', // READY = meets conf threshold (awaiting AI gate)
                  reasons: (sig.reasons) || [],
                  strategies: [],
                  entry: sig.entry, sl: sig.sl, target1: sig.target1,
                  target2: sig.target2, rr: sig.risk_reward,
                  _minConf: minConf,
                  // Option-level data for detail panel
                  optEntry: opt ? (opt.entry || opt.ltp) : null,
                  optSl: opt ? opt.sl : null,
                  optT1: opt ? opt.target1 : null,
                  optT2: opt ? opt.target2 : null,
                  optLots: opt ? opt.lots : null,
                  optQty: opt ? opt.qty : null,
                  optLotSize: opt ? opt.lot_size : null,
                  optCapital: opt ? opt.capital : null,
                  optMaxLoss: opt ? opt.max_loss : null,
                  optT1Profit: opt ? opt.t1_profit : null,
                  optT2Profit: opt ? opt.t2_profit : null,
                  optDelta: opt ? opt.delta : null,
                  optDeltaSrc: opt ? opt.delta_source : null,
                  optIv: opt ? opt.iv : null,
                  optGamma: opt ? opt.gamma : null,
                  optTheta: opt ? opt.theta : null,
                  optVega: opt ? opt.vega : null,
                  optOi: opt ? opt.oi : null,
                  optVolume: opt ? opt.volume : null,
                  optRr: opt ? opt.rr : null,
                  optSymbol: opt ? opt.symbol : null,
                  optExpiry: opt ? opt.expiry : null,
                  timing: result.timing || null,
                  chainAnalytics: result.chain_analytics || null,
                  chainFetchedAt: result.chain_fetched_at || null,
                  updatedAt: result.updated_at || null,
                };
              }).filter(Boolean);
              if (watchNow.length) {
                setSignals(prev => {
                  const nonWatch = prev.filter(s => s.status !== 'WATCH' && s.status !== 'READY');
                  return [...watchNow, ...nonWatch].slice(0, 300);
                });
              }
            }

            // ── LIVE signals: s.alerts = signals that passed all gates (conf + R:R + AI).
            // These trigger beep + browser notification.
            const rawAlerts = Array.isArray(s.alerts) ? s.alerts : [];
            if (rawAlerts.length) {
              const mapped = rawAlerts.map(a => {
                const sig = a.signal || {};
                const opt = a.option || null;
                return {
                  id: String(a.id || `${a.instrument}-${a.time}`),
                  inst: a.instrument || '',
                  dir: sig.direction || '',
                  type: (opt && opt.type) || (sig.direction === 'LONG' ? 'CE' : 'PE'),
                  strike: (opt && opt.strike) || null,
                  premium: (opt && opt.ltp) || null,
                  confidence: (sig.confidence_ai_adj != null ? sig.confidence_ai_adj : sig.confidence) || 0,
                  t: a.time || '',
                  // Full chrono so the user can verify against any external chart:
                  // - date: "2026-05-09" (YYYY-MM-DD)
                  // - weekday: "Fri"
                  // - iso_ts: "2026-05-09 12:35:00"  ← copy-paste into TradingView's Goto-date
                  date: a.date || '',
                  weekday: a.weekday || '',
                  iso_ts: a.iso_ts || (a.date && a.time ? `${a.date} ${a.time}` : a.time || ''),
                  // Spot-at-signal — so user can sanity-check against the chart's price at that moment
                  spotAtSignal: sig.price || sig.entry || null,
                  status: 'LIVE',
                  reasons: sig.reasons || [],
                  strategies: [],
                  entry: sig.entry, sl: sig.sl,
                  target1: sig.target1, target2: sig.target2,
                  rr: sig.risk_reward,
                  // Option-level data
                  optEntry: opt ? (opt.entry || opt.ltp) : null,
                  optSl: opt ? opt.sl : null,
                  optT1: opt ? opt.target1 : null,
                  optT2: opt ? opt.target2 : null,
                  optLots: opt ? opt.lots : null,
                  optQty: opt ? opt.qty : null,
                  optLotSize: opt ? opt.lot_size : null,
                  optCapital: opt ? opt.capital : null,
                  optMaxLoss: opt ? opt.max_loss : null,
                  optT1Profit: opt ? opt.t1_profit : null,
                  optT2Profit: opt ? opt.t2_profit : null,
                  optDelta: opt ? opt.delta : null,
                  optDeltaSrc: opt ? opt.delta_source : null,
                  optIv: opt ? opt.iv : null,
                  optGamma: opt ? opt.gamma : null,
                  optTheta: opt ? opt.theta : null,
                  optVega: opt ? opt.vega : null,
                  optOi: opt ? opt.oi : null,
                  optVolume: opt ? opt.volume : null,
                  optRr: opt ? opt.rr : null,
                  optSymbol: opt ? opt.symbol : null,
                  optExpiry: opt ? opt.expiry : null,
                  timing: a.timing || null,
                  aiVerdict: a.ai ? a.ai.verdict : null,
                  aiReasoning: a.ai ? a.ai.reasoning : null,
                  aiRiskNote: a.ai ? a.ai.risk_note : null,
                  aiPosPct: a.ai ? a.ai.position_pct : null,
                };
              });
              setSignals(prev => {
                const existingIds = new Set(prev.filter(s=>s.status==='LIVE').map(s=>s.id));
                const newOnes = mapped.filter(s => !existingIds.has(s.id));
                return newOnes.length ? [...newOnes, ...prev].slice(0, 300) : prev;
              });
              const latest = mapped[0];
              if (latest && latest.id !== lastSigId.current) {
                lastSigId.current = latest.id;
                notifySignal(latest); // beep only for LIVE (confirmed) signals
              }
            }

            if (Array.isArray(s.trades))  setTrades(s.trades);
            if (Array.isArray(s.log))     setLogLines(s.log.slice(-200));
          } catch(e) {
            const msg = e.message || String(e);
            if (msg !== lastStatusErr) {
              lastStatusErr = msg;
              addLog('INFO', `status poll failed · ${msg}`);
            }
          }
        };
        fast();
        const fastId = setInterval(fast, 2000);
        const pullHistory = async () => {
          for (const i of INST) {
            try {
              const r = await apiJSON(`/api/historical/${i.key || i.name}?days=1`);
              const arr = r.candles || r.data || r.bars || (Array.isArray(r) ? r : null);
              if (alive && Array.isArray(arr) && arr.length) {
                setCandles(prev => ({ ...prev, [i.name]: normCandles(arr) }));
                if (histErr[i.name]) { addLog('TICK', `${i.name} · historical recovered · ${arr.length} candles`); histErr[i.name] = ''; }
              } else if (alive && histErr[i.name] !== 'empty') {
                histErr[i.name] = 'empty';
                addLog('INFO', `${i.name} · historical empty or unknown response shape`);
              }
            } catch(e) {
              const msg = e.message || String(e);
              if (alive && histErr[i.name] !== msg) {
                histErr[i.name] = msg;
                addLog('INFO', `${i.name} · historical poll failed · ${msg}`);
              }
            }
          }
        };
        // kick off history immediately, then refresh every 30s
        pullHistory();
        const slowId = setInterval(pullHistory, 30000);

        // ── Swing scan polling — every 60s (server rescans every 30 min, so 60s is plenty) ──
        const fetchSwing = async () => {
          if (!alive) return;
          try {
            const r = await apiJSON('/api/swing/status');
            if (alive && r) setSwingData(r);
          } catch(e) { /* silent */ }
        };
        fetchSwing();
        const swingId = setInterval(fetchSwing, 60000);

        // ── Metrics + risk polling — every 8s. Powers the RiskBanner kill-switch + cost panel ──
        const fetchMetrics = async () => {
          if (!alive) return;
          try {
            const r = await apiJSON('/api/metrics');
            if (alive && r) setMetrics(r);
          } catch(e) { /* silent — endpoint may be unreachable on cold deploy */ }
        };
        fetchMetrics();
        const metricsId = setInterval(fetchMetrics, 8000);

        return () => { alive = false; clearInterval(fastId); clearInterval(slowId); clearInterval(swingId); clearInterval(metricsId); };
      }, [on, mode]);

      // Poll /api/ltp every 3 s while engine is on — keeps live cards populated.
      // Backend sends { ltp, change }; frontend reads { ltp, chg, pct } — normalise here.
      useEffect(() => {
        if (!on || mode !== 'live') return;
        let cancelled = false;
        const tick = async () => {
          try {
            const r = await apiJSON('/api/ltp');
            const raw = r && r.prices;
            if (!cancelled && raw && typeof raw === 'object') {
              const normalised = {};
              for (const [sym, v] of Object.entries(raw)) {
                if (v && typeof v === 'object') {
                  const ltp = Number(v.ltp  ?? v.last_price ?? 0);
                  const chg = Number(v.chg  ?? v.change     ?? v.net_change ?? 0);
                  // pct: use server value if present, else derive from prev_close or ltp-chg
                  const prevClose = Number(v.prev_close ?? v.prevClose ?? 0);
                  const pct = Number(
                    v.pct ?? v.percent_change ??
                    (prevClose > 0 ? (chg / prevClose) * 100 :
                     (ltp && chg   ? (chg / Math.abs(ltp - chg || 1)) * 100 : 0))
                  );
                  normalised[sym] = { ...v, ltp, chg, pct };
                } else {
                  // plain number — keep it, chg/pct will be NaN (unchanged from before)
                  normalised[sym] = v;
                }
              }
              setLive(prev => ({ ...prev, ...normalised }));
            }
          } catch (e) { /* silent */ }
        };
        tick();
        const id = setInterval(tick, 3000);
        return () => { cancelled = true; clearInterval(id); };
      }, [on, mode]);

      // Replay tick — uses functional updater so it always sees current state; no ref needed.
      // KEY: guard AND deps include !!replay (so effect re-fires the moment replay is initialised
      // after candles load — which happens async AFTER setOn(true)).
      // replay?.done in deps stops the interval cleanly when replay finishes.
      // replay.idx is NOT in deps — interval stays stable across ticks.
      useEffect(() => {
        if (!on || mode !== 'replay' || !replay || replay.done) return;
        const ms = Math.max(50, 220 / Math.max(1, speed));
        const id = setInterval(() => {
          setReplay(prev => {
            if (!prev || prev.done) return prev;
            if (prev.idx >= prev.total - 1) return { ...prev, done: true };
            return { ...prev, idx: prev.idx + 1 };
          });
        }, ms);
        return () => clearInterval(id);
      }, [on, mode, speed, !!replay, replay?.done]); // eslint-disable-line react-hooks/exhaustive-deps

      // Replay canvas updater + signal generator — fires on every idx change
      useEffect(() => {
        if (!replay) return;
        if (replay.done) {
          setOn(false);
          setSignals(prev => { addLog('INFO', `✓ Replay complete · ${replay.total} bars scanned · ${prev.length} signal(s) found`); return prev; });
          return;
        }
        const { data, idx } = replay;
        if (!data) return;
        Object.entries(data).forEach(([name, allCandles]) => {
          const visible = allCandles.slice(0, Math.min(idx, allCandles.length));
          if (visible.length === 0) return;
          // Update visible candles for chart animation
          setCandles(prev => {
            if ((prev[name] || []).length === visible.length) return prev;
            return { ...prev, [name]: visible };
          });
          // Analyze every 3 bars; but require 12-bar (60 min) cooldown for SAME direction.
          // Direction change always fires immediately (catches reversals).
          const lastState = replayAnalyzedAt.current[name] || { idx: 0, dir: null };
          const barsSinceLast = idx - lastState.idx;
          const shouldAnalyze = visible.length >= 20 && (barsSinceLast >= 3);
          if (shouldAnalyze) {
            const instDef = INST.find(i => i.name === name);
            if (!instDef) return;
            try {
              const sig = analyze(visible, instDef, 100000);
              if (sig && sig.direction && sig.confidence >= 60) {
                // 60-min cooldown per direction (12 bars × 5 min) — allow direction flip immediately
                const sameDir = sig.direction === lastState.dir;
                const cooldownOk = !sameDir || barsSinceLast >= 12;
                replayAnalyzedAt.current[name] = { idx, dir: sig.direction };
                if (cooldownOk) {
                  const lastC = visible[visible.length - 1];
                  // Preserve the bar's REAL date+time so the user can verify
                  // against any external chart at that exact moment.
                  const barDate = lastC.time ? new Date(lastC.time) : null;
                  const t = barDate
                    ? barDate.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })
                    : `bar ${idx}`;
                  const date = barDate ? barDate.toISOString().slice(0,10) : '';      // 2026-05-09
                  const weekday = barDate ? barDate.toLocaleDateString('en-IN', {weekday:'short'}) : '';
                  const iso_ts = barDate
                    ? `${date} ${barDate.toTimeString().slice(0,8)}`
                    : t;
                  const sigId = `REPLAY-${name}-${idx}`;
                  setSignals(prev => {
                    if (prev.some(s => s.id === sigId)) return prev;
                    beep(880);
                    return [{
                      id: sigId, inst: name, dir: sig.direction,
                      type: sig.option?.type || (sig.direction === 'LONG' ? 'CE' : 'PE'),
                      strike: sig.option?.strike, confidence: sig.confidence, t,
                      date, weekday, iso_ts, spotAtSignal: sig.entry || null,
                      status: 'REPLAY', reasons: sig.reasons || [], strategies: sig.strategies || [],
                      entry: sig.entry, sl: sig.sl, target1: sig.target1,
                      target2: sig.target2, rr: sig.rr, risk: sig.risk,
                    }, ...prev];
                  });
                }
              } else {
                // Update analyzed-at even when no signal so we don't hammer analyze()
                replayAnalyzedAt.current[name] = { idx, dir: lastState.dir };
              }
            } catch(e) { /* signal calc errors are non-fatal */ }
          }
        });
      }, [replay]); // eslint-disable-line react-hooks/exhaustive-deps

      const persist = (edits) => {
        Object.entries(edits).forEach(([k, v]) => localStorage.setItem(`se_${k}`, v));
      };

      const setTheme = (v) => { setThemeState(v); persist({ theme:v }); };
      const setAccent = (v) => { setAccentState(v); persist({ accent:v }); };
      const setDensity = (v) => { setDensityState(v); persist({ density:v }); };

      const tabs = [
        { id:'signals', label:'Intraday', icon:'◉' },
        { id:'swing',   label:'Swing',    icon:'📈' },
        { id:'journal', label:'Journal',  icon:'📊' },
        { id:'stats',   label:'Stats',    icon:'📉' },
        { id:'calc',    label:'Calculator', icon:'🧮' },
        { id:'log',     label:'Engine Log', icon:'⚙' },
      ];

      // ── defensive coercions (never trust the server shape) ──
      const safeSignals = Array.isArray(signals) ? signals : [];
      const safeTrades  = Array.isArray(trades)  ? trades  : [];
      const safeLog     = Array.isArray(logLines) ? logLines : [];
      const safeCandles = (candles && typeof candles === 'object' && !Array.isArray(candles)) ? candles : {};
      const safeLive    = (live && typeof live === 'object' && !Array.isArray(live)) ? live : {};

      // First active LIVE signal for the LIVE HERO card
      const activeLive = (safeSignals || []).find(s => s && (s.status === 'LIVE' || s.status === 'READY')) || null;

      return (
        <div key={theme+accent} className="app-shell">
          <NewSidebar
            tab={tab} mode={mode}
            setTab={setTab} setMode={setMode}
            signals={safeSignals}
            onSettings={() => setTweakOpen(true)}
          />
          <main className="main-col">
            <NewTopbar
              theme={theme} setTheme={setTheme}
              userName={userName} capital={capital}
              onTweaks={() => setTweakOpen(o => !o)}
              onProfileClick={() => setProfileOpen(true)}
            />

            {tab === 'signals' && (
              <>
                <LiveStripBar
                  on={on} mode={mode}
                  doStart={doStart} doStop={doStop}
                  replayDays={replayDays} setReplayDays={setReplayDays}
                  speed={speed} setSpeed={setSpeed}
                />
                <HeroRow trades={safeTrades} signals={safeSignals} capital={capital}/>
                <IndexPills live={safeLive}/>
                {activeLive && (
                  <LiveHeroCard
                    signal={activeLive}
                    live={safeLive}
                    capital={capital}
                    onOpen={() => setInst(activeLive.inst)}
                  />
                )}
              </>
            )}

            {/* Risk banner stays visible across views when engine is on */}
            {on && metrics && tab === 'signals' && (
              <div style={{margin:'10px 0'}}>
                <RiskBanner
                  metrics={metrics}
                  onTrip={() => doKillswitch('trip')}
                  onReset={() => doKillswitch('reset')}
                  onStrategyChange={doStrategy}
                />
              </div>
            )}

            <div key={tab+mode} className="reveal-enter" style={{flex:1, overflowY:'auto'}}>
              {tab === 'signals' && <SignalsTab sel={inst} setSel={setInst} signals={safeSignals} candles={safeCandles} live={safeLive} on={on}/>}
              {tab === 'swing'   && <SwingTab data={swingData} getServer={getServer} getAuthToken={getAuthToken} showToast={showToast}/>}
              {tab === 'journal' && <JournalTab trades={safeTrades}/>}
              {tab === 'stats' && <StatsTab trades={safeTrades} signals={safeSignals}/>}
              {tab === 'calc' && <CalcTab/>}
              {tab === 'log' && <LogTab logLines={safeLog} onClear={()=>setLogLines([])}/>}
            </div>

            {showPosMonitor && <PositionMonitor open={safeTrades.find(t => t && t.status === 'OPEN')} live={safeLive} onClose={()=>setShowPosMonitor(false)}/>}
            {tweakOpen && <Tweaks theme={theme} setTheme={setTheme} accent={accent} setAccent={setAccent} density={density} setDensity={setDensity} serverOk={serverOk} onClose={()=>setTweakOpen(false)}/>}

            <ProfileModal
              open={profileOpen}
              userName={userName} capital={capital}
              onClose={() => setProfileOpen(false)}
              onSave={({name, capital: cap}) => {
                setUserName(name);
                setCapital(cap);
                try {
                  localStorage.setItem('se_user_name', name);
                  localStorage.setItem('se_capital', String(cap));
                } catch(_) {}
                setProfileOpen(false);
              }}
            />

            {toast && (
              <div style={{position:'fixed', bottom:28, left:'50%', transform:'translateX(-50%)', zIndex:200,
                background:'var(--bg-elev)', backdropFilter:'blur(18px) saturate(140%)',
                border:'1px solid var(--accent)', borderRadius:'var(--r-md)', padding:'10px 18px',
                fontSize:12.5, color:'var(--ink-0)', boxShadow:'var(--shadow-lg), 0 0 32px var(--accent-faint)',
                animation:'fade-up 320ms cubic-bezier(.2,.7,.2,1)'}}>
                {toast}
              </div>
            )}
          </main>
        </div>
      );
    }

    // ===========================================
    // ERROR BOUNDARY
    // A single bad shape from the server should never blank the page.
    // ===========================================

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      componentDidCatch(error, info) { try { console.error('[Signal Engine] render error:', error, info); } catch(e){} }
      reset = () => { try { location.reload(); } catch(e) { this.setState({ error: null }); } };
      render() {
        if (!this.state.error) return this.props.children;
        return (
          <div style={{padding:'60px 24px', maxWidth:560, margin:'0 auto', fontFamily:'Inter, sans-serif', color:'var(--ink-0)'}}>
            <div style={{fontFamily:'Instrument Serif, serif', fontSize:34, lineHeight:1, color:'var(--ink-0)', marginBottom:10}}>
              Something <em style={{color:'var(--accent)'}}>went sideways</em>.
            </div>
            <div style={{fontSize:13, color:'var(--ink-2)', marginBottom:18, lineHeight:1.6}}>
              The dashboard hit a render error. Your data is safe — this is usually a bad response shape from the server. The details are in the browser console.
            </div>
            <pre style={{background:'var(--bg-2)', border:'1px solid var(--line-1)', borderRadius:8, padding:12, fontFamily:'JetBrains Mono, monospace', fontSize:11.5, color:'var(--short)', overflowX:'auto', marginBottom:16, whiteSpace:'pre-wrap'}}>
              {String(this.state.error && this.state.error.message || this.state.error)}
            </pre>
            <button type="button" className="btn primary" onClick={this.reset}>⟲ Reload dashboard</button>
          </div>
        );
      }
    }

    // ===========================================
    // RENDER
    // ===========================================

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary><App/></ErrorBoundary>
    );
  </script>
</body>
</html>
