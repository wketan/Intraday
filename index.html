<html lang="en">
<head>

  <title>Signal Engine · Intraday</title>

  <link rel="manifest" href="manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>

  <style>
    /* ===============================================================
       Signal Engine — Intraday Options Console
       Full design-handoff CSS, inlined.
       Dual theme (dark / light) · cinematic motion · Bloomberg density
       =============================================================== */

    /* ===== rich-pastel palette (ported from preview.html) ============
       Existing variable names preserved so all 22+ components inherit
       the new look automatically. New ones added underneath for the
       upcoming glass cards / glow / aurora.                          */

    :root, [data-theme="dark"] {
      --bg-0: oklch(0.100 0.012 35);
      --bg-1: oklch(0.130 0.014 35);
      --bg-2: oklch(0.160 0.013 35);
      --bg-3: oklch(0.190 0.014 35);
      --bg-elev: oklch(0.140 0.014 35 / 0.62);
      --ink-0: oklch(0.985 0.006 80);
      --ink-1: oklch(0.800 0.012 60);
      --ink-2: oklch(0.600 0.014 60);
      --ink-3: oklch(0.450 0.012 60);
      --line-0: oklch(1 0 0 / 0.05);
      --line-1: oklch(1 0 0 / 0.10);
      --line-2: oklch(1 0 0 / 0.16);
      --long:      oklch(0.86 0.13 152);     /* sage mint */
      --long-dim:  oklch(0.86 0.13 152 / 0.16);
      --short:     oklch(0.76 0.14 22);      /* dusty rose */
      --short-dim: oklch(0.76 0.14 22 / 0.16);
      --warn:      oklch(0.86 0.11 80);      /* warm cream */
      --warn-dim:  oklch(0.86 0.11 80 / 0.18);
      --accent:    oklch(0.80 0.11 280);     /* periwinkle */
      --accent-2:  oklch(0.72 0.14 295);     /* deeper violet */
      --accent-ink: oklch(0.18 0.04 280);
      --accent-dim: oklch(0.80 0.11 280 / 0.22);
      --accent-faint: oklch(0.80 0.11 280 / 0.08);
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.40);
      --shadow-md: 0 6px 24px oklch(0 0 0 / 0.35);
      --shadow-lg: 0 20px 60px oklch(0 0 0 / 0.55);
      --glow-accent: 0 0 0 1px var(--accent), 0 0 28px oklch(0.80 0.11 280 / 0.25);
      --glow-long:   0 0 0 1px var(--long),   0 0 28px oklch(0.86 0.13 152 / 0.25);
      --win-glow:    oklch(0.86 0.13 152 / 0.35);
      --loss-glow:   oklch(0.76 0.14 22 / 0.35);
      /* glass card primitives (used by upcoming new components) */
      --glass-bg:        linear-gradient(140deg, oklch(1 0 0 / 0.07), oklch(1 0 0 / 0.018));
      --glass-bg-hi:     linear-gradient(140deg, oklch(1 0 0 / 0.11), oklch(1 0 0 / 0.030));
      --glass-border:    oklch(1 0 0 / 0.11);
      --glass-border-hi: oklch(1 0 0 / 0.18);
      --glass-shadow:
        inset 0 1px 0 oklch(1 0 0 / 0.10),
        0 1px 2px oklch(0 0 0 / 0.30),
        0 16px 40px oklch(0 0 0 / 0.55);
      --scrim: none;  /* aurora handled by the .aurora layer */
    }

    [data-theme="light"] {
      --bg-0: oklch(0.975 0.008 75);
      --bg-1: oklch(1 0 0);
      --bg-2: oklch(0.955 0.010 75);
      --bg-3: oklch(0.930 0.012 75);
      --bg-elev: oklch(1 0 0 / 0.82);
      --ink-0: oklch(0.18 0.020 35);
      --ink-1: oklch(0.36 0.018 35);
      --ink-2: oklch(0.52 0.016 35);
      --ink-3: oklch(0.66 0.012 35);
      --line-0: oklch(0 0 0 / 0.04);
      --line-1: oklch(0 0 0 / 0.08);
      --line-2: oklch(0 0 0 / 0.14);
      --long:      oklch(0.62 0.13 152);
      --long-dim:  oklch(0.62 0.13 152 / 0.14);
      --short:     oklch(0.62 0.16 25);
      --short-dim: oklch(0.62 0.16 25 / 0.14);
      --warn:      oklch(0.68 0.14 78);
      --warn-dim:  oklch(0.68 0.14 78 / 0.14);
      --accent:    oklch(0.60 0.14 280);
      --accent-2:  oklch(0.52 0.16 295);
      --accent-ink: oklch(0.99 0 0);
      --accent-dim: oklch(0.60 0.14 280 / 0.18);
      --accent-faint: oklch(0.60 0.14 280 / 0.06);
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.05);
      --shadow-md: 0 6px 24px oklch(0 0 0 / 0.08);
      --shadow-lg: 0 20px 60px oklch(0 0 0 / 0.12);
      --glow-accent: 0 0 0 1px var(--accent), 0 4px 24px oklch(0.60 0.14 280 / 0.20);
      --glow-long:   0 0 0 1px var(--long),   0 4px 24px oklch(0.62 0.13 152 / 0.20);
      --win-glow:    oklch(0.62 0.13 152 / 0.30);
      --loss-glow:   oklch(0.62 0.16 25 / 0.30);
      --glass-bg:        linear-gradient(140deg, oklch(1 0 0 / 0.65), oklch(1 0 0 / 0.42));
      --glass-bg-hi:     linear-gradient(140deg, oklch(1 0 0 / 0.78), oklch(1 0 0 / 0.50));
      --glass-border:    oklch(1 0 0 / 0.55);
      --glass-border-hi: oklch(1 0 0 / 0.75);
      --glass-shadow:
        inset 0 1px 0 oklch(1 0 0 / 0.60),
        0 1px 2px oklch(0 0 0 / 0.04),
        0 16px 40px oklch(0 0 0 / 0.10);
      --scrim: none;
    }

    :root {
      --ui: 'Inter', system-ui, -apple-system, sans-serif;
      --serif: 'Instrument Serif', 'Times New Roman', serif;
      --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      --r-xs: 3px; --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px;
      --row-h: 38px;
      --pad-x: 20px;
      --pad-y: 14px;
      --gap: 14px;
    }
    [data-density="compact"] { --pad-x: 14px; --pad-y: 10px; --gap: 10px; --row-h: 32px; }
    [data-density="comfortable"] { --pad-x: 22px; --pad-y: 16px; --gap: 16px; --row-h: 40px; }

    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; width:100%; height:100%; }
    body {
      background: var(--bg-0);
      color: var(--ink-0);
      font-family: var(--ui);
      font-feature-settings: "tnum", "ss01";
      font-size: 13px;
      line-height: 1.45;
      letter-spacing: -0.005em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* ── aurora canvas (soft pastel blobs behind everything) ─────────── */
    .aurora {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .aurora .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.85; }
    .aurora .b1 { width: 720px; height: 720px; top: -220px; right: -160px;
                  background: radial-gradient(circle, oklch(0.80 0.12 280 / 0.50), transparent 70%); }
    .aurora .b2 { width: 620px; height: 620px; top: 28%; right: -200px;
                  background: radial-gradient(circle, oklch(0.78 0.12 320 / 0.36), transparent 70%); }
    .aurora .b3 { width: 540px; height: 540px; bottom: -140px; left: -100px;
                  background: radial-gradient(circle, oklch(0.78 0.13 22 / 0.30), transparent 70%); }
    .aurora .b4 { width: 420px; height: 420px; top: 38%; left: 16%;
                  background: radial-gradient(circle, oklch(0.84 0.11 152 / 0.22), transparent 70%); }
    [data-theme="light"] .aurora .blob { opacity: 0.60; }
    [data-theme="light"] .aurora .b1 { background: radial-gradient(circle, oklch(0.88 0.09 280 / 0.55), transparent 70%); }
    [data-theme="light"] .aurora .b2 { background: radial-gradient(circle, oklch(0.90 0.08 320 / 0.45), transparent 70%); }
    [data-theme="light"] .aurora .b3 { background: radial-gradient(circle, oklch(0.92 0.08 22 / 0.40), transparent 70%); }
    [data-theme="light"] .aurora .b4 { background: radial-gradient(circle, oklch(0.92 0.08 152 / 0.35), transparent 70%); }
    .aurora .grid {
      position: absolute; inset: 0;
      background-image: radial-gradient(oklch(1 0 0 / 0.05) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    }
    [data-theme="light"] .aurora .grid {
      background-image: radial-gradient(oklch(0 0 0 / 0.05) 1px, transparent 1px);
    }

    #root { width:100%; height:100%; display:flex; flex-direction:column; position: relative; z-index: 1; }
    *, *::before, *::after {
      transition:
        background-color 260ms cubic-bezier(.2,.6,.2,1),
        border-color 260ms cubic-bezier(.2,.6,.2,1),
        color 180ms cubic-bezier(.2,.6,.2,1),
        box-shadow 260ms cubic-bezier(.2,.6,.2,1);
    }
    button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }
    .mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; }
    .muted { color: var(--ink-2); }
    .dim { color: var(--ink-3); }
    .pos, .num.pos { color: var(--long); font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .neg, .num.neg { color: var(--short); font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .right { text-align: right; }

    ::-webkit-scrollbar { width:10px; height:10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line-1); border-radius:10px; border:2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: var(--line-2); background-clip: padding-box; }
    ::selection { background: var(--accent-dim); color: var(--ink-0); }

    /* ── keyframes ───────────────────────────── */
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.40; } }
    @keyframes glow-pulse {
      0%,100% { box-shadow: 0 0 0 1px var(--accent), 0 0 18px oklch(0.82 0.15 75 / 0.18); }
      50%     { box-shadow: 0 0 0 1px var(--accent), 0 0 42px oklch(0.82 0.15 75 / 0.45); }
    }
    @keyframes fade-up { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
    @keyframes fade-in { from { opacity:0; } to { opacity:1; } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes ticker-flash-up   { 0% { background: var(--long-dim); } 100% { background: transparent; } }
    @keyframes ticker-flash-down { 0% { background: var(--short-dim); } 100% { background: transparent; } }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes scan {
      0%   { transform: translateX(-100%); opacity: 0; }
      20%  { opacity: 1; }
      100% { transform: translateX(100%); opacity: 0; }
    }
    @keyframes heart {
      0%,100% { transform: scale(1); box-shadow: 0 0 0 0 oklch(0.80 0.17 150 / 0.55); }
      50%     { transform: scale(1.15); box-shadow: 0 0 0 6px oklch(0.80 0.17 150 / 0); }
    }
    @keyframes slide-in-right { from { transform: translateX(100%); } to { transform: translateX(0); } }

    .fade-up { animation: fade-up 520ms cubic-bezier(.2,.7,.2,1) both; }
    .fade-in { animation: fade-in 420ms ease both; }
    .reveal-enter { animation: fade-up 360ms cubic-bezier(.2,.8,.2,1) both; }

    /* ── top chrome ────────────────────────── */
    .chrome {
      display:flex; align-items:center; gap:14px;
      min-height:56px; padding: 0 var(--pad-x);
      background: var(--bg-elev);
      backdrop-filter: saturate(140%) blur(16px);
      -webkit-backdrop-filter: saturate(140%) blur(16px);
      border-bottom: 1px solid var(--line-0);
      font-size: 12.5px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .brand { display:flex; align-items:center; gap:11px; font-weight:600; letter-spacing:-0.018em; font-size:15px; }
    .brand .mark {
      width:34px; height:34px; flex-shrink:0;
      position:relative; border-radius:10px;
      background: linear-gradient(140deg, var(--accent), var(--accent-2));
      box-shadow:
        0 4px 14px oklch(0.55 0.18 290 / 0.40),
        inset 0 1px 0 oklch(1 0 0 / 0.18),
        inset 0 -10px 18px oklch(0 0 0 / 0.20);
      overflow: hidden;
    }
    .brand .mark svg { width: 100%; height: 100%; display: block; }
    .brand .mark .bm-rings { opacity: 0.22; }
    .brand .mark .bm-bar.b1 { fill: oklch(1 0 0 / 0.55); }
    .brand .mark .bm-bar.b2 { fill: oklch(1 0 0 / 0.72); }
    .brand .mark .bm-bar.b3 { fill: oklch(1 0 0 / 0.86); }
    .brand .mark .bm-bar.b4 { fill: oklch(1 0 0 / 1.00); }
    .brand .name { display:flex; flex-direction:column; line-height:1.1; }
    .brand .name span:first-child { font-weight:600; font-size:15px; color: var(--ink-0); }
    .brand .sub  { font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-3); font-weight:500; font-family:var(--mono); margin-top:1px; }

    .market-status { display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11.5px; color:var(--ink-1); }
    .market-status .pulse { width:7px; height:7px; border-radius:99px; background:var(--long);
      box-shadow: 0 0 0 0 oklch(0.80 0.17 150 / 0.6); animation: heart 2s ease-in-out infinite; flex-shrink: 0; }

    .kbd { display:inline-flex; align-items:center; padding:2px 6px; border-radius:4px;
      border:1px solid var(--line-1); background:var(--bg-2); color:var(--ink-2);
      font-family:var(--mono); font-size:10.5px; }

    /* ── marquee ticker tape ────────────── */
    .tape { position: relative; overflow: hidden; border-bottom: 1px solid var(--line-0);
      background: var(--bg-1); height: 28px; display: flex; align-items: center; flex-shrink: 0; }
    .tape .label { position: sticky; left:0; top:0; padding: 0 14px; height:100%;
      display:flex; align-items:center; background: var(--bg-2); border-right:1px solid var(--line-1);
      font-family: var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
      color: var(--ink-3); font-weight:600; z-index:2; white-space: nowrap; }
    .tape .track { display:flex; gap:28px; padding: 0 28px; animation: marquee 45s linear infinite; white-space: nowrap; }
    .tape-item { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; }
    .tape-item .sym { font-family:var(--mono); font-weight:600; color:var(--ink-0); }
    .tape-item .val { font-family:var(--mono); color:var(--ink-1); }

    /* ── buttons ─────────────────────────── */
    .btn { display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 13px;
      border-radius: var(--r-sm); border:1px solid var(--line-1); background: var(--bg-2); color: var(--ink-0);
      font-size:12px; font-weight:500; cursor:pointer; position:relative; white-space: nowrap; }
    .btn:hover { background: var(--bg-3); border-color: var(--line-2); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn.primary {
      background: linear-gradient(180deg, var(--accent), var(--accent));
      background-image: linear-gradient(180deg, oklch(from var(--accent) calc(l + 0.05) c h), var(--accent));
      color: var(--accent-ink); border-color: var(--accent); font-weight:600;
      box-shadow: 0 1px 0 oklch(1 0 0 / 0.15) inset, 0 6px 18px oklch(0.82 0.15 75 / 0.30);
    }
    .btn.primary:hover { filter: brightness(1.05); transform: translateY(-1px);
      box-shadow: 0 1px 0 oklch(1 0 0 / 0.15) inset, 0 10px 28px oklch(0.82 0.15 75 / 0.38); }
    .btn.ghost { background: transparent; }
    .btn.ghost:hover { background: var(--bg-2); }
    .btn.danger { background: transparent; color: var(--short); border-color: var(--short-dim); }
    .btn.danger:hover { background: var(--short-dim); border-color: var(--short); }
    .btn.success { background: transparent; color: var(--long); border-color: var(--long-dim); }
    .btn.lg { height: 38px; padding: 0 20px; font-size: 13px; border-radius: 8px; }

    .seg { display:inline-flex; background: var(--bg-1); padding:3px; border-radius: var(--r-sm);
      border:1px solid var(--line-0); flex-shrink: 0; }
    .seg button { padding:6px 12px; border:none; background:transparent; color:var(--ink-2);
      font-size:11.5px; border-radius:4px; cursor:pointer; font-weight:500; }
    .seg button:hover:not(.on) { color: var(--ink-0); }
    .seg button.on { background: var(--bg-3); color: var(--ink-0);
      box-shadow: 0 1px 2px oklch(0 0 0 / 0.15), inset 0 0 0 1px var(--line-1); }
    .seg button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── tabs ─────────────────────────────── */
    .tabs { display:flex; gap:2px; border-bottom:1px solid var(--line-0); padding:0 var(--pad-x);
      background: var(--bg-0); flex-shrink: 0; overflow-x: auto; overflow-y: hidden; }
    .tab { padding:14px 18px 12px; border:none; background:transparent; color:var(--ink-2);
      font-size:12.5px; font-weight:500; cursor:pointer; position:relative;
      display:flex; align-items:center; gap:8px; letter-spacing:0.01em; white-space: nowrap; }
    .tab::after { content:''; position:absolute; left:10%; right:10%; bottom:-1px;
      height:2px; background: var(--accent); border-radius:2px 2px 0 0;
      transform: scaleX(0); transform-origin: center;
      transition: transform 320ms cubic-bezier(.2,.8,.2,1); }
    .tab:hover { color:var(--ink-0); }
    .tab.on { color: var(--ink-0); }
    .tab.on::after { transform: scaleX(1); }
    .tab .count { font-family:var(--mono); font-size:10.5px; padding:1px 7px; border-radius:99px;
      background: var(--bg-2); color:var(--ink-2); }
    .tab.on .count { background: var(--accent-dim); color: var(--accent); }

    /* ── chips ───────────────────────────── */
    .chip { display:inline-flex; align-items:center; gap:5px; padding:2.5px 8px; border-radius: var(--r-xs);
      font-size:10.5px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
      font-family:var(--mono); line-height:1.4; }
    .chip.long  { color: var(--long);  background: var(--long-dim);
      box-shadow: inset 0 0 0 1px oklch(from var(--long) l c h / 0.25); }
    .chip.short { color: var(--short); background: var(--short-dim);
      box-shadow: inset 0 0 0 1px oklch(from var(--short) l c h / 0.25); }
    .chip.warn  { color: var(--warn);  background: var(--warn-dim); }
    .chip.accent{ color: var(--accent); background: var(--accent-dim);
      box-shadow: inset 0 0 0 1px oklch(from var(--accent) l c h / 0.3); }
    .chip.ghost { color: var(--ink-2); background: var(--bg-2); box-shadow: inset 0 0 0 1px var(--line-0); }

    /* ── panels ──────────────────────────── */
    .panel { background: var(--bg-1); border:1px solid var(--line-0); border-radius: var(--r-md);
      box-shadow: var(--shadow-sm); overflow:hidden; }
    .panel-head { display:flex; align-items:center; gap:10px; padding:13px 16px;
      border-bottom:1px solid var(--line-0); font-size:12px; }
    .panel-head h3 { margin:0; font-size:10.5px; font-weight:600; letter-spacing:0.1em;
      text-transform:uppercase; color: var(--ink-2); }

    /* ── tables ──────────────────────────── */
    .tbl { width:100%; border-collapse:collapse; font-size:12.5px; }
    .tbl th { text-align:left; font-weight:500; font-size:10px; letter-spacing:0.1em;
      text-transform:uppercase; color: var(--ink-3); padding:11px var(--pad-x);
      border-bottom:1px solid var(--line-0); background: var(--bg-1); }
    .tbl td { padding:0 var(--pad-x); height: var(--row-h);
      border-bottom:1px solid var(--line-0); vertical-align:middle; color: var(--ink-1); }
    .tbl tr:hover td { background: var(--bg-2); }
    .tbl .right { text-align:right; }
    .tbl .ticker { font-family:var(--mono); font-weight:600; letter-spacing:-0.01em; font-size:13px; color: var(--ink-0); }
    .tbl tr.selected td { background: var(--accent-faint); box-shadow: inset 2px 0 0 var(--accent); }

    /* ── misc ────────────────────────────── */
    .meter { display:inline-flex; gap:2px; align-items:center; }
    .meter .bar { width:3px; height:11px; background: var(--line-1); border-radius:1px;
      transition: height 220ms ease; }
    .meter .bar.on { background: var(--accent); }
    .meter.strong .bar.on { background: var(--long); box-shadow: 0 0 6px var(--long); }
    .meter.weak .bar.on { background: var(--short); box-shadow: 0 0 6px var(--short); }

    .spark { display:inline-block; vertical-align:middle; }
    .big { font-family: var(--mono); font-weight: 500; font-size: 36px;
      letter-spacing:-0.02em; color: var(--ink-0); }
    .big small { font-size:14px; color: var(--ink-2); margin-left:4px; }

    /* ── ladder (entry/SL/target) ────────── */
    .ladder { position:relative; padding:6px 0; }
    .ladder .rail { position:absolute; left:13px; top:18px; bottom:18px; width:2px; background: var(--line-0); }
    .ladder .node { display:flex; align-items:center; gap:14px; padding:10px 0; position:relative; }
    .ladder .dot { width:28px; height:28px; border-radius:99px; background: var(--bg-2);
      border:2px solid var(--line-1); display:flex; align-items:center; justify-content:center;
      font-family:var(--mono); font-size:10px; font-weight:600; color: var(--ink-2);
      position:relative; z-index:2; flex-shrink:0; }
    .ladder .node.t1 .dot, .ladder .node.t2 .dot { border-color: var(--long); color: var(--long); }
    .ladder .node.entry .dot { border-color: var(--accent); color: var(--accent); background: var(--accent-dim);
      box-shadow: 0 0 0 4px oklch(from var(--accent) l c h / 0.08); }
    .ladder .node.sl .dot { border-color: var(--short); color: var(--short); }

    /* ── layout grids ────────────────────── */
    .grid-2 { display:grid; grid-template-columns: 1.6fr 1fr; gap:16px; }
    .grid-3 { display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; }
    .grid-4 { display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; }

    /* ── metric card ─────────────────────── */
    .metric { padding:16px 18px; border:1px solid var(--line-0); border-radius: var(--r-md);
      background: var(--bg-1); box-shadow: var(--shadow-sm); }
    .metric .label { font-size:10px; letter-spacing:0.12em; text-transform:uppercase;
      color: var(--ink-3); font-weight:600; margin-bottom:8px; }
    .metric .val { font-family: var(--mono); font-size: 26px; font-weight: 500;
      letter-spacing:-0.015em; line-height:1; color: var(--ink-0); }
    .metric .val.pos { color: var(--long); }
    .metric .val.neg { color: var(--short); }
    .metric .delta { font-size:11.5px; margin-top:6px; font-family: var(--mono); color: var(--ink-3); }
    .metric .delta.pos { color: var(--long); }
    .metric .delta.neg { color: var(--short); }
    .metric .delta.dim { color: var(--ink-3); }

    /* ── instrument cards ────────────────── */
    .inst-row { display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; padding:16px var(--pad-x); }
    .inst-card { padding:16px 18px; background: var(--bg-1); border:1px solid var(--line-0);
      border-radius: var(--r-md); cursor:pointer; position:relative; overflow:hidden;
      box-shadow: var(--shadow-sm); }
    .inst-card::before {
      content:''; position:absolute; inset:0; pointer-events:none; opacity:0;
      background: linear-gradient(135deg, var(--accent-faint) 0%, transparent 50%);
      transition: opacity 400ms ease;
    }
    .inst-card:hover { transform: translateY(-1px); border-color: var(--line-1); box-shadow: var(--shadow-md); }
    .inst-card:hover::before { opacity: 1; }
    .inst-card.on { border-color: var(--accent);
      background: linear-gradient(180deg, var(--accent-faint), transparent 70%); }
    .inst-card.on::before { opacity: 1; }
    .inst-card .name { font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
      color: var(--ink-2); font-weight:600; }
    .inst-card .price { font-family:var(--mono); font-size:26px; font-weight:500;
      margin-top:6px; letter-spacing:-0.02em; color: var(--ink-0); }
    .inst-card .delta { font-family:var(--mono); font-size:12px; margin-top:3px; color: var(--ink-2); }

    /* ── window strip ────────────────────── */
    .win-strip { display:flex; gap:0; padding:14px var(--pad-x); border-top:1px solid var(--line-0);
      border-bottom:1px solid var(--line-0); align-items:center; }
    .win { padding:8px 16px; flex:1; position:relative; font-size:11.5px; }
    .win + .win { border-left:1px solid var(--line-0); }
    .win .lbl { font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color: var(--ink-3); font-weight:600; }
    .win .tm { font-family:var(--mono); color: var(--ink-1); margin-top:2px; }
    .win.active { background: linear-gradient(90deg, var(--accent-faint), transparent); position: relative; overflow: hidden; }
    .win.active::after { content:''; position:absolute; inset:0;
      background: linear-gradient(90deg, transparent, oklch(from var(--accent) l c h / 0.12), transparent);
      animation: scan 3.6s ease-in-out infinite; pointer-events:none; }
    .win.active .lbl { color: var(--accent); }
    .win.past .tm { color: var(--ink-3); }
    .win .state { position:absolute; top:8px; right:16px; font-size:9.5px; font-weight:600;
      letter-spacing:0.08em; font-family:var(--mono); }
    .win.active .state { color: var(--accent); }
    .win.past .state { color: var(--ink-3); }
    .win.upcoming .state { color: var(--ink-2); }

    /* ── floating position monitor ─ design ── */
    .pos-monitor { position: fixed; bottom: 20px; left: 20px; z-index: 60;
      background: var(--bg-elev);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid var(--accent);
      border-radius: var(--r-md); padding: 12px 14px;
      display: flex; align-items: center; gap: 14px; font-size: 12px;
      box-shadow: var(--shadow-lg), 0 0 40px oklch(0.82 0.15 75 / 0.15);
      animation: fade-up 600ms cubic-bezier(.2,.7,.2,1);
    }
    .pos-monitor .live-dot { width:7px; height:7px; border-radius:99px; background: var(--long);
      box-shadow: 0 0 12px var(--long); animation: heart 2s ease-in-out infinite; }

    /* ── legacy position-monitor component shim ─ */
    .position-monitor { position: fixed; bottom: 24px; right: 24px; width: 300px;
      background: var(--bg-elev); backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid var(--accent); border-radius: var(--r-md); padding: 14px 16px;
      box-shadow: var(--shadow-lg), 0 0 40px oklch(0.82 0.15 75 / 0.15);
      z-index: 1000; animation: fade-up 200ms ease; }
    .position-monitor-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .position-monitor-header h4 { margin:0; font-size:11px; font-weight:700; color:var(--ink-0);
      letter-spacing:0.08em; text-transform: uppercase; }
    .position-monitor-close { width:20px; height:20px; border-radius:4px; background:var(--bg-2);
      border:1px solid var(--line-1); color:var(--ink-2); display:flex; align-items:center;
      justify-content:center; font-size:12px; cursor:pointer; }
    .position-monitor-close:hover { background: var(--bg-3); }
    .position-monitor-row { display:flex; justify-content:space-between; align-items:center;
      padding:5px 0; font-size:12px; }
    .position-monitor-row .label { color: var(--ink-2); }
    .position-monitor-row .value { font-weight:600; color: var(--ink-0); font-family: var(--mono); }
    .position-monitor-row .value.pos { color: var(--long); }
    .position-monitor-row .value.neg { color: var(--short); }

    /* ── tweaks ─────────────────────────── */
    .tweaks { position: fixed; bottom: 20px; right: 20px; z-index: 100; width: 320px;
      max-height: calc(100vh - 40px); overflow-y: auto;
      background: var(--bg-elev);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid var(--line-1);
      border-radius: var(--r-lg); padding: 18px;
      box-shadow: var(--shadow-lg); font-size: 12px;
      animation: fade-up 400ms cubic-bezier(.2,.7,.2,1);
    }
    .tweaks h4 { margin: 0 0 14px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; }
    .tweak-row { margin-bottom: 16px; }
    .tweak-row:last-child { margin-bottom: 0; }
    .tweak-row .lbl { font-size: 10.5px; color: var(--ink-3); margin-bottom: 8px;
      display: flex; justify-content: space-between;
      letter-spacing:0.08em; text-transform:uppercase; font-weight:600; }
    .tweak-row .lbl .v { color: var(--ink-1); font-family: var(--mono);
      letter-spacing:0; text-transform:none; font-weight:500; }
    .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
    .swatch { width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--line-1); position:relative; }
    .swatch::after { content:''; position:absolute; inset:-3px; border-radius:9px;
      border: 2px solid transparent; transition: border-color 200ms; }
    .swatch.on::after { border-color: var(--ink-0); }

    .theme-toggle { display:inline-flex; padding:3px; border-radius:99px;
      border:1px solid var(--line-1); background: var(--bg-2); gap:2px; }
    .theme-toggle button { height:26px; border-radius:99px; border:none; background:transparent;
      color: var(--ink-3); cursor:pointer; display:inline-flex; align-items:center;
      justify-content:center; font-size:11.5px; padding: 0 12px; font-weight: 500; }
    .theme-toggle button.on { background: var(--bg-0); color: var(--ink-0); box-shadow: var(--shadow-sm); }

    /* ── confidence ring ─────────────────── */
    .conf-ring { position: relative; width:48px; height:48px; flex-shrink: 0; }
    .conf-ring svg { transform: rotate(-90deg); display: block; }
    .conf-ring .v { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-family:var(--mono); font-weight:600; font-size:14px; }
    .conf-ring svg circle { transition: stroke-dashoffset 900ms cubic-bezier(.2,.8,.2,1); }

    .bar-h { height:6px; background: var(--bg-2); border-radius:3px; overflow:hidden; }
    .bar-h .fill { height:100%; background: var(--accent); transition: width 600ms cubic-bezier(.2,.8,.2,1); }

    /* ── calculator ─────────────────────── */
    .calc-grid { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
    .calc-input { display:flex; flex-direction:column; gap:6px; }
    .calc-input label { font-size:10px; letter-spacing:0.12em; text-transform:uppercase;
      color: var(--ink-3); font-weight:600; }
    .calc-input input { background: var(--bg-2); border:1px solid var(--line-1); color: var(--ink-0);
      padding:11px 13px; border-radius: var(--r-sm); font-family: var(--mono); font-size:14px; outline:none; }
    .calc-input input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }

    /* ── compact stats bar (replaces hero) ── */
    .statsbar { padding: 6px var(--pad-x); display:flex; align-items:center; gap:16px;
      flex-shrink: 0; flex-wrap: wrap; border-bottom: 1px solid var(--line-0); background: var(--bg-0); }
    .statsbar .stat { display:flex; align-items:baseline; gap:5px; }
    .statsbar .stat-label { font-size:9.5px; color: var(--ink-3); text-transform:uppercase;
      letter-spacing:0.07em; font-weight:600; font-family:var(--mono); }
    .statsbar .stat-val { font-size:13px; font-weight:600; font-family:var(--mono); color:var(--ink-0); }
    .statsbar .divider { width:1px; height:14px; background:var(--line-1); flex-shrink:0; }

    /* ── log terminal ───────────────────── */
    .log { font-family: var(--mono); font-size:11.5px; padding:14px var(--pad-x);
      background: var(--bg-0); }
    .log-row { padding:4px 0; display:grid; grid-template-columns: 84px 56px 1fr; gap:14px;
      align-items:center; animation: fade-in 400ms ease both; }
    .log-row .lvl { font-size:9.5px; padding:2px 7px; border-radius:3px; text-align:center;
      font-weight:600; letter-spacing:0.03em; font-family: var(--mono); }
    .log-row .lvl.SIG  { background: var(--accent-dim); color: var(--accent); }
    .log-row .lvl.INFO { background: var(--bg-2); color: var(--ink-2); }
    .log-row .lvl.TICK { background: var(--bg-2); color: var(--ink-3); }
    .log-row .lvl.EXIT { background: var(--long-dim); color: var(--long); }
    .log-row .lvl.WARN { background: var(--warn-dim); color: var(--warn); }
    .log-row .dim { color: var(--ink-3); }

    /* ── inputs ─────────────────────────── */
    input, textarea, select {
      font-family: inherit; font-size: inherit;
      background: var(--bg-2); border: 1px solid var(--line-1); color: var(--ink-0);
      padding: 7px 10px; border-radius: var(--r-sm);
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }

    /* ── responsive ─────────────────────── */
    @media (max-width: 960px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: repeat(2, 1fr); }
      .inst-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .statsbar { gap:10px; }
      .grid-4 { grid-template-columns: 1fr; }
      .grid-3 { grid-template-columns: 1fr; }
      .tweaks { width: calc(100% - 40px); left: 20px; right: 20px; }
      .position-monitor { width: calc(100% - 40px); left: 20px; right: 20px; }
    }

    /* ═══════════════════════════════════════════════════════════════════
       ▼  PORTED DESIGN (preview.html → real engine)
       Sidebar shell · topbar · hero row · pills · LIVE HERO · drawer · modal
       ═══════════════════════════════════════════════════════════════════ */

    .app-shell {
      display: grid; grid-template-columns: 240px 1fr;
      min-height: 100vh; width: 100%;
      position: relative; z-index: 1;
    }
    @media (max-width: 900px) { .app-shell { grid-template-columns: 1fr; } .sidebar { display:none; } }

    /* ── sidebar ─────────────────────────────────────────────────────── */
    .sidebar {
      padding: 18px 14px 16px;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--line-0);
    }
    .sidebar .brand { padding: 4px 6px; margin-bottom: 24px; }
    .nav-sec {
      font-family: var(--mono); font-size: 9.5px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--ink-3); padding: 12px 10px 6px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 11px; margin-bottom: 2px;
      border-radius: 10px; cursor: pointer;
      color: var(--ink-1); font-size: 13px; font-weight: 500;
      position: relative; background: transparent; border: 0;
      width: 100%; text-align: left;
      transition: color 0.15s, background 0.15s;
    }
    .nav-item:hover { color: var(--ink-0); background: var(--line-0); }
    .nav-item.on {
      color: var(--ink-0);
      background: linear-gradient(95deg, var(--accent-dim) 0%, transparent 80%);
    }
    .nav-item.on::before {
      content:''; position:absolute; left:0; top:8px; bottom:8px;
      width: 2.5px; border-radius: 4px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 8px var(--accent);
    }
    .nav-item .ico { width: 16px; height: 16px; flex-shrink: 0; display:inline-flex; }
    .nav-item .ico svg { width:100%; height:100%; stroke: currentColor; fill: none; stroke-width: 1.7; opacity: 0.85; }
    .nav-item .nav-badge {
      margin-left: auto; font-family: var(--mono); font-size: 10px;
      padding: 2px 8px; border-radius: 999px;
      border: 1px solid var(--line-1); color: var(--ink-2);
      background: oklch(0 0 0 / 0.20);
    }
    .nav-item .nav-badge.live {
      color: oklch(0.78 0.20 22);
      border-color: oklch(0.78 0.20 22 / 0.35);
      background: oklch(0.78 0.20 22 / 0.16);
      display: inline-flex; align-items: center; gap: 6px; font-weight: 700;
    }
    .nav-item .nav-badge .nav-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: oklch(0.78 0.20 22);
      box-shadow: 0 0 6px oklch(0.78 0.20 22);
      animation: nav-pulse 1.6s ease-in-out infinite;
    }
    @keyframes nav-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(1.35); }
    }
    .help-widget {
      margin-top: auto; position: relative; overflow: hidden;
      background: linear-gradient(140deg, oklch(0.70 0.13 280 / 0.24), oklch(0.55 0.16 320 / 0.12));
      border: 1px solid oklch(0.70 0.13 280 / 0.32);
      border-radius: 14px; padding: 14px; text-align: center;
    }
    .help-widget h4 { margin: 0 0 4px; font-size: 13.5px; font-weight: 600; letter-spacing: -0.012em; }
    .help-widget p { margin: 0 0 10px; font-size: 11px; color: var(--ink-2); line-height: 1.4; }
    .help-widget button {
      background: linear-gradient(95deg, var(--accent), var(--accent-2));
      color: var(--accent-ink); border: 0; border-radius: 8px;
      padding: 7px 14px; font-weight: 600; font-size: 11.5px; cursor: pointer;
      box-shadow: 0 6px 18px oklch(0.55 0.18 290 / 0.45);
    }

    /* ── topbar ──────────────────────────────────────────────────────── */
    .main-col { min-width: 0; padding: 18px 22px 40px; display: flex; flex-direction: column; }
    .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .topbar .grow { flex: 1; }
    .iconbtn-glass {
      width: 38px; height: 38px;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(30px) saturate(180%);
      border-radius: 11px; color: var(--ink-1); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      position: relative; transition: color 0.15s, transform 0.15s;
      box-shadow: var(--glass-shadow);
    }
    .iconbtn-glass:hover { color: var(--ink-0); transform: translateY(-1px); }
    .iconbtn-glass svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .theme-toggle {
      position: relative; width: 64px; height: 32px;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      border-radius: 999px; cursor: pointer; backdrop-filter: blur(20px);
      overflow: hidden; box-shadow: var(--glass-shadow);
    }
    .theme-toggle .thumb {
      position: absolute; top: 3px; left: 3px;
      width: 24px; height: 24px; border-radius: 50%;
      background: linear-gradient(140deg, var(--accent), var(--accent-2));
      box-shadow: 0 2px 8px oklch(0 0 0 / 0.40), inset 0 1px 0 oklch(1 0 0 / 0.30);
      transition: left 0.35s cubic-bezier(0.65, 0, 0.35, 1);
      z-index: 2;
    }
    [data-theme="light"] .theme-toggle .thumb { left: 35px; background: linear-gradient(140deg, oklch(0.95 0.05 80), oklch(0.80 0.12 60)); }
    .theme-toggle svg { position: absolute; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--ink-2); fill: none; stroke-width: 2; transition: opacity 0.3s; }
    .theme-toggle .ico-sun  { left: 9px; }
    .theme-toggle .ico-moon { right: 9px; }
    [data-theme="dark"]  .theme-toggle .ico-sun  { opacity: 0.40; }
    [data-theme="dark"]  .theme-toggle .ico-moon { opacity: 1; color: var(--ink-0); }
    [data-theme="light"] .theme-toggle .ico-sun  { opacity: 1; color: var(--accent); }
    [data-theme="light"] .theme-toggle .ico-moon { opacity: 0.40; }
    .userchip {
      display: flex; align-items: center; gap: 11px;
      padding: 5px 14px 5px 5px;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(30px) saturate(180%);
      border-radius: 999px; cursor: pointer;
      box-shadow: var(--glass-shadow);
      font-family: inherit; color: inherit;
      transition: transform 0.15s, border-color 0.15s;
    }
    .userchip:hover { transform: translateY(-1px); border-color: var(--glass-border-hi); }
    .userchip .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(140deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 0 2px var(--bg-0);
    }
    .userchip .name { font-size: 12.5px; font-weight: 600; color: var(--ink-0); letter-spacing: -0.01em; text-align: left; }
    .userchip .cap  { font-size: 10px; color: var(--ink-2); margin-top: 1px; font-family: var(--mono); text-align: left; }

    /* ── glass card ──────────────────────────────────────────────────── */
    .gcard {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-top-color: var(--glass-border-hi);
      backdrop-filter: blur(40px) saturate(180%);
      border-radius: 16px;
      box-shadow: var(--glass-shadow);
      position: relative; overflow: hidden;
    }
    .gcard-hi { background: var(--glass-bg-hi); }

    /* ── live status strip ───────────────────────────────────────────── */
    .live-strip {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 14px; margin-bottom: 10px;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(30px) saturate(180%);
      border-radius: 12px; box-shadow: var(--glass-shadow);
    }
    .live-strip .ldot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--long); box-shadow: 0 0 12px var(--long);
      animation: nav-pulse 1.6s ease-in-out infinite;
    }
    .live-strip.off .ldot { background: var(--ink-3); box-shadow: none; animation: none; }
    .live-strip.off { opacity: 0.92; }
    .live-strip .ltitle { font-size: 13.5px; font-weight: 600; color: var(--ink-0); letter-spacing: -0.005em; }
    .live-strip .lsub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); margin-top: 1px; letter-spacing: 0.02em; }

    /* ── engine toggle (inside live strip) ─────────────────────────── */
    .engine-toggle {
      display: inline-flex; align-items: center; gap: 12px; margin-left: auto;
      padding: 5px 6px 5px 12px;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      border-radius: 999px; cursor: pointer; font-family: inherit;

    /* ── hero row ────────────────────────────────────────────────────── */

    .modal-backdrop {

<body>
  <div class="aurora" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
    <div class="grid"></div>
  </div>
  <div id="root"></div>

  <script crossOrigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossOrigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ===========================================
    // SERVER & API INTEGRATION
    // ===========================================

    const DEFAULT_SERVER = "";

    const getServer = () => localStorage.getItem('signal_server_url') || DEFAULT_SERVER;
    const setServer = (url) => localStorage.setItem('signal_server_url', (url||'').replace(/\/$/,''));
    const API = (path) => { const s = getServer(); return s ? s + path : path; };
    const getAuthToken = () => localStorage.getItem('signal_auth_token') || '';
    const setAuthToken = (token) => {
      if (token) localStorage.setItem('signal_auth_token', token.trim());
      else localStorage.removeItem('signal_auth_token');
    };

    async function apiFetch(path, opts = {}) {
      const headers = Object.assign({}, opts.headers || {});
      const tok = getAuthToken();
      if (tok) headers['X-Auth-Token'] = tok;
      if (opts.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
      const res = await fetch(API(path), Object.assign({ credentials: 'include' }, opts, { headers }));
      return res;
    }
    async function apiJSON(path, opts = {}) {
      const r = await apiFetch(path, opts);
      if (!r.ok) {
        let body = '';
        try { body = await r.text(); } catch(e) {}
        let detail = '';
        if (body) {
          try {
            const j = JSON.parse(body);
            detail = j.message || j.error || j.detail || j.msg || body.slice(0, 200);
          } catch(e) { detail = body.slice(0, 200); }
        }
        const err = new Error(`API ${r.status}${detail ? ' · ' + detail : ''}`);
        err.status = r.status;
        err.body = body;
        throw err;
      }
      return r.json();
    }

    // ===========================================
    // TECHNICAL ANALYSIS LIBRARY
    // ===========================================

    const TA = {
      ema: (data, period) => {
        if (!data || data.length < period) return data;
        const k = 2 / (period + 1);
        let ema = data.slice(0, period).reduce((a, b) => a + b, 0) / period;
        const result = [ema];
        for (let i = period; i < data.length; i++) {
          ema = data[i] * k + ema * (1 - k);
          result.push(ema);
        }
        return result;
      },

      rsi: (data, period = 14) => {
        if (!data || data.length < period) return data;
        const result = [];
        for (let i = period; i < data.length; i++) {
          let up = 0, down = 0;
          for (let j = i - period; j < i; j++) {
            const diff = data[j + 1] - data[j];
            if (diff > 0) up += diff;
            else down -= diff;
          }
          const rs = up / down || 0;
          result.push(100 - 100 / (1 + rs));
        }
        return result;
      },

      macd: (data) => {
        const ema12 = TA.ema(data, 12);
        const ema26 = TA.ema(data, 26);
        const macd = ema12.map((v, i) => v - (ema26[i] || 0));
        const sig = TA.ema(macd, 9);
        return { macd, signal: sig, histogram: macd.map((v, i) => v - (sig[i] || 0)) };
      },

      atr: (high, low, close, period = 14) => {
        const tr = [];
        for (let i = 1; i < close.length; i++) {
          const h = high[i], l = low[i], pc = close[i - 1];
          const t = Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc));
          tr.push(t);
        }
        if (tr.length < period) return tr;
        let atr = tr.slice(0, period).reduce((a, b) => a + b) / period;
        const result = [atr];
        for (let i = period; i < tr.length; i++) {
          atr = (atr * (period - 1) + tr[i]) / period;
          result.push(atr);
        }
        return result;
      },

      vwap: (high, low, close, volume) => {
        const vwap = [];
        let cumVol = 0, cumPV = 0;
        for (let i = 0; i < close.length; i++) {
          const tp = (high[i] + low[i] + close[i]) / 3;
          cumVol += volume[i];
          cumPV += tp * volume[i];
          vwap.push(cumVol > 0 ? cumPV / cumVol : tp);
        }
        return vwap;
      },

      supertrend: (high, low, close, period = 10, mult = 3) => {
        // Proper SuperTrend: track band state across candles (not just raw bands)
        const hl2 = high.map((h, i) => (h + low[i]) / 2);
        const atrArr = TA.atr(high, low, close, period);
        const n = close.length;
        const fUpper = new Array(n).fill(0);
        const fLower = new Array(n).fill(0);
        const trend  = new Array(n).fill(1);  // 1 = bull, -1 = bear
        for (let i = 0; i < n; i++) {
          const bU = hl2[i] + mult * (atrArr[i] || 0);
          const bL = hl2[i] - mult * (atrArr[i] || 0);
          if (i === 0) { fUpper[i] = bU; fLower[i] = bL; trend[i] = 1; continue; }
          // Upper band narrows (only decreases); resets on breakout above
          fUpper[i] = (bU < fUpper[i-1] || close[i-1] > fUpper[i-1]) ? bU : fUpper[i-1];
          // Lower band widens (only increases); resets on breakdown below
          fLower[i] = (bL > fLower[i-1] || close[i-1] < fLower[i-1]) ? bL : fLower[i-1];
          // Trend: flip on decisive closes above/below prior band
          if      (close[i] > fUpper[i-1]) trend[i] =  1;
          else if (close[i] < fLower[i-1]) trend[i] = -1;
          else                              trend[i] =  trend[i-1];
        }
        // SuperTrend line = dynamic support when bull, resistance when bear
        const line = trend.map((t, i) => t === 1 ? fLower[i] : fUpper[i]);
        return { trend, line, upper: fUpper, lower: fLower };
      },

      stoch: (high, low, close, k = 14) => {
        const result = [];
        for (let i = k; i < close.length; i++) {
          const h = Math.max(...high.slice(i - k, i + 1));
          const l = Math.min(...low.slice(i - k, i + 1));
          const stoch = ((close[i] - l) / (h - l)) * 100 || 0;
          result.push(stoch);
        }
        return result;
      }
    };

    // ===========================================
    // INSTRUMENTS
    // ===========================================

    const INST = [
      // Lot sizes per NSE F&O (latest reviewed: NIFTY 75, BANKNIFTY 30, FINNIFTY 65)
      { name: 'NIFTY',     key: 'NIFTY',     base: 'NIFTY 50',   lot: 75, gap: 50,  pfx: 'I' },
      { name: 'BANKNIFTY', key: 'BANKNIFTY', base: 'BANK NIFTY', lot: 30, gap: 100, pfx: 'B' },
      { name: 'FINNIFTY',  key: 'FINNIFTY',  base: 'FIN NIFTY',  lot: 65, gap: 50,  pfx: 'F' }
    ];

    // ===========================================
    // ANALYSIS ENGINE
    // ===========================================

    const analyze = (candles, inst, budget = 100000) => {
      if (!candles || candles.length < 20) return null;

      const closes = candles.map(c => c.close);
      const highs = candles.map(c => c.high);
      const lows = candles.map(c => c.low);
      const volumes = candles.map(c => c.volume || 0);

      // Indicators
      const ema9 = TA.ema(closes, 9);
      const ema21 = TA.ema(closes, 21);
      const rsi = TA.rsi(closes, 14);
      const atr = TA.atr(highs, lows, closes, 14);
      const vwap = TA.vwap(highs, lows, closes, volumes);
      const st = TA.supertrend(highs, lows, closes, 10, 3);
      const macd = TA.macd(closes);

      const idx = closes.length - 1;
      const c = closes[idx];
      const h = highs[idx];
      const l = lows[idx];
      const e9 = ema9[idx];
      const e21 = ema21[idx];

      let direction = null, confidence = 0, strategies = [];

      // ORB — use FIRST 6 candles (30 min of 5-min bars) as the actual opening range
      const orbWin = candles.slice(0, Math.min(6, Math.max(1, Math.floor(candles.length * 0.08))));
      const orbHigh = Math.max(...orbWin.map(x => x.high));
      const orbLow  = Math.min(...orbWin.map(x => x.low));
      let orbPts = 0;
      if      (c > orbHigh * 1.0003)  { direction = 'LONG';  orbPts = 25; }
      else if (c < orbLow  * 0.9997)  { direction = 'SHORT'; orbPts = 25; }
      else orbPts = 10;
      strategies.push({ name: 'ORB', score: orbPts, active: orbPts === 25,
        detail: orbPts === 25 ? `break ${c > orbHigh ? 'high' : 'low'} (${orbWin.length}b range)` : 'inside range' });

      // VWAP
      const vwapVal = vwap[idx];
      let vwapPts = 0;
      if (c > vwapVal * 1.01 && direction !== 'SHORT') { direction = 'LONG'; vwapPts = 20; }
      else if (c < vwapVal * 0.99 && direction !== 'LONG') { direction = 'SHORT'; vwapPts = 20; }
      else vwapPts = 5;
      strategies.push({ name: 'VWAP', score: vwapPts, active: vwapPts >= 15, detail: c > vwapVal ? '+above' : '-below' });

      // EMA+RSI
      let emaPts = 0, rsiVal = rsi[rsi.length - 1] || 50;
      if (e9 > e21 && rsiVal > 50 && direction !== 'SHORT') { direction = 'LONG'; emaPts = 20; }
      else if (e9 < e21 && rsiVal < 50 && direction !== 'LONG') { direction = 'SHORT'; emaPts = 20; }
      else emaPts = rsiVal > 60 || rsiVal < 40 ? 15 : 8;
      strategies.push({ name: 'EMA+RSI', score: emaPts, active: emaPts >= 15, detail: `RSI ${rsiVal.toFixed(0)}` });

      // SuperTrend — use proper trend state (1=bull / -1=bear)
      const stTrend = st.trend[idx]; // 1 = bullish, -1 = bearish
      let stPts = 0;
      if (stTrend === 1 && direction !== 'SHORT')  { direction = 'LONG';  stPts = 20; }
      else if (stTrend === -1 && direction !== 'LONG') { direction = 'SHORT'; stPts = 20; }
      else stPts = 8;
      strategies.push({ name: 'SuperTrend', score: stPts, active: stPts >= 15, detail: stTrend === 1 ? '▲ bull' : '▼ bear' });

      // PDH/PDL
      const pdh = Math.max(...highs.slice(Math.max(0, idx - 20)));
      const pdl = Math.min(...lows.slice(Math.max(0, idx - 20)));
      let pdhPts = 0;
      if (c > pdh * 0.999 && direction !== 'SHORT') { pdhPts = 15; }
      else if (c < pdl * 1.001 && direction !== 'LONG') { pdhPts = 15; }
      strategies.push({ name: 'PDH/PDL', score: pdhPts, active: pdhPts > 0, detail: pdhPts > 0 ? 'level break' : '—' });

      const activeCount = strategies.filter(s => s.active).length;
      confidence = strategies.reduce((a, b) => a + b.score, 0);

      if (!direction || activeCount < 2) return { direction: null, confidence: Math.min(confidence, 65), strategies, activeCount, reasons: [], indicators: { rsi: rsiVal } };

      // Entry & Risk
      const atrVal = atr[idx] || (h - l);
      const entry = direction === 'LONG' ? h : l;
      const sl = direction === 'LONG' ? entry - atrVal * 1.5 : entry + atrVal * 1.5;
      const risk = Math.abs(entry - sl);
      const target1 = direction === 'LONG' ? entry + risk * 1.5 : entry - risk * 1.5;
      const target2 = direction === 'LONG' ? entry + risk * 2.5 : entry - risk * 2.5;
      const rr = risk > 0 ? (Math.abs(target1 - entry) / risk) : 0;

      // Option
      const ivFactor = { NIFTY: 0.0034, BANKNIFTY: 0.0050, FINNIFTY: 0.0054 }[inst.key] || 0.0040;
      const optionPrice = Math.max(risk * ivFactor, 10);
      const optType = direction === 'LONG' ? 'CE' : 'PE';
      const optStrike = Math.round(entry / inst.gap) * inst.gap;

      const reasons = strategies.filter(s => s.active).map(s => s.name);

      return {
        direction,
        confidence: Math.min(confidence, 100),
        price: c,
        entry,
        sl,
        target1,
        target2,
        risk,
        reward: Math.abs(target1 - entry),
        rr,
        strategies,
        activeCount,
        reasons,
        inWindow: true,
        indicators: { rsi: rsiVal, atr: atrVal },
        option: { sym: inst.key, strike: optStrike, type: optType, price: optionPrice },
        estExit: direction === 'LONG' ? target1 : target1,
        time: new Date().toLocaleTimeString('en-IN'),
        date: new Date().toLocaleDateString('en-IN')
      };
    };

    // ===========================================
    // COMPONENT ATOMS
    // ===========================================

    function Spark({ data, color, w = 64, h = 18 }) {
      const min = Math.min(...data), max = Math.max(...data), range = (max - min) || 1;
      const pts = data.map((v, i) => `${(i/(data.length-1))*w},${h - ((v-min)/range)*h}`).join(' ');
      const last = data[data.length-1];
      const c = color || (last >= data[0] ? 'var(--long)' : 'var(--short)');
      return (
        <svg className="spark" width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
          <polyline points={pts} fill="none" stroke={c} strokeWidth={1.4} strokeLinecap="round" strokeLinejoin="round"/>
          <circle cx={w} cy={h - ((last-min)/range)*h} r={1.6} fill={c}/>
        </svg>
      );
    }

    function ConfRing({ value }) {
      const r = 18, c = 2 * Math.PI * r;
      const off = c * (1 - value/100);
      const color = value >= 70 ? 'var(--long)' : value >= 55 ? 'var(--accent)' : 'var(--ink-3)';
      return (
        <div className="conf-ring">
          <svg width="48" height="48">
            <circle cx="24" cy="24" r={r} fill="none" stroke="var(--line-1)" strokeWidth="3"/>
            <circle cx="24" cy="24" r={r} fill="none" stroke={color} strokeWidth="3"
              strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"/>
          </svg>
          <div className="v" style={{color}}>{value}</div>
        </div>
      );
    }

    function Side({ d, type }) {
      const cls = d === 'LONG' ? 'long' : 'short';
      return <span className={`chip ${cls}`}>{d === 'LONG' ? 'BUY' : 'SELL'} {type}</span>;
    }

    function Num({ value, sign = false, decimals = 2 }) {
      if (value == null) return <span className="dim">—</span>;
      const n = Number(value);
      const cls = sign ? (n >= 0 ? 'pos' : 'neg') : 'num';
      const s = sign && n >= 0 ? '+' : '';
      return <span className={cls}>{s}{n.toLocaleString('en-IN', {minimumFractionDigits: decimals, maximumFractionDigits: decimals})}</span>;
    }

    function INR({ value, sign = false }) {
      if (value == null) return <span className="dim">—</span>;
      const n = Number(value);
      const cls = sign ? (n >= 0 ? 'pos' : 'neg') : 'num';
      const s = sign && n >= 0 ? '+' : n < 0 ? '−' : '';
      return <span className={cls}>{s}₹{Math.abs(n).toLocaleString('en-IN')}</span>;
    }

    // Format a YYYY-MM-DD or ISO datetime into "27th May 2026" style.
    // Returns "" for null/empty.  Used in signal rows + Replay panel header
    // so users can read the date at a glance and verify against external charts.
    function fmtPrettyDate(input) {
      if (!input) return '';
      const d = typeof input === 'string' ? new Date(input.length === 10 ? input + 'T00:00:00' : input) : input;
      if (isNaN(d.getTime())) return String(input);
      const day = d.getDate();
      const month = d.toLocaleDateString('en-IN', { month: 'long' });
      const year = d.getFullYear();
      const suffix = (day % 10 === 1 && day !== 11) ? 'st'
                   : (day % 10 === 2 && day !== 12) ? 'nd'
                   : (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
      return `${day}${suffix} ${month} ${year}`;
    }

    // Short variant for compact rows: "27 May" — no year, no suffix.
    function fmtShortDate(input) {
      if (!input) return '';
      const d = typeof input === 'string' ? new Date(input.length === 10 ? input + 'T00:00:00' : input) : input;
      if (isNaN(d.getTime())) return String(input);
      const day = d.getDate();
      const month = d.toLocaleDateString('en-IN', { month: 'short' });
      return `${day} ${month}`;
    }

    function MarketClock() {
      const [now, setNow] = useState(new Date());
      useEffect(() => { const id = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(id); }, []);
      // getTime() is always UTC-based; just shift to IST (UTC+5:30)
      const ist = new Date(now.getTime() + 5.5 * 3600 * 1000);
      const hh = String(ist.getUTCHours()).padStart(2,'0');
      const mm = String(ist.getUTCMinutes()).padStart(2,'0');
      const ss = String(ist.getUTCSeconds()).padStart(2,'0');
      const minsOfDay = ist.getUTCHours() * 60 + ist.getUTCMinutes();
      const dow = ist.getUTCDay(); // 0=Sun 6=Sat
      const OPEN = 9*60 + 15, CLOSE = 15*60 + 30;
      const isWeekday = dow >= 1 && dow <= 5;
      const open = isWeekday && minsOfDay >= OPEN && minsOfDay < CLOSE;
      const preOpen = isWeekday && minsOfDay < OPEN;
      let statusTxt, statusColor, tail;
      if (open) {
        const mins = CLOSE - minsOfDay;
        statusTxt = 'NSE OPEN'; statusColor = 'var(--long)';
        tail = mins < 60 ? `${mins}m to close` : `${Math.floor(mins/60)}h ${mins%60}m to close`;
      } else if (preOpen) {
        const mins = OPEN - minsOfDay;
        statusTxt = 'PRE-OPEN'; statusColor = 'var(--warn)';
        tail = mins < 60 ? `opens in ${mins}m` : `opens in ${Math.floor(mins/60)}h ${mins%60}m`;
      } else {
        statusTxt = 'NSE CLOSED'; statusColor = 'var(--ink-3)';
        tail = isWeekday ? (minsOfDay >= CLOSE ? 'closed · opens 09:15' : '') : 'weekend · opens Mon 09:15';
      }
      return (
        <div className="market-status">
          <span className="pulse" style={{background: statusColor}} />
          <span style={{color: statusColor, fontWeight:600}}>{statusTxt}</span>
          <span className="dim">·</span>
          <span>{hh}:{mm}:{ss} IST</span>
          {tail && <><span className="dim">·</span><span>{tail}</span></>}
        </div>
      );
    }

    function StratBars({ items }) {
      return (
        <div style={{display:'flex', flexDirection:'column', gap:8}}>
          {items.map(s => (
            <div key={s.name} style={{display:'flex', alignItems:'center', gap:10, fontSize:12}}>
              <span style={{width:6, height:6, borderRadius:99,
                background: s.active ? (s.dir === 'LONG' ? 'var(--long)' : s.dir === 'SHORT' ? 'var(--short)' : 'var(--ink-3)') : 'var(--ink-3)',
                boxShadow: s.active ? `0 0 6px ${s.dir==='LONG'?'var(--long)':'var(--short)'}` : 'none'}}/>
              <span style={{width:90, color: s.active ? 'var(--ink-0)' : 'var(--ink-2)', fontWeight: s.active?500:400}}>{s.name}</span>
              <span className="dim" style={{width:60, fontSize:11, fontFamily:'JetBrains Mono, monospace'}}>{s.detail}</span>
              <span style={{flex:1}}/>
              <div style={{width:80, height:4, background:'var(--bg-2)', borderRadius:2, overflow:'hidden'}}>
                <div style={{width: `${(s.score/25)*100}%`, height:'100%',
                  background: s.active ? 'var(--accent)' : 'var(--line-1)'}}/>
              </div>
              <span className="num" style={{width:24, textAlign:'right', fontSize:11, color: s.active ? 'var(--accent)':'var(--ink-3)'}}>+{s.score}</span>
            </div>
          ))}
        </div>
      );
    }

    function PriceChart({ data, sig }) {
      const w = 700, h = 240, pad = 24;
      const min = Math.min(...data) - 8, max = Math.max(...data) + 8;
      const range = max - min || 1;
      const xStep = (w - pad*2) / (data.length - 1);
      const yOf = v => h - pad - ((v - min)/range) * (h - pad*2);
      const linePts = data.map((v, i) => `${pad + i*xStep},${yOf(v)}`).join(' ');
      const areaPts = `${pad},${h-pad} ${linePts} ${pad + (data.length-1)*xStep},${h-pad}`;
      return (
        <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} style={{display:'block'}}>
          <defs>
            <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.22"/>
              <stop offset="100%" stopColor="var(--accent)" stopOpacity="0"/>
            </linearGradient>
          </defs>
          {[0.25, 0.5, 0.75].map((p, i) => (
            <line key={i} x1={pad} y1={pad + (h - pad*2)*p} x2={w - pad} y2={pad + (h - pad*2)*p}
              stroke="var(--line-0)" strokeDasharray="2 4"/>
          ))}
          {sig && sig.entry && <line x1={pad} y1={yOf(sig.entry)} x2={w-pad} y2={yOf(sig.entry)} stroke="var(--accent)" strokeDasharray="3 3" opacity="0.55"/>}
          <polygon points={areaPts} fill="url(#ga)"/>
          <polyline points={linePts} fill="none" stroke="var(--accent)" strokeWidth="1.6"/>
          {data.map((v, i) => (
            <circle key={i} cx={pad + i*xStep} cy={yOf(v)} r="1.5" fill="var(--accent)"/>
          ))}
        </svg>
      );
    }

    // ===========================================
    // SCREEN COMPONENTS
    // ===========================================

    function SignalsTab({ sel, setSel, signals = [], candles = {}, live = {}, on }) {
      const [selectedSig, setSelectedSig] = React.useState(null);

      const sigArr = Array.isArray(signals) ? signals : [];
      const candObj = (candles && typeof candles === 'object' && !Array.isArray(candles)) ? candles : {};
      const liveObj = (live && typeof live === 'object' && !Array.isArray(live)) ? live : {};
      const inst = INST[sel];
      const rawCandles = candObj[inst.name];
      const instCandles = Array.isArray(rawCandles) ? rawCandles : [];
      const instSignals = sigArr.filter(s => s && s.inst === inst.name);
      // selectedSig > most-recent signal > null
      const displaySig = selectedSig || instSignals[0] || null;
      const sparkData = instCandles.length
        ? instCandles.slice(-80).map(c => Number(c.close ?? c[4] ?? c)).filter(n => n > 0)
        : null;

      // Clear selection when switching instruments
      React.useEffect(() => { setSelectedSig(null); }, [sel]);

      // Helper: format price
      const fmt = v => v != null ? Number(v).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}) : '—';

      return (
        <div style={{display:'flex', flexDirection:'column'}}>
          {/* ── instrument cards ── */}
          <div className="inst-row">
            {INST.map((i, idx) => {
              const l = liveObj[i.name];
              const rawC = candObj[i.name];
              const cnds = Array.isArray(rawC) ? rawC : [];
              const instSigs = sigArr.filter(s => s && s.inst === i.name);
              return (
                <div key={i.name} className={`inst-card ${idx===sel?'on':''}`} onClick={()=>setSel(idx)}>
                  <div style={{display:'flex', alignItems:'center', justifyContent:'space-between'}}>
                    <span className="name">{i.name}</span>
                    <span className="dim mono" style={{fontSize:10, color: instSigs.some(s=>s.status==='LIVE')?'var(--long)':instSigs.some(s=>s.status==='READY')?'var(--accent)':instSigs.length?'var(--ink-2)':'var(--ink-3)'}}>
                      {instSigs.some(s=>s.status==='LIVE') ? `● ${instSigs.filter(s=>s.status==='LIVE').length} LIVE` : instSigs.some(s=>s.status==='READY') ? `◉ READY` : instSigs.length ? `◌ ${instSigs.length} watch` : `lot ${i.lot}`}
                    </span>
                  </div>
                  <div className="price">
                    {l ? Number(l.ltp).toLocaleString('en-IN', {minimumFractionDigits:2}) : '—'}
                  </div>
                  <div className="delta">
                    {l
                      ? <><span className={l.chg>=0?'pos':'neg'}>{l.chg>=0?'+':''}{Number(l.chg).toFixed(2)}</span>
                          <span className={l.pct>=0?'pos':'neg'} style={{marginLeft:8}}>{l.pct>=0?'+':''}{Number(l.pct).toFixed(2)}%</span></>
                      : <span className="dim">no live data yet</span>}
                    <span className="dim" style={{marginLeft:10, fontSize:11}}>· {cnds.length} candles</span>
                  </div>
                </div>
              );
            })}
          </div>

          <div style={{padding:'8px var(--pad-x) 16px', display:'grid', gridTemplateColumns:'1.55fr 1fr', gap:16}}>
            {/* ── LEFT: chart ── */}
            <div style={{display:'flex', flexDirection:'column', gap:12}}>
              <div className="panel">
                <div className="panel-head">
                  <h3>{inst.name} · price chart</h3>
                  <span style={{flex:1}}/>
                  <span className="muted mono" style={{fontSize:11}}>
                    {sparkData ? `${instCandles.length} bars · last ${sparkData[sparkData.length-1]?.toFixed(2) ?? '?'}` : 'no data yet'}
                  </span>
                </div>
                <div style={{padding:14, minHeight:160}}>
                  {sparkData && sparkData.length > 1 ? (
                    <Spark data={sparkData} w={700} h={160}/>
                  ) : (
                    <div style={{padding:'50px 0', textAlign:'center', color:'var(--ink-3)', fontSize:12.5}}>
                      {on ? 'Waiting for candles…' : 'Press ▶ Start to load historical candles.'}
                    </div>
                  )}
                </div>
              </div>

              {/* ── All-instrument signal feed ── */}
              <div className="panel">
                <div className="panel-head">
                  <h3>All signals · all instruments</h3>
                  <span style={{flex:1}}/>
                  <span className="muted mono" style={{fontSize:11}}>{sigArr.length} total</span>
                </div>
                <div style={{maxHeight:260, overflowY:'auto'}}>
                  {sigArr.length === 0 ? (
                    <div style={{padding:'20px 14px', color:'var(--ink-3)', fontSize:12}}>
                      {on ? 'Scanning for confluence…' : 'No signals yet — press ▶ Start.'}
                    </div>
                  ) : sigArr.slice(0, 50).map((s, i) => {
                    const isSelected = displaySig && s.id === displaySig.id;
                    const shortDate = s.date ? fmtShortDate(s.date) : '';
                    return (
                      <div key={s.id || i}
                        onClick={() => setSelectedSig(s)}
                        style={{display:'flex', alignItems:'center', gap:10, padding:'9px 14px',
                          borderBottom:'1px solid var(--line-0)', fontSize:12, cursor:'pointer',
                          background: isSelected ? 'var(--accent-faint)' : 'transparent',
                          borderLeft: isSelected ? '2px solid var(--accent)' : '2px solid transparent',
                          transition:'background 120ms'}}>
                        {/* Stacked date+time so the user can tell at a glance WHICH DAY
                            this signal fired — critical when reviewing 10 days of backtest results. */}
                        <span className="mono" style={{minWidth:82, fontSize:10, flexShrink:0, lineHeight:1.2, display:'flex', flexDirection:'column'}}>
                          {shortDate
                            ? <span style={{color:'var(--ink-1)', fontWeight:600}}>{shortDate}</span>
                            : <span style={{color:'var(--ink-3)'}}>—</span>}
                          <span style={{color:'var(--ink-3)'}}>{s.t}</span>
                        </span>
                        <span className="dim mono" style={{minWidth:68, fontSize:10, color:'var(--ink-2)', flexShrink:0}}>{s.inst}</span>
                        <span className={`chip ${s.dir==='LONG'?'long':'short'}`}>{s.dir} {s.type||''}</span>
                        <span className="num dim" style={{fontSize:11, flexShrink:0}}>{s.strike}</span>
                        {s.spotAtSignal != null && (
                          <span className="dim mono" style={{fontSize:10, color:'var(--ink-3)'}}>

                          </span>
                        )}
                        <span style={{flex:1}}/>
                        {s.rr != null && <span className="dim mono" style={{fontSize:10}}>R:R {Number(s.rr).toFixed(1)}</span>}
                        <span className="muted" style={{fontSize:11, width:30, textAlign:'right'}}>{s.confidence}%</span>
                        <span className={`chip ${
                          s.status==='LIVE'?'long':s.status==='READY'?'accent':
                          s.status==='WATCH'?'ghost':s.status==='OPEN'?'accent':
                          s.status==='WIN'?'long':s.status==='LOSS'?'short':'ghost'}`}
                          style={{fontSize:9, opacity: s.status==='WATCH' ? 0.7 : 1}}>{s.status}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* ── RIGHT: signal detail ── */}
            <div style={{display:'flex', flexDirection:'column', gap:12}}>
              <div className="panel" style={{borderColor: displaySig ? (displaySig.dir==='LONG'?'var(--long)':'var(--short)') : 'var(--line-0)'}}>
                <div className="panel-head">
                  <h3 style={{color: displaySig ? (displaySig.dir==='LONG'?'var(--long)':'var(--short)') : 'var(--ink-2)'}}>
                    {displaySig ? `● ${displaySig.status || 'Signal'}` : 'No signal selected'}
                  </h3>
                  <span style={{flex:1}}/>
                  {displaySig && selectedSig && (
                    <button type="button" className="btn ghost" style={{fontSize:10, padding:'2px 8px'}}
                      onClick={() => setSelectedSig(null)}>← latest</button>
                  )}
                  {/* Full pretty date + time so the user can verify against any external chart.
                      Format example: "9th May 2026 · Fri · 10:50 am" */}
                  <span className="mono" style={{fontSize:11, marginLeft:6, color:'var(--ink-1)',
                                                  display:'flex', alignItems:'center', gap:6}}>
                    {displaySig
                      ? <>
                          {displaySig.date && <span style={{fontWeight:600}}>{fmtPrettyDate(displaySig.date)}</span>}
                          {displaySig.weekday && <span style={{color:'var(--ink-3)'}}>· {displaySig.weekday}</span>}
                          <span style={{color:'var(--ink-2)'}}>· {displaySig.t || '—'}</span>
                          {displaySig.iso_ts && (
                            <button type="button" title="Copy full timestamp (paste into your broker chart's Goto-date)"
                              onClick={(e) => { e.stopPropagation();

                                    <div style={{color:'var(--ink-2)', fontFamily:'var(--mono)'}}>

                              {/* OI velocity — building/unwinding strikes */}
                              {oiAvail && (() => {
                                const bldCe = ca.building_ce || [];
                                const bldPe = ca.building_pe || [];
                                const unwCe = ca.unwinding_ce || [];
                                const unwPe = ca.unwinding_pe || [];
                                const volCe = ca.vol_accel_ce || [];
                                const volPe = ca.vol_accel_pe || [];
                                const hasOiRows = bldCe.length || bldPe.length || unwCe.length || unwPe.length || volCe.length || volPe.length;

                                        {unwPe.map(x => <Strike key={x.strike+'PE_u'} s={`${x.strike}PE`} d={x.oi_delta} color='var(--ink-3)'/>)}

                                        {volCe.map(x => <Strike key={x.strike+'VC'} s={`${x.strike}CE`} d={x.vol_delta} color='var(--warn)'/>)}
                                        {volPe.map(x => <Strike key={x.strike+'VP'} s={`${x.strike}PE`} d={x.vol_delta} color='var(--warn)'/>)}
                                      </div>
                                    )}
                                  </div>
                                );
                              })()}

                        {displaySig.aiVerdict && (

                            background: displaySig.aiVerdict==='TAKE' ? 'var(--long-dim)' : displaySig.aiVerdict==='SKIP' ? 'var(--short-dim)' : 'var(--warn-dim)',

                            <div style={{fontWeight:700, fontSize:10, textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:3}}>
                              🤖 AI · {displaySig.aiVerdict} {displaySig.aiPosPct ? `${displaySig.aiPosPct}%` : ''}
