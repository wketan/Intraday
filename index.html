<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Intraday Engine · Live</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800&family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ═══ Proveway Hub — design tokens ═══ */
:root{
  --font-display:'Playfair Display','Iowan Old Style',Georgia,serif;
  --font-italic:'Instrument Serif','Playfair Display',Georgia,serif;
  --font-body:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --font-body-alt:'DM Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-in-out:cubic-bezier(.22,.61,.36,1);
  --r-sm:3px;--r-md:4px;--r-lg:16px;--r-xl:22px;
}

/* ═══ Theme tokens ═══ */
:root,
html[data-theme="dark"]{
  --bg-base:#050510;
  --ink-1:rgba(255,255,255,0.92);
  --ink-2:rgba(255,255,255,0.60);
  --ink-3:rgba(255,255,255,0.45);
  --ink-4:rgba(255,255,255,0.30);
  --ink-5:rgba(255,255,255,0.18);
  --line-1:rgba(255,255,255,0.10);
  --line-2:rgba(255,255,255,0.07);
  --line-3:rgba(255,255,255,0.04);
  --tile-fill-1:rgba(255,255,255,0.06);
  --tile-fill-2:rgba(255,255,255,0.018);
  --tile-border:rgba(255,255,255,0.09);
  --tile-border-hi:rgba(167,139,250,0.22);
  --tile-shadow:0 8px 32px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.06);
  --tile-shadow-hi:0 14px 42px rgba(0,0,0,0.5),0 0 40px rgba(167,139,250,0.08),inset 0 1px 0 rgba(255,255,255,0.10);
  --status-fill-1:rgba(255,255,255,0.07);
  --status-fill-2:rgba(255,255,255,0.025);
  --hover-bg:rgba(255,255,255,0.025);
  --row-live-bg:rgba(96,165,250,0.04);
  --grid-stroke:rgba(255,255,255,0.4);
  --grid-opacity:0.04;
  --aurora-opacity:1;
  --noise-opacity:0.06;
  --logo-text:#0b0b16;
  --avatar-text:#1c1a17;
  --btn-text:#0b0b16;
  --win:#86efac;  --win-soft:rgba(134,239,172,0.12);  --win-border:rgba(134,239,172,0.20);
  --loss:#fca5a5; --loss-soft:rgba(248,113,113,0.12); --loss-border:rgba(248,113,113,0.24);
  --warn:#fbbf24; --warn-soft:rgba(251,191,36,0.12);  --warn-border:rgba(251,191,36,0.22);
  --info:#60a5fa; --info-soft:rgba(96,165,250,0.12);  --info-border:rgba(96,165,250,0.20);
  --accent:#a78bfa; --accent-soft:rgba(167,139,250,0.14);
  --pink:#f0abfc;
  --gradient-hero:linear-gradient(135deg,#60a5fa 0%,#22d3ee 35%,#a78bfa 70%,#f0abfc 100%);
  --gradient-pnl-loss:linear-gradient(135deg,#fca5a5,#fbbf24,#f0abfc);
}
html[data-theme="light"]{
  --bg-base:#faf8f3;
  --ink-1:#1c1a17;
  --ink-2:#4a4640;
  --ink-3:#75716a;
  --ink-4:#a8a49d;
  --ink-5:#d6d1c6;
  --line-1:rgba(28,26,23,0.13);
  --line-2:rgba(28,26,23,0.08);
  --line-3:rgba(28,26,23,0.04);
  --tile-fill-1:rgba(255,255,255,0.85);
  --tile-fill-2:rgba(255,255,255,0.55);
  --tile-border:rgba(28,26,23,0.10);
  --tile-border-hi:rgba(122,90,238,0.40);
  --tile-shadow:0 1px 2px rgba(28,26,23,0.04),0 4px 16px rgba(28,26,23,0.06),0 1px 0 rgba(255,255,255,0.7) inset;
  --tile-shadow-hi:0 12px 30px rgba(28,26,23,0.12),0 0 24px rgba(122,90,238,0.10);
  --status-fill-1:rgba(255,255,255,0.85);
  --status-fill-2:rgba(255,255,255,0.55);
  --hover-bg:rgba(28,26,23,0.035);
  --row-live-bg:rgba(58,80,104,0.05);
  --grid-stroke:rgba(28,26,23,0.45);
  --grid-opacity:0.05;
  --aurora-opacity:0.45;
  --noise-opacity:0.03;
  --logo-text:#fff;
  --avatar-text:#fff;
  --btn-text:#fff;
  --win:#2f6e4a;  --win-soft:rgba(61,107,82,0.10);   --win-border:rgba(61,107,82,0.30);
  --loss:#b03326; --loss-soft:rgba(192,57,43,0.08);   --loss-border:rgba(192,57,43,0.30);
  --warn:#9a6a14; --warn-soft:rgba(176,124,26,0.10);  --warn-border:rgba(176,124,26,0.30);
  --info:#355c80; --info-soft:rgba(58,80,104,0.08);   --info-border:rgba(58,80,104,0.30);
  --accent:#6c4ddc; --accent-soft:rgba(108,77,220,0.10);
  --pink:#b3429f;
  --gradient-hero:linear-gradient(135deg,#355c80 0%,#0e7c8f 35%,#6c4ddc 70%,#b3429f 100%);
  --gradient-pnl-loss:linear-gradient(135deg,#b03326,#9a6a14,#b3429f);
}

html{background:var(--bg-base)!important;transition:background 0.4s var(--ease-out);}
body{margin:0;padding:0;background:var(--bg-base)!important;overflow-x:hidden;
  font-family:var(--font-body);color:var(--ink-1);min-height:100vh;
  font-feature-settings:'ss01','cv11';-webkit-font-smoothing:antialiased;
  transition:background 0.4s var(--ease-out);}
*{box-sizing:border-box;}
button{font-family:inherit;}

/* ── Aurora background ── */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  opacity:var(--aurora-opacity);transition:opacity 0.5s var(--ease-out);}
.aurora .orb{position:absolute;border-radius:999px;filter:blur(110px);will-change:transform;}
.aurora .a{width:620px;height:620px;top:-180px;left:-120px;
  background:radial-gradient(circle,rgba(96,165,250,0.34),transparent 60%);
  animation:orbDriftA 28s ease-in-out infinite alternate;}
.aurora .b{width:560px;height:560px;top:18%;right:-200px;
  background:radial-gradient(circle,rgba(167,139,250,0.30),transparent 60%);
  animation:orbDriftB 34s ease-in-out infinite alternate;}
.aurora .c{width:440px;height:440px;bottom:-180px;left:30%;
  background:radial-gradient(circle,rgba(244,114,182,0.22),transparent 60%);
  animation:orbDriftC 40s ease-in-out infinite alternate;}
.aurora .d{width:380px;height:380px;top:55%;left:8%;
  background:radial-gradient(circle,rgba(34,211,238,0.18),transparent 60%);
  animation:orbDriftD 32s ease-in-out infinite alternate;}
@keyframes orbDriftA{0%{transform:translate(0,0) scale(1);}100%{transform:translate(80px,60px) scale(1.08);}}
@keyframes orbDriftB{0%{transform:translate(0,0) scale(1);}100%{transform:translate(-90px,40px) scale(0.92);}}
@keyframes orbDriftC{0%{transform:translate(0,0) scale(1);}100%{transform:translate(60px,-80px) scale(1.12);}}
@keyframes orbDriftD{0%{transform:translate(0,0) scale(1);}100%{transform:translate(-50px,-30px) scale(1.05);}}
html[data-theme="light"] .aurora .a{background:radial-gradient(circle,rgba(58,80,104,0.30),transparent 60%);}
html[data-theme="light"] .aurora .b{background:radial-gradient(circle,rgba(108,77,220,0.22),transparent 60%);}
html[data-theme="light"] .aurora .c{background:radial-gradient(circle,rgba(201,95,46,0.18),transparent 60%);}
html[data-theme="light"] .aurora .d{background:radial-gradient(circle,rgba(14,124,143,0.18),transparent 60%);}
.aurora .grid{position:absolute;inset:0;opacity:var(--grid-opacity);
  background-image:linear-gradient(var(--grid-stroke) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-stroke) 1px,transparent 1px);
  background-size:80px 80px;}

/* ── Page wrap ── */
.page{position:relative;z-index:2;max-width:1480px;margin:0 auto;padding:14px 28px 60px;}

/* ── Status bar ── */
.status{position:sticky;top:14px;z-index:50;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;row-gap:8px;
  padding:10px 14px 10px 12px;margin-bottom:24px;
  background:linear-gradient(140deg,var(--status-fill-1),var(--status-fill-2));
  border:1px solid var(--tile-border);
  backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  border-radius:var(--r-lg);box-shadow:var(--tile-shadow);font-size:11px;}
.status > *{flex-shrink:0;}
.status .spacer{flex:1 1 auto;min-width:0;}
.status .pings{display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:6px;min-width:0;}
.status .actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.status .brand{display:inline-flex;align-items:center;gap:10px;padding-right:14px;border-right:1px solid var(--line-2);}
.status .logo{width:30px;height:30px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,#60a5fa,#a78bfa 60%,#f0abfc);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--logo-text);font-family:var(--font-display);font-weight:800;font-size:13px;font-style:italic;
  box-shadow:0 4px 14px rgba(96,165,250,0.4),inset 0 1px 0 rgba(255,255,255,0.35);letter-spacing:-0.04em;}
.status .brand-block{display:flex;flex-direction:column;line-height:1.2;}
.status .brand-name{font-family:var(--font-display);font-weight:600;font-style:italic;
  font-size:14px;letter-spacing:-0.01em;color:var(--ink-1);white-space:nowrap;}
.status .brand-name em{font-family:var(--font-italic);color:var(--accent);font-style:italic;}
.status .brand-tag{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-3);
  letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap;}
.status .divide{width:1px;height:18px;background:var(--line-2);flex-shrink:0;}
.status .clock{font-family:var(--font-mono);font-size:12px;letter-spacing:0.04em;color:var(--ink-2);white-space:nowrap;}
.status .clock b{color:var(--ink-1);font-weight:500;}
.status .clock .ms{color:var(--ink-4);}
.status .session{font-family:var(--font-mono);font-size:10px;letter-spacing:0.05em;
  color:var(--ink-3);text-transform:uppercase;white-space:nowrap;}
.status .session b{color:var(--ink-1);font-weight:500;}

.btn{appearance:none;border:1px solid var(--tile-border);
  background:var(--status-fill-1);color:var(--ink-2);
  padding:6px 12px;border-radius:8px;font-size:10.5px;
  letter-spacing:0.05em;text-transform:uppercase;font-weight:500;cursor:pointer;
  white-space:nowrap;transition:all 0.2s var(--ease-out);}
.btn:hover{border-color:var(--ink-3);color:var(--ink-1);background:var(--hover-bg);}
.btn.danger{color:var(--loss);border-color:var(--loss-border);background:var(--loss-soft);}
.btn.danger:hover{background:var(--loss-soft);border-color:var(--loss);}
.btn.primary{color:var(--btn-text);border:none;
  background:linear-gradient(135deg,#a78bfa,#60a5fa);font-weight:600;}
.btn-icon{padding:6px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;}
.btn-icon svg{width:14px;height:14px;}
.btn[disabled]{opacity:0.45;cursor:not-allowed;}

.avatar{width:30px;height:30px;border-radius:999px;flex-shrink:0;
  appearance:none;border:0;cursor:pointer;
  background:linear-gradient(135deg,#fbbf24,#f87171);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--avatar-text);font-weight:700;font-size:12px;font-family:var(--font-body-alt);
  box-shadow:0 2px 8px rgba(248,113,113,0.25),inset 0 1px 0 rgba(255,255,255,0.25);
  transition:transform 0.2s var(--ease-out),box-shadow 0.2s var(--ease-out);}
.avatar:hover{transform:scale(1.06);
  box-shadow:0 4px 14px rgba(248,113,113,0.4),inset 0 1px 0 rgba(255,255,255,0.3);}

/* ── Ping ── */
.ping{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.07em;color:var(--win);
  display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 9px;
  background:var(--win-soft);border:1px solid var(--win-border);
  border-radius:999px;text-transform:uppercase;font-weight:500;white-space:nowrap;flex-shrink:0;}
.ping .d{width:6px;height:6px;border-radius:999px;background:var(--win);
  box-shadow:0 0 6px var(--win);animation:pulse 2.8s ease-in-out infinite;}
.ping b{color:var(--ink-1);font-weight:600;letter-spacing:0.02em;}
.ping.warn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-border);}
.ping.warn .d{background:var(--warn);box-shadow:0 0 6px var(--warn);animation-name:pulseWarn;}
.ping.err{color:var(--loss);background:var(--loss-soft);border-color:var(--loss-border);}
.ping.err .d{background:var(--loss);box-shadow:0 0 6px var(--loss);animation-name:pulseErr;}
.ping.info{color:var(--info);background:var(--info-soft);border-color:var(--info-border);}
.ping.info .d{background:var(--info);box-shadow:0 0 6px var(--info);animation-name:pulseInfo;}
.ping.muted{color:var(--ink-3);background:var(--tile-fill-1);border-color:var(--tile-border);}
.ping.muted .d{background:var(--ink-3);box-shadow:none;animation:none;}
@keyframes pulse{0%,100%{box-shadow:0 0 6px var(--win),0 0 0 0 var(--win-soft);}
  50%{box-shadow:0 0 9px var(--win),0 0 0 6px transparent;}}
@keyframes pulseWarn{0%,100%{box-shadow:0 0 6px var(--warn),0 0 0 0 var(--warn-soft);}
  50%{box-shadow:0 0 9px var(--warn),0 0 0 6px transparent;}}
@keyframes pulseErr{0%,100%{box-shadow:0 0 6px var(--loss),0 0 0 0 var(--loss-soft);}
  50%{box-shadow:0 0 10px var(--loss),0 0 0 7px transparent;}}
@keyframes pulseInfo{0%,100%{box-shadow:0 0 6px var(--info),0 0 0 0 var(--info-soft);}
  50%{box-shadow:0 0 9px var(--info),0 0 0 6px transparent;}}

/* ── Masthead ── */
.mast{display:flex;justify-content:space-between;align-items:flex-end;
  gap:28px;padding:8px 4px 20px;border-bottom:1px solid var(--line-1);margin-bottom:22px;}
.mast .left{flex:1;min-width:0;}
.mast .kick{font-family:var(--font-body);font-size:10px;font-weight:600;
  letter-spacing:0.22em;text-transform:uppercase;color:var(--info);
  display:inline-flex;align-items:center;gap:12px;margin-bottom:14px;
  white-space:nowrap;flex-wrap:wrap;}
.mast .kick::before{content:'';width:24px;height:2px;background:var(--info);flex-shrink:0;}
.mast .kick > span{white-space:nowrap;}
.mast .kick .sep{color:var(--ink-5);}
.mast h1{font-family:var(--font-display);font-weight:700;font-size:44px;
  letter-spacing:-0.03em;line-height:1.05;margin:0 0 10px;color:var(--ink-1);text-wrap:balance;}
.mast h1 em{font-family:var(--font-italic);font-style:italic;font-weight:400;
  background:var(--gradient-hero);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  padding-right:6px;animation:hueShift 9s ease-in-out infinite;}
.mast h1 em.loss{background:var(--gradient-pnl-loss);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;}
@keyframes hueShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.mast .lede{color:var(--ink-2);font-size:14px;max-width:620px;line-height:1.55;text-wrap:pretty;}
.mast .lede em{font-family:var(--font-italic);font-style:italic;color:var(--pink);}
.mast .lede b{color:var(--ink-1);font-weight:600;}
.mast .right{text-align:right;font-family:var(--font-mono);font-size:10.5px;
  color:var(--ink-3);letter-spacing:0.06em;line-height:1.9;flex-shrink:0;}
.mast .right .label{color:var(--ink-3);text-transform:uppercase;
  letter-spacing:0.12em;font-size:9.5px;white-space:nowrap;display:block;}
.mast .right .big{font-family:var(--font-display);font-weight:600;font-size:20px;font-style:italic;
  color:var(--ink-1);letter-spacing:-0.01em;line-height:1.1;display:block;margin-top:4px;white-space:nowrap;}
.mast .right .big em{font-family:var(--font-italic);color:var(--pink);
  margin-left:6px;font-style:italic;font-size:18px;font-weight:400;}
.mast .right .row{display:flex;justify-content:flex-end;gap:22px;margin-top:14px;}
.mast .right .row > div{text-align:right;}
.mast .right .val{color:var(--ink-1);font-size:13px;font-weight:500;
  display:block;margin-top:2px;white-space:nowrap;}
.mast .right .val .sub{color:var(--ink-4);font-size:11px;font-weight:400;margin-left:4px;}

/* ── Positions ── */
.positions{margin-bottom:12px;}
.positions-head{display:flex;align-items:baseline;gap:14px;margin-bottom:10px;padding:0 4px;}
.positions-head .title{font-family:var(--font-body);font-size:10px;font-weight:600;
  letter-spacing:0.22em;text-transform:uppercase;color:var(--ink-3);
  display:inline-flex;align-items:center;gap:10px;}
.positions-head .title::before{content:'';width:24px;height:2px;background:var(--accent);}
.positions-head .count{font-family:var(--font-mono);font-size:10px;
  color:var(--ink-1);background:var(--accent-soft);
  padding:2px 8px;border-radius:4px;letter-spacing:0.06em;font-weight:600;}
.positions-head .meta{font-family:var(--font-mono);font-size:10px;
  color:var(--ink-3);letter-spacing:0.05em;text-transform:uppercase;margin-left:auto;}
.positions-head .meta b{color:var(--ink-1);font-weight:500;}

.positions-grid{display:grid;gap:14px;}
.positions-grid[data-count="1"]{grid-template-columns:1fr;}
.positions-grid[data-count="1"] .pos-card{max-width:680px;}
.positions-grid[data-count="2"]{grid-template-columns:repeat(2,1fr);}
.positions-grid[data-count="3"]{grid-template-columns:repeat(3,1fr);}

.pos-card{position:relative;overflow:hidden;
  background:linear-gradient(140deg,var(--tile-fill-1),var(--tile-fill-2));
  border:1px solid var(--tile-border);
  backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-radius:var(--r-xl);padding:14px 18px;box-shadow:var(--tile-shadow);
  transition:border-color 0.4s var(--ease-out),box-shadow 0.4s var(--ease-out),transform 0.5s var(--ease-out);
  display:flex;flex-direction:column;min-width:0;min-height:230px;
  --mx:50%;--my:50%;--tx:0deg;--ty:0deg;
  transform-style:preserve-3d;will-change:transform;}
.pos-card::before{content:'';position:absolute;left:6%;right:6%;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.22) 35%,rgba(255,255,255,0.35) 50%,rgba(255,255,255,0.22) 65%,transparent);
  pointer-events:none;}
html[data-theme="light"] .pos-card::before{
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.65) 35%,rgba(255,255,255,0.85) 50%,rgba(255,255,255,0.65) 65%,transparent);}
.pos-card::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle 360px at var(--mx) var(--my),rgba(167,139,250,0.12),transparent 55%);
  opacity:0;transition:opacity 0.5s var(--ease-out);border-radius:inherit;}
html[data-theme="light"] .pos-card::after{
  background:radial-gradient(circle 360px at var(--mx) var(--my),rgba(108,77,220,0.10),transparent 55%);}
.pos-card:hover::after{opacity:1;}
.pos-card.warn::after{background:radial-gradient(circle 360px at var(--mx) var(--my),rgba(251,191,36,0.14),transparent 55%);}
.pos-card:hover{border-color:var(--tile-border-hi);box-shadow:var(--tile-shadow-hi);
  transform:perspective(1200px) rotateX(var(--ty)) rotateY(var(--tx));}
.pos-card.win .edge{background:linear-gradient(90deg,transparent,var(--win),var(--info),transparent);}
.pos-card.warn .edge{background:linear-gradient(90deg,transparent,var(--warn),var(--loss),transparent);}
.pos-card .edge{position:absolute;left:0;right:0;bottom:0;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--win),var(--info),transparent);
  background-size:200% 100%;opacity:0.6;animation:edgeDrift 8s ease-in-out infinite;}

.tlm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin-top:2px;}
.tlm-grid > div{min-width:0;}
.tlm-k{font-family:var(--font-mono);font-size:8.5px;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap;display:block;}
.tlm-v{font-family:var(--font-mono);font-size:13px;color:var(--ink-1);
  font-weight:600;margin-top:1px;white-space:nowrap;font-feature-settings:'tnum';}
.tlm-v.win{color:var(--win);}
.tlm-bar{display:flex;gap:2px;height:4px;margin-top:auto;padding-top:8px;border-radius:999px;overflow:visible;}
.tlm-bar .seg{height:4px;border-radius:1px;}
.tlm-bar .seg.a{background:var(--info);}
.tlm-bar .seg.b{background:var(--win);}
.tlm-bar .seg.c{background:var(--accent);}
.tlm-bar .seg.d{background:var(--warn);}
.tlm-bar .seg.e{background:var(--pink);}
.tlm-legend{display:flex;gap:6px;flex-wrap:wrap;
  font-family:var(--font-mono);font-size:8.5px;letter-spacing:0.04em;
  color:var(--ink-3);margin-top:4px;text-transform:uppercase;line-height:1;}
.tlm-legend span{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;}
.tlm-legend .swatch{width:5px;height:5px;border-radius:1px;}
.tlm-legend .swatch.a{background:var(--info);}
.tlm-legend .swatch.b{background:var(--win);}
.tlm-legend .swatch.c{background:var(--accent);}
.tlm-legend .swatch.d{background:var(--warn);}
.tlm-legend .swatch.e{background:var(--pink);}

/* ── Bento ── */
.bento{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:160px;gap:12px;}
.tile{position:relative;overflow:hidden;
  background:linear-gradient(140deg,var(--tile-fill-1),var(--tile-fill-2));
  border:1px solid var(--tile-border);
  backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-radius:var(--r-xl);padding:14px 16px;box-shadow:var(--tile-shadow);
  transition:border-color 0.4s var(--ease-out),box-shadow 0.4s var(--ease-out),transform 0.6s var(--ease-out);
  display:flex;flex-direction:column;min-width:0;--mx:50%;--my:50%;}
.tile::before{content:'';position:absolute;left:6%;right:6%;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.20) 35%,rgba(255,255,255,0.32) 50%,rgba(255,255,255,0.20) 65%,transparent);
  pointer-events:none;border-radius:1px;}
html[data-theme="light"] .tile::before{
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.65) 35%,rgba(255,255,255,0.85) 50%,rgba(255,255,255,0.65) 65%,transparent);}
.tile::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle 280px at var(--mx) var(--my),rgba(167,139,250,0.10),transparent 55%);
  opacity:0;transition:opacity 0.5s var(--ease-out);border-radius:inherit;}
html[data-theme="light"] .tile::after{
  background:radial-gradient(circle 280px at var(--mx) var(--my),rgba(108,77,220,0.08),transparent 55%);}
.tile:hover::after{opacity:1;}
.tile:hover{border-color:var(--tile-border-hi);box-shadow:var(--tile-shadow-hi);}
.tile .edge{position:absolute;left:0;right:0;bottom:0;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--info),var(--accent),transparent);
  background-size:200% 100%;opacity:0.55;animation:edgeDrift 8s ease-in-out infinite;}
@keyframes edgeDrift{0%,100%{background-position:0% 50%;opacity:0.45;}
  50%{background-position:100% 50%;opacity:0.75;}}
.tile.accent .edge{background:linear-gradient(90deg,transparent,var(--win),var(--info),transparent);}
.tile.danger .edge{background:linear-gradient(90deg,transparent,var(--warn),var(--loss),transparent);}

.t-hero{grid-column:span 3;grid-row:span 2;}
.t-wide-tall{grid-column:span 3;grid-row:span 2;}
.t-md{grid-column:span 2;grid-row:span 1;}
.t-tall{grid-column:span 2;grid-row:span 2;}
.t-wide{grid-column:span 4;grid-row:span 1;}
.t-full{grid-column:span 6;grid-row:span 1;}

.tile-head{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px;gap:10px;min-width:0;}
.tile-head .lbl{font-family:var(--font-body);font-size:10px;font-weight:600;
  letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-3);
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap;min-width:0;}
.tile-head .lbl .num{font-family:var(--font-mono);color:var(--ink-4);
  letter-spacing:0.05em;font-weight:500;}
.tile-head .lbl > span{white-space:nowrap;}
.tile-head .right-meta{font-family:var(--font-mono);font-size:9.5px;
  color:var(--ink-3);letter-spacing:0.06em;text-transform:uppercase;
  white-space:nowrap;flex-shrink:0;}

/* ── Position tile ── */
.pos-sym{font-family:var(--font-display);font-weight:700;font-size:22px;
  letter-spacing:-0.02em;color:var(--ink-1);line-height:1.05;margin:4px 0 3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pos-sym em{font-family:var(--font-italic);font-style:italic;font-weight:400;color:var(--pink);}
.pos-meta{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);
  font-size:9px;color:var(--ink-3);letter-spacing:0.04em;text-transform:uppercase;
  margin-bottom:10px;white-space:nowrap;overflow:hidden;}
.pos-meta .dur{color:var(--info);}
.pos-meta .sep{color:var(--ink-5);}

.pos-prices{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:12px;}
.pos-prices .col{min-width:0;}
.pos-prices .col .k{font-family:var(--font-mono);font-size:8.5px;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:3px;white-space:nowrap;}
.pos-prices .col .v{font-family:var(--font-display);font-size:22px;font-weight:600;
  color:var(--ink-1);letter-spacing:-0.02em;line-height:1;white-space:nowrap;position:relative;}
.pos-prices .col .v .cur{color:var(--win);position:relative;display:inline-block;}
.pos-prices .col .v .cur::after{content:'';position:absolute;inset:-4px -8px;
  background:linear-gradient(90deg,transparent,rgba(134,239,172,0.18),transparent);
  background-size:200% 100%;background-position:200% 0;
  border-radius:6px;pointer-events:none;opacity:0;}
.pos-prices .col .v .cur.flash::after{animation:ltpFlash 0.9s var(--ease-out);}
@keyframes ltpFlash{0%{opacity:0;background-position:200% 0;}35%{opacity:1;}100%{opacity:0;background-position:-100% 0;}}
.pos-prices .col.right{text-align:right;}
.pos-prices .arrow{width:28px;height:28px;border-radius:999px;flex-shrink:0;
  background:var(--win-soft);border:1px solid var(--win-border);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--win);font-size:14px;font-weight:600;}

.pos-bar{height:5px;background:var(--line-2);border-radius:999px;
  position:relative;margin:12px 0 6px;overflow:visible;}
.pos-bar .fill{height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--loss) 0%,var(--warn) 30%,var(--win) 65%,var(--info) 100%);}
.pos-bar .mark{position:absolute;top:-8px;width:2px;height:22px;background:var(--ink-3);border-radius:1px;}
.pos-bar .mark::after{content:attr(data-label);position:absolute;left:50%;top:-15px;transform:translateX(-50%);
  font-family:var(--font-mono);font-size:8.5px;letter-spacing:0.08em;
  color:var(--ink-3);white-space:nowrap;text-transform:uppercase;}
.pos-bar .now{position:absolute;top:-7px;width:14px;height:20px;
  margin-left:-7px;display:flex;align-items:center;justify-content:center;}
.pos-bar .now::before{content:'';width:14px;height:14px;border-radius:999px;background:var(--win);
  box-shadow:0 0 0 3px var(--win-soft),0 0 12px var(--win);
  animation:pulse 2.5s ease-in-out infinite;}
.pos-bar-labels{display:flex;justify-content:space-between;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.05em;
  color:var(--ink-3);margin-top:10px;white-space:nowrap;}
.pos-bar-labels b{color:var(--ink-1);font-weight:500;}
.pos-bar-labels .sl{color:var(--loss);}
.pos-bar-labels .t1,.pos-bar-labels .t2{color:var(--win);}

.pos-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line-2);}
.pos-foot-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;}
.pos-foot-row .pnl-block{min-width:0;}
.pos-foot-row .k{font-family:var(--font-mono);font-size:8.5px;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:3px;display:block;white-space:nowrap;}
.pos-pnl-now{font-family:var(--font-display);font-weight:600;font-size:18px;
  letter-spacing:-0.02em;color:var(--win);line-height:1;white-space:nowrap;
  display:flex;align-items:center;gap:7px;}
.pos-pnl-now .pct{font-family:var(--font-mono);font-size:10px;
  background:var(--win-soft);color:var(--win);
  padding:2px 6px;border-radius:4px;font-weight:600;}
.pos-verdict{display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:999px;
  background:var(--win-soft);border:1px solid var(--win-border);
  color:var(--win);font-weight:600;text-transform:uppercase;letter-spacing:0.08em;
  font-size:9.5px;font-family:var(--font-mono);white-space:nowrap;}
.pos-verdict .dot{width:5px;height:5px;border-radius:999px;background:var(--win);box-shadow:0 0 5px var(--win);}
.pos-note{font-family:var(--font-body);font-size:11px;color:var(--ink-2);line-height:1.4;text-wrap:pretty;}

.tile.empty{align-items:center;justify-content:center;text-align:center;padding:24px;}
.tile.empty .big{font-family:var(--font-display);font-weight:600;font-size:30px;
  color:var(--ink-1);letter-spacing:-0.015em;line-height:1.2;margin-bottom:8px;}
.tile.empty .big em{font-family:var(--font-italic);font-style:italic;font-weight:400;color:var(--accent);}
.tile.empty .big em.warn{color:var(--warn);}
.tile.empty .sub{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.05em;
  color:var(--ink-3);text-transform:uppercase;}

/* ── P&L tile ── */
.pnl-big{font-family:var(--font-display);font-weight:700;
  font-size:clamp(24px,2.4vw,32px);letter-spacing:-0.04em;color:var(--ink-1);line-height:1.15;
  margin:4px 0 2px;padding-top:2px;padding-right:6px;white-space:nowrap;min-width:0;}
.pnl-big .curr{font-size:0.6em;font-weight:500;color:var(--ink-4);font-style:italic;
  font-family:var(--font-italic);margin-right:4px;}
.pnl-big em{padding-right:0.3em;font-family:var(--font-italic);font-style:italic;font-weight:400;}
.pnl-big.win em{color:var(--win);}
.pnl-big.loss em{color:var(--loss);}
.pnl-sub{font-family:var(--font-mono);font-size:10px;letter-spacing:0.04em;
  color:var(--ink-3);text-transform:uppercase;margin-bottom:8px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.pnl-sub .ddh{color:var(--loss);}
.equity{height:60px;width:100%;margin:4px 0 8px;display:block;}
.pnl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
  padding-top:10px;border-top:1px solid var(--line-2);margin-top:auto;}
.pnl-grid > div{min-width:0;}
.pnl-grid .k{font-family:var(--font-mono);font-size:9px;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;display:block;white-space:nowrap;}
.pnl-grid .v{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-1);
  font-weight:500;font-feature-settings:'tnum';white-space:nowrap;}
.pnl-grid .v.win{color:var(--win);}
.pnl-grid .v.loss{color:var(--loss);}
.pnl-grid .v.muted{color:var(--ink-2);}

/* ── Index pill ── */
.idx{display:flex;flex-direction:column;justify-content:space-between;height:100%;min-width:0;}
.idx-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.idx-name{font-family:var(--font-body-alt);font-weight:700;font-size:11px;
  letter-spacing:0.04em;color:var(--ink-1);text-transform:uppercase;
  display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0;}
.idx-name .dot-live{width:6px;height:6px;border-radius:999px;background:var(--win);
  box-shadow:0 0 5px var(--win);animation:pulse 2.5s ease-in-out infinite;flex-shrink:0;}
.idx-pct{font-family:var(--font-mono);font-size:11px;font-weight:600;
  padding:2px 7px;border-radius:4px;letter-spacing:0.02em;white-space:nowrap;flex-shrink:0;}
.idx-pct.up{color:var(--win);background:var(--win-soft);}
.idx-pct.dn{color:var(--loss);background:var(--loss-soft);}
.idx-ltp{font-family:var(--font-display);font-weight:600;font-size:24px;
  letter-spacing:-0.025em;color:var(--ink-1);line-height:1;margin:4px 0 2px;white-space:nowrap;}
.idx-pts{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.04em;color:var(--ink-3);white-space:nowrap;}
.idx-pts.up{color:var(--win);}
.idx-pts.dn{color:var(--loss);}
.idx-spark{width:100%;height:28px;display:block;margin-top:4px;}

/* ── Win-rate ring ── */
.ring-wrap{display:flex;align-items:center;gap:14px;flex:1;min-width:0;}
.ring-svg{width:100px;height:100px;flex-shrink:0;filter:drop-shadow(0 0 16px var(--win-soft));}
.ring-track{fill:none;stroke:var(--line-2);stroke-width:8;}
.ring-prog{fill:none;stroke-width:8;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:center;
  stroke-dasharray:283;stroke-dashoffset:90;
  transition:stroke-dashoffset 1.2s var(--ease-out);}
.ring-center{font-family:var(--font-display);font-weight:600;font-size:26px;
  fill:var(--ink-1);letter-spacing:-0.02em;text-anchor:middle;dominant-baseline:central;}
.ring-center .pct{font-size:12px;fill:var(--ink-3);font-family:var(--font-mono);font-weight:500;}
.ring-stats{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;}
.ring-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.03em;
  border-bottom:1px solid var(--line-3);padding-bottom:4px;}
.ring-row:last-child{border:none;}
.ring-row .l{color:var(--ink-3);text-transform:uppercase;letter-spacing:0.1em;font-size:9.5px;white-space:nowrap;}
.ring-row .v{color:var(--ink-1);font-weight:600;font-size:13px;white-space:nowrap;}
.ring-row .v.win{color:var(--win);}
.ring-row .v.loss{color:var(--loss);}

/* ── Capital ── */
.cap-big{font-family:var(--font-display);font-weight:600;font-size:24px;
  letter-spacing:-0.02em;color:var(--ink-1);line-height:1;margin:2px 0;
  display:flex;align-items:baseline;gap:6px;white-space:nowrap;}
.cap-big .pct{font-size:12px;color:var(--ink-3);font-family:var(--font-mono);font-weight:500;}
.cap-sub{font-family:var(--font-mono);font-size:10px;letter-spacing:0.05em;
  color:var(--ink-3);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cap-bar{height:5px;background:var(--line-2);border-radius:999px;overflow:hidden;margin-top:auto;}
.cap-bar .fill{height:100%;background:linear-gradient(90deg,#60a5fa,#a78bfa);
  border-radius:999px;transition:width 1s var(--ease-out);}
.cap-foot{display:flex;justify-content:space-between;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.05em;
  color:var(--ink-4);margin-top:6px;white-space:nowrap;}

/* ── Strategy ── */
.strat-name{font-family:var(--font-display);font-weight:600;font-size:15px;
  letter-spacing:-0.015em;color:var(--ink-1);margin:0 0 8px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.strat-name em{font-family:var(--font-italic);font-style:italic;color:var(--accent);font-weight:400;}
.strat-tag{background:linear-gradient(135deg,#a78bfa,#60a5fa);color:var(--btn-text);
  padding:2px 8px;border-radius:4px;font-weight:700;letter-spacing:0.08em;
  font-size:9.5px;font-family:var(--font-mono);text-transform:uppercase;display:inline-block;}
.confluence{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:auto;}
.conf-cell{padding:4px 8px;border-radius:5px;min-width:0;
  background:var(--win-soft);border:1px solid var(--win-border);}
.conf-cell.off{background:var(--line-3);border-color:var(--line-1);}
.conf-cell .k{font-family:var(--font-mono);font-size:8px;letter-spacing:0.06em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;display:block;}
.conf-cell.off .k{color:var(--ink-4);}
.conf-cell .v{font-family:var(--font-mono);font-size:10px;font-weight:600;
  color:var(--win);margin-top:1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.conf-cell.off .v{color:var(--ink-3);}

/* ── Regime ── */
.regime-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.regime-pill{display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:999px;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.04em;
  text-transform:uppercase;font-weight:500;white-space:nowrap;}
.regime-pill.ok{color:var(--win);background:var(--win-soft);border:1px solid var(--win-border);}
.regime-pill.warn{color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-border);}
.regime-pill.err{color:var(--loss);background:var(--loss-soft);border:1px solid var(--loss-border);}
.regime-pill .check{width:10px;height:10px;flex-shrink:0;}
.regime-pill .note{color:var(--ink-3);margin-left:2px;}
.regime-foot{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.04em;
  color:var(--ink-3);margin-top:auto;padding-top:10px;
  border-top:1px solid var(--line-2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.regime-foot b{color:var(--ink-1);font-weight:500;}
.regime-foot .sep{color:var(--ink-5);margin:0 6px;}

/* ── Timeline ── */
.timeline-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;
  position:relative;padding:6px 0 4px;min-width:0;}
.timeline-line{position:absolute;left:0;right:0;top:50%;
  height:1px;background:linear-gradient(90deg,transparent 0%,var(--line-1) 8%,var(--line-1) 92%,transparent 100%);}
.timeline-ticks{position:relative;height:14px;
  font-family:var(--font-mono);font-size:9px;letter-spacing:0.06em;
  color:var(--ink-4);text-transform:uppercase;}
.timeline-ticks span{position:absolute;white-space:nowrap;}
.timeline-events{position:relative;height:18px;margin:10px 0 6px;}
.timeline-event{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;}
.timeline-event .ev-dot{width:12px;height:12px;border-radius:999px;
  background:var(--ink-3);border:2px solid var(--bg-base);
  box-shadow:0 0 0 1px var(--ink-4);}
.timeline-event.win .ev-dot{background:var(--win);
  box-shadow:0 0 0 1px var(--win-border),0 0 10px var(--win-soft);}
.timeline-event.loss .ev-dot{background:var(--loss);
  box-shadow:0 0 0 1px var(--loss-border),0 0 10px var(--loss-soft);}
.timeline-event.open .ev-dot{background:var(--info);
  box-shadow:0 0 0 1px var(--info-border),0 0 10px var(--info-soft);
  animation:pulse 2.5s ease-in-out infinite;}
.timeline-event.filter .ev-dot{background:var(--ink-5);width:8px;height:8px;}
.timeline-event .ev-tip{position:absolute;bottom:22px;left:50%;
  transform:translateX(-50%);background:var(--bg-base);
  border:1px solid var(--tile-border);padding:8px 12px;border-radius:8px;
  font-family:var(--font-mono);font-size:10px;letter-spacing:0.03em;
  color:var(--ink-2);white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity 0.2s var(--ease-out);
  box-shadow:0 8px 24px rgba(0,0,0,0.5);z-index:10;}
.timeline-event:hover .ev-tip{opacity:1;}
.timeline-event .ev-tip b{color:var(--ink-1);font-weight:600;}
.timeline-event .ev-tip .v{margin-left:6px;}
.timeline-event .ev-tip .v.win{color:var(--win);}
.timeline-event .ev-tip .v.loss{color:var(--loss);}
.timeline-now{position:absolute;top:-4px;bottom:-4px;
  width:2px;background:linear-gradient(180deg,var(--accent),var(--info));
  box-shadow:0 0 12px var(--accent);transform:translateX(-50%);border-radius:1px;}
.timeline-legend{display:flex;gap:14px;font-family:var(--font-mono);font-size:9.5px;
  color:var(--ink-3);letter-spacing:0.05em;text-transform:uppercase;white-space:nowrap;}
.timeline-legend span{display:inline-flex;align-items:center;gap:5px;}
.timeline-legend .dot{width:7px;height:7px;border-radius:999px;}

/* ── Lower ── */
.lower{display:grid;grid-template-columns:1fr 380px;gap:14px;margin-top:14px;}
.panel{background:linear-gradient(140deg,var(--tile-fill-1),var(--tile-fill-2));
  border:1px solid var(--tile-border);
  backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-radius:var(--r-xl);padding:18px 20px;box-shadow:var(--tile-shadow);min-width:0;}
.panel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;
  margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line-1);}
.panel-title{font-family:var(--font-display);font-weight:700;font-size:18px;
  letter-spacing:-0.015em;color:var(--ink-1);line-height:1.2;}
.panel-title em{font-family:var(--font-italic);font-style:italic;font-weight:400;
  background:var(--gradient-hero);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.panel-sub{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.06em;
  color:var(--ink-3);text-transform:uppercase;margin-top:4px;white-space:nowrap;}

.sig-table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:11.5px;table-layout:auto;}
.sig-table th{font-family:var(--font-body);font-size:9.5px;font-weight:600;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--ink-3);
  text-align:left;padding:8px 10px 12px;
  border-bottom:1px solid var(--line-1);white-space:nowrap;}
.sig-table th.r{text-align:right;}
.sig-table td{padding:10px 10px;border-bottom:1px solid var(--line-3);
  color:var(--ink-2);vertical-align:middle;font-feature-settings:'tnum';}
.sig-table tr:last-child td{border-bottom:none;}
.sig-table tr.live{background:var(--row-live-bg);}
.sig-table tr:hover{background:var(--hover-bg);}
.sig-table td.r{text-align:right;}
.sig-table .sym-cell{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;}
.sig-table .sym{font-family:var(--font-body-alt);font-weight:600;color:var(--ink-1);
  font-size:12.5px;letter-spacing:-0.005em;white-space:nowrap;}
.sig-table .side-tag{display:inline-block;padding:1px 7px;border-radius:3px;
  font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:0.06em;}
.sig-table .side-tag.long{background:var(--win-soft);color:var(--win);}
.sig-table .side-tag.short{background:var(--loss-soft);color:var(--loss);}
.sig-table .time{color:var(--ink-3);letter-spacing:0.04em;white-space:nowrap;}
.sig-table .score{color:var(--accent);font-weight:600;letter-spacing:0.04em;white-space:nowrap;}
.sig-table .verdict{font-weight:600;white-space:nowrap;}
.sig-table .verdict.take{color:var(--win);}
.sig-table .verdict.wait{color:var(--warn);}
.sig-table .verdict.skip{color:var(--ink-3);}
.sig-table .reason{color:var(--ink-2);font-family:var(--font-body);font-size:12px;text-wrap:pretty;line-height:1.45;}
.sig-table .pnl-cell{font-weight:600;font-size:13px;white-space:nowrap;}
.sig-table .pnl-cell .pct{font-size:10px;font-weight:400;color:var(--ink-4);
  display:block;margin-top:2px;font-family:var(--font-mono);}
.sig-table .pnl-cell.win{color:var(--win);}
.sig-table .pnl-cell.loss{color:var(--loss);}
.sig-table .pnl-cell.open{color:var(--info);}
.sig-table .pnl-cell.muted{color:var(--ink-4);}
.sig-table .status-chip{display:inline-block;padding:2px 8px;border-radius:999px;
  font-size:9px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap;}
.sig-table .status-chip.win{background:var(--win-soft);color:var(--win);}
.sig-table .status-chip.loss{background:var(--loss-soft);color:var(--loss);}
.sig-table .status-chip.open{background:var(--info-soft);color:var(--info);}
.sig-table .status-chip.filtered{background:var(--line-3);color:var(--ink-3);}
.sig-table .status-chip.watch{background:var(--warn-soft);color:var(--warn);}

.feed{display:flex;flex-direction:column;gap:0;flex:1;
  margin:0 -10px -10px;padding:0 10px 10px;
  max-height:580px;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--ink-5) transparent;}
.feed::-webkit-scrollbar{width:4px;}
.feed::-webkit-scrollbar-thumb{background:var(--ink-5);border-radius:4px;}
.feed-item{display:grid;grid-template-columns:54px 1fr;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--line-3);}
.feed-item:last-child{border-bottom:none;}
.feed-time{font-family:var(--font-mono);font-size:10px;letter-spacing:0.04em;
  color:var(--ink-3);line-height:1.4;white-space:nowrap;}
.feed-time .layer{display:inline-block;margin-top:4px;
  font-size:8.5px;font-weight:600;letter-spacing:0.1em;
  padding:1px 5px;border-radius:3px;}
.feed-time .layer.a{background:var(--info-soft);color:var(--info);}
.feed-time .layer.b{background:var(--win-soft);color:var(--win);}
.feed-time .layer.c{background:var(--accent-soft);color:var(--accent);}
.feed-time .layer.d{background:var(--warn-soft);color:var(--warn);}
.feed-time .layer.e{background:rgba(244,114,182,0.14);color:var(--pink);}
.feed-msg{color:var(--ink-2);font-size:12.5px;line-height:1.55;text-wrap:pretty;min-width:0;
  overflow-wrap:break-word;word-break:break-word;}
.feed-msg .kind{font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;
  text-transform:uppercase;color:var(--ink-3);margin-right:8px;font-weight:600;white-space:nowrap;}
.feed-msg b{color:var(--ink-1);font-weight:600;}
.feed-empty{padding:32px 0;text-align:center;font-family:var(--font-mono);
  font-size:11px;color:var(--ink-4);letter-spacing:0.05em;text-transform:uppercase;}

/* ── Modal ── */
.modal-backdrop{position:fixed;inset:0;z-index:200;
  background:rgba(5,5,16,0.65);
  backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  display:flex;align-items:center;justify-content:center;padding:24px;
  animation:fadeIn 0.25s var(--ease-out) both;}
html[data-theme="light"] .modal-backdrop{background:rgba(28,26,23,0.30);}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes modalPop{from{opacity:0;transform:translateY(10px) scale(0.97);}to{opacity:1;transform:none;}}
.modal-card{width:min(440px,100%);
  background:linear-gradient(140deg,var(--tile-fill-1),var(--tile-fill-2));
  border:1px solid var(--tile-border);border-radius:var(--r-xl);
  box-shadow:0 24px 60px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.08);

  max-height:90vh;overflow-y:auto;}

  background:linear-gradient(140deg,rgba(255,255,255,0.98),rgba(255,255,255,0.92));
  box-shadow:0 24px 60px rgba(28,26,23,0.18),0 1px 0 rgba(255,255,255,0.7) inset;}
.modal-head{display:flex;align-items:center;gap:14px;
  padding:20px 24px 16px;border-bottom:1px solid var(--line-1);}
.modal-head > div:nth-child(2){flex:1;min-width:0;}
.modal-avatar{width:42px;height:42px;border-radius:999px;flex-shrink:0;
  background:linear-gradient(135deg,#fbbf24,#f87171);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--avatar-text);font-weight:700;font-size:16px;font-family:var(--font-body-alt);
  box-shadow:0 4px 14px rgba(248,113,113,0.3),inset 0 1px 0 rgba(255,255,255,0.3);}
.modal-name{font-family:var(--font-display);font-weight:700;font-size:18px;
  letter-spacing:-0.015em;color:var(--ink-1);line-height:1.2;}
.modal-name-input{font-family:var(--font-display);font-weight:700;font-size:18px;
  letter-spacing:-0.015em;color:var(--ink-1);line-height:1.2;
  background:transparent;border:0;outline:0;border-bottom:1px solid var(--line-1);padding:2px 0;width:100%;}
.modal-name-input:focus{border-bottom-color:var(--accent);}
.modal-sub{font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;
  text-transform:uppercase;color:var(--ink-3);margin-top:3px;}
.modal-x{appearance:none;border:0;background:transparent;
  width:28px;height:28px;border-radius:999px;cursor:pointer;
  color:var(--ink-3);font-size:22px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;
  transition:all 0.2s var(--ease-out);}
.modal-x:hover{background:var(--hover-bg);color:var(--ink-1);}
.modal-body{padding:22px 24px;}
.modal-section{margin-bottom:18px;}
.modal-section:last-child{margin-bottom:0;}
.modal-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:10px;font-weight:600;}
.modal-input-row{display:flex;align-items:center;gap:8px;
  background:var(--tile-fill-1);border:1px solid var(--tile-border);
  border-radius:10px;padding:10px 16px;transition:border-color 0.2s var(--ease-out);}
.modal-input-row:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.modal-curr{font-family:var(--font-display);font-style:italic;
  color:var(--ink-3);font-size:28px;font-weight:500;flex-shrink:0;line-height:1;}
.modal-input{flex:1;min-width:0;appearance:none;-webkit-appearance:none;
  background:transparent;border:0;outline:0;
  font-family:var(--font-display);font-weight:600;font-size:28px;
  color:var(--ink-1);letter-spacing:-0.02em;font-feature-settings:'tnum';}
.modal-input::-webkit-outer-spin-button,.modal-input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0;}
.modal-input-text{flex:1;min-width:0;appearance:none;
  background:transparent;border:0;outline:0;
  font-family:var(--font-mono);font-size:12.5px;color:var(--ink-1);}
.modal-presets{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.modal-preset{appearance:none;border:1px solid var(--tile-border);
  background:var(--tile-fill-1);color:var(--ink-2);
  padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;
  letter-spacing:0.04em;cursor:pointer;font-family:var(--font-mono);
  transition:all 0.2s var(--ease-out);}
.modal-preset:hover{border-color:var(--ink-3);color:var(--ink-1);}
.modal-preset.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.modal-note{font-family:var(--font-body);font-size:11.5px;
  color:var(--ink-3);line-height:1.55;margin-top:16px;text-wrap:pretty;
  padding:12px 14px;border-radius:10px;
  background:var(--tile-fill-2);border:1px solid var(--line-2);}
.modal-note b{color:var(--ink-1);font-weight:600;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;
  padding:14px 24px 18px;border-top:1px solid var(--line-1);}
.modal-foot .btn{padding:9px 18px;font-size:11.5px;}

/* ── Backtest modal (wider) ── */
.bt-card{width:min(960px,100%);max-height:90vh;overflow-y:auto;}
.bt-controls{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;
  padding:18px 24px;border-bottom:1px solid var(--line-1);}
.bt-controls .group{display:flex;flex-direction:column;gap:6px;min-width:0;}
.bt-controls .group .label{font-family:var(--font-mono);font-size:9.5px;
  letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;}
.bt-seg{display:inline-flex;gap:4px;background:var(--tile-fill-1);
  border:1px solid var(--tile-border);border-radius:8px;padding:3px;}
.bt-seg button{appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:var(--font-mono);font-size:11px;letter-spacing:0.04em;font-weight:600;
  color:var(--ink-3);padding:5px 10px;border-radius:5px;transition:all 0.15s var(--ease-out);}
.bt-seg button:hover{color:var(--ink-1);}
.bt-seg button.on{background:var(--accent-soft);color:var(--accent);}
.bt-syms{display:inline-flex;gap:4px;}
.bt-sym-chip{appearance:none;border:1px solid var(--tile-border);
  background:var(--tile-fill-1);color:var(--ink-3);
  padding:6px 12px;border-radius:8px;font-family:var(--font-mono);font-size:11px;
  font-weight:600;cursor:pointer;letter-spacing:0.04em;transition:all 0.15s var(--ease-out);}
.bt-sym-chip:hover{color:var(--ink-1);border-color:var(--ink-3);}
.bt-sym-chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.bt-run{margin-left:auto;padding:9px 18px;font-size:11px;}
.bt-body{padding:18px 24px;}
.bt-empty{padding:60px 24px;text-align:center;font-family:var(--font-mono);
  font-size:11px;color:var(--ink-4);letter-spacing:0.05em;text-transform:uppercase;line-height:1.6;}
.bt-empty b{color:var(--ink-2);}
.bt-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.bt-stat{padding:14px 16px;border-radius:12px;
  background:var(--tile-fill-1);border:1px solid var(--tile-border);min-width:0;}
.bt-stat .k{font-family:var(--font-mono);font-size:9px;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:6px;font-weight:600;}
.bt-stat .v{font-family:var(--font-display);font-weight:700;font-size:22px;
  letter-spacing:-0.02em;color:var(--ink-1);line-height:1;}
.bt-stat .v.win{color:var(--win);}
.bt-stat .v.loss{color:var(--loss);}
.bt-stat .v.warn{color:var(--warn);}
.bt-stat .sub{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-4);
  letter-spacing:0.05em;margin-top:4px;display:block;}
.bt-section-title{font-family:var(--font-display);font-weight:600;font-size:14px;
  letter-spacing:-0.01em;color:var(--ink-1);margin:18px 0 8px;}
.bt-table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:11px;}
.bt-table th{text-align:left;padding:6px 8px;color:var(--ink-3);font-weight:600;
  letter-spacing:0.06em;text-transform:uppercase;border-bottom:1px solid var(--line-1);font-size:9px;}
.bt-table th.r{text-align:right;}
.bt-table td{padding:6px 8px;border-bottom:1px solid var(--line-3);
  color:var(--ink-2);font-feature-settings:'tnum';}
.bt-table td.r{text-align:right;}
.bt-table td.win{color:var(--win);font-weight:600;}
.bt-table td.loss{color:var(--loss);font-weight:600;}
.bt-curve{width:100%;height:120px;display:block;}
.bt-running{display:flex;flex-direction:column;align-items:center;
  padding:60px 24px;gap:14px;font-family:var(--font-mono);font-size:11px;
  letter-spacing:0.05em;color:var(--ink-3);text-transform:uppercase;}
.bt-running .spinner{width:24px;height:24px;}
.bt-err{padding:12px 14px;background:var(--loss-soft);border:1px solid var(--loss-border);
  border-radius:8px;font-family:var(--font-mono);font-size:11px;color:var(--loss);
  letter-spacing:0.04em;margin-bottom:14px;}

/* ── Setup overlay (first run) ── */
.setup{position:fixed;inset:0;z-index:300;
  display:flex;align-items:center;justify-content:center;padding:24px;
  background:var(--bg-base);}
.setup-card{width:min(520px,100%);
  background:linear-gradient(140deg,var(--tile-fill-1),var(--tile-fill-2));
  border:1px solid var(--tile-border);border-radius:var(--r-xl);
  box-shadow:0 24px 60px rgba(0,0,0,0.5);
  padding:32px 32px 28px;}
.setup-head{margin-bottom:22px;}
.setup-logo{width:42px;height:42px;border-radius:11px;
  background:linear-gradient(135deg,#60a5fa,#a78bfa 60%,#f0abfc);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--logo-text);font-family:var(--font-display);font-weight:800;font-size:18px;
  font-style:italic;letter-spacing:-0.04em;
  box-shadow:0 4px 14px rgba(96,165,250,0.4);margin-bottom:14px;}
.setup-title{font-family:var(--font-display);font-weight:700;font-size:26px;
  letter-spacing:-0.015em;color:var(--ink-1);margin-bottom:6px;line-height:1.2;}
.setup-title em{font-family:var(--font-italic);font-style:italic;color:var(--accent);font-weight:400;}
.setup-sub{font-family:var(--font-body);font-size:13px;color:var(--ink-2);line-height:1.55;text-wrap:pretty;}
.setup-err{font-family:var(--font-mono);font-size:11px;letter-spacing:0.04em;
  color:var(--loss);background:var(--loss-soft);border:1px solid var(--loss-border);
  border-radius:8px;padding:8px 12px;margin-bottom:14px;text-transform:uppercase;}

/* ── Loading state ── */
.spinner{width:14px;height:14px;border:2px solid var(--line-1);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin 0.9s linear infinite;display:inline-block;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;}
}
@media(max-width:1280px){
  .mast h1{font-size:38px;}
  .pnl-big{font-size:28px;}
  .pnl-big .curr{font-size:18px;}
  .pos-sym{font-size:20px;}
  .pos-prices .col .v{font-size:20px;}
}
@media(max-width:1100px){
  .bento{grid-template-columns:repeat(4,1fr);}
  .t-hero,.t-wide-tall{grid-column:span 4;}
  .t-tall{grid-column:span 2;grid-row:span 2;}
  .t-md{grid-column:span 2;}
  .t-wide{grid-column:span 4;}
  .t-full{grid-column:span 4;}
  .lower{grid-template-columns:1fr;}
}
@media(max-width:760px){
  .page{padding:14px 16px 60px;}
  .bento{grid-template-columns:repeat(2,1fr);grid-auto-rows:130px;}
  .t-hero,.t-wide-tall,.t-wide,.t-full{grid-column:span 2;}
  .t-tall{grid-column:span 2;grid-row:span 2;}
  .t-md{grid-column:span 1;}
  .mast{flex-direction:column;align-items:flex-start;}
  .mast .right{text-align:left;}
  .mast .right .row{justify-content:flex-start;}
  .mast h1{font-size:40px;}
  .status{flex-wrap:wrap;}
  .status .session{display:none;}
}

<body>
  <div class="aurora" aria-hidden="true">
    <div class="grid"></div>
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>
    <div class="orb d"></div>
  </div>
  <div id="root"></div>

  <script>
    try {
      const saved = localStorage.getItem('ie-theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch(e){}
  </script>

  <script crossOrigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossOrigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ─────────────────────────────────────────────────────────
    // Server / Auth helpers
    // ─────────────────────────────────────────────────────────
    const DEFAULT_SERVER = "";
    const getServer = () => localStorage.getItem('signal_server_url') || DEFAULT_SERVER;
    const setServer = (url) => localStorage.setItem('signal_server_url', (url||'').replace(/\/$/,''));
    const API = (path) => { const s = getServer(); return s ? s + path : path; };
    const getAuthToken = () => localStorage.getItem('signal_auth_token') || '';
    const setAuthToken = (token) => {
      if (token) localStorage.setItem('signal_auth_token', token.trim());
      else localStorage.removeItem('signal_auth_token');
    };

    async function apiFetch(path, opts) {
      opts = opts || {};
      const headers = Object.assign({}, opts.headers || {});
      const tok = getAuthToken();
      if (tok) headers['X-Auth-Token'] = tok;
      if (opts.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
      return fetch(API(path), Object.assign({ credentials: 'include' }, opts, { headers }));
    }
    async function apiJSON(path, opts) {
      const r = await apiFetch(path, opts);
      if (!r.ok) {
        let body = '';
        try { body = await r.text(); } catch(e) {}
        const err = new Error('API ' + r.status + (body ? ' · ' + body.slice(0,160) : ''));
        err.status = r.status;
        throw err;
      }
      return r.json();
    }

    // ─────────────────────────────────────────────────────────
    // Formatting + math helpers
    // ─────────────────────────────────────────────────────────
    const fmtINR = (n, signed) => {
      if (n == null || isNaN(n)) return '—';
      const abs = Math.abs(Math.round(n));
      const sign = n >= 0 ? (signed?'+':'') : '−';
      return sign + '₹' + abs.toLocaleString('en-IN');
    };
    const fmtNum = (n, dp) => {
      if (n == null || isNaN(n)) return '—';
      return Number(n).toLocaleString('en-IN', { minimumFractionDigits: dp||0, maximumFractionDigits: dp||0 });
    };
    const fmtPct = (n, dp) => {
      if (n == null || isNaN(n)) return '—';
      return (n>=0?'+':'') + Number(n).toFixed(dp||2) + '%';
    };

    function sparkPath(series, w, h, pad) {
      pad = pad || 2;
      if (!series || series.length < 2) return { line: '', area: '', last: null };
      const mn = Math.min.apply(null, series);
      const mx = Math.max.apply(null, series);
      const range = mx - mn || 1;
      const step = (w - pad*2) / (series.length - 1);
      const points = series.map((v, i) => {
        const x = pad + i * step;
        const y = pad + (1 - (v - mn) / range) * (h - pad*2);
        return [x, y];
      });
      const line = points.map((p, i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      const area = line + ' L ' + (w-pad).toFixed(1) + ' ' + (h-pad).toFixed(1) + ' L ' + pad.toFixed(1) + ' ' + (h-pad).toFixed(1) + ' Z';
      return { line, area, last: points[points.length-1] };
    }

    // Humanize option symbol BANKNIFTY26MAY2654300CE → ['BANKNIFTY 54300', 'CE']
    function humanizeSym(sym) {
      if (!sym) return ['—', ''];
      const s = String(sym).toUpperCase();
      const m = s.match(/^([A-Z]+?)(\d{1,2})([A-Z]{3})(\d{2})(\d{3,6})(CE|PE)$/);
      if (m) {
        const [, idx, day, mon, yr, strike, type] = m;
        return [idx + ' ' + strike, type];
      }
      // Fallback split CE/PE if present at end
      const m2 = s.match(/^(.+?)(CE|PE)$/);
      if (m2) return [m2[1], m2[2]];
      return [s, ''];
    }

    function instOf(sym) {
      if (!sym) return 'NIFTY';
      const s = String(sym).toUpperCase();
      if (s.startsWith('BANKNIFTY')) return 'BANKNIFTY';
      if (s.startsWith('FINNIFTY')) return 'FINNIFTY';
      if (s.startsWith('NIFTY')) return 'NIFTY';
      return 'NIFTY';
    }

    function todayISO() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function ddMonYY() {
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const d = new Date();
      return String(d.getDate()).padStart(2,'0') + ' ' + months[d.getMonth()] + ' · ' + d.getFullYear();
    }

    function weekday() {
      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      return days[new Date().getDay()];
    }

    // Compute duration HH:MM:SS from "HH:MM" string today
    function durFromHHMM(t_in) {
      if (!t_in) return '—';
      const [h, m] = String(t_in).split(':').map(x => parseInt(x,10));
      if (isNaN(h)) return '—';
      const start = new Date();
      start.setHours(h, m||0, 0, 0);
      let ms = Date.now() - start.getTime();
      if (ms < 0) ms = 0;
      const hh = Math.floor(ms / 3600000);
      const mm = Math.floor((ms % 3600000) / 60000);
      const ss = Math.floor((ms % 60000) / 1000);
      return String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
    }

    // ─────────────────────────────────────────────────────────
    // Theme hook
    // ─────────────────────────────────────────────────────────
    function useTheme() {
      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem('ie-theme') || 'dark'; } catch(e){ return 'dark'; }
      });
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        try { localStorage.setItem('ie-theme', theme); } catch(e){}
      }, [theme]);
      const toggle = () => setTheme(t => t === 'dark' ? 'light' : 'dark');
      return [theme, toggle];
    }

    // ─────────────────────────────────────────────────────────
    // Polling hook
    // ─────────────────────────────────────────────────────────
    function usePoll(path, intervalMs, opts) {
      opts = opts || {};
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const enabled = opts.enabled !== false;
      useEffect(() => {
        if (!enabled) return;
        let cancelled = false;
        let timer = null;
        async function tick() {
          try {
            const j = await apiJSON(path);
            if (!cancelled) { setData(j); setErr(null); }
          } catch (e) {
            if (!cancelled) setErr(e);
          } finally {
            if (!cancelled) timer = setTimeout(tick, intervalMs);
          }
        }
        tick();
        return () => { cancelled = true; if (timer) clearTimeout(timer); };
      }, [path, intervalMs, enabled]);
      return [data, err];
    }

    // ─────────────────────────────────────────────────────────
    // Ping component

    // ─────────────────────────────────────────────────────────
    // Masthead
    // ─────────────────────────────────────────────────────────
    function Masthead({ perfNet, openCount, streak, dayLabel, dayCount }) {
      const pnl = perfNet || 0;
      const pnlAbs = Math.abs(Math.round(pnl));
      const isWin = pnl >= 0;
      const arrow = isWin ? '▲' : '▼';

      let h1, lede;
      if (openCount > 0) {
        h1 = <>Live · <em>{openCount}</em> position{openCount===1?'':'s'} open.</>;
        lede = <>{streak>0?(<><b>{streak}-trade</b> <em>win streak</em>. </>):null}
          Layer-D monitoring {openCount===1?'this trade':'each trade'} · <em>net of brokerage &amp; slippage.</em></>;
      } else if (pnl > 0) {
        h1 = <>Up <em>{fmtINR(pnl, true)}</em> today.</>;
        lede = <>{dayCount} closed trade{dayCount===1?'':'s'} today. Engine standing by for the next high-conviction setup.</>;
      } else if (pnl < 0) {
        h1 = <>Down <em className="loss">{fmtINR(pnl, true)}</em> today.</>;
        lede = <>{dayCount} closed trade{dayCount===1?'':'s'} today. Engine continues watching for the next setup.</>;
      } else {
        h1 = <>Engine <em>standing by.</em></>;
        lede = <>No trades fired yet · scanning for high-conviction setups. <em>Layer-A regime check</em> active.</>;
      }

      return (
        <section className="mast">
          <div className="left">
            <div className="kick">
              <span>Intraday Console</span>
              <span className="sep">·</span>
              <span>{weekday()} · {dayLabel}</span>
              <span className="sep">·</span>
              <span>Live signals</span>
            </div>
            <h1>{h1}</h1>
            <p className="lede">{lede}</p>
          </div>

          <div className="right">
            <span className="label">SESSION P&amp;L · NET</span>
            <span className="big">{isWin?'+':'−'}₹{pnlAbs.toLocaleString('en-IN')} {pnl !== 0 && <em>{arrow}</em>}</span>

            <div className="row">
              <div>
                <span className="label">OPEN</span>
                <span className="val" style={{color: 'var(--info)'}}>{openCount}</span>
              </div>
              <div>
                <span className="label">CLOSED</span>
                <span className="val">{dayCount}</span>
              </div>
              <div>
                <span className="label">STREAK</span>
                <span className="val">{streak > 0 ? <span style={{color:'var(--win)'}}>+{streak}W</span> : streak < 0 ? <span style={{color:'var(--loss)'}}>{streak}L</span> : '—'}</span>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Position card
    // ─────────────────────────────────────────────────────────
    function PositionCard({ pos, idx }) {
      const sym = pos.option_symbol || ((pos.instrument||'') + ' ' + (pos.option_strike||'') + ' ' + (pos.option_type||''));
      const [head, type] = humanizeSym(sym);
      const entry = +pos.entry || 0;
      const ltp   = pos.current_premium != null ? +pos.current_premium : entry;
      const sl    = +pos.sl || (entry * 0.6);
      const t1    = +pos.t1 || (entry * 1.5);
      const t2    = +pos.t2 || (entry * 2.0);
      const totalRange = (t2 - sl) || 1;
      const nowPct   = Math.max(2, Math.min(98, ((ltp - sl) / totalRange) * 100));
      const slPct    = 0;
      const entryPct = ((entry - sl) / totalRange) * 100;
      const t1Pct    = ((t1 - sl) / totalRange) * 100;
      const t2Pct    = 100;
      const qty = +pos.qty || 0;
      const pnlNow = pos.pnl_now != null ? +pos.pnl_now : (ltp - entry) * qty;
      const pctNow = entry > 0 ? ((ltp - entry) / entry) * 100 : 0;
      const isWinning = pnlNow >= 0;
      const health = isWinning ? 'win' : 'warn';
      const verdictKind = isWinning ? 'win' : 'warn';
      const verdict = isWinning ? 'HOLD' : 'WATCH';
      const expiry = '—'; // engine doesn't expose expiry on open signal — could parse from symbol

      const peakPremium = pos.peak_premium;
      const peakPnl = pos.pnl_peak;
      const pctToT1 = pos.pct_to_t1;

      const [flash, setFlash] = useState(false);
      const prevLtp = useRef(ltp);
      useEffect(() => {
        if (prevLtp.current !== ltp) {
          prevLtp.current = ltp;
          setFlash(true);
          const id = setTimeout(() => setFlash(false), 950);
          return () => clearTimeout(id);
        }
      }, [ltp]);

      // Live ticking duration
      const [dur, setDur] = useState(() => durFromHHMM(pos.t_in));
      useEffect(() => {
        const id = setInterval(() => setDur(durFromHHMM(pos.t_in)), 1000);
        return () => clearInterval(id);
      }, [pos.t_in]);

      let note;
      if (peakPnl != null && peakPnl > pnlNow) {
        note = <>Peaked at {fmtINR(peakPnl, true)} ({pctToT1!=null?pctToT1+'% to T1':''}) · now {fmtINR(pnlNow, true)}</>;
      } else if (isWinning) {
        note = <>Riding momentum · LTP +{Math.abs(pctNow).toFixed(1)}% from entry</>;
      } else {
        note = <>Underwater · holding above SL at ₹{sl.toFixed(1)}</>;
      }

      return (
        <div className={'pos-card ' + health}>
          <div className="tile-head">
            <div className="lbl">
              <span className="num">{String(idx).padStart(2,'0')}</span>
              <span>Active position</span>
            </div>
            <Ping kind={health==='warn'?'warn':'ok'} dot label="LIVE" value={dur}/>
          </div>

          <div className="pos-sym">{head} {type && <em>{type}</em>}</div>
          <div className="pos-meta">
            <span>{pos.direction || 'LONG'}</span>
            <span className="sep">·</span>
            <span>{pos.lots||1} lot{(pos.lots||1)>1?'s':''} · {qty} qty</span>
            <span className="sep">·</span>
            <span className="dur">conf {Math.round(pos.confidence||0)}</span>
            <span className="sep">·</span>
            <span>entered {pos.t_in||'—'}</span>
          </div>

          <div className="pos-prices">
            <div className="col">
              <span className="k">Entry</span>
              <span className="v">₹{entry.toFixed(1)}</span>
            </div>
            <div className="arrow" style={isWinning ? {} : {background:'var(--loss-soft)', borderColor:'var(--loss-border)', color:'var(--loss)'}}>→</div>
            <div className="col right">
              <span className="k">LTP · live</span>
              <span className="v"><span className={'cur ' + (flash?'flash':'')} style={{color: isWinning?'var(--win)':'var(--loss)'}}>₹{ltp.toFixed(1)}</span></span>
            </div>
          </div>

          <div>
            <div className="pos-bar">
              <div className="fill"/>
              <div className="mark" style={{left: slPct+'%'}}    data-label="SL"/>
              <div className="mark" style={{left: entryPct+'%'}} data-label="ENTRY"/>
              <div className="mark" style={{left: t1Pct+'%'}}    data-label="T1"/>
              <div className="mark" style={{left: t2Pct+'%'}}    data-label="T2"/>
              <div className="now" style={{left: nowPct+'%'}}/>
            </div>
            <div className="pos-bar-labels">
              <span className="sl">₹{sl.toFixed(0)}</span>
              <span><b>₹{entry.toFixed(0)}</b></span>
              <span className="t1">₹{t1.toFixed(0)}</span>
              <span className="t2">₹{t2.toFixed(0)}</span>
            </div>
          </div>

          <div className="pos-foot">
            <div className="pos-foot-row">
              <div className="pnl-block">
                <span className="k">P&amp;L · unrealised</span>
                <div className="pos-pnl-now" style={{color: isWinning?'var(--win)':'var(--loss)'}}>
                  {fmtINR(pnlNow, true)}
                  <span className="pct" style={{background: isWinning?'var(--win-soft)':'var(--loss-soft)', color: isWinning?'var(--win)':'var(--loss)'}}>
                    {fmtPct(pctNow, 1)}
                  </span>
                </div>
              </div>
              <span className={'pos-verdict ' + verdictKind} style={{
                background: verdictKind==='warn'?'var(--warn-soft)':'var(--win-soft)',
                borderColor: verdictKind==='warn'?'var(--warn-border)':'var(--win-border)',
                color: verdictKind==='warn'?'var(--warn)':'var(--win)'
              }}>
                <span className="dot" style={{background:'currentColor', boxShadow:'0 0 5px currentColor'}}/>
                {verdict} · L-D
              </span>
            </div>
            <div className="pos-note">{note}</div>
          </div>
          <div className="edge"/>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Positions section
    // ─────────────────────────────────────────────────────────
    function PositionsSection({ positions }) {
      if (!positions || positions.length === 0) {
        return (
          <section className="positions">
            <div className="positions-head">
              <span className="title">Open positions <span className="count">0</span></span>

      return (

              Combined unrealised · <b style={{color: totalNet>=0?'var(--win)':'var(--loss)'}}>{fmtINR(totalNet, true)}</b>
              &nbsp;·&nbsp; Layer-D · <b>30s</b>
            </span>

          <div className="positions-grid" data-count={count}>
            {positions.slice(0, 3).map((pos, i) => <PositionCard key={pos.id || i} pos={pos} idx={i+1}/>)}
          </div>
        </section>
      );
    }

    // ─────────────────────────────────────────────────────────
    // PnL Tile
    // ─────────────────────────────────────────────────────────
    function PnLTile({ perfNet, perfGross, brokerage, slippage, equityCurve, maxDD, capital }) {
      const isWin = perfNet >= 0;
      const pctOfCap = capital > 0 ? (perfNet / capital) * 100 : 0;
      const series = (equityCurve || []).map(p => p.v);
      const { line, area, last } = sparkPath(series, 400, 70, 2);

      return (
        <div className="tile t-wide-tall">
          <div className="tile-head">
            <div className="lbl">
              <span className="num">01</span>
              <span>Session P&amp;L</span>
            </div>
            <Ping kind="muted" label="9:15 → NOW"/>
          </div>

          <div className={'pnl-big ' + (isWin?'win':'loss')}>
            <span className="curr">₹</span>
            <span><em>{isWin?'+':'−'}{Math.abs(Math.round(perfNet||0)).toLocaleString('en-IN')}</em></span>
          </div>
          <div className="pnl-sub">
            Net · {fmtPct(pctOfCap, 2)} of capital
            {maxDD < 0 && <>  &nbsp;·&nbsp; <span className="ddh">Max DD {fmtINR(maxDD, true)}</span></>}
          </div>

          {series.length > 1 ? (
            <svg className="equity" viewBox="0 0 400 70" preserveAspectRatio="none">
              <defs>
                <linearGradient id="eqGrad" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0%" stopColor={isWin?'var(--win)':'var(--loss)'} stopOpacity="0.35"/>
                  <stop offset="100%" stopColor={isWin?'var(--win)':'var(--loss)'} stopOpacity="0"/>
                </linearGradient>
              </defs>
              <line x1="0" y1="60" x2="400" y2="60" stroke="var(--line-1)" strokeDasharray="3 4"/>
              <path d={area} fill="url(#eqGrad)"/>
              <path d={line} fill="none" stroke={isWin?'var(--win)':'var(--loss)'} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
              {last && <circle cx={last[0]} cy={last[1]} r="3" fill={isWin?'var(--win)':'var(--loss)'}>
                <animate attributeName="r" values="3;4.5;3" dur="2.4s" repeatCount="indefinite"/>
              </circle>}
            </svg>
          ) : (
            <div style={{height:72, display:'flex', alignItems:'center', justifyContent:'center',
              fontFamily:'var(--font-mono)', fontSize:11, color:'var(--ink-4)',
              letterSpacing:'0.05em', textTransform:'uppercase'}}>

            </div>

            <div><span className="k">Net</span><div className={'v ' + (perfNet>=0?'win':'loss')}>{fmtINR(perfNet||0, true)}</div></div>
          </div>
          <div className="edge"/>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Win-rate tile
    // ─────────────────────────────────────────────────────────
    function WinRateTile({ wins, losses, winRate, streak, expectancy, last10 }) {
      const C = 2 * Math.PI * 45;
      const off = C * (1 - (winRate||0) / 100);
      const recent = last10 || [];
      const closed = wins + losses;
      return (
        <div className="tile t-wide-tall">
          <div className="tile-head">
            <div className="lbl">
              <span className="num">02</span>
              <span>Win rate</span>
            </div>
            <span className="right-meta">All-time · {closed} closed</span>
          </div>
          <div className="ring-wrap" style={{alignItems:'center'}}>
            <svg className="ring-svg" viewBox="0 0 120 120" style={{width:110, height:110}}>
              <defs>
                <linearGradient id="ringGrad" x1="0" x2="1" y1="0" y2="1">
                  <stop offset="0%" stopColor="var(--win)"/>
                  <stop offset="100%" stopColor="var(--info)"/>
                </linearGradient>
              </defs>
              <circle cx="60" cy="60" r="45" className="ring-track"/>
              <circle cx="60" cy="60" r="45" className="ring-prog"
                      stroke="url(#ringGrad)"
                      strokeDasharray={C.toFixed(1)}
                      strokeDashoffset={off.toFixed(1)}/>
              <text x="60" y="60" className="ring-center">
                <tspan>{Math.round(winRate||0)}</tspan><tspan className="pct">%</tspan>
              </text>
            </svg>
            <div className="ring-stats" style={{gap:8}}>

              <div className="ring-row"><span className="l">Streak</span><span className={'v ' + (streak>0?'win':streak<0?'loss':'')}>{streak>0?'+'+streak+'W':streak<0?streak+'L':'—'}</span></div>
              <div className="ring-row"><span className="l">Expectancy</span><span className={'v ' + (expectancy>=0?'win':'loss')}>{fmtINR(expectancy||0, true)}</span></div>
            </div>
          </div>

          {recent.length > 0 && (
            <div style={{marginTop:'auto', paddingTop:14, borderTop:'1px solid var(--line-2)'}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:8}}>
