          <div className="position-monitor-row">
            <span className="label">Entry</span>
            <span className="value">{entry ? entry.toLocaleString('en-IN', {minimumFractionDigits:2}) : '—'}</span>
          </div>
          <div className="position-monitor-row">
            <span className="label">Current</span>
            <span className="value">{cur != null ? cur.toLocaleString('en-IN', {minimumFractionDigits:2}) : '—'}</span>
          </div>
          <div className="position-monitor-row">
            <span className="label">Unrealized P&amp;L</span>
            <span className={`value ${cls}`}>
              {pnl == null ? '—' : (pnl >= 0 ? '+₹' : '−₹') + Math.abs(Math.round(pnl)).toLocaleString('en-IN')}
            </span>
          </div>
          <button className="btn danger" style={{width:'100%', marginTop:12, justifyContent:'center'}} onClick={onClose}>Dismiss</button>
        </div>
      );
    }

    // ===========================================
    // TICKER TAPE
    // ===========================================

    function TickerTape({ live = {} }) {
      // Build live rows from state; show dashes when we don't have data yet
      const items = INST.map(i => {
        const d = live[i.name];
        return d
          ? { name: i.name, spot: d.ltp, change: d.chg || 0, pct: d.pct || 0, hasData: true }
          : { name: i.name, spot: null, change: 0, pct: 0, hasData: false };
      });
      const row = (it, k) => (
        <span key={k} className="tape-item">
          <span className="sym">{it.name}</span>
          <span className="val">
            {it.hasData ? Number(it.spot).toLocaleString('en-IN', {minimumFractionDigits:2}) : '—'}
          </span>
          {it.hasData && (
            <span className={it.change >= 0 ? 'pos' : 'neg'} style={{fontSize:11}}>
              {it.change >= 0 ? '▲' : '▼'} {Math.abs(it.pct).toFixed(2)}%
            </span>
          )}
        </span>
      );
      return (
        <div className="tape">
          <div className="label">LIVE · NSE</div>
          <div className="track">
            {items.map((it,i) => row(it, i))}
            {items.map((it,i) => row(it, 'dup-'+i))}
          </div>
        </div>
      );
    }

    // ===========================================
    // TWEAKS PANEL
    // ===========================================

    const ACCENTS = {
      amber:  { dark: { a:'0.82 0.15 75',  ai:'0.15 0.02 75' },  light:{ a:'0.62 0.16 55',  ai:'0.99 0 0' } },
      indigo: { dark: { a:'0.72 0.17 270', ai:'0.99 0 0' },     light:{ a:'0.52 0.18 270', ai:'0.99 0 0' } },
      emerald:{ dark: { a:'0.78 0.17 160', ai:'0.15 0.02 160' },light:{ a:'0.55 0.15 160', ai:'0.99 0 0' } },
      rose:   { dark: { a:'0.74 0.19 15',  ai:'0.99 0 0' },     light:{ a:'0.58 0.19 15',  ai:'0.99 0 0' } },
    };

    function applyAccent(theme, accent) {
      const a = ACCENTS[accent][theme];
      const r = document.documentElement;
      r.style.setProperty('--accent',        `oklch(${a.a})`);
      r.style.setProperty('--accent-ink',    `oklch(${a.ai})`);
      r.style.setProperty('--accent-dim',    `oklch(${a.a} / 0.20)`);
      r.style.setProperty('--accent-faint',  `oklch(${a.a} / 0.08)`);
    }

    function Tweaks({ theme, setTheme, accent, setAccent, density, setDensity, serverOk, onClose }) {
      const [serverInp, setServerInp] = useState(getServer());
      const [tokInp, setTokInp] = useState(getAuthToken());
      const inputStyle = { width:'100%', background:'var(--bg-2)', border:'1px solid var(--line-1)', color:'var(--ink-0)',
        padding:'8px 10px', borderRadius:'var(--r-sm)', fontFamily:'JetBrains Mono, monospace', fontSize:11.5, outline:'none', marginBottom:6 };
      const dotColor = serverOk === true ? 'var(--long)' : serverOk === false ? 'var(--short)' : 'var(--ink-3)';
      const dotText  = serverOk === true ? 'connected' : serverOk === false ? 'offline' : 'checking…';
      return (
        <div className="tweaks">
          <h4>Settings <button type="button" onClick={onClose} className="btn ghost" style={{height:22, padding:'0 8px', fontSize:10}}>close</button></h4>

          <div className="tweak-row">
            <div className="lbl">
              <span>Connection</span>
              <span className="v" style={{display:'inline-flex', alignItems:'center', gap:5}}>
                <span style={{width:7, height:7, borderRadius:99, background: dotColor, boxShadow: serverOk===true?'0 0 6px var(--long)':'none'}}/>
                {dotText}
              </span>
            </div>
            <input type="text" placeholder="Server URL (e.g. https://intraday.up.railway.app)" value={serverInp}
              onChange={e=>setServerInp(e.target.value)}
              onBlur={e=>setServer(e.target.value)} style={inputStyle}/>
            <input type="password" placeholder="Auth token" value={tokInp}
              onChange={e=>setTokInp(e.target.value)}
              onBlur={e=>setAuthToken(e.target.value)} style={inputStyle}/>
          </div>

          <div className="tweak-row">
            <div className="lbl">Theme <span className="v">{theme}</span></div>
            <div className="theme-toggle" style={{width:'100%'}}>
              <button type="button" className={theme==='dark'?'on':''} onClick={()=>setTheme('dark')} style={{flex:1, borderRadius:99}}>◗ Dark</button>
              <button type="button" className={theme==='light'?'on':''} onClick={()=>setTheme('light')} style={{flex:1, borderRadius:99}}>◐ Light</button>
            </div>
          </div>
          <div className="tweak-row">
            <div className="lbl">Accent <span className="v">{accent}</span></div>
            <div className="swatches">
              {Object.keys(ACCENTS).map(k => {
                const color = `oklch(${ACCENTS[k][theme].a})`;
                return <div key={k} className={`swatch ${accent===k?'on':''}`} style={{background:color}} onClick={()=>setAccent(k)} title={k}/>;
              })}
            </div>
          </div>
          <div className="tweak-row">
            <div className="lbl">Density <span className="v">{density}</span></div>
            <div className="seg" style={{width:'100%'}}>
              <button type="button" className={density==='comfortable'?'on':''} style={{flex:1}} onClick={()=>setDensity('comfortable')}>Comfort</button>
              <button type="button" className={density==='compact'?'on':''} style={{flex:1}} onClick={()=>setDensity('compact')}>Compact</button>
            </div>
          </div>
        </div>
      );
    }

    // ===========================================
    // MAIN APP
    // ===========================================

    function App() {
      const [tab, setTab] = useState(() => localStorage.getItem('se_tab') || 'signals');
      const [inst, setInst] = useState(0);
      const [theme, setThemeState] = useState(() => localStorage.getItem('se_theme') || 'dark');
      const [accent, setAccentState] = useState(() => localStorage.getItem('se_accent') || 'amber');
      const [density, setDensityState] = useState(() => localStorage.getItem('se_density') || 'comfortable');
      const [tweakOpen, setTweakOpen] = useState(false);
      const [showPosMonitor, setShowPosMonitor] = useState(false);

      // ── engine state ─────────────────────────────────
      const [mode, setMode] = useState(() => localStorage.getItem('se_mode') || 'live'); // 'live' | 'replay'
      const [speed, setSpeed] = useState(2); // 1x/2x/4x
      const [replayDays, setReplayDays] = useState(5);
      const [on, setOn] = useState(false);
      const [serverOk, setServerOk] = useState(null);
      const [signals, setSignals] = useState([]);
      const [trades, setTrades] = useState([]);
      const [logLines, setLogLines] = useState([]);
      const [candles, setCandles] = useState({});    // { NIFTY:[...], BANKNIFTY:[...], ... }
      const [live, setLive] = useState({});          // { NIFTY:{ltp, chg, pct}, ... }
      const [replay, setReplay] = useState(null);    // { data, idx, total }
      const [toast, setToast] = useState(null);
      const lastSigId = useRef(null);

      const addLog = (level, msg) => {
        const ist = new Date(Date.now() + 5.5*3600*1000);
        const t = String(ist.getUTCHours()).padStart(2,'0')+':'+String(ist.getUTCMinutes()).padStart(2,'0')+':'+String(ist.getUTCSeconds()).padStart(2,'0');
        setLogLines(prev => [...prev.slice(-199), { t, level, msg }]);
      };

      const showToast = (text, ms=3000) => { setToast(text); setTimeout(()=>setToast(null), ms); };

      const beep = (freq=880) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.frequency.value = freq; o.connect(g); g.connect(ctx.destination);
          g.gain.setValueAtTime(0.0001, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime+0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.18);
          o.start(); o.stop(ctx.currentTime+0.2);
        } catch(e){}
      };

      const notifySignal = (sig) => {
        beep(880); setTimeout(()=>beep(1100), 180);
        showToast(`● ${sig.inst || ''} ${sig.direction || sig.dir || ''} ${sig.option?.strike || sig.strike || ''}`);
        try {
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('Signal Engine', { body: `${sig.inst} ${sig.direction || sig.dir} @ ${sig.option?.strike || sig.strike}`, silent: false });
          }
        } catch(e){}
      };

      const requestNotify = () => { try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch(e){} };

      // Determine current NSE phase from IST clock
      const nsePhase = () => {
        const ist = new Date(Date.now() + 5.5*3600*1000);
        const mins = ist.getUTCHours()*60 + ist.getUTCMinutes();
        const dow  = ist.getUTCDay();
        const wkdy = dow >= 1 && dow <= 5;
        if (!wkdy) return 'closed';
        if (mins < 9*60) return 'pre-market';          // before 09:00
        if (mins < 9*60+15) return 'pre-open';          // 09:00–09:15
        if (mins < 15*60+30) return 'open';             // 09:15–15:30
        return 'closed';
      };

      // Fetch historical candles for all instruments and run analyze() on each
      const preopenScan = async () => {
        addLog('INFO', `Pre-open scan · fetching ${replayDays || 5}d historical for all instruments`);
        const results = [];
        let firstAuthFail = true;
        for (const i of INST) {
          try {
            addLog('TICK', `Loading ${i.name} historical · ${replayDays || 5}d …`);
            const r = await apiJSON(`/api/historical/${i.key}?days=${replayDays || 5}`);
            const arr = r.candles || r.data || r;
            if (!Array.isArray(arr) || arr.length < 20) {
              addLog('INFO', `${i.name} · insufficient data (${arr && arr.length || 0} candles)`);
              continue;
            }
            setCandles(prev => ({ ...prev, [i.name]: arr }));
            addLog('TICK', `${i.name} · ${arr.length} candles loaded · last close ${arr[arr.length-1].close || arr[arr.length-1][4] || '?'}`);
            // analyze
            try {
              const sig = analyze(arr, i, 100000);
              if (sig && sig.direction && sig.direction !== 'NONE') {
                const entry = { id: `PRE-${i.name}-${Date.now()}`, inst: i.name, t: new Date(Date.now()+5.5*3600*1000).toISOString().slice(11,16),
                  dir: sig.direction, type: sig.option?.type || (sig.direction==='LONG'?'CE':'PE'),
                  strike: sig.option?.strike, premium: sig.option?.ltp, confidence: sig.confidence,
                  strategies: sig.strategies, reasons: sig.reasons, status: 'PRE-OPEN' };
                results.push(entry);
                addLog('SIG', `${i.name} · ${sig.direction} ${sig.confidence}% · ${sig.strategies.length} strategies · ${sig.reasons[0] || ''}`);
              } else {
                addLog('INFO', `${i.name} · no signal · conditions not met`);
              }
            } catch (aE) {
              addLog('INFO', `${i.name} · analyze error · ${aE.message || aE}`);
            }
          } catch (e) {
            // surface the server's actual reason if we have one
            const status = e.status || '';
            const reason = e.message || String(e);
            addLog('INFO', `${i.name} · fetch failed · ${reason}`);
            if (status === 401 && firstAuthFail) {
              firstAuthFail = false;
              showToast('Historical 401 — broker session likely expired on server');
              addLog('INFO', '↳ 401 on historical usually means the server-side Angel One session expired. Re-run broker login or check the backend logs.');
            }
          }
        }
        if (results.length) setSignals(prev => [...results, ...prev]);
        addLog('INFO', `Pre-open scan complete · ${results.length} signal${results.length===1?'':'s'} staged`);
        return results;
      };

      const doStart = async () => {
        requestNotify();
        const phase = nsePhase();
        // Flip button immediately so user sees acknowledgment
        setOn(true);
        addLog('INFO', `▶ Start pressed · mode=${mode} · phase=${phase}`);
        showToast(`● Engine ${mode === 'live' ? 'LIVE' : 'REPLAY'} · ${phase}`);

        // Pre-flight: warn if no auth token configured (server will 401 historical otherwise)
        if (!getAuthToken()) {
          addLog('INFO', '⚠ No auth token configured · open ⚙ Tweaks and paste your token');
          showToast('Set auth token in ⚙ Tweaks first');
          setOn(false);
          return;
        }

        try {
          if (mode === 'live') {
            addLog('TICK', 'Pinging server …');
            const ping = await apiFetch('/api/ping');
            if (!ping.ok) throw new Error('server ping failed · HTTP ' + ping.status);
            addLog('INFO', 'Server reachable');

            addLog('TICK', 'Authenticating with broker …');
            try {
              const lr = await apiFetch('/api/login', { method:'POST' });
              if (lr.status === 401) { addLog('INFO', '✗ Auth token rejected (HTTP 401) · check ⚙ Tweaks'); showToast('Auth 401 — check token in Tweaks'); setOn(false); return; }
              if (lr.ok) {
                addLog('INFO', 'Broker login OK');
                // Some backends mint a per-session JWT after broker login. If one is returned, persist it.
                try {
                  const body = await lr.clone().json();
                  const sess = body && (body.token || body.jwt || body.access_token || body.session_token || (body.data && (body.data.jwtToken || body.data.token)));
                  if (sess && typeof sess === 'string' && sess !== getAuthToken()) {
                    setAuthToken(sess);
                    addLog('INFO', '↳ session token refreshed from broker login response');
                  }
                  if (body && body.message) addLog('INFO', `↳ ${body.message}`);
                } catch(_) { /* login response may be empty/non-JSON — that's fine */ }
              } else {
                let bodyTxt = '';
                try { bodyTxt = await lr.text(); } catch(_) {}
                addLog('INFO', `Broker login skipped · HTTP ${lr.status}${bodyTxt ? ' · ' + bodyTxt.slice(0,200) : ''}`);
              }
            } catch(e) { addLog('INFO', 'Broker login warning · ' + (e.message || e)); }

            if (phase === 'open') {
              addLog('TICK', 'Starting live engine …');
              const r = await apiFetch('/api/start', { method:'POST', body: JSON.stringify({ mode:'live' }) });
              if (!r.ok) throw new Error('start HTTP ' + r.status);
              addLog('SIG', 'Engine started · LIVE · scanning ticks every 2s');
              showToast('● Engine LIVE · scanning ticks');
              // Warm candles immediately instead of waiting 30s for the slow poller
              addLog('TICK', 'Warming candles · fetching today\'s history for all instruments');
              (async () => {
                for (const i of INST) {
                  try {
                    const hr = await apiJSON(`/api/historical/${i.key || i.name}?days=1`);
                    const arr = hr.candles || hr.data || hr.bars || (Array.isArray(hr) ? hr : null);
                    if (Array.isArray(arr) && arr.length) {
                      setCandles(prev => ({ ...prev, [i.name]: arr }));
                      addLog('TICK', `${i.name} · ${arr.length} candles loaded`);
                    } else {
                      addLog('INFO', `${i.name} · historical empty or unknown shape`);
                    }
                  } catch (e) {
                    addLog('INFO', `${i.name} · warm-up fetch failed · ${e.message || e}`);
                  }
                }
              })();
            } else {
              addLog('INFO', `Market ${phase} · running pre-open analysis instead of live tick loop`);
              await preopenScan();
              addLog('INFO', `Engine idle · will auto-activate live at 09:15 IST`);
              showToast(phase === 'pre-open' ? 'Pre-open scan complete' : `${phase} · historical scan complete`);
            }
          } else {
            addLog('TICK', `Replay · loading ${replayDays}d @ ${speed}x`);
            await preopenScan();
            addLog('SIG', `Replay running · ${replayDays}d · ${speed}x`);
            showToast('Replay running');
          }
        } catch (e) {
          addLog('INFO', '✗ Start failed · ' + (e.message || e));
          showToast('Start failed — check server + auth token');
          setOn(false); // revert button on hard failure
        }
      };

      const doStop = async () => {
        if (mode === 'live') {
          try { await apiFetch('/api/stop', { method:'POST' }); } catch(e){}
        }
        setOn(false); addLog('INFO', 'Engine stopped'); showToast('Engine stopped');
      };

      const doReset = () => {
        setSignals([]); setTrades([]); setLogLines([]); setReplay(null); lastSigId.current = null;
        addLog('INFO', 'State reset');
      };

      useEffect(() => { localStorage.setItem('se_tab', tab); }, [tab]);
      useEffect(() => { localStorage.setItem('se_mode', mode); }, [mode]);

      // Auto-reveal floating position monitor when an OPEN trade exists
      useEffect(() => {
        const tArr = Array.isArray(trades) ? trades : [];
        const hasOpen = tArr.some(t => t && t.status === 'OPEN');
        if (hasOpen && !showPosMonitor) setShowPosMonitor(true);
        if (!hasOpen && showPosMonitor) setShowPosMonitor(false);
      }, [trades]);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-density', density);
        applyAccent(theme, accent);
      }, [theme, accent, density]);

      // server health ping
      useEffect(() => {
        let alive = true;
        const check = async () => {
          try { const r = await apiFetch('/api/ping'); if (alive) setServerOk(r.ok); }
          catch { if (alive) setServerOk(false); }
        };
        check();
        const id = setInterval(check, 10000);
        return () => { alive = false; clearInterval(id); };
      }, []);

      // live pollers
      useEffect(() => {
        if (!on || mode !== 'live') return;
        let alive = true;
        let lastStatusErr = '';
        const histErr = {}; // { [instName]: lastErrMessage }
        const fast = async () => {
          try {
            const s = await apiJSON('/api/status');
            if (!alive) return;
            lastStatusErr = ''; // success — reset throttle
            if (Array.isArray(s.signals)) setSignals(s.signals);
            if (Array.isArray(s.trades))  setTrades(s.trades);
            if (s.live && typeof s.live === 'object' && !Array.isArray(s.live)) setLive(s.live);
            if (Array.isArray(s.log))     setLogLines(s.log.slice(-200));
            const latest = Array.isArray(s.signals) ? s.signals[0] : null;
            if (latest && latest.id && latest.id !== lastSigId.current) {
              lastSigId.current = latest.id;
              notifySignal(latest);
            }
          } catch(e) {
            const msg = e.message || String(e);
            if (msg !== lastStatusErr) {
              lastStatusErr = msg;
              addLog('INFO', `status poll failed · ${msg}`);
            }
          }
        };
        fast();
        const fastId = setInterval(fast, 2000);
        const pullHistory = async () => {
          for (const i of INST) {
            try {
              const r = await apiJSON(`/api/historical/${i.key || i.name}?days=1`);
              const arr = r.candles || r.data || r.bars || (Array.isArray(r) ? r : null);
              if (alive && Array.isArray(arr) && arr.length) {
                setCandles(prev => ({ ...prev, [i.name]: arr }));
                if (histErr[i.name]) { addLog('TICK', `${i.name} · historical recovered · ${arr.length} candles`); histErr[i.name] = ''; }
              } else if (alive && histErr[i.name] !== 'empty') {
                histErr[i.name] = 'empty';
                addLog('INFO', `${i.name} · historical empty or unknown response shape`);
              }
            } catch(e) {
              const msg = e.message || String(e);
              if (alive && histErr[i.name] !== msg) {
                histErr[i.name] = msg;
                addLog('INFO', `${i.name} · historical poll failed · ${msg}`);
              }
            }
          }
        };
        // kick off history immediately, then refresh every 30s
        pullHistory();
        const slowId = setInterval(pullHistory, 30000);
        return () => { alive = false; clearInterval(fastId); clearInterval(slowId); };
      }, [on, mode]);

      // replay tick
      useEffect(() => {
        if (!on || mode !== 'replay' || !replay) return;
        const id = setInterval(() => {
          setReplay(r => {
            if (!r) return r;
            if (r.idx >= r.total - 1) { clearInterval(id); setOn(false); addLog('INFO','Replay complete'); return r; }
            return { ...r, idx: r.idx + 1 };
          });
        }, Math.max(60, 180 / Math.max(1, speed)));
        return () => clearInterval(id);
      }, [on, mode, replay, speed]);

      const persist = (edits) => {
        Object.entries(edits).forEach(([k, v]) => localStorage.setItem(`se_${k}`, v));
      };

      const setTheme = (v) => { setThemeState(v); persist({ theme:v }); };
      const setAccent = (v) => { setAccentState(v); persist({ accent:v }); };
      const setDensity = (v) => { setDensityState(v); persist({ density:v }); };

      const tabs = [
        { id:'signals', label:'Signals', icon:'◉' },
        { id:'journal', label:'Journal', icon:'📊' },
        { id:'stats', label:'Stats', icon:'📈' },
        { id:'calc', label:'Calculator', icon:'🧮' },
        { id:'log', label:'Engine Log', icon:'⚙' },
      ];

      // ── defensive coercions (never trust the server shape) ──
      const safeSignals = Array.isArray(signals) ? signals : [];
      const safeTrades  = Array.isArray(trades)  ? trades  : [];
      const safeLog     = Array.isArray(logLines) ? logLines : [];
      const safeCandles = (candles && typeof candles === 'object' && !Array.isArray(candles)) ? candles : {};
      const safeLive    = (live && typeof live === 'object' && !Array.isArray(live)) ? live : {};

      return (
        <div key={theme+accent} style={{width:'100%', height:'100%', display:'flex', flexDirection:'column'}}>
          <div className="chrome">
            <div className="brand">
              <div className="mark"/>
              <div className="name">
                <span>Signal Engine</span>
                <span className="sub">Intraday · NSE</span>
              </div>
            </div>

            <div style={{width:1, height:22, background:'var(--line-1)', margin:'0 2px'}}/>

            <MarketClock/>

            <span style={{flex:1}}/>

            <div className="kbd">⌘K</div>
            <span className="muted" style={{fontSize:11.5}}>Search · signals · trades</span>

            <span style={{flex:1}}/>

            <div className="seg" title="engine mode">
              <button type="button" className={mode==='live'?'on':''} onClick={()=>!on && setMode('live')} disabled={on}>LIVE</button>
              <button type="button" className={mode==='replay'?'on':''} onClick={()=>!on && setMode('replay')} disabled={on}>REPLAY</button>
            </div>

            {mode === 'replay' && (
              <>
                <div className="seg" title="replay speed">
                  {[1,2,4].map(x => (
                    <button type="button" key={x} className={speed===x?'on':''} onClick={()=>setSpeed(x)}>{x}x</button>
                  ))}
                </div>
                <div style={{display:'flex', alignItems:'center', gap:6, fontSize:11.5, color:'var(--ink-2)'}}>
                  <span>Days</span>
                  <input type="number" min="1" max="30" value={replayDays} onChange={e=>setReplayDays(parseInt(e.target.value)||5)}
                    style={{width:46, background:'var(--bg-2)', border:'1px solid var(--line-1)', color:'var(--ink-0)', borderRadius:4, padding:'4px 6px', fontFamily:'JetBrains Mono, monospace', fontSize:11.5}}/>
                </div>
              </>
            )}

            <button type="button" className="btn ghost" onClick={() => setTheme(theme==='dark'?'light':'dark')} title="toggle theme">
              {theme==='dark' ? '◐' : '◗'}
            </button>
            <button type="button" className="btn" onClick={() => setTweakOpen(o=>!o)} title="settings">⚙ Tweaks</button>
            {on
              ? <button type="button" className="btn danger" onClick={doStop} title="stop engine">■ Stop</button>
              : <button type="button" className="btn primary" onClick={doStart} title="start engine">▶ Start</button>}
            <button type="button" className="btn ghost" onClick={doReset} title="reset state">⟲</button>
          </div>

          <TickerTape live={live}/>

          {/* engine status bar — always visible when engine is on */}
          {on && (
            <div style={{padding:'10px var(--pad-x)', background:'var(--accent-faint)', borderBottom:'1px solid var(--accent-dim)',
              display:'flex', alignItems:'center', gap:14, fontSize:12}}>
              <span style={{width:8, height:8, borderRadius:99, background:'var(--accent)', boxShadow:'0 0 8px var(--accent)', animation:'heart 1.4s ease-in-out infinite'}}/>
              <span style={{color:'var(--accent)', fontWeight:600, letterSpacing:'0.08em', textTransform:'uppercase', fontSize:10.5}}>
                Engine {mode === 'live' ? (nsePhase()==='open' ? 'LIVE · ticks' : `IDLE · ${nsePhase()}`) : `REPLAY · ${replayDays}d @ ${speed}x`}
              </span>
              <span style={{flex:1}}/>
              <span className="muted mono" style={{fontSize:11}}>
                {Object.keys(safeCandles).length}/{INST.length} inst loaded · {safeSignals.length} signal{safeSignals.length===1?'':'s'} staged · {safeLog.length} log lines
              </span>
            </div>
          )}

          <div className="hero">
            <div>
              <div className="title">Today's <em>edge</em>, engineered.</div>
              <div className="sub">Six confluence strategies scanning NIFTY, BANKNIFTY and FINNIFTY tick-by-tick. Signals fire only when at least two align with sufficient confidence — and stop loss, targets, and time exit are set before you click.</div>
            </div>
            <div className="rightcol">
              {(() => {
                const closed = safeTrades.filter(t => t && t.status && t.status !== 'OPEN');
                const pnl = closed.reduce((a, b) => a + (Number(b.pnl) || 0), 0);
                const wins = closed.filter(t => t.status === 'WIN').length;
                const winRate = closed.length ? Math.round((wins / closed.length) * 100) : 0;
                const totalCandles = Object.values(safeCandles).reduce((a,c)=> a + (Array.isArray(c) ? c.length : 0), 0);
                const fired = safeSignals.length;
                const open = safeSignals.filter(s => s && s.status === 'OPEN').length;
                const pnlCls = pnl >= 0 ? 'pos' : 'neg';
                return <>
                  <div className="metric" style={{minWidth:140, padding:'10px 14px'}}>
                    <div className="label">Today P&amp;L</div>
                    <div className={`val ${pnlCls}`} style={{fontSize:20}}>
                      {closed.length === 0 ? '₹0' : (pnl >= 0 ? '+₹' : '−₹') + Math.abs(Math.round(pnl)).toLocaleString('en-IN')}
                    </div>
                    <div className={`delta ${pnlCls}`} style={{fontSize:11}}>
                      {closed.length === 0 ? '— no trades yet' : `${closed.length} trade${closed.length===1?'':'s'} · ${winRate}% win`}
                    </div>
                  </div>
                  <div className="metric" style={{minWidth:140, padding:'10px 14px'}}>
                    <div className="label">Scanned</div>
                    <div className="val" style={{fontSize:20}}>{totalCandles.toLocaleString('en-IN')}</div>
                    <div className="delta dim" style={{fontSize:11}}>{fired} fired · {open} open</div>
                  </div>
                </>;
              })()}
            </div>
          </div>

          <div className="tabs" style={{marginTop:14}}>
            {tabs.map(t => (
              <button key={t.id} className={`tab ${tab===t.id?'on':''}`} onClick={()=>setTab(t.id)}>
                {t.icon && <span style={{opacity:0.7, fontSize:8}}>{t.icon}</span>}
                {t.label}
              </button>
            ))}
          </div>

          <div key={tab} className="reveal-enter" style={{flex:1, overflowY:'auto'}}>
            {tab === 'signals' && <SignalsTab sel={inst} setSel={setInst} signals={safeSignals} candles={safeCandles} live={safeLive} on={on}/>}
            {tab === 'journal' && <JournalTab trades={safeTrades}/>}
            {tab === 'stats' && <StatsTab trades={safeTrades} signals={safeSignals}/>}
            {tab === 'calc' && <CalcTab/>}
            {tab === 'log' && <LogTab logLines={safeLog} onClear={()=>setLogLines([])}/>}
          </div>

          {showPosMonitor && <PositionMonitor open={safeTrades.find(t => t && t.status === 'OPEN')} live={safeLive} onClose={()=>setShowPosMonitor(false)}/>}
          {tweakOpen && <Tweaks theme={theme} setTheme={setTheme} accent={accent} setAccent={setAccent} density={density} setDensity={setDensity} serverOk={serverOk} onClose={()=>setTweakOpen(false)}/>}

          {toast && (
            <div style={{position:'fixed', bottom:28, left:'50%', transform:'translateX(-50%)', zIndex:200,
              background:'var(--bg-elev)', backdropFilter:'blur(18px) saturate(140%)',
              border:'1px solid var(--accent)', borderRadius:'var(--r-md)', padding:'10px 18px',
              fontSize:12.5, color:'var(--ink-0)', boxShadow:'var(--shadow-lg), 0 0 32px var(--accent-faint)',
              animation:'fade-up 320ms cubic-bezier(.2,.7,.2,1)'}}>
              {toast}
            </div>
          )}

          <footer style={{padding:'24px var(--pad-x) 100px', textAlign:'center', color:'var(--ink-3)', fontSize:11, fontFamily:'JetBrains Mono, monospace', letterSpacing:'0.08em', flexShrink:0}}>
            SIGNAL ENGINE v2.5 · build <span style={{color:'var(--ink-2)'}}>{(document.querySelector('meta[name=\"build-stamp\"]')||{}).content || 'dev'}</span> · PAPER-TRADING DEMO · NOT INVESTMENT ADVICE
          </footer>
        </div>
      );
    }

    // ===========================================
    // ERROR BOUNDARY
    // A single bad shape from the server should never blank the page.
    // ===========================================

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      componentDidCatch(error, info) { try { console.error('[Signal Engine] render error:', error, info); } catch(e){} }
      reset = () => { try { location.reload(); } catch(e) { this.setState({ error: null }); } };
      render() {
        if (!this.state.error) return this.props.children;
        return (
          <div style={{padding:'60px 24px', maxWidth:560, margin:'0 auto', fontFamily:'Inter, sans-serif', color:'var(--ink-0)'}}>
            <div style={{fontFamily:'Instrument Serif, serif', fontSize:34, lineHeight:1, color:'var(--ink-0)', marginBottom:10}}>
              Something <em style={{color:'var(--accent)'}}>went sideways</em>.
            </div>
            <div style={{fontSize:13, color:'var(--ink-2)', marginBottom:18, lineHeight:1.6}}>
              The dashboard hit a render error. Your data is safe — this is usually a bad response shape from the server. The details are in the browser console.
            </div>
            <pre style={{background:'var(--bg-2)', border:'1px solid var(--line-1)', borderRadius:8, padding:12, fontFamily:'JetBrains Mono, monospace', fontSize:11.5, color:'var(--short)', overflowX:'auto', marginBottom:16, whiteSpace:'pre-wrap'}}>
              {String(this.state.error && this.state.error.message || this.state.error)}
            </pre>
            <button type="button" className="btn primary" onClick={this.reset}>⟲ Reload dashboard</button>
          </div>
        );
      }
    }

    // ===========================================
    // RENDER
    // ===========================================

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary><App/></ErrorBoundary>
    );
  </script>
</body>
</html>
