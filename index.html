</head>
<body>
  <div class="aurora" aria-hidden="true">
    <div class="grid"></div>
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>
    <div class="orb d"></div>
  </div>
  <div id="root"></div>

  <script>
    try {
      const saved = localStorage.getItem('ie-theme');
      document.documentElement.setAttribute('data-theme', (saved === 'light' || saved === 'dark') ? saved : 'light');
    } catch(e){ document.documentElement.setAttribute('data-theme','light'); }
  </script>

  <script crossOrigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossOrigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ─────────────────────────────────────────────────────────
    // Server / Auth helpers
    // ─────────────────────────────────────────────────────────
    const DEFAULT_SERVER = "";
    const getServer = () => localStorage.getItem('signal_server_url') || DEFAULT_SERVER;
    const setServer = (url) => localStorage.setItem('signal_server_url', (url||'').replace(/\/$/,''));
    const API = (path) => { const s = getServer(); return s ? s + path : path; };
    const getAuthToken = () => localStorage.getItem('signal_auth_token') || '';
    const setAuthToken = (token) => {
      if (token) localStorage.setItem('signal_auth_token', token.trim());
      else localStorage.removeItem('signal_auth_token');
    };

    async function apiFetch(path, opts) {
      opts = opts || {};
      const headers = Object.assign({}, opts.headers || {});
      const tok = getAuthToken();
      if (tok) headers['X-Auth-Token'] = tok;
      if (opts.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
      return fetch(API(path), Object.assign({ credentials: 'include' }, opts, { headers }));
    }
    async function apiJSON(path, opts) {
      const r = await apiFetch(path, opts);
      if (!r.ok) {
        let body = '';
        try { body = await r.text(); } catch(e) {}
        const err = new Error('API ' + r.status + (body ? ' · ' + body.slice(0,160) : ''));
        err.status = r.status;
        throw err;
      }
      return r.json();
    }

    // ─────────────────────────────────────────────────────────
    // Formatting + math helpers
    // ─────────────────────────────────────────────────────────
    const fmtINR = (n, signed) => {
      if (n == null || isNaN(n)) return '—';
      const abs = Math.abs(Math.round(n));
      const sign = n >= 0 ? (signed?'+':'') : '−';
      return sign + '₹' + abs.toLocaleString('en-IN');
    };
    const fmtNum = (n, dp) => {
      if (n == null || isNaN(n)) return '—';
      return Number(n).toLocaleString('en-IN', { minimumFractionDigits: dp||0, maximumFractionDigits: dp||0 });
    };
    const fmtPct = (n, dp) => {
      if (n == null || isNaN(n)) return '—';
      return (n>=0?'+':'') + Number(n).toFixed(dp||2) + '%';
    };

    function sparkPath(series, w, h, pad) {
      pad = pad || 2;
      if (!series || series.length < 2) return { line: '', area: '', last: null };
      const mn = Math.min.apply(null, series);
      const mx = Math.max.apply(null, series);
      const range = mx - mn || 1;
      const step = (w - pad*2) / (series.length - 1);
      const points = series.map((v, i) => {
        const x = pad + i * step;
        const y = pad + (1 - (v - mn) / range) * (h - pad*2);
        return [x, y];
      });
      const line = points.map((p, i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      const area = line + ' L ' + (w-pad).toFixed(1) + ' ' + (h-pad).toFixed(1) + ' L ' + pad.toFixed(1) + ' ' + (h-pad).toFixed(1) + ' Z';
      return { line, area, last: points[points.length-1] };
    }

    // Humanize option symbol BANKNIFTY26MAY2654300CE → ['BANKNIFTY 54300', 'CE']
    function humanizeSym(sym) {
      if (!sym) return ['—', ''];
      const s = String(sym).toUpperCase();
      const m = s.match(/^([A-Z]+?)(\d{1,2})([A-Z]{3})(\d{2})(\d{3,6})(CE|PE)$/);
      if (m) {
        const [, idx, day, mon, yr, strike, type] = m;
        return [idx + ' ' + strike, type];
      }
      // Fallback split CE/PE if present at end
      const m2 = s.match(/^(.+?)(CE|PE)$/);
      if (m2) return [m2[1], m2[2]];
      return [s, ''];
    }

    function instOf(sym) {
      if (!sym) return 'NIFTY';
      const s = String(sym).toUpperCase();
      if (s.startsWith('BANKNIFTY')) return 'BANKNIFTY';
      if (s.startsWith('FINNIFTY')) return 'FINNIFTY';
      if (s.startsWith('NIFTY')) return 'NIFTY';
      return 'NIFTY';
    }

    function todayISO() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function ddMonYY() {
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const d = new Date();
      return String(d.getDate()).padStart(2,'0') + ' ' + months[d.getMonth()] + ' · ' + d.getFullYear();
    }

    function weekday() {
      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      return days[new Date().getDay()];
    }

    // Compute duration HH:MM:SS from "HH:MM" string today
    function durFromHHMM(t_in) {
      if (!t_in) return '—';
      const [h, m] = String(t_in).split(':').map(x => parseInt(x,10));
      if (isNaN(h)) return '—';
      const start = new Date();
      start.setHours(h, m||0, 0, 0);
      let ms = Date.now() - start.getTime();
      if (ms < 0) ms = 0;
      const hh = Math.floor(ms / 3600000);
      const mm = Math.floor((ms % 3600000) / 60000);
      const ss = Math.floor((ms % 60000) / 1000);
      return String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
    }

    // ─────────────────────────────────────────────────────────
    // Theme hook
    // ─────────────────────────────────────────────────────────
    function useTheme() {
      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem('ie-theme') || 'light'; } catch(e){ return 'light'; }
      });
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        try { localStorage.setItem('ie-theme', theme); } catch(e){}
      }, [theme]);
      const toggle = () => setTheme(t => t === 'dark' ? 'light' : 'dark');
      return [theme, toggle];
    }

    // ─────────────────────────────────────────────────────────
    // Polling hook
    // ─────────────────────────────────────────────────────────
    function usePoll(path, intervalMs, opts) {
      opts = opts || {};
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const enabled = opts.enabled !== false;
      useEffect(() => {
        if (!enabled) return;
        let cancelled = false;
        let timer = null;
        async function tick() {
          try {
            const j = await apiJSON(path);
            if (!cancelled) { setData(j); setErr(null); }
          } catch (e) {
            if (!cancelled) setErr(e);
          } finally {
            if (!cancelled) timer = setTimeout(tick, intervalMs);
          }
        }
        tick();
        return () => { cancelled = true; if (timer) clearTimeout(timer); };
      }, [path, intervalMs, enabled]);
      return [data, err];
    }

    // ─────────────────────────────────────────────────────────
    // Ping component
    // ─────────────────────────────────────────────────────────
    function Ping({ kind, dot, label, value }) {
      const cls = 'ping ' + (kind === 'ok' ? '' : (kind || ''));
      return (
        <span className={cls}>
          {dot && <span className="d"/>}
          {label}{value && <> · <b>{value}</b></>}
        </span>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Status bar
    // ─────────────────────────────────────────────────────────
    function StatusBar({ engineState, clock, theme, onToggleTheme, userName, onProfileClick, onTrip, onReset, onOpenBacktest, busy }) {
      const isLive = engineState === 'LIVE';
      const isOff  = engineState === 'OFF';

      return (
        <header className="status">
          <div className="brand">
            <div className="logo">I</div>
            <div className="brand-block">
              <div className="brand-name">Intraday <em>Engine</em></div>
              <div className="brand-tag">v2 · Trend-Momentum</div>
            </div>
          </div>

          <div className="clock">
            <b>{clock.hh}:{clock.mm}:{String(clock.ss).padStart(2,'0')}</b>
            <span className="ms"> IST</span>
          </div>
          <div className="divide"/>
          <div className="session">
            <b>{weekday()}</b> · Live console · Cutoff <b>15:15</b>
          </div>

          <div className="spacer"/>

          <div className="pings">
            {isLive && <Ping kind="ok"  dot label="ENGINE" value="LIVE"/>}
            {!isLive && !isOff && <Ping kind="warn" dot label="ENGINE" value="IDLE"/>}
            {isOff  && <Ping kind="muted" label="ENGINE" value="OFF"/>}
            <Ping kind="info" dot label="STRAT" value="V2"/>
          </div>

          <div className="divide"/>
          <div className="actions">
            {isLive
              ? <button className="btn danger" onClick={onTrip} disabled={busy}>Stop</button>
              : <button className="btn primary" onClick={onReset} disabled={busy}>Start</button>}
            <button className="btn" onClick={onOpenBacktest}>Backtest</button>
            <button className="btn btn-icon" title={theme === 'dark' ? 'Switch to light' : 'Switch to dark'} onClick={onToggleTheme}>
              {theme === 'dark'
                ? (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                  </svg>)
                : (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                  </svg>)
              }
            </button>
            <button className="avatar" title={userName + ' · click to set capital'} onClick={onProfileClick}>
              {(userName || 'K')[0].toUpperCase()}
            </button>
          </div>
        </header>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Masthead
    // ─────────────────────────────────────────────────────────
    function Masthead({ perfNet, openCount, streak, dayLabel, dayCount }) {
      const pnl = perfNet || 0;
      const pnlAbs = Math.abs(Math.round(pnl));
      const isWin = pnl >= 0;
      const arrow = isWin ? '▲' : '▼';

      let h1, lede;
      if (openCount > 0) {
        h1 = <>Live · <em>{openCount}</em> position{openCount===1?'':'s'} open.</>;
        lede = <>{streak>0?(<><b>{streak}-trade</b> <em>win streak</em>. </>):null}
          Layer-D monitoring {openCount===1?'this trade':'each trade'} · <em>net of brokerage &amp; slippage.</em></>;
      } else if (pnl > 0) {
        h1 = <>Up <em>{fmtINR(pnl, true)}</em> today.</>;
        lede = <>{dayCount} closed trade{dayCount===1?'':'s'} today. Engine standing by for the next high-conviction setup.</>;
      } else if (pnl < 0) {
        h1 = <>Down <em className="loss">{fmtINR(pnl, true)}</em> today.</>;
        lede = <>{dayCount} closed trade{dayCount===1?'':'s'} today. Engine continues watching for the next setup.</>;
      } else {
        h1 = <>Engine <em>standing by.</em></>;
        lede = <>No trades fired yet · scanning for high-conviction setups. <em>Layer-A regime check</em> active.</>;
      }

      return (
        <section className="mast">
          <div className="left">
            <div className="kick">
              <span>Intraday Console</span>
              <span className="sep">·</span>
              <span>{weekday()} · {dayLabel}</span>
              <span className="sep">·</span>
              <span>Live signals</span>
            </div>
            <h1>{h1}</h1>
            <p className="lede">{lede}</p>
          </div>

          <div className="right">
            <span className="label">SESSION P&amp;L · NET</span>
            <span className="big">{isWin?'+':'−'}₹{pnlAbs.toLocaleString('en-IN')} {pnl !== 0 && <em>{arrow}</em>}</span>

            <div className="row">
              <div>
                <span className="label">OPEN</span>
                <span className="val" style={{color: 'var(--info)'}}>{openCount}</span>
              </div>
              <div>
                <span className="label">CLOSED</span>
                <span className="val">{dayCount}</span>
              </div>
              <div>
                <span className="label">STREAK</span>
                <span className="val">{streak > 0 ? <span style={{color:'var(--win)'}}>+{streak}W</span> : streak < 0 ? <span style={{color:'var(--loss)'}}>{streak}L</span> : '—'}</span>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Position card
    // ─────────────────────────────────────────────────────────
    function PositionCard({ pos, idx }) {
      const sym = pos.option_symbol || ((pos.instrument||'') + ' ' + (pos.option_strike||'') + ' ' + (pos.option_type||''));
      const [head, type] = humanizeSym(sym);
      const entry = +pos.entry || 0;
      const ltp   = pos.current_premium != null ? +pos.current_premium : entry;
      const sl    = +pos.sl || (entry * 0.6);
      const t1    = +pos.t1 || (entry * 1.5);
      const t2    = +pos.t2 || (entry * 2.0);
      const totalRange = (t2 - sl) || 1;
      const nowPct   = Math.max(2, Math.min(98, ((ltp - sl) / totalRange) * 100));
      const slPct    = 0;
      const entryPct = ((entry - sl) / totalRange) * 100;
      const t1Pct    = ((t1 - sl) / totalRange) * 100;
      const t2Pct    = 100;
      const qty = +pos.qty || 0;
      const pnlNow = pos.pnl_now != null ? +pos.pnl_now : (ltp - entry) * qty;
      const pctNow = entry > 0 ? ((ltp - entry) / entry) * 100 : 0;
      const isWinning = pnlNow >= 0;
      const health = isWinning ? 'win' : 'warn';
      const verdictKind = isWinning ? 'win' : 'warn';
      const verdict = isWinning ? 'HOLD' : 'WATCH';
      const expiry = '—'; // engine doesn't expose expiry on open signal — could parse from symbol

      const peakPremium = pos.peak_premium;
      const peakPnl = pos.pnl_peak;
      const pctToT1 = pos.pct_to_t1;

      const [flash, setFlash] = useState(false);
      const prevLtp = useRef(ltp);
      useEffect(() => {
        if (prevLtp.current !== ltp) {
          prevLtp.current = ltp;
          setFlash(true);
          const id = setTimeout(() => setFlash(false), 950);
          return () => clearTimeout(id);
        }
      }, [ltp]);

      // Live ticking duration
      const [dur, setDur] = useState(() => durFromHHMM(pos.t_in));
      useEffect(() => {
        const id = setInterval(() => setDur(durFromHHMM(pos.t_in)), 1000);
        return () => clearInterval(id);
      }, [pos.t_in]);

      let note;
      if (peakPnl != null && peakPnl > pnlNow) {
        note = <>Peaked at {fmtINR(peakPnl, true)} ({pctToT1!=null?pctToT1+'% to T1':''}) · now {fmtINR(pnlNow, true)}</>;
      } else if (isWinning) {
        note = <>Riding momentum · LTP +{Math.abs(pctNow).toFixed(1)}% from entry</>;
      } else {
        note = <>Underwater · holding above SL at ₹{sl.toFixed(1)}</>;
      }

      return (
        <div className={'pos-card ' + health}>
          <div className="tile-head">
            <div className="lbl">
              <span className="num">{String(idx).padStart(2,'0')}</span>
              <span>Active position</span>
            </div>
            <Ping kind={health==='warn'?'warn':'ok'} dot label="LIVE" value={dur}/>
          </div>

          <div className="pos-sym">{head} {type && <em>{type}</em>}</div>
          <div className="pos-meta">
            <span>{pos.direction || 'LONG'}</span>
            <span className="sep">·</span>
            <span>{pos.lots||1} lot{(pos.lots||1)>1?'s':''} · {qty} qty</span>
            <span className="sep">·</span>
            <span className="dur">conf {Math.round(pos.confidence||0)}</span>
            <span className="sep">·</span>
            <span>entered {pos.t_in||'—'}</span>
          </div>

          <div className="pos-prices">
            <div className="col">
              <span className="k">Entry</span>
              <span className="v">₹{entry.toFixed(1)}</span>
            </div>
            <div className="arrow" style={isWinning ? {} : {background:'var(--loss-soft)', borderColor:'var(--loss-border)', color:'var(--loss)'}}>→</div>
            <div className="col right">
              <span className="k">LTP · live</span>
              <span className="v"><span className={'cur ' + (flash?'flash':'')} style={{color: isWinning?'var(--win)':'var(--loss)'}}>₹{ltp.toFixed(1)}</span></span>
            </div>
          </div>

          <div>
            <div className="pos-bar">
              <div className="fill"/>
              <div className="mark" style={{left: slPct+'%'}}    data-label="SL"/>
              <div className="mark" style={{left: entryPct+'%'}} data-label="ENTRY"/>
              <div className="mark" style={{left: t1Pct+'%'}}    data-label="T1"/>
              <div className="mark" style={{left: t2Pct+'%'}}    data-label="T2"/>
              <div className="now" style={{left: nowPct+'%'}}/>
            </div>
            <div className="pos-bar-labels">
              <span className="sl">₹{sl.toFixed(0)}</span>
              <span><b>₹{entry.toFixed(0)}</b></span>
              <span className="t1">₹{t1.toFixed(0)}</span>
              <span className="t2">₹{t2.toFixed(0)}</span>
            </div>
          </div>

          <div className="pos-foot">
            <div className="pos-foot-row">
              <div className="pnl-block">
                <span className="k">P&amp;L · unrealised</span>
                <div className="pos-pnl-now" style={{color: isWinning?'var(--win)':'var(--loss)'}}>
                  {fmtINR(pnlNow, true)}
                  <span className="pct" style={{background: isWinning?'var(--win-soft)':'var(--loss-soft)', color: isWinning?'var(--win)':'var(--loss)'}}>
                    {fmtPct(pctNow, 1)}
                  </span>
                </div>
              </div>
              <span className={'pos-verdict ' + verdictKind} style={{
                background: verdictKind==='warn'?'var(--warn-soft)':'var(--win-soft)',
                borderColor: verdictKind==='warn'?'var(--warn-border)':'var(--win-border)',
                color: verdictKind==='warn'?'var(--warn)':'var(--win)'
              }}>
                <span className="dot" style={{background:'currentColor', boxShadow:'0 0 5px currentColor'}}/>
                {verdict} · L-D
              </span>
            </div>
            <div className="pos-note">{note}</div>
          </div>
          <div className="edge"/>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Positions section
    // ─────────────────────────────────────────────────────────
    function PositionsSection({ positions }) {
      if (!positions || positions.length === 0) {
        return (
          <section className="positions">
            <div className="positions-head">
              <span className="title">Open positions <span className="count">0</span></span>
              <span className="meta">No active trades · <b>scanning</b></span>
            </div>
            <div className="positions-grid" data-count="1">
              <div className="pos-card" style={{alignItems:'center',justifyContent:'center',textAlign:'center',minHeight:200}}>
                <div style={{fontFamily:'var(--font-display)',fontSize:24,fontWeight:600,color:'var(--ink-1)'}}>
                  No <em style={{fontFamily:'var(--font-italic)',color:'var(--accent)',fontStyle:'italic'}}>open positions.</em>
                </div>
                <div style={{fontFamily:'var(--font-mono)',fontSize:10.5,letterSpacing:'0.05em',color:'var(--ink-3)',textTransform:'uppercase',marginTop:8}}>
                  Engine watching markets
                </div>
                <div className="edge"/>
              </div>
            </div>
          </section>
        );
      }

      const totalNet = positions.reduce((a, p) => a + (+p.pnl_now || 0), 0);
      const count = Math.min(positions.length, 3);

      return (
        <section className="positions">
          <div className="positions-head">
            <span className="title">Open positions <span className="count">{positions.length}</span></span>
            <span className="meta">
              Combined unrealised · <b style={{color: totalNet>=0?'var(--win)':'var(--loss)'}}>{fmtINR(totalNet, true)}</b>
              &nbsp;·&nbsp; Layer-D · <b>30s</b>
            </span>
          </div>
          <div className="positions-grid" data-count={count}>
            {positions.slice(0, 3).map((pos, i) => <PositionCard key={pos.id || i} pos={pos} idx={i+1}/>)}
          </div>
        </section>
      );
    }

    // ─────────────────────────────────────────────────────────
    // PnL Tile
    // ─────────────────────────────────────────────────────────
    function PnLTile({ perfNet, perfGross, brokerage, slippage, equityCurve, maxDD, capital }) {
      const isWin = perfNet >= 0;
      const pctOfCap = capital > 0 ? (perfNet / capital) * 100 : 0;
      const series = (equityCurve || []).map(p => p.v);
      const { line, area, last } = sparkPath(series, 400, 70, 2);

      return (
        <div className="tile t-wide-tall">
          <div className="tile-head">
            <div className="lbl">
              <span className="num">01</span>
              <span>Session P&amp;L</span>
            </div>
            <Ping kind="muted" label="9:15 → NOW"/>
          </div>

          <div className={'pnl-big ' + (isWin?'win':'loss')}>
            <span className="curr">₹</span>
            <span><em>{isWin?'+':'−'}{Math.abs(Math.round(perfNet||0)).toLocaleString('en-IN')}</em></span>
          </div>
          <div className="pnl-sub">
            Net · {fmtPct(pctOfCap, 2)} of capital
            {maxDD < 0 && <>  &nbsp;·&nbsp; <span className="ddh">Max DD {fmtINR(maxDD, true)}</span></>}
          </div>

          {series.length > 1 ? (
            <svg className="equity" viewBox="0 0 400 70" preserveAspectRatio="none">
              <defs>
                <linearGradient id="eqGrad" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0%" stopColor={isWin?'var(--win)':'var(--loss)'} stopOpacity="0.35"/>
                  <stop offset="100%" stopColor={isWin?'var(--win)':'var(--loss)'} stopOpacity="0"/>
                </linearGradient>
              </defs>
              <line x1="0" y1="60" x2="400" y2="60" stroke="var(--line-1)" strokeDasharray="3 4"/>
              <path d={area} fill="url(#eqGrad)"/>
              <path d={line} fill="none" stroke={isWin?'var(--win)':'var(--loss)'} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
              {last && <circle cx={last[0]} cy={last[1]} r="3" fill={isWin?'var(--win)':'var(--loss)'}>
                <animate attributeName="r" values="3;4.5;3" dur="2.4s" repeatCount="indefinite"/>
              </circle>}
            </svg>
          ) : (
            <div style={{height:72, display:'flex', alignItems:'center', justifyContent:'center',
              fontFamily:'var(--font-mono)', fontSize:11, color:'var(--ink-4)',
              letterSpacing:'0.05em', textTransform:'uppercase'}}>
              No closed trades yet today
            </div>
          )}

          <div className="pnl-grid">
            <div><span className="k">Gross</span><div className={'v ' + (perfGross>=0?'win':'loss')}>{fmtINR(perfGross||0, true)}</div></div>
            <div><span className="k">Brokerage</span><div className="v muted">−₹{Math.abs(Math.round(brokerage||0))}</div></div>
            <div><span className="k">Slippage</span><div className="v muted">−₹{Math.abs(Math.round(slippage||0))}</div></div>
            <div><span className="k">Net</span><div className={'v ' + (perfNet>=0?'win':'loss')}>{fmtINR(perfNet||0, true)}</div></div>
          </div>
          <div className="edge"/>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Win-rate tile
    // ─────────────────────────────────────────────────────────
    function WinRateTile({ wins, losses, winRate, streak, expectancy, last10 }) {
      const C = 2 * Math.PI * 45;
      const off = C * (1 - (winRate||0) / 100);
      const recent = last10 || [];
      const closed = wins + losses;
      return (
        <div className="tile t-wide-tall">
          <div className="tile-head">
            <div className="lbl">
              <span className="num">02</span>
              <span>Win rate</span>
            </div>
            <span className="right-meta">All-time · {closed} closed</span>
          </div>
          <div className="ring-wrap" style={{alignItems:'center'}}>
            <svg className="ring-svg" viewBox="0 0 120 120" style={{width:110, height:110}}>
              <defs>
                <linearGradient id="ringGrad" x1="0" x2="1" y1="0" y2="1">
                  <stop offset="0%" stopColor="var(--win)"/>
                  <stop offset="100%" stopColor="var(--info)"/>
                </linearGradient>
              </defs>
              <circle cx="60" cy="60" r="45" className="ring-track"/>
              <circle cx="60" cy="60" r="45" className="ring-prog"
                      stroke="url(#ringGrad)"
                      strokeDasharray={C.toFixed(1)}
                      strokeDashoffset={off.toFixed(1)}/>
              <text x="60" y="60" className="ring-center">
                <tspan>{Math.round(winRate||0)}</tspan><tspan className="pct">%</tspan>
              </text>
            </svg>
            <div className="ring-stats" style={{gap:8}}>
              <div className="ring-row"><span className="l">Wins</span><span className="v win">{wins||0}</span></div>
              <div className="ring-row"><span className="l">Losses</span><span className="v loss">{losses||0}</span></div>
              <div className="ring-row"><span className="l">Streak</span><span className={'v ' + (streak>0?'win':streak<0?'loss':'')}>{streak>0?'+'+streak+'W':streak<0?streak+'L':'—'}</span></div>
              <div className="ring-row"><span className="l">Expectancy</span><span className={'v ' + (expectancy>=0?'win':'loss')}>{fmtINR(expectancy||0, true)}</span></div>
            </div>
          </div>

          {recent.length > 0 && (
            <div style={{marginTop:'auto', paddingTop:14, borderTop:'1px solid var(--line-2)'}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:8}}>
                <span style={{fontFamily:'var(--font-mono)',fontSize:9,letterSpacing:'0.12em',textTransform:'uppercase',color:'var(--ink-3)'}}>Last {recent.length} trades</span>
                <span style={{fontFamily:'var(--font-mono)',fontSize:10,color:'var(--ink-2)',letterSpacing:'0.04em'}}>{recent.filter(w=>w).length}W · {recent.filter(w=>!w).length}L</span>
              </div>
              <div style={{display:'flex',gap:4,height:22}}>
                {recent.map((w, idx) => (
                  <div key={idx} style={{
                    flex:1, height:'100%', borderRadius:3,
                    background: w ? 'linear-gradient(180deg, var(--win), var(--win-soft))' : 'linear-gradient(180deg, var(--loss), var(--loss-soft))',
                    opacity: 0.4 + (idx/recent.length)*0.6,
                  }}/>
                ))}
              </div>
            </div>
          )}
          <div className="edge"/>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Index tile
    // ─────────────────────────────────────────────────────────
    function IndexTile({ name, ltp, pct, pts, spark, i }) {
      const up = (pct||0) >= 0;
      const series = (spark && spark.length > 1) ? spark : [ltp||0, ltp||0];
      const { line, area, last } = sparkPath(series, 220, 34, 2);
      return (
        <div className="tile t-md">
          <div className="idx">
            <div className="idx-top">
              <div className="idx-name"><span className="dot-live"/>{name}</div>
              <div className={'idx-pct ' + (up?'up':'dn')}>{fmtPct(pct, 2)}</div>
            </div>
            <div>
              <div className="idx-ltp">{ltp != null ? fmtNum(ltp, 2) : '—'}</div>
              <div className={'idx-pts ' + (up?'up':'dn')}>{up?'+':'−'}{Math.abs(pts||0).toFixed(2)} pts</div>
            </div>
            <svg className="idx-spark" viewBox="0 0 220 34" preserveAspectRatio="none">
              <defs>
                <linearGradient id={'sparkGrad'+i} x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0%"   stopColor={up?'var(--win)':'var(--loss)'} stopOpacity="0.30"/>
                  <stop offset="100%" stopColor={up?'var(--win)':'var(--loss)'} stopOpacity="0"/>
                </linearGradient>
              </defs>
              <path d={area} fill={'url(#sparkGrad'+i+')'}/>
              <path d={line} fill="none" stroke={up?'var(--win)':'var(--loss)'} strokeWidth="1.4" strokeLinecap="round"/>
              {last && <circle cx={last[0]} cy={last[1]} r="2.2" fill={up?'var(--win)':'var(--loss)'}/>}
            </svg>
          </div>
          <div className="edge"/>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Strategy tile
    // ─────────────────────────────────────────────────────────
    function StrategyTile({ diag }) {
      // diag is the v2-diag response. Pick the most recent decision across
      // any instrument that has long_checks/short_checks.
      let recent = null;
      let recentInst = null;
      if (diag && diag.decisions) {
        for (const inst of Object.keys(diag.decisions)) {
          const arr = diag.decisions[inst];
          if (arr && arr.length > 0) {
            const last = arr[arr.length-1];
            if (!recent || (last.ts > recent.ts)) { recent = last; recentInst = inst; }
          }
        }
      }
      const checks = recent ? (recent.long_score >= recent.short_score ? recent.long_checks : recent.short_checks) : null;
      const score = recent ? Math.max(recent.long_score||0, recent.short_score||0) : 0;
      const total = checks ? Object.keys(checks).length : 6;
      // Display top 4 checks
      const items = checks ? Object.entries(checks).slice(0, 4) : [
        ['VWAP', false], ['RSI', false], ['EMA', false], ['Range', false]
      ];

      return (
        <div className="tile t-md">
          <div className="tile-head">
            <div className="lbl">
              <span className="num">06</span>
              <span>Strategy</span>
            </div>
            <span className="strat-tag">V2</span>
          </div>
          <div className="strat-name"><em>Trend-Momentum</em> · {score}-of-{total}</div>
          <div className="confluence">
            {items.map(([key, ok], idx) => (
              <div key={idx} className={'conf-cell ' + (ok?'':'off')}>
                <span className="k">{key}</span>
                <div className="v">{ok?'✓':'·'} {ok?'ok':'wait'}</div>
              </div>
            ))}
          </div>
          <div className="edge"/>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Capital tile
    // ─────────────────────────────────────────────────────────
    function CapitalTile({ capital, deployed, positionsCount }) {
      const pct = capital > 0 ? (deployed/capital)*100 : 0;
      return (
        <div className="tile t-md">
          <div className="tile-head">
            <div className="lbl">
              <span className="num">07</span>
              <span>Capital</span>
            </div>
            <span className="right-meta">{positionsCount} open</span>
          </div>
          <div className="cap-big">₹{(deployed/1000).toFixed(1)}k <span className="pct">/ ₹{(capital/1000).toFixed(0)}k</span></div>
          <div className="cap-sub">{pct.toFixed(1)}% deployed · 50% cap/trade</div>
          <div className="cap-bar"><div className="fill" style={{width: Math.min(100, pct)+'%'}}/></div>
          <div className="cap-foot">
            <span>0%</span>
            <span>50% MAX</span>
            <span>100%</span>
          </div>
          <div className="edge"/>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Telemetry tile
    // ─────────────────────────────────────────────────────────
    function TelemetryTile({ metrics }) {
      const m = metrics || {};
      const eng = m.metrics_today || {};
      const cache = (m.cache || {}).candles || {};
      const ant = (m.cache || {}).anthropic || {};
      const scans = eng.scans || 0;
      const apiCalls = eng.api_calls || (eng.angel_calls || 0);
      const cacheHit = cache.hit_rate != null ? Math.round(cache.hit_rate) : (cache.hit_rate_pct || 0);
      const aiCalls = ant.calls || 0;
      const spend = ant.spend_usd != null ? ant.spend_usd : (ant.cost_usd || 0);
      const byL = ant.by_layer || {};
      const layers = ['A','B','C','D','E'];
      const total = layers.reduce((s, L) => s + (byL[L]||0), 0) || 1;
      return (
        <div className="tile t-md">
          <div className="tile-head">
            <div className="lbl">
              <span className="num">08</span>
              <span>Telemetry</span>
            </div>
            <span className="right-meta">scan #{scans}</span>
          </div>
          <div className="tlm-grid">
            <div>
              <span className="tlm-k">API calls</span>
              <div className="tlm-v">{apiCalls.toLocaleString('en-IN')}</div>
            </div>
            <div>
              <span className="tlm-k">Cache hit</span>
              <div className="tlm-v win">{cacheHit}%</div>
            </div>
            <div>
              <span className="tlm-k">AI calls</span>
              <div className="tlm-v">{aiCalls}</div>
            </div>
            <div>
              <span className="tlm-k">Spend</span>
              <div className="tlm-v">${Number(spend||0).toFixed(2)}</div>
            </div>
          </div>
          <div className="tlm-bar">
            {layers.map(L => (
              <div key={L} className={'seg ' + L.toLowerCase()} style={{flex: (byL[L]||0) / total}}/>
            ))}
          </div>
          <div className="tlm-legend">
            {layers.map(L => (
              <span key={L}><span className={'swatch ' + L.toLowerCase()}/>L{L} {byL[L]||0}</span>
            ))}
          </div>
          <div className="edge"/>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Regime tile
    // ─────────────────────────────────────────────────────────
    function RegimeTile({ regimeChecks }) {
      const checks = regimeChecks || [
        { label: 'Market open', ok: false, note: 'Awaiting session' },
        { label: 'Pre-cutoff',  ok: false, note: 'Before 12:30' },
        { label: 'Volatility',  ok: false, note: 'VIX feed' },
        { label: 'Events',      ok: false, note: 'Calendar' },
        { label: 'Expiry',      ok: false, note: 'Days out' },
      ];
      return (
        <div className="tile t-full">
          <div className="tile-head">
            <div className="lbl">
              <span className="num">09</span>
              <span>Pre-trade regime</span>
            </div>
            <Ping kind={checks.every(c=>c.ok)?'ok':'warn'} dot label="LAYER-A"/>
          </div>
          <div className="regime-pills">
            {checks.map((c, idx) => (
              <span key={idx} className={'regime-pill ' + (c.ok?'ok':'err')}>
                <svg className="check" viewBox="0 0 12 12" fill="none">
                  {c.ok
                    ? <path d="M2 6 L5 9 L10 3" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
                    : <><line x1="3" y1="3" x2="9" y2="9" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/><line x1="9" y1="3" x2="3" y2="9" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></>}
                </svg>
                {c.label} <span className="note">· {c.note}</span>
              </span>
            ))}
          </div>
          <div className="regime-foot">
            Next gate check in <b>30s</b> <span className="sep">·</span> Auto-close at <b>15:15 IST</b> <span className="sep">·</span> Inflight model <b>haiku-4-5</b>
          </div>
          <div className="edge"/>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Timeline tile
    // ─────────────────────────────────────────────────────────
    function TimelineTile({ events }) {
      const sessionMin = 375;
      // Current time minutes into session
      const now = new Date();
      const ist = new Date(now.getTime() + ((now.getTimezoneOffset() + 330) * 60000));
      const sessionStart = new Date(ist);
      sessionStart.setHours(9, 15, 0, 0);
      let elapsed = Math.max(0, Math.min(sessionMin, (ist - sessionStart) / 60000));

      const hours = [0, 60, 120, 180, 240, 300, 360, 375];
      const labels = ['9:15', '10:15', '11:15', '12:15', '13:15', '14:15', '15:15', '15:30'];
      const evs = events || [];
      return (
        <div className="tile t-full">
          <div className="tile-head">
            <div className="lbl">
              <span className="num">10</span>
              <span>Today · trade activity</span>
            </div>
            <div className="timeline-legend">
              <span><span className="dot" style={{background:'var(--win)'}}/>Win</span>
              <span><span className="dot" style={{background:'var(--loss)'}}/>Loss</span>
              <span><span className="dot" style={{background:'var(--info)'}}/>Open</span>
            </div>
          </div>

          <div className="timeline-wrap">
            <div className="timeline-events">
              {evs.map((e, idx) => {
                const left = (e.t / sessionMin) * 100;
                const cls = 'timeline-event ' + e.kind;
                return (
                  <div key={idx} className={cls} style={{left: left+'%'}}>
                    <div className="ev-dot"/>
                    <div className="ev-tip">
                      <b>{e.label}</b> · {e.sym}
                      {e.pnl != null && <span className={'v ' + e.kind}>{fmtINR(e.pnl, true)}</span>}
                    </div>
                  </div>
                );
              })}
              <div className="timeline-now" style={{left: (elapsed/sessionMin*100)+'%'}}/>
            </div>
            <div className="timeline-line"/>
            <div className="timeline-ticks">
              {labels.map((l, idx) => (
                <span key={idx} style={{left: (hours[idx]/sessionMin*100)+'%',
                  transform: idx===0?'translateX(0)':idx===labels.length-1?'translateX(-100%)':'translateX(-50%)'}}>{l}</span>
              ))}
            </div>
          </div>
          <div className="edge"/>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Signals panel
    // ─────────────────────────────────────────────────────────
    function SignalsPanel({ signals }) {
      const all = (signals || []).slice(0, 20);
      const open = all.filter(s => s.status === 'OPEN').length;
      const closed = all.filter(s => s.status === 'CLOSED').length;
      return (
        <div className="panel">
          <div className="panel-head">
            <div>
              <div className="panel-title">Today's <em>signals</em></div>
              <div className="panel-sub">{all.length} fired · {open} open · {closed} closed</div>
            </div>
            <Ping kind="info" label="LAYER B · HAIKU 4.5"/>
          </div>
          {all.length === 0 ? (
            <div style={{padding:'32px 0', textAlign:'center', fontFamily:'var(--font-mono)', fontSize:11,
              color:'var(--ink-4)', letterSpacing:'0.05em', textTransform:'uppercase'}}>
              No signals yet today · scanning
            </div>
          ) : (
          <table className="sig-table">
            <thead>
              <tr>
                <th style={{width:60}}>Time</th>
                <th>Symbol</th>
                <th>Conf.</th>
                <th>Result</th>
                <th>Reasoning</th>
                <th className="r">P&amp;L</th>
                <th className="r" style={{width:80}}>Status</th>
              </tr>
            </thead>
            <tbody>
              {all.map((s, i) => {
                const ts = (s.timestamp || '').split(' ')[1] || '';
                const t = ts.slice(0,5);
                const [head, type] = humanizeSym(s.option_symbol || ((s.instrument||'') + (s.option_strike||'') + (s.option_type||'')));
                const sym = head + ' ' + type;
                const side = (s.direction || '').toUpperCase();
                const status = (s.status === 'CLOSED' && s.result === 'LOSS') ? 'LOSS' :
                               (s.status === 'CLOSED' && (s.result==='WIN' || s.result==='T1' || s.result==='T2')) ? 'WIN' :
                               s.status === 'OPEN' ? 'OPEN' : (s.status || 'PENDING');
                const conf = Math.round(s.confidence || 0);
                const pnl = s.pnl_rupees_net != null ? +s.pnl_rupees_net : (s.pnl_rupees != null ? +s.pnl_rupees : null);
                const signedPnl = pnl != null ? ((s.result === 'LOSS') ? -Math.abs(pnl) : ((s.result==='WIN'||s.result==='T1'||s.result==='T2') ? Math.abs(pnl) : pnl)) : null;
                const pnlEntry = +s.option_entry || 0;
                const pnlPct = pnlEntry > 0 && signedPnl != null && s.option_lot_size > 0 ? (signedPnl / (pnlEntry * s.option_lot_size * (s.option_lots||1))) * 100 : null;
                let reason = s.reasons || s.reason || '';
                if (typeof reason === 'string' && reason.startsWith('[')) {
                  try { reason = JSON.parse(reason).slice(0,2).join(' · '); } catch(e) {}
                }
                if (Array.isArray(reason)) reason = reason.slice(0,2).join(' · ');
                return (
                  <tr key={s.id || i} className={status==='OPEN'?'live':''}>
                    <td className="time">{t}</td>
                    <td>
                      <span className="sym-cell">
                        <span className="sym">{sym}</span>
                        <span className={'side-tag ' + side.toLowerCase()}>{side}</span>
                      </span>
                    </td>
                    <td className="score">{conf}</td>
                    <td className={'verdict ' + (status==='WIN'?'take':status==='LOSS'?'skip':'wait')}>
                      {s.result || (status==='OPEN' ? 'IN-FLIGHT' : '—')}
                    </td>
                    <td className="reason">{String(reason || '—').slice(0,160)}</td>
                    <td className={'r pnl-cell ' + (status==='WIN'?'win':status==='LOSS'?'loss':status==='OPEN'?'open':'muted')}>
                      {signedPnl != null
                        ? <>{fmtINR(signedPnl, true)}{pnlPct != null && <span className="pct">{fmtPct(pnlPct, 1)}</span>}</>
                        : '—'}
                    </td>
                    <td className="r"><span className={'status-chip ' + status.toLowerCase()}>{status}</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // AI inflight feed — derived from engine alerts
    // ─────────────────────────────────────────────────────────
    function AiFeedPanel({ alerts }) {
      const items = (alerts || []).slice(0, 40).map(a => {
        // alerts may be strings or { ts, msg, layer }
        if (typeof a === 'string') {
          // Try to parse "HH:MM:SS · MSG"
          const m = a.match(/^(\d{2}:\d{2}:\d{2})\s*[·\-]\s*(.+)$/);
          const time = m ? m[1] : '';
          const msg = m ? m[2] : a;
          return { time, layer: 'D', kind: 'MONITOR', msg };
        }
        return {
          time: a.ts || a.time || '',
          layer: a.layer || 'D',
          kind: (a.kind || 'MONITOR').toUpperCase(),
          msg: a.msg || a.message || ''
        };
      });
      return (
        <div className="panel">
          <div className="panel-head">
            <div>
              <div className="panel-title">AI <em>inflight</em></div>
              <div className="panel-sub">Claude commentary · 5 layers</div>
            </div>
          </div>
          {items.length === 0 ? (
            <div className="feed-empty">No commentary yet · waiting for engine</div>
          ) : (
            <div className="feed">
              {items.map((f, i) => (
                <div key={i} className="feed-item">
                  <div className="feed-time">
                    {String(f.time).slice(0,5)}<br/>
                    <span className={'layer ' + String(f.layer).toLowerCase()}>L{f.layer}</span>
                  </div>
                  <div className="feed-msg">
                    <span className="kind">{f.kind}</span>
                    {f.msg}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Profile modal — name + capital + server + auth token

      const [name, setName] = useState(userName);

              </div>
              <button className="modal-x" onClick={onClose} aria-label="Close">×</button>
            </div>
            <div className="modal-body">
              <div className="modal-section">
                <label className="modal-label">Trading capital (₹)</label>
                <div className="modal-input-row">
                  <span className="modal-curr">₹</span>
                  <input
                    className="modal-input" type="number"
                    min={5000} max={5000000} step={1000}
                    value={val}
                    onChange={(e)=>setVal(e.target.value)}
                  />
                </div>
                <div className="modal-presets">
                  {presets.map(p => (
                    <button key={p} type="button"
                      className={'modal-preset' + (+val === p ? ' on' : '')}
                      onClick={()=>setVal(p)}>
                      ₹{(p/1000)}k{p >= 200000 ? '+' : ''}

                  ))}

              </div>
              <div className="modal-section">
                <label className="modal-label">Server URL (optional)</label>
                <div className="modal-input-row" style={{padding:'10px 14px'}}>
                  <input className="modal-input-text" type="text"
                    placeholder="https://intraday.up.railway.app"

              <div className="modal-section">
                <label className="modal-label">Auth token</label>
                <div className="modal-input-row" style={{padding:'10px 14px'}}>
                  <input className="modal-input-text" type="password"
                    placeholder="Server AUTH_TOKEN"
                    value={token}
                    onChange={e=>setToken(e.target.value)}/>

              </div>
              <div className="modal-note">
                Capital splits across open positions · max <b>50% per position</b>, <b>85% total</b>.
                Lots = ⌊budget ÷ (premium × lot_size)⌋ · max 3 lots per position.
