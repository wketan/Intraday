<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Intraday Console</title>
<!-- iPhone home-screen app (PWA) -->
<link rel="manifest" href="console.webmanifest"/>
<meta name="theme-color" content="#0a0b0e"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="Console"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
/* ═══════════════ INTRADAY CONSOLE — tactical trading terminal ═══════════════ */
:root{
  --ui:'Space Grotesk',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --e:cubic-bezier(.2,.8,.2,1);
}
html[data-theme="dark"]{
  --bg:#0a0b0e; --bg2:#0d0f13; --panel:#101317; --panel2:#15191f; --raised:#191e25;
  --ink:#eef2ef; --ink2:#979ea6; --ink3:#5d646d; --ink4:#363c44;
  --line:rgba(255,255,255,0.09); --line2:rgba(255,255,255,0.05); --grid:rgba(255,255,255,0.022);
  --hover:rgba(255,255,255,0.04);
  --lime:#c8f550; --lime2:#9ee84a; --lime-soft:rgba(200,245,80,0.13); --lime-gl:rgba(200,245,80,0.55);
  --up:#c8f550; --up-soft:rgba(200,245,80,0.13);
  --dn:#ff5d6e; --dn-soft:rgba(255,93,110,0.14); --dn-gl:rgba(255,93,110,0.5);
  --warn:#ffc24b; --warn-soft:rgba(255,194,75,0.15);
  --sh:0 20px 50px -28px rgba(0,0,0,0.9);
}
html[data-theme="light"]{
  --bg:#efece1; --bg2:#f5f3ea; --panel:#fffdf7; --panel2:#f7f4ea; --raised:#fffefa;
  --ink:#12140e; --ink2:#4c5147; --ink3:#7c8174; --ink4:#aeb2a4;
  --line:rgba(18,20,14,0.14); --line2:rgba(18,20,14,0.08); --grid:rgba(18,20,14,0.03);
  --hover:rgba(18,20,14,0.04);
  --lime:#5f7d10; --lime2:#6f8f12; --lime-soft:rgba(140,180,20,0.16); --lime-gl:rgba(140,180,20,0.4);
  --up:#1d8f52; --up-soft:rgba(29,143,82,0.12);
  --dn:#cf2d40; --dn-soft:rgba(207,45,64,0.11); --dn-gl:rgba(207,45,64,0.35);
  --warn:#9a6a00; --warn-soft:rgba(154,106,0,0.13);
  --sh:0 16px 36px -26px rgba(18,20,14,0.4);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;}
body{font-family:var(--ui);-webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-.01em;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),radial-gradient(900px 480px at 78% -8%,var(--lime-soft),transparent 65%);
  background-size:34px 34px,34px 34px,100% 100%;
  transition:background-color .4s var(--e),color .4s var(--e);}
button{font-family:inherit;cursor:pointer;}input{font-family:inherit;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.up{color:var(--up);}.dn{color:var(--dn);}
::selection{background:var(--lime-soft);}
.lbl{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);}

/* shell */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:72px 1fr;min-height:100vh;min-height:100dvh;}
.rail{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;z-index:30;
  background:var(--bg2);border-right:1px solid var(--line);}
.rail .logo{width:42px;height:42px;border-radius:10px;background:var(--lime);display:grid;place-items:center;
  color:#0a0b0e;font-weight:700;font-size:20px;font-family:var(--ui);box-shadow:0 0 28px -4px var(--lime-gl);margin-bottom:10px;}
.rail .rspace{flex:1;}
.rbtn{position:relative;width:46px;height:46px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink3);display:grid;place-items:center;transition:all .18s var(--e);}
.rbtn:hover{color:var(--ink);background:var(--hover);}
.rbtn.on{color:var(--lime);background:var(--lime-soft);border-color:var(--line);}
.rbtn.on::before{content:'';position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--lime);box-shadow:0 0 10px var(--lime);}
.rbtn svg{width:20px;height:20px;}
.rbtn .tip{position:absolute;left:54px;top:50%;transform:translateY(-50%) translateX(-6px);background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:all .18s var(--e);z-index:40;}
.rbtn:hover .tip{opacity:1;transform:translateY(-50%) translateX(0);}
.rdot{width:9px;height:9px;border-radius:2px;background:var(--ink4);}
.rdot.live{background:var(--up);box-shadow:0 0 11px var(--up);animation:bp 2.2s infinite;}
.rdot.off{background:var(--dn);}
.ava{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:700;font-size:15px;}
.blabel{display:none;}
.estat{display:grid;place-items:center;width:46px;height:46px;}
@keyframes bp{0%,100%{opacity:1;}50%{opacity:.25;}}

.main{min-width:0;padding:0 28px 96px;max-width:1640px;}

/* top readout bar */
.top{position:sticky;top:0;z-index:20;margin:0 -28px;display:flex;flex-direction:column;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);}
.tapebar{display:flex;align-items:center;height:42px;padding:0 28px;border-bottom:1px solid var(--line2);}
.toolbar{display:flex;align-items:center;height:56px;padding:0 28px;gap:12px;}
.tk{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 18px;border-right:1px solid var(--line2);white-space:nowrap;}
.tk:first-child{padding-left:0;}
.tk .nm{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--ink3);}
.tk .rowx{display:flex;align-items:baseline;gap:8px;}
.tk .px{font-family:var(--mono);font-size:15px;font-weight:700;}
.tk .ch{font-family:var(--mono);font-size:11px;font-weight:600;}
/* news-style auto-scrolling ticker tape */
.tape{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;height:100%;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 94%,transparent);}
.tape-track{display:inline-flex;align-items:center;flex:none;white-space:nowrap;animation:marq 30s linear infinite;}
.tape:hover .tape-track{animation-play-state:paused;}
@keyframes marq{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.tkm{display:inline-flex;align-items:baseline;gap:9px;padding:0 2px;white-space:nowrap;}
.tkm .nm{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--ink3);}
.tkm .px{font-family:var(--mono);font-size:14.5px;font-weight:700;}
.tkm .ch{font-family:var(--mono);font-size:11px;font-weight:600;}
.tkm .sep{color:var(--ink4);padding:0 12px;}
.top-r{margin-left:auto;display:flex;align-items:center;gap:12px;}
.clock{font-family:var(--mono);font-size:13px;color:var(--ink2);letter-spacing:.04em;}.clock b{color:var(--ink);}
.led{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;border-radius:8px;border:1px solid var(--line);color:var(--ink2);}
.led .d{width:7px;height:7px;border-radius:2px;background:var(--ink4);}
.led.live{color:var(--up);border-color:var(--up-soft);background:var(--up-soft);}.led.live .d{background:var(--up);box-shadow:0 0 8px var(--up);animation:bp 2.2s infinite;}
.led.off{color:var(--dn);border-color:var(--dn-soft);background:var(--dn-soft);}.led.off .d{background:var(--dn);}
.btn{appearance:none;border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--panel2);color:var(--ink);transition:all .18s var(--e);}
.btn:hover{border-color:var(--ink3);}.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.go{background:var(--lime);color:#0a0b0e;border-color:var(--lime);box-shadow:0 0 22px -8px var(--lime-gl);}
.btn.stop{background:var(--dn-soft);color:var(--dn);border-color:var(--dn-soft);}
.ib{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);display:grid;place-items:center;transition:all .18s var(--e);}
.ib:hover{color:var(--ink);}.ib svg{width:17px;height:17px;}
.ib.on{color:var(--lime);border-color:var(--lime-soft);background:var(--lime-soft);}

/* new-signal toast */
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;max-width:92%;cursor:pointer;
  background:var(--raised);border:1px solid var(--lime);border-left:4px solid var(--lime);border-radius:13px;padding:13px 18px;
  box-shadow:0 18px 44px -14px rgba(0,0,0,.8),0 0 26px -8px var(--lime-gl);animation:toastin .35s var(--e);}
.toast .tt{font-weight:700;font-size:13.5px;color:var(--ink);letter-spacing:-.01em;}
.toast .tb{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:3px;}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-14px);}to{opacity:1;transform:translate(-50%,0);}}
@media(max-width:680px){.toast{top:calc(10px + env(safe-area-inset-top));width:92%;}}

/* nav tabs */
.tabs{display:flex;gap:0;padding:22px 0 2px;border-bottom:1px solid var(--line);margin-bottom:22px;}
.tab{appearance:none;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink3);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;margin-bottom:-1px;transition:all .18s var(--e);}
.tab:hover{color:var(--ink);}
.tab.on{color:var(--ink);border-bottom-color:var(--lime);}

/* panels + grid */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;box-shadow:var(--sh);}
.panel.hud::before,.panel.hud::after{content:'';position:absolute;width:13px;height:13px;pointer-events:none;}
.panel.hud::before{top:-1px;left:-1px;border-top:2px solid var(--lime);border-left:2px solid var(--lime);border-top-left-radius:10px;}
.panel.hud::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--lime);border-right:2px solid var(--lime);border-bottom-right-radius:10px;}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;}
.g-chart{grid-column:span 8;align-self:start;}.g-sig{grid-column:span 4;}
.g-kpi{grid-column:span 3;}
.g-sigs{grid-column:span 7;}.g-open{grid-column:span 5;}
.g-gates{grid-column:span 5;}.g-feed{grid-column:span 7;}
.g6{grid-column:span 6;}.g12{grid-column:span 12;}

.head{display:flex;align-items:center;gap:10px;margin:0 0 16px;}
.head .t{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);}
.head .t b{color:var(--lime);font-weight:700;}
.head .r{margin-left:auto;}
.live-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--up);}
.live-tag .d{width:7px;height:7px;border-radius:2px;background:var(--up);box-shadow:0 0 8px var(--up);animation:bp 1.8s infinite;}

/* KPI */
.kpi .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px;}
.kpi .v{font-family:var(--mono);font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1;}
.kpi .v.up{color:var(--up);}.kpi .v.dn{color:var(--dn);}.kpi .v.ac{color:var(--lime);}
.kpi .s{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:10px;}
.kpi .spark{position:absolute;right:0;bottom:0;width:50%;height:42px;opacity:.85;pointer-events:none;}

/* live chart */
.chartwrap{position:relative;overflow:hidden;border-radius:8px;}
.chartwrap::after{content:'';position:absolute;top:0;bottom:22px;width:1px;background:linear-gradient(var(--lime),transparent);opacity:.5;animation:sweep 6s linear infinite;}
@keyframes sweep{0%{left:2%;opacity:0;}10%{opacity:.5;}90%{opacity:.5;}100%{left:86%;opacity:0;}}
.cstrip{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
.cstrip .pxbig{font-family:var(--mono);font-size:clamp(30px,3.4vw,42px);font-weight:800;letter-spacing:-.04em;line-height:.9;}
.cstrip .pxbig.up{color:var(--up);}.cstrip .pxbig.dn{color:var(--dn);}
.cstrip .pxd{font-family:var(--mono);font-size:13px;font-weight:700;padding:4px 10px;border-radius:6px;}
.cstrip .pxd.up{color:var(--up);background:var(--up-soft);}.cstrip .pxd.dn{color:var(--dn);background:var(--dn-soft);}
.cstrip .pxm{font-family:var(--mono);font-size:11px;color:var(--ink3);}

/* live signal */
.sig-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.dirbadge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:800;font-size:15px;letter-spacing:.02em;padding:10px 14px;border-radius:8px;}
.dirbadge.long{background:var(--up-soft);color:var(--up);box-shadow:0 0 26px -8px var(--lime-gl);}
.dirbadge.short{background:var(--dn-soft);color:var(--dn);box-shadow:0 0 26px -8px var(--dn-gl);}
.dirbadge svg{width:16px;height:16px;}
.sig-inst{font-size:18px;font-weight:700;letter-spacing:-.01em;}
.sig-sub{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:3px;letter-spacing:.03em;}
.confwrap{margin-left:auto;text-align:right;}
.confwrap .cv{font-family:var(--mono);font-size:34px;font-weight:800;line-height:1;color:var(--lime);}
.confwrap .cl{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-top:5px;}
.verdict{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:4px 8px;border-radius:5px;margin-left:9px;}
.verdict.take{background:var(--up-soft);color:var(--up);}.verdict.skip{background:var(--dn-soft);color:var(--dn);}.verdict.watch{background:var(--warn-soft);color:var(--warn);}
.stalebadge{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.08em;color:#1a1206;background:var(--dn);padding:2px 6px;border-radius:5px;margin-right:7px;vertical-align:middle;}
.stalebar{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--dn);background:color-mix(in srgb,var(--dn) 12%,transparent);border:1px solid color-mix(in srgb,var(--dn) 35%,transparent);border-radius:9px;padding:9px 12px;margin-bottom:13px;line-height:1.35;}
.panel.is-stale{border-color:color-mix(in srgb,var(--dn) 45%,var(--line));}
.ophead{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;padding:13px 15px;border-radius:11px;background:var(--panel2);border:1px solid var(--lime-soft);box-shadow:0 0 22px -12px var(--lime-gl);margin-bottom:13px;}
.ophead .opname{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:-.01em;}
.ophead .opmeta{font-family:var(--mono);font-size:10.5px;color:var(--ink3);flex-basis:100%;}
.legbar{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:13px;}
.leg{padding:10px 11px;background:var(--panel);min-width:0;}
.leg .k{font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px;white-space:nowrap;}
.leg .v{font-family:var(--mono);font-size:15px;font-weight:700;white-space:nowrap;}
.leg .v.up{color:var(--up);}.leg .v.dn{color:var(--dn);}
.leg .lp{display:block;font-size:8.5px;font-weight:600;margin-top:3px;white-space:nowrap;}
.leg .lp.up{color:var(--up);}.leg .lp.dn{color:var(--dn);}
.optline{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 14px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);margin-bottom:15px;}
.opttag{font-family:var(--mono);font-weight:700;font-size:11px;padding:5px 9px;border-radius:6px;background:var(--lime);color:#0a0b0e;}
.optsym{font-family:var(--mono);font-size:13.5px;font-weight:700;}
.optmeta{font-family:var(--mono);font-size:10.5px;color:var(--ink3);}.optmeta b{color:var(--ink2);}
.votes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
.vote{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:5px 8px;border-radius:6px;border:1px solid var(--line);color:var(--ink3);}
.vote.hit{color:var(--up);border-color:var(--up-soft);background:var(--up-soft);}
.vote .vd{width:5px;height:5px;border-radius:1px;background:currentColor;}
.reasons{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;}
.reasons li{font-family:var(--mono);font-size:11.5px;color:var(--ink2);line-height:1.45;padding-left:16px;position:relative;}
.reasons li::before{content:'»';position:absolute;left:0;top:0;color:var(--lime);font-weight:700;}
.sig-empty{display:flex;align-items:center;gap:18px;padding:20px 2px;}
.radar{position:relative;width:54px;height:54px;flex-shrink:0;display:grid;place-items:center;}
.radar .dot{width:10px;height:10px;border-radius:2px;background:var(--lime);box-shadow:0 0 14px var(--lime);z-index:2;}
.radar .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--lime);opacity:0;animation:ping 2.6s var(--e) infinite;}
.radar .ring.r2{animation-delay:1.3s;}
@keyframes ping{0%{transform:scale(.26);opacity:.6;}80%,100%{transform:scale(1);opacity:0;}}
.sig-empty .t{font-size:16px;font-weight:700;}
.sig-empty .d{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:6px;letter-spacing:.02em;}

/* table */
.tbl{width:100%;}
.tbl .hr{display:grid;grid-template-columns:52px minmax(0,1fr) 60px auto auto;gap:14px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink4);padding:0 4px 11px;border-bottom:1px solid var(--line);}
.tbl .hr .r{text-align:right;}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) 60px auto auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line2);transition:background .14s var(--e);}
.row:hover{background:var(--hover);}
.row .t{font-family:var(--mono);font-size:11px;color:var(--ink3);}
.row .ins .s{font-weight:700;font-size:13px;}
.row .ins .c{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:4px;}
.chip.long{background:var(--up-soft);color:var(--up);}.chip.short{background:var(--dn-soft);color:var(--dn);}
.row .px{font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap;}.row .px b{color:var(--ink);}
.row .pnl{font-family:var(--mono);font-size:14px;font-weight:800;text-align:right;white-space:nowrap;}
.row .pnl.up{color:var(--up);}.row .pnl.dn{color:var(--dn);}.row .pnl.open{color:var(--lime);}.row .pnl.flat{color:var(--ink3);}
.row .pnl .st{display:block;font-size:8px;font-weight:600;letter-spacing:.08em;color:var(--ink4);margin-top:2px;text-transform:uppercase;}

function Area({pts,color,h=120}){if(!pts||pts.length<2)return null;
  const W=560,H=h,vs=pts.map(p=>p.v),mn=Math.min(...vs,0),mx=Math.max(...vs,0),rng=(mx-mn)||1;
  const X=i=>(i/(pts.length-1))*W,Y=v=>H-((v-mn)/rng)*(H-8)-4;
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');const gid='ag'+color.replace(/[^a-z0-9]/gi,'');
  return(<svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{width:'100%',height:'100%'}}>
    <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.3"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>
    <path d={`${line} L${W} ${H} L0 ${H} Z`} fill={`url(#${gid})`}/><path d={line} fill="none" stroke={color} strokeWidth="2"/></svg>);}

function CandleChart({candles,ltp}){
  // Keep last known good data - never blank the chart due to a transient poll gap
  const lastRef=useRef(null);
  const disp=(candles&&candles.length>=2)?candles:lastRef.current;
  if(candles&&candles.length>=2)lastRef.current=candles;
  if(!disp)return <div className="empty" style={{padding:'80px 0'}}>Waiting for candles · market may be closed</div>;

  // W=880 is the coordinate space; on a 375pt iPhone it scales to ~43%
  // so all sizes are set ~2.3x larger than they'd be for desktop-only
  const SLOTS=75; // 9:15 → 15:25 = 75 five-min slots
  const W=880,H=320,pT=30,pB=36,pL=10,pR=80;
  const hi=Math.max(...disp.map(c=>c.h)),lo=Math.min(...disp.map(c=>c.l));
  const pad=(hi-lo)*0.06||1,mx=hi+pad,mn=lo-pad,rng=mx-mn||1;
  const iw=(W-pL-pR)/SLOTS,bw=Math.max(2,Math.min(14,iw*0.72));
  const Y=v=>pT+(1-(v-mn)/rng)*(H-pT-pB);
  const slotOf=t=>{const s=(t||'').slice(11,16)||t;const[h,m]=(s||'00:00').split(':').map(Number);return Math.round((h*60+m-555)/5);};
  const X=slot=>pL+slot*iw+iw/2;
  const lastC=disp[disp.length-1],lastClose=(ltp&&+ltp)||lastC.c,lpUp=lastClose>=lastC.o;
  const lastSlot=slotOf(lastC.t);
  const grid=[0,.25,.5,.75,1].map(f=>mn+rng*f);const F="'Courier New',monospace";

  // Trade window slots: Conductor fires 9:45-14:30
  // 9:15=slot0, 9:45=slot6, 14:30=slot63
  const W_OPEN=6,W_CLOSE=63;
  const xOpen=pL+W_OPEN*iw,xClose=pL+W_CLOSE*iw,xEnd=W-pR;
  const bandH=H-pT-pB;

  return(<div className="chartwrap"><svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
    {/* Trade window background bands */}
    <rect x={pL} y={pT} width={xOpen-pL} height={bandH} fill="rgba(176,58,46,0.07)"/>
    <rect x={xOpen} y={pT} width={xClose-xOpen} height={bandH} fill="rgba(61,104,72,0.07)"/>
    <rect x={xClose} y={pT} width={xEnd-xClose} height={bandH} fill="rgba(184,116,40,0.08)"/>
    {/* Window boundary lines */}
    <line x1={xOpen} x2={xOpen} y1={pT} y2={H-pB} stroke="rgba(61,104,72,0.35)" strokeWidth="1.5" strokeDasharray="4 4"/>
    <line x1={xClose} x2={xClose} y1={pT} y2={H-pB} stroke="rgba(184,116,40,0.35)" strokeWidth="1.5" strokeDasharray="4 4"/>
    {/* Window labels at top */}
    <text x={pL+3} y={pT-8} fill="rgba(176,58,46,0.75)" fontSize="13" fontFamily={F} fontWeight="700" letterSpacing="0.06em">PRE</text>
    <text x={xOpen+6} y={pT-8} fill="rgba(61,104,72,0.8)" fontSize="13" fontFamily={F} fontWeight="700" letterSpacing="0.06em">TRADE WINDOW</text>
    <text x={xClose+6} y={pT-8} fill="rgba(184,116,40,0.85)" fontSize="13" fontFamily={F} fontWeight="700" letterSpacing="0.06em">CLOSED</text>
    {/* Price grid */}
    {grid.map((g,i)=>(<g key={i}><line x1={pL} x2={xEnd} y1={Y(g)} y2={Y(g)} stroke="var(--line2)" strokeWidth="1"/>
      <text x={xEnd+6} y={Y(g)+5} fill="var(--ink2)" fontSize="16" fontFamily={F} fontWeight="700">{Math.round(g)}</text></g>))}
    {disp.map((c,i)=>{
      const slot=slotOf(c.t);if(slot<0||slot>=SLOTS)return null;
      const u=c.c>=c.o,col=u?'var(--up)':'var(--dn)';
      const yO=Y(c.o),yC=Y(c.c),top=Math.min(yO,yC),hh=Math.max(1.5,Math.abs(yC-yO));
      return(<g key={i}><line x1={X(slot)} x2={X(slot)} y1={Y(c.h)} y2={Y(c.l)} stroke={col} strokeWidth="1.5" opacity="0.85"/>
        <rect x={X(slot)-bw/2} y={top} width={bw} height={hh} fill={col}/></g>);
    })}
    <line x1={pL} x2={xEnd} y1={Y(lastClose)} y2={Y(lastClose)} stroke={lpUp?'var(--up)':'var(--dn)'} strokeWidth="1" strokeDasharray="3 4" opacity="0.7"/>
    <rect x={xEnd} y={Y(lastClose)-12} width={pR-3} height="24" fill={lpUp?'var(--up)':'var(--dn)'}/>
    <text x={xEnd+(pR-3)/2} y={Y(lastClose)+5} textAnchor="middle" fill="#0F1D14" fontSize="15" fontWeight="800" fontFamily={F}>{Math.round(lastClose)}</text>
    {lastSlot>=0&&lastSlot<SLOTS&&<circle cx={X(lastSlot)} cy={Y(lastC.c)} r="4.5" fill={lpUp?'var(--up)':'var(--dn)'}><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>}
    {/* Time labels */}
    <text x={pL} y={H-10} fill="var(--ink2)" fontSize="15" fontWeight="700" fontFamily={F}>09:15</text>
    <text x={xOpen} y={H-10} textAnchor="middle" fill="var(--ink2)" fontSize="15" fontWeight="700" fontFamily={F}>09:45</text>
    <text x={X(39)} y={H-10} textAnchor="middle" fill="var(--ink3)" fontSize="14" fontFamily={F}>12:30</text>
    <text x={xClose} y={H-10} textAnchor="middle" fill="var(--ink2)" fontSize="15" fontWeight="700" fontFamily={F}>14:30</text>
    <text x={xEnd-4} y={H-10} textAnchor="end" fill="var(--ink2)" fontSize="15" fontWeight="700" fontFamily={F}>15:30</text>
  </svg></div>);}

function elapsedFrom(tin){ if(!tin) return '00:00:00'; const m=String(tin).match(/(\d{1,2}):(\d{2})/); if(!m) return '00:00:00';
  const now=istNow(); const st=new Date(now); st.setHours(+m[1],+m[2],0,0); let s=Math.floor((now-st)/1000); if(s<0)s=0;
  const hh=Math.floor(s/3600),mm=Math.floor((s%3600)/60),ss=s%60; const z=n=>String(n).padStart(2,'0'); return z(hh)+':'+z(mm)+':'+z(ss); }

function PositionCard({p,idx}){

    <div className="track">

      <span className="tk-lab" style={{left:t1P+'%'}}>T1</span><span className="tk-lab r" style={{left:'100%'}}>T2</span>
      <div className="tk-bar" style={{background:grad}}>

      <span className="tk-val" style={{left:t1P+'%'}}>₹{t1.toFixed(0)}</span><span className="tk-val r" style={{left:'100%'}}>₹{t2.toFixed(0)}</span></div>
    <div className="pos-pnl">
      <div><div className="k">P&amp;L · Unrealised</div><div className={'v '+(up?'up':'dn')}>{up?'+':'−'}₹{fmt(pnl)}<span className={'pct '+(up?'up':'dn')}>{pct>=0?'+':''}{pct.toFixed(1)}%</span></div></div>
      <span className="pos-stat" style={{color:up?'var(--up)':'var(--warn)'}}><span className="d"/>{up?'RUNNING':'WATCH'}</span></div>

  </div>);

  const todayCandles=useMemo(()=>{const arr=(candleData&&candleData.candles)||[];const t=todayISO();const todays=arr.filter(c=>(c.t||'').slice(0,10)===t);return todays.length>=2?todays:arr.slice(-78);},[candleData]);
  const eng=!status?'idle':(status.running?'live':'off');
  const open=(status&&status.open_signals)||[];const alerts=(status&&status.alerts)||[];
  const bnf=(status&&status.signals&&status.signals.BANKNIFTY)||null;
  const rows=Array.isArray(hist)?hist.filter(s=>s.date===todayISO()):[];const closed=rows.filter(s=>s.status==='CLOSED');
  const equity=useMemo(()=>{const o=closed.slice().sort((a,b)=>(a.timestamp||'').localeCompare(b.timestamp||''));let c=0;const p=[{t:0,v:0}];o.forEach((s,i)=>{c+=sgn(s);p.push({t:i+1,v:c});});return p;},[hist]);
  const realized=closed.reduce((a,s)=>a+sgn(s),0);const unreal=open.reduce((a,s)=>a+(+s.pnl_now||0),0);const net=realized+unreal;
  const pa=perf||{};const wins=pa.wins||0,losses=pa.losses||0,cl=wins+losses;
  const wr=pa.win_rate!=null?pa.win_rate:(cl?(wins/cl)*100:0);
  const exp=cl?((wr/100)*(pa.avg_win||0)+((100-wr)/100)*(pa.avg_loss||0)):0;
  const [cap,setCap]=useState(()=>+localStorage.getItem('ie-capital')||20000);
  const netCU=useCountUp(net),wrCU=useCountUp(wr,500);
  const tickers=['NIFTY','BANKNIFTY','FINNIFTY'].map(c=>{const p=(ltp&&ltp.prices&&ltp.prices[c])||{};return{c,ltp:p.ltp,pct:p.pct};});
  const bnfLtp=(ltp&&ltp.prices&&ltp.prices.BANKNIFTY)||{};

  const gates=useMemo(()=>{const m=metrics||{},e=m.engine||{};const ist=istNow();const hh=ist.getHours(),mm=ist.getMinutes(),wd=ist.getDay();
    const mo=(status&&status.market_open!=null)?status.market_open:(wd>=1&&wd<=5&&((hh>9)||(hh===9&&mm>=15))&&(hh<16));const pc=mo&&(hh<12||(hh===12&&mm<30));
    const KNOWN=['v1','v2','conductor','scalper','scalper_v3','reverter','nifty_windows','deadzone_fade','patterns'];const strat=e.strategy||(status&&status.config&&status.config.strategy)||'—';
    return[{l:'Market',ok:mo,n:mo?'In session':'Closed'},{l:'Pre-cutoff',ok:pc,n:pc?'Before 12:30':'After 12:30'},
      {l:'Engine',ok:!!(e.running||(status&&status.running)),n:(e.running||(status&&status.running))?'Running':'Stopped'},
      {l:'Kill-switch',ok:!e.killswitch_tripped,n:e.killswitch_tripped?'Tripped':'Clear'},{l:'Strategy',ok:KNOWN.includes(strat),n:strat}];},[metrics,status]);

  const engCall=async(p)=>{setBusy(true);try{await apiFetch(p,{method:'POST',body:'{}'});}catch(e){}finally{setBusy(false);}};

  /* ── new-trade alert system ── */
  const ensureAudio=()=>{try{if(!audioRef.current){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioRef.current=new AC();}if(audioRef.current&&audioRef.current.state==='suspended')audioRef.current.resume();}catch(e){}};
  const beep=()=>{try{const c=audioRef.current;if(!c)return;[0,0.18].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=i?1175:880;const s=c.currentTime+t;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.3,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.16);o.start(s);o.stop(s+0.18);});}catch(e){}};
  const showToast=(tt,tb,ms)=>{setToast({tt,tb});clearTimeout(toastT.current);toastT.current=setTimeout(()=>setToast(null),ms||6000);};
  const fireAlert=(a)=>{const s=a.signal||{},o=a.option||{},dir=(s.direction||'').toUpperCase();
    const tt=`${a.instrument||'Signal'}${dir?(' '+dir):''}${o.action?(' · '+o.action):''}`;
    const tb=`${humanizeOpt(o.symbol)||''}${o.entry?(' @ ₹'+(+o.entry).toFixed(1)):''}${(s.confidence_ai_adj||s.confidence)?(' · conf '+(s.confidence_ai_adj||s.confidence)):''}`;
    showToast(tt,tb,7000);beep();try{navigator.vibrate&&navigator.vibrate([60,40,60]);}catch(e){}
    if(notify&&'serviceWorker'in navigator&&'Notification'in window&&Notification.permission==='granted'){
      navigator.serviceWorker.ready.then(r=>r.showNotification(tt,{body:tb,icon:'icon-192.png',badge:'icon-192.png',tag:'ie-signal',renotify:true})).catch(()=>{});}};
  const toggleNotify=async()=>{ensureAudio();
    if(notify){setNotify(false);localStorage.setItem('ie-notify','0');showToast('Alerts off','',2500);return;}
    if(!('Notification'in window)){showToast('Not supported','This browser has no notifications',4000);return;}
    let p=Notification.permission;if(p==='default'){try{p=await Notification.requestPermission();}catch(e){}}
    if(p==='granted'){setNotify(true);localStorage.setItem('ie-notify','1');showToast('Alerts on','You’ll be pinged when a new trade is found',4000);}
    else{showToast('Notifications blocked','Enable in iOS Settings → this app → Notifications',5500);}};
  useEffect(()=>{const top=alerts&&alerts[0];const id=top&&(top.id!=null?top.id:top.iso_ts);if(id==null)return;
    if(lastAlert.current===undefined){lastAlert.current=id;return;}
    if(id!==lastAlert.current){lastAlert.current=id;fireAlert(top);}},[alerts]);

  if(needsSetup)return <Setup onDone={()=>{setNeedsSetup(false);ensureAudio();}}/>;
  const day=istNow().toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'}).toUpperCase();
  const NAV=[['overview',I.grid,'Overview'],['signals',I.list,'Signals'],['chain',I.layers,'Chain']];

  const kpis=(<>
    <section className="panel g-kpi kpi"><div className="k">Net P&amp;L</div><div className={'v '+(net>=0?'up':'dn')}>{net>=0?'+':'−'}₹{fmt(netCU)}</div><div className="s">{closed.length} closed · {open.length} open</div><div className="spark"><Area pts={equity} color={net>=0?'var(--up)':'var(--dn)'} h={42}/></div></section>
    <section className="panel g-kpi kpi"><div className="k">Win rate</div><div className="v">{wrCU.toFixed(1)}%</div><div className="s">{wins}W · {losses}L</div></section>
    <section className="panel g-kpi kpi"><div className="k">Expectancy</div><div className={'v '+(exp>=0?'up':'dn')}>{exp>=0?'+':'−'}₹{fmt(exp)}</div><div className="s">per trade</div></section>
    <section className="panel g-kpi kpi"><div className="k">Capital</div><div className="v ac">₹{fmt(cap)}</div><div className="s">{net>=0?'+':'−'}{(Math.abs(net)/cap*100).toFixed(2)}% today</div></section></>);

  const chartCard=(<section className="panel hud g-chart"><div className="head"><span className="t"><b>//</b> BANKNIFTY · 5-MIN</span><span className="r"><span className="live-tag"><span className="d"/>LIVE</span></span></div>
    <div className="cstrip"><span className={'pxbig '+((bnfLtp.pct||0)>=0?'up':'dn')}>{bnfLtp.ltp?(+bnfLtp.ltp).toLocaleString('en-IN'):'—'}</span>
      {bnfLtp.pct!=null&&<span className={'pxd '+((bnfLtp.pct||0)>=0?'up':'dn')}>{(bnfLtp.pct>=0?'+':'')}{(+bnfLtp.pct).toFixed(2)}%</span>}<span className="pxm">{todayCandles.length} candles today</span></div>
    <CandleChart candles={todayCandles} ltp={bnfLtp.ltp}/></section>);

  const openCard=(<section className="panel g12"><div className="head"><span className="t"><b>//</b> Open positions</span><span className="r lbl">{open.length}</span></div>
    {open.length===0&&<div className="empty" style={{padding:'28px 0'}}>Flat · watching for setups</div>}
    {open.map((p,i)=><PositionCard key={p.id||i} p={p} idx={i}/>)}</section>);

  const gatesCard=(<section className="panel g-gates"><div className="head"><span className="t"><b>//</b> Pre-trade gates</span></div>
    {gates.map((g,i)=>(<div className={'gaterow '+(g.ok?'ok':'bad')} key={i}><span className="ic"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d={g.ok?I.check:I.x}/></svg></span><span className="gl">{g.l}</span><span className="gn">{g.n}</span></div>))}</section>);

  const feedCard=(<section className="panel g-feed"><div className="head"><span className="t"><b>//</b> Live feed</span><span className="r lbl">{alerts.length} alerts</span></div>
    <div className="scrolly">{(!alerts||alerts.length===0)&&<div className="empty" style={{padding:'22px 0'}}>Quiet · no alerts yet</div>}
      {alerts.slice(0,30).map((a,i)=>{const s=a.signal||{},o=a.option||{},ai=a.ai||{};const t=(a.iso_ts?a.iso_ts.slice(11,16):'')||a.time||'';const long=(s.direction||'').toUpperCase()==='LONG';const conf=s.confidence_ai_adj||s.confidence;
        return(<div className="feedrow" key={a.id||i}><span className="feed-t">{t}</span><div className="feed-b"><div className="feed-l1"><span className="feed-inst">{a.instrument||'—'}</span>
          {s.direction&&<span className={'mc '+(long?'long':'short')}>{s.direction}</span>}{ai.verdict&&<span className={'mc '+verdictClass(ai.verdict)}>{ai.verdict}</span>}</div>
          <div className="feed-l2">{o.action||'BUY'} {humanizeOpt(o.symbol)}{conf?(' · conf '+conf):''}</div></div></div>);})}</div></section>);

  const signalsTable=(full)=>(<section className={'panel '+(full?'g12':'g-sigs')}><div className="head"><span className="t"><b>//</b> Signals</span><span className="r lbl">{rows.length} today</span></div>
    <div className="tbl"><div className="hr"><span>Time</span><span>Instrument</span><span className="cs">Side</span><span className="cp">Entry → Exit</span><span className="r">P&amp;L</span></div>
      {rows.length===0&&<div className="empty">No signals today · engine scanning</div>}
      {rows.slice(0,full?50:10).map((s,i)=>{const o=s.status==='OPEN';const pnl=o?(+s.pnl_now||0):sgn(s);const cls=o?'open':(isWin(s.result)?'up':(s.result==='LOSS'?'dn':'flat'));const t=(s.timestamp||'').slice(11,16)||(s.time||'—');
        return(<div className="row" key={s.id||i} style={{animationDelay:(i*0.015)+'s'}}><span className="t">{t}</span>
          <div className="ins"><div className="s">{s.instrument||'—'}</div><div className="c">{humanizeOpt(s.option_symbol)||(s.strike?(s.strike+' '+(s.option_type||'')):'')}</div></div>
          <span className="cside"><span className={'chip '+((s.direction||'')==='LONG'?'long':'short')}>{s.direction||'—'}</span></span>
          <span className="px cpx">{s.option_entry?<>₹<b>{(+s.option_entry).toFixed(1)}</b>{(s.option_exit?(' → ₹'+(+s.option_exit).toFixed(1)):'')}</>:'—'}</span>
          <span className={'pnl '+cls}>{o?'':((pnl>=0?'+':'−'))}₹{fmt(pnl)}<span className="st">{o?'OPEN':(s.result||s.status)}</span></span></div>);})}</div></section>);

  return(<div className="shell">
    {toast&&<div className="toast" onClick={()=>setToast(null)}><div className="tt">{toast.tt}</div>{toast.tb&&<div className="tb">{toast.tb}</div>}</div>}
    <nav className="rail"><div className="logo">I</div>
      {NAV.map(([id,icon,label])=>(<button key={id} className={'rbtn '+(view===id?'on':'')} onClick={()=>setView(id)} aria-label={label}><Ico d={icon}/><span className="tip">{label}</span><span className="blabel">{label}</span></button>))}
      <div className="rspace"/>
      <button className="rbtn" onClick={toggle} aria-label="Theme"><Ico d={theme==='dark'?I.sun:I.moon}/><span className="tip">{theme==='dark'?'Light':'Dark'}</span><span className="blabel">Theme</span></button>
      <div className={'estat '+eng} title={'Engine '+eng}><span className={'rdot '+eng}/><span className="blabel">{eng==='live'?'Live':eng==='off'?'Off':'···'}</span></div>
      <button className="ava" title="Settings" onClick={()=>{setSettingsName(localStorage.getItem('ie-user')||'');setSettingsCap(+localStorage.getItem('ie-capital')||20000);setShowSettings(true);}}>{(localStorage.getItem('ie-user')||'K')[0].toUpperCase()}</button></nav>
    <main className="main">
      <div className="top">
        <div className="tapebar"><div className="tape"><div className="tape-track">
          {[...tickers,...tickers,...tickers,...tickers,...tickers,...tickers].map((t,i)=>(<span className="tkm" key={i}>
            <span className="nm">{t.c}</span>
            <span className="px mono">{t.ltp?(+t.ltp).toLocaleString('en-IN'):'—'}</span>
            <span className={'ch mono '+((t.pct||0)>=0?'up':'dn')}>{t.pct!=null?((t.pct>=0?'+':'')+(+t.pct).toFixed(2)+'%'):'—'}</span>
            <span className="sep">/</span></span>))}
        </div></div></div>
        <div className="toolbar"><span className="clock mono"><b>{clock}</b> IST</span>
          <div className="top-r">
          <span className={'led '+eng}><span className="d"/>{eng==='live'?'Engine live':eng==='off'?'Engine off':'Connecting'}</span>
          {eng==='live'?<button className="btn stop" onClick={()=>engCall('/api/stop')} disabled={busy}>Stop</button>:<button className="btn go" onClick={()=>engCall('/api/start')} disabled={busy}>Start</button>}
          <button className={'ib'+(notify?' on':'')} onClick={toggleNotify} aria-label="Alerts" title={notify?'Alerts on':'Enable alerts'}><Ico d={notify?I.bell:I.belloff}/></button>
          <button className="ib" onClick={toggle} aria-label="Theme"><Ico d={theme==='dark'?I.sun:I.moon}/></button>
          <button className="ib" onClick={()=>{setSettingsName(localStorage.getItem('ie-user')||'');setSettingsCap(+localStorage.getItem('ie-capital')||20000);setShowSettings(true);}} aria-label="Settings"><Ico d={I.gear}/></button></div>
        </div>
      </div>
      <div className="tabs">{NAV.map(([id,icon,label])=>(<button key={id} className={'tab '+(view===id?'on':'')} onClick={()=>setView(id)}>{label}</button>))}</div>

      {view==='overview'&&<div className="grid">{kpis}{chartCard}<SignalCard sig={bnf} marketOpen={status&&status.market_open} market={status&&status.market}/>{open.length>0&&openCard}{signalsTable(true)}{open.length===0&&openCard}{gatesCard}{feedCard}</div>}
      {view==='signals'&&<div className="grid">{kpis}{signalsTable(true)}{openCard}{feedCard}</div>}
      {view==='chain'&&<div className="grid"><ChainCards sig={bnf} ltp={ltp}/>{gatesCard}{feedCard}</div>}
    </main>
    {showSettings&&<div onClick={e=>{if(e.target===e.currentTarget)setShowSettings(false);}} style={{
        position:'fixed',inset:0,zIndex:200,
        background:'rgba(10,15,11,0.72)',
        backdropFilter:'blur(10px)',WebkitBackdropFilter:'blur(10px)',
        display:'flex',alignItems:'center',justifyContent:'center',
        padding:'20px'}}>
      <div style={{
          width:'100%',maxWidth:'340px',
          background:'var(--panel)',
          border:'1px solid var(--line)',
          padding:'36px 28px 28px',
          position:'relative'}}>
        <div style={{
            width:52,height:52,
            background:'linear-gradient(135deg,#B87428,#3D6848)',
            display:'grid',placeItems:'center',
            fontSize:20,fontWeight:700,color:'#F1EDE0',
            margin:'0 auto 18px'}}>{(settingsName||'K')[0].toUpperCase()}</div>
        <div style={{
            fontFamily:"Palatino,'Book Antiqua',Georgia,serif",
            fontSize:22,fontWeight:'normal',color:'var(--ink)',
            textAlign:'center',marginBottom:32,letterSpacing:'-0.01em'}}>Settings</div>
        <div style={{marginBottom:22}}>
          <div style={{fontSize:10,fontFamily:"'Courier New',monospace",letterSpacing:'0.13em',color:'var(--ink3)',marginBottom:8,textTransform:'uppercase'}}>Name</div>
          <input value={settingsName} onChange={e=>setSettingsName(e.target.value)} placeholder="Ketan" style={{
              width:'100%',padding:'9px 0',
              background:'transparent',border:'none',borderBottom:'1px solid var(--line)',
              color:'var(--ink)',fontSize:16,outline:'none',fontFamily:'inherit',boxSizing:'border-box'}}/>
        </div>
        <div style={{marginBottom:32}}>
          <div style={{fontSize:10,fontFamily:"'Courier New',monospace",letterSpacing:'0.13em',color:'var(--ink3)',marginBottom:8,textTransform:'uppercase'}}>Capital</div>
          <div style={{display:'flex',alignItems:'baseline',gap:6,borderBottom:'1px solid var(--line)'}}>
            <span style={{color:'var(--ink3)',fontSize:15,fontFamily:"'Courier New',monospace",paddingBottom:9}}>₹</span>
            <input type="number" value={settingsCap} onChange={e=>setSettingsCap(+e.target.value||20000)} placeholder="20000" style={{
                flex:1,padding:'9px 0',
                background:'transparent',border:'none',
                color:'var(--ink)',fontSize:16,outline:'none',
                fontFamily:"'Courier New',monospace",boxSizing:'border-box'}}/>
          </div>
          <div style={{fontSize:11,marginTop:6,color:'var(--ink4)',fontFamily:"'Courier New',monospace"}}>% return shown on Capital tile</div>
        </div>
        <button onClick={()=>{
            if(settingsName.trim())localStorage.setItem('ie-user',settingsName.trim());
            localStorage.setItem('ie-capital',settingsCap||20000);
            setCap(settingsCap||20000);
            setShowSettings(false);
          }} style={{
            width:'100%',padding:'13px',marginBottom:10,
            background:'linear-gradient(135deg,#B87428,#3D6848)',
            border:'none',color:'#F1EDE0',
            fontSize:11,letterSpacing:'0.14em',textTransform:'uppercase',
            fontFamily:"'Courier New',monospace",cursor:'pointer'}}>Save</button>
        <button onClick={()=>setShowSettings(false)} style={{
            width:'100%',padding:'11px',marginBottom:18,
            background:'transparent',border:'1px solid var(--line)',
            color:'var(--ink3)',fontSize:11,letterSpacing:'0.12em',textTransform:'uppercase',
            fontFamily:"'Courier New',monospace",cursor:'pointer'}}>Cancel</button>
        <div style={{borderTop:'1px solid var(--line)',paddingTop:14,textAlign:'center'}}>
          <div style={{fontSize:10,fontFamily:"'Courier New',monospace",color:'var(--ink4)',marginBottom:10,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{getServer()}</div>
          <button onClick={()=>{localStorage.clear();location.reload();}} style={{
              background:'transparent',border:'none',
              color:'rgba(176,58,46,0.75)',fontSize:10,letterSpacing:'0.12em',
              textTransform:'uppercase',fontFamily:"'Courier New',monospace",cursor:'pointer'}}>Disconnect</button>
        </div>
      </div>
    </div>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
